      if (charCode < 0 || charCode > 11171) return word.charAt(0);
      const originalChosung = CHO_SUNG[Math.floor(charCode / 588)];
      return MERGE_MAP[originalChosung] || originalChosung; // 쌍자음을 기본 자음으로 병합
    }

    let wordData = [];
    let chosungCount = {};

    const mainChosungs = ["ㄱ", "ㄴ", "ㄷ", "ㄹ", "ㅁ", "ㅂ", "ㅅ", "ㅇ", "ㅈ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
    mainChosungs.forEach(c => chosungCount[c] = 0);

    RAW_WORDS.forEach(item => {
      const chosung = getChosung(item[0]);
      wordData.push({
        word: item[0],
        category: item[1],
        level: item[2],
        meaning: item[3],
        example: item[4],
        tip: item[5],
        chosung: chosung
      });
      if(chosungCount[chosung] !== undefined) {
        chosungCount[chosung]++;
      }
    });

    const btnContainer = document.getElementById('consonant-buttons');
    const gridContainer = document.getElementById('word-grid');
    const resultInfo = document.getElementById('result-info');

    // 자음 버튼 생성
    mainChosungs.forEach(c => {
      const btn = document.createElement('button');
      const count = chosungCount[c] || 0;
      btn.className = `px-4 py-2 rounded-full font-bold text-sm border-2 ${count > 0 ? 'border-blue-500 text-blue-600 hover:bg-blue-50' : 'border-gray-200 text-gray-400 cursor-not-allowed'}`;
      btn.innerText = `${c} (${count})`;
      
      if (count > 0) {
        btn.onclick = () => renderWords(c);
      }
      btnContainer.appendChild(btn);
    });

    // 단어 카드 그리기
    function renderWords(targetChosung) {
      gridContainer.innerHTML = '';
      const filtered = wordData.filter(w => w.chosung === targetChosung);
      
      resultInfo.innerText = `'${targetChosung}'(으)로 시작하는 고유어가 ${filtered.length}개 있습니다.`;

      filtered.forEach(w => {
        const card = document.createElement('div');
        card.className = 'word-card bg-white p-6 rounded-2xl border border-gray-100 relative';
        
        let levelStars = w.level === 1 ? '⭐ 기초' : w.level === 2 ? '⭐⭐ 실력' : '⭐⭐⭐ 탐구';

        card.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <span class="text-xs font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded">${w.category}</span>
            <span class="text-xs font-bold text-yellow-500 bg-yellow-50 px-2 py-1 rounded">${levelStars}</span>
          </div>
          <h2 class="text-2xl font-bold mb-2">${w.word}</h2>
          <p class="text-gray-700 font-medium mb-3">"${w.meaning}"</p>
          <div class="bg-gray-50 p-3 rounded-lg text-sm text-gray-600 mb-3 border-l-2 border-blue-400">
            예문: ${w.example}
          </div>
          <p class="text-xs text-green-600 font-bold">💡 팁: ${w.tip}</p>
        `;
        gridContainer.appendChild(card);
      });
    }

    // 처음 로딩 시 'ㄱ' 단어 보여주기
    if(chosungCount["ㄱ"] > 0) {
      renderWords("ㄱ");
    }
  </script>
</body>
</html>
