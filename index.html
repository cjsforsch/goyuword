<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반짝반짝 우리말 고유어 대사전 (초등 6학년)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'], fun: ['"Gaegu"', 'cursive'] },
          colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } }
        }
      }
    }
  </script>
  <style>
    .card-hover { transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.2), 0 8px 10px -6px rgba(16, 185, 129, 0.1); }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
    .modal-open { overflow: hidden; }
    .word-highlight { background: linear-gradient(120deg, #dcfce7 0%, #dcfce7 100%); background-repeat: no-repeat; background-size: 100% 40%; background-position: 0 88%; }
  </style>
</head>
<body class="bg-gradient-to-br from-amber-50/60 via-emerald-50/50 to-sky-50/60 text-slate-800 min-h-screen flex flex-col font-sans selection:bg-emerald-200">

  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-emerald-100 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 cursor-pointer" onclick="resetFilters()">
        <span class="text-3xl p-2 bg-emerald-100 rounded-2xl shadow-inner text-emerald-600">
          <i class="fa-solid fa-book-bookmark"></i>
        </span>
        <div>
          <h1 class="text-xl sm:text-2xl font-fun font-bold text-emerald-800 tracking-wide flex items-center gap-2">
            우리말 고유어 대사전
            <span class="text-xs font-sans font-bold bg-emerald-500 text-white px-2 py-0.5 rounded-full shadow-sm" id="totalWordsBadge">로딩중...</span>
          </h1>
          <p class="text-xs text-slate-500 hidden sm:block">초등학교 6학년 국어 연계 • 아름다운 우리말 탐험</p>
        </div>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0 custom-scroll">
        <button id="bookmarkTabBtn" onclick="toggleBookmarkFilter()" class="whitespace-nowrap px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-amber-300 bg-amber-50 text-amber-800 hover:bg-amber-100 flex items-center gap-1.5 shadow-sm transition active:scale-95">
          <i class="fa-solid fa-star text-amber-500"></i><span>내 단어장</span><span id="bookmarkCount" class="bg-amber-500 text-white rounded-full px-1.5 py-0.2 text-[11px] font-bold">0</span>
        </button>
        <button onclick="openPracticeModal()" class="whitespace-nowrap px-3 py-2 rounded-xl text-xs sm:text-sm font-bold bg-sky-50 text-sky-700 hover:bg-sky-100 border border-sky-200 flex items-center gap-1.5 transition active:scale-95">
          <i class="fa-solid fa-pen-to-square text-sky-500"></i><span>문장 짓기 노트</span>
        </button>
        <button onclick="openQuizModal()" class="whitespace-nowrap px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white shadow-sm flex items-center gap-1.5 transition active:scale-95">
          <i class="fa-solid fa-gamepad"></i><span>낱말 퀴즈</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-5 flex flex-col gap-5">
    <section class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-emerald-100 relative overflow-hidden bg-gradient-to-r from-emerald-50/80 via-white to-sky-50/60">
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div class="space-y-2">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1 shadow-sm">
              <i class="fa-solid fa-sparkles"></i> 오늘의 추천 고유어
            </span>
            <span id="todayWordCategory" class="text-xs text-slate-500 bg-white px-2 py-0.5 rounded-lg border font-medium">자연</span>
            <span id="todayWordLevel" class="text-xs text-emerald-700 bg-emerald-100/70 font-semibold px-2 py-0.5 rounded-lg">1단계 (기초)</span>
          </div>
          <div class="flex items-baseline gap-3 pt-1">
            <h2 id="todayWordTitle" class="text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-tight word-highlight">불러오는 중</h2>
            <button onclick="speakWord(document.getElementById('todayWordTitle').innerText)" class="text-emerald-600 hover:text-emerald-700 text-xl transition-transform hover:scale-110" title="발음 듣기">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </div>
          <p id="todayWordMeaning" class="text-slate-700 text-sm sm:text-base font-medium leading-relaxed"></p>
          <div class="bg-white/60 p-3 rounded-xl border border-white mt-2 inline-block">
            <p id="todayWordExample" class="text-sm text-slate-600 italic"></p>
          </div>
        </div>
        <button onclick="pickRandomTodayWord()" class="px-4 py-2.5 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold rounded-2xl border border-slate-200 shadow-sm transition active:scale-95 flex items-center gap-2 shrink-0">
          <i class="fa-solid fa-shuffle text-emerald-500"></i> 다른 낱말 보기
        </button>
      </div>
    </section>

    <section class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-5">
      <div class="relative group">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400 group-focus-within:text-emerald-500 transition-colors">
          <i class="fa-solid fa-magnifying-glass text-lg"></i>
        </span>
        <input type="text" id="searchInput" placeholder="단어, 뜻, 예문을 검색해 보세요." class="w-full pl-12 pr-24 py-3.5 bg-slate-50 hover:bg-slate-100/60 focus:bg-white text-slate-800 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm font-medium transition-all shadow-inner" oninput="handleSearch()" />
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-3 px-3 my-auto h-8 text-xs font-bold text-slate-500 hover:text-slate-800 bg-slate-200/60 hover:bg-slate-300/60 rounded-xl transition-colors">지우기</button>
      </div>
      <div>
        <div class="flex items-center justify-between mb-2.5">
          <label class="text-xs sm:text-sm font-bold text-slate-600 flex items-center gap-1.5">
            <span class="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center"><i class="fa-solid fa-shapes"></i></span>자음으로 찾기
          </label>
          <button onclick="clearConsonantFilter()" class="text-xs text-emerald-600 hover:text-emerald-700 font-bold bg-emerald-50 px-2 py-1 rounded-lg">전체 보기</button>
        </div>
        <div class="grid grid-cols-7 sm:grid-cols-14 gap-1.5 sm:gap-2" id="consonantContainer"></div>
      </div>
      <div class="flex flex-col lg:flex-row gap-4 pt-4 border-t border-slate-100">
        <div class="flex-1">
          <label class="text-xs font-bold text-slate-500 mb-2 block">주제별 테마</label>
          <div class="flex flex-wrap items-center gap-1.5" id="categoryContainer"></div>
        </div>
        <div class="lg:border-l lg:border-slate-100 lg:pl-4">
          <label class="text-xs font-bold text-slate-500 mb-2 block">6학년 맞춤 난이도</label>
          <div class="flex items-center gap-1.5">
            <button onclick="setLevelFilter('all')" id="levelBtn-all" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow-sm transition">전체</button>
            <button onclick="setLevelFilter(1)" id="levelBtn-1" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🌱 1단계(기초)</button>
            <button onclick="setLevelFilter(2)" id="levelBtn-2" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🌿 2단계(실력)</button>
            <button onclick="setLevelFilter(3)" id="levelBtn-3" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🌳 3단계(도전)</button>
          </div>
        </div>
      </div>
    </section>

    <section class="space-y-4 flex-grow">
      <div class="flex flex-wrap items-center justify-between px-1 gap-3">
        <div class="text-sm font-bold text-slate-700 flex items-center gap-2">
          <span>발견한 고유어</span><span id="resultCount" class="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full text-xs font-extrabold shadow-sm">0개</span><span id="pageInfoText" class="text-xs text-slate-400 font-normal hidden sm:inline"></span>
        </div>
        <div class="flex items-center gap-2 text-xs">
          <select id="sortSelect" onchange="applyFiltersAndRender(1)" class="bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-slate-700 font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm cursor-pointer hover:bg-slate-50 transition">
            <option value="nameAsc">가나다순 (ㄱ~ㅎ)</option>
            <option value="nameDesc">역순 (ㅎ~ㄱ)</option>
            <option value="levelAsc">쉬운 순서</option>
            <option value="levelDesc">어려운 순서</option>
          </select>
        </div>
      </div>
      <div id="wordGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div id="paginationContainer" class="flex flex-wrap items-center justify-center gap-2 pt-6 pb-4"></div>
      <div id="emptyState" class="hidden flex-col items-center justify-center p-16 text-center bg-white rounded-3xl border-2 border-dashed border-slate-200">
        <div class="w-16 h-16 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center text-2xl mb-4"><i class="fa-solid fa-face-sad-tear"></i></div>
        <h3 class="text-lg font-bold text-slate-700">앗, 해당하는 고유어를 찾지 못했어요.</h3>
        <button onclick="resetFilters()" class="mt-6 px-5 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-bold rounded-xl shadow-sm transition active:scale-95 flex items-center gap-2"><i class="fa-solid fa-rotate-right"></i> 모든 필터 초기화</button>
      </div>
    </section>
  </main>

  <div id="wordModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4" onclick="handleModalClick(event, 'wordModal')">
    <div class="bg-white rounded-[2rem] max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-100 relative transform transition-all scale-95 opacity-0 duration-200" id="modalCard">
      <button onclick="closeWordModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center transition-colors text-lg"><i class="fa-solid fa-xmark"></i></button>
      <div class="space-y-5">
        <div class="flex items-center gap-2">
          <span id="modalCategoryBadge" class="text-xs font-bold px-3 py-1.2 rounded-xl shadow-sm"></span><span id="modalLevelBadge" class="text-xs font-bold px-3 py-1.2 rounded-xl border"></span>
        </div>
        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
          <div class="flex items-end gap-3">
            <h2 id="modalTitle" class="text-4xl font-extrabold text-slate-800 tracking-tight"></h2>
            <button id="modalAudioBtn" class="text-emerald-500 hover:text-emerald-600 text-2xl p-1 mb-1 transition-transform hover:scale-110" title="발음 듣기"><i class="fa-solid fa-circle-play"></i></button>
          </div>
          <button id="modalBookmarkBtn" class="text-3xl p-2 transition transform hover:scale-110 active:scale-125"><i class="fa-regular fa-star text-slate-300"></i></button>
        </div>
        <div class="space-y-4 pt-2">
          <div><p class="text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">뜻풀이</p><p id="modalMeaning" class="text-slate-800 text-lg font-bold leading-relaxed break-keep"></p></div>
          <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100/50"><p class="text-xs font-bold text-emerald-700 mb-2 flex items-center gap-1.5"><i class="fa-solid fa-pen-fancy"></i> 이렇게 문장으로 써요</p><p id="modalExample" class="text-emerald-900 text-sm font-medium leading-relaxed break-keep"></p></div>
          <div class="bg-amber-50 p-4 rounded-2xl border border-amber-100/50"><p class="text-xs font-bold text-amber-700 mb-2 flex items-center gap-1.5"><i class="fa-regular fa-lightbulb"></i> 6학년 돋보기 팁</p><p id="modalTip" class="text-amber-900 text-sm font-medium leading-relaxed break-keep"></p></div>
        </div>
      </div>
      <div class="mt-8 flex flex-col sm:flex-row justify-between items-center gap-3">
        <button id="modalPracticeShortcutBtn" class="w-full sm:w-auto px-5 py-3 bg-sky-50 hover:bg-sky-100 text-sky-700 text-sm font-bold rounded-xl transition flex items-center justify-center gap-2 border border-sky-200"><i class="fa-solid fa-pen-nib"></i> 이 단어로 문장 짓기</button>
        <button onclick="closeWordModal()" class="w-full sm:w-auto px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-xl transition shadow-md">확인</button>
      </div>
    </div>
  </div>

  <div id="practiceModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4" onclick="handleModalClick(event, 'practiceModal')">
    <div class="bg-white rounded-[2rem] max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-100 relative">
      <button onclick="closePracticeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center transition-colors text-lg"><i class="fa-solid fa-xmark"></i></button>
      <div class="space-y-5">
        <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
          <span class="w-10 h-10 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center text-lg font-bold shadow-inner"><i class="fa-solid fa-book-journal-whills"></i></span>
          <div><h3 class="text-xl font-extrabold text-slate-800">나만의 문장 짓기 노트</h3><p class="text-xs font-medium text-slate-500">배운 고유어를 넣어 멋진 문장을 완성해 보세요!</p></div>
        </div>
        <div class="space-y-4">
          <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
            <label class="block text-xs font-bold text-slate-600 mb-2">1. 사용할 고유어 선택하기</label>
            <div class="flex gap-2">
              <input type="text" id="practiceWordSearch" placeholder="단어 검색..." class="w-1/3 bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400 outline-none transition" oninput="filterPracticeOptions()" />
              <select id="practiceWordSelect" onchange="updatePracticeWordDetail()" class="w-2/3 bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400 cursor-pointer shadow-sm"></select>
            </div>
            <div class="mt-3 p-3 bg-white rounded-xl border border-slate-100"><p id="practiceWordMeaningHint" class="text-sm text-slate-700 font-medium"></p></div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-2">2. 나만의 문장 쓰기</label>
            <textarea id="practiceSentenceInput" rows="4" placeholder="선택한 고유어를 포함해서 자연스러운 문장을 지어보세요." class="w-full bg-slate-50 hover:bg-white border-2 border-slate-200 rounded-2xl p-4 text-sm font-medium focus:bg-white focus:outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100 transition-all resize-none shadow-inner" oninput="handlePracticeInput()"></textarea>
            <div class="flex justify-between items-center mt-2 px-1 text-xs font-bold text-slate-400">
              <span id="practiceWordCheckMsg" class="flex items-center gap-1"><i class="fa-solid fa-circle-exclamation"></i> 문장에 단어를 넣어주세요.</span><span id="practiceCharCount">0자</span>
            </div>
          </div>
          <div id="practiceSuccessBox" class="hidden p-4 bg-emerald-50 border-2 border-emerald-200 rounded-2xl text-emerald-800 text-sm font-bold flex items-start gap-3 shadow-sm transform transition-all">
            <i class="fa-solid fa-face-smile-wink text-emerald-500 text-2xl mt-0.5"></i>
            <div><p>참 잘했어요! 👏</p><p class="text-xs text-emerald-600 font-medium mt-1">고유어를 아주 자연스럽게 활용한 멋진 문장입니다.</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="quizModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4" onclick="handleModalClick(event, 'quizModal')">
    <div class="bg-white rounded-[2rem] max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-100 relative">
      <button onclick="closeQuizModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center transition-colors text-lg"><i class="fa-solid fa-xmark"></i></button>
      <div class="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
        <span class="w-10 h-10 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center text-xl shadow-inner"><i class="fa-solid fa-crown"></i></span>
        <div><h3 class="text-xl font-extrabold text-slate-800">우리말 척척박사 퀴즈</h3><p class="text-xs font-medium text-slate-500">설명을 읽고 알맞은 고유어를 맞춰보세요!</p></div>
      </div>
      <div id="quizQuestionBox" class="space-y-5">
        <div class="bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 relative">
          <span class="absolute -top-3 left-4 text-xs font-bold text-white bg-emerald-500 px-3 py-1 rounded-full shadow-sm">문제</span>
          <p id="quizMeaning" class="text-slate-800 font-bold text-base mt-2 min-h-[60px] flex items-center leading-relaxed break-keep"></p>
        </div>
        <div id="quizOptions" class="grid grid-cols-1 gap-2.5"></div>
        <div id="quizFeedback" class="hidden p-4 rounded-xl text-center text-sm font-bold shadow-sm transition-all transform scale-95"></div>
        <div class="flex justify-between items-center pt-4 border-t border-slate-100">
          <div class="flex flex-col"><span class="text-[10px] font-bold text-slate-400 uppercase">내 점수</span><span id="quizScoreText" class="text-lg font-extrabold text-emerald-600">0점</span></div>
          <button id="nextQuizBtn" onclick="generateNewQuiz()" class="hidden px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-xl transition shadow-md flex items-center gap-2">다음 문제 도전 <i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 
    const RAW_WORDS = [
      ["가꾸다", "action", 1, "1. 식물을 정성껏 보살펴서 잘 자라게 하는 일이에요.<br>2. 외모나 몸을 보기 좋게 꾸미는 일이에요.", "1. 봄이 되어 교실 창가에 있는 화분 속 꽃을 정성껏 가꾸었다.<br>2. 틈틈이 운동을 하며 몸을 튼튼하게 가꾸었다.", "'꿈을 가꾸다'처럼 자신의 실력이나 목표를 훌륭하게 키워갈 때도 멋지게 쓰는 말이에요."],
      ["가누다", "action", 2, "1. 몸의 자세를 똑바로 잡는 행동이에요.<br>2. 정신이나 기운을 흩어지지 않게 차리는 뜻이에요.", "1. 오래달리기를 하고 나서 숨을 헐떡이며 겨우 몸을 가누었다.<br>2. 너무 슬퍼서 무너지는 마음을 가누기 힘들었다.", "주로 '몸을 가누다', '마음을 가누다'처럼 아프거나 힘들 때 중심을 잡는 의미로 씁니다."],
      ["가득", "daily", 1, "분량이나 수효가 정해진 범위나 그릇 안에 빈틈없이 꽉 차 있는 모양이에요.", "가을 소풍날, 내 가방 안에는 엄마가 싸주신 맛있는 김밥과 과자가 가득 들어 있었다.", "공간이 꽉 찬 것뿐만 아니라 '자신감이 가득하다'처럼 감정이 넘쳐흐를 때도 자주 써요."],
      ["가리키다", "action", 1, "손가락이나 물건을 어떤 방향이나 대상을 향하게 하여 집어내는 행동이에요.", "선생님께서 지휘봉으로 칠판에 적힌 중요한 수학 공식을 가리키며 설명해 주셨다.", "'가르치다(알려주다)'와 발음이 비슷해서 헷갈리기 쉬우니 쓸 때 조심해야 하는 단어예요."],
      ["가르치다", "action", 1, "1. 지식이나 이치 등을 깨닫게 하거나 알려 주는 일이에요.<br>2. 기능이나 기술 등을 익히게 하는 일이에요.<br>3. 나쁜 버릇 따위를 고치어 바로잡는 일이에요.", "1. 수학 문제를 몰라서 헤매는 짝꿍에게 푸는 법을 가르쳐 주었다.<br>2. 동생에게 안전하게 두발자전거를 타는 방법을 가르쳤다.<br>3. 남의 물건을 함부로 만지지 않도록 올바른 예절을 가르쳤다.", "세 가지 뜻 모두 '누군가를 바른길로 이끌고 성장하게 돕는다'는 훌륭한 의미가 담겨 있어요."],
      ["가름", "daily", 2, "1. 사물이나 상황을 쪼개거나 나누는 일이에요.<br>2. 승패나 판결 등을 따로따로 구별되게 하는 판단이에요.", "1. 남은 케이크를 두 가름으로 똑같이 나누어 먹었다.<br>2. 오늘 열린 피구 대회에서 우리 반의 승패 가름은 마지막 1분에 결정되었다.", "새로운 것으로 바꾼다는 뜻의 '갈음'과는 완전히 다른 뜻의 단어이니 맞춤법에 유의하세요."],
      ["가만히", "action", 1, "1. 몸을 움직이지 않고 잠잠하게 있는 모양이에요.<br>2. 아무 말 없이 조용히, 또는 속으로 몰래 하는 모양이에요.<br>3. 마음을 가라앉히고 깊이 생각하는 모양이에요.", "1. 수업 시간에 떠들지 않고 자리에 가만히 앉아 있었다.<br>2. 친구를 깜짝 놀라게 해주려고 가만히 뒤로 다가갔다.<br>3. 내 장래 희망이 무엇인지 눈을 감고 가만히 생각해보았다.", "주변을 방해하지 않고 평화롭게 있는 태도나 조심스러운 움직임을 나타낼 때 주로 씁니다."],
      ["가물거리다", "action", 2, "1. 작은 불빛이 자꾸 어두워졌다 밝아졌다 하는 상태예요.<br>2. 사물이 보일 듯 말 듯 희미하게 흔들리는 상태예요.<br>3. 기억이나 생각이 날 듯 말 듯 흐릿한 상태예요.", "1. 밤바다 멀리 떠 있는 배의 불빛이 가물거린다.<br>2. 짙은 안개 속에서 사람의 그림자가 가물거렸다.<br>3. 어릴 적 재미있게 놀았던 추억인데 시간이 지나 기억이 가물거린다.", "불빛이 흔들리는 물리적인 현상부터 기억이 뚜렷하지 않을 때까지 폭넓게 쓰여요."],
      ["가시", "nature", 1, "1. 식물의 줄기나 동물의 몸에 돋아난 뾰족한 부분이에요.<br>2. 남의 마음을 아프게 찌르는 독한 말이나 태도예요.", "1. 산길을 걷다가 장미 넝쿨의 가시에 찔려 상처가 났다.<br>2. 화가 난다고 친구에게 가시 돋친 말을 하면 안 된다.", "물리적으로 뾰족한 것뿐만 아니라 문학적으로 비유할 때도 널리 쓰이는 명사입니다."],
      ["가엽다", "heart", 2, "다른 사람이나 동물의 처지가 마음이 아플 만큼 안되고 불쌍하다는 따뜻한 마음이에요.", "비 오는 날 길가에서 덜덜 떨고 있는 버려진 강아지가 너무 가여워서 집으로 데려왔다.", "'가엾다'와 똑같은 뜻으로 쓰이는 복수 표준어로, 남을 동정하고 배려하는 착한 마음을 뜻해요."],
      ["가운데", "daily", 1, "1. 여럿이 있는 속이나 안, 또는 공간의 중심이에요.<br>2. 어떤 일이나 시간이 한창 진행되고 있는 도중을 말해요.", "1. 친구들이 둥글게 모여 앉았고 나는 그 가운데 섰다.<br>2. 진지하게 회의를 하는 가운데 갑자기 좋은 아이디어가 떠올랐다.", "물리적인 정중앙을 뜻하는 동시에 시간의 흐름을 나타내는 폭넓은 명사입니다."],
      ["가을", "time", 1, "여름과 겨울 사이의 계절로, 잎이 붉게 물들고 곡식을 거두어들이는 수확의 시기예요.", "가을이 되니 학교 뒤뜰의 은행나무 잎이 노랗게 물들고 시원한 바람이 불어오기 시작했다.", "우리나라의 아름다운 사계절 중 풍성함과 독서를 상징하는 아주 아름다운 고유어 명칭입니다."],
      ["가장", "daily", 1, "여럿 가운데 어느 것보다 정도가 높거나 으뜸이 되게라는 뜻을 가진 훌륭한 부사예요.", "우리 반에서 달리기가 가장 빠른 민수는 이번 체육대회 계주 마지막 주자로 뽑혔다.", "한자어인 '제일(第一)'을 완벽하게 대체할 수 있는 아주 자연스럽고 예쁜 순우리말입니다."],
      ["가지런하다", "daily", 2, "여럿이 줄지어 있는 모양이 들쭉날쭉하지 않고 나란하며 아주 고르게 정돈된 상태예요.", "체육관에 들어가기 전, 입구에 벗어둔 친구들의 실내화가 삐뚤어지지 않고 아주 가지런했다.", "물건이 보기 좋게 정리된 모습뿐만 아니라, 글씨나 마음가짐이 바른 상태를 칭찬할 때 씁니다."],
      ["가탈", "daily", 3, "1. 일이 순조롭게 나아가는 것을 방해하는 뜻밖의 조건이에요.<br>2. 이리저리 트집을 잡아 까다롭게 구는 얄미운 행동이에요.", "1. 갑작스러운 소나기로 운동회 준비에 가탈이 생겼다.<br>2. 모둠 숙제를 하는데 지훈이가 자꾸 사소한 일로 가탈을 부려 힘들었다.", "별일 아닌 것에 괜한 불평을 늘어놓는 피곤한 행동을 아주 정확하게 꼬집어 주는 낱말입니다."],
      ["간지럽다", "heart", 1, "살갗에 무엇이 살짝 닿아 웃음이 날 만큼 찌릿하거나 기분 좋게 근질거리는 느낌이에요.", "친구와 귓속말을 하는데 친구의 숨결이 귀에 닿아 몹시 간지러워서 나도 모르게 웃음이 터졌다.", "쑥스러운 칭찬을 들어서 부끄러울 때 '귀가 간지럽다'라고 마음의 느낌을 표현할 때도 써요."],
      ["갈무리", "action", 2, "1. 물건을 잘 정돈하여 안전하게 보관하는 일이에요.<br>2. 하던 일을 깔끔하게 끝맺어 정리하는 일이에요.", "1. 겨울옷을 깨끗하게 빨아 옷장에 잘 갈무리했다.<br>2. 오늘 배운 중요한 단어들을 내 노트에 예쁜 글씨로 잘 갈무리해 두었다.", "컴퓨터나 스마트폰에서 화면을 캡처해서 저장하는 기능도 요즘은 '갈무리'라고 순화해서 불러요."],
      ["갈피", "daily", 2, "1. 겹쳐진 책이나 물건들의 사이를 뜻해요.<br>2. 얽힌 사물이나 일의 가닥을 뜻해요.<br>3. 마음이나 생각의 방향을 뜻해요.", "1. 예쁜 네잎클로버를 주워 책 갈피에 끼워 두었다.<br>2. 사건이 너무 복잡하게 얽혀서 갈피를 잡을 수 없다.<br>3. 수학 문제가 너무 어려워서 어떻게 풀어야 할지 갈피를 잡지 못했다.", "마음이나 생각의 방향을 정할 때 '갈피를 못 잡다'로 아주 흔하게 쓰이는 유용한 단어입니다."],
      ["감기다", "action", 1, "1. 눈꺼풀이 저절로 내려와 눈이 덮이는 일이에요.<br>2. 실이나 끈 따위가 다른 물체에 빙빙 둘러지는 일이에요.", "1. 늦게까지 책을 읽었더니 수업 시간에 자꾸 눈이 스르르 감겼다.<br>2. 연을 날릴 때 실이 얼레에 팽팽하게 감겨 있었다.", "머리를 씻는 뜻인 '머리가 감기다'와는 다른 뜻으로, 수동적으로 일어나는 현상을 나타냅니다."],
      ["감다", "action", 1, "1. 샴푸나 비누로 머리나 몸을 씻는 일이에요.<br>2. 눈꺼풀을 내리어 눈을 덮는 행동이에요.<br>3. 끈을 다른 물체에 두르는 일이에요.", "1. 아침에 늦잠을 자서 머리를 감지 못하고 등교했다.<br>2. 무서운 영화 장면이 나오자 두 눈을 질끈 감았다.<br>3. 다친 친구의 팔에 붕대를 단단하게 감아 주었다.", "씻다, 덮다, 두르다 등 무려 3가지 이상의 전혀 다른 뜻을 가진 으뜸 다의어입니다."],
      ["갑자기", "time", 1, "미처 대비하거나 생각할 겨를도 없이 아주 급하고 빠르게 일어나는 상황을 뜻해요.", "체육 시간에 맑았던 하늘에서 갑자기 굵은 소나기가 쏟아져서 반 친구들 모두 교실로 뛰어 들어갔다.", "예상치 못한 돌발 상황이 벌어져서 당황스러울 때 문장의 맨 앞에 가장 자주 붙는 고유어 부사예요."],
      ["강아지", "nature", 1, "개가 낳은 새끼를 아주 귀엽고 친근하게 부르는 널리 사랑받는 동물의 이름이에요.", "학교 가는 길에 꼬리를 흔들며 쫄랑쫄랑 따라오는 이웃집 하얀 강아지가 너무 귀여워 쓰다듬어 주었다.", "짐승의 새끼를 뜻하는 '-아지'가 개와 결합하여 파생된 말로, 송아지, 망아지도 같은 원리로 만들어졌어요."],
      ["갖추다", "action", 2, "1. 목적을 위해 꼭 있어야 할 물건이나 조건을 마련하는 일이에요.<br>2. 올바른 예절이나 태도를 차리는 일이에요.", "1. 우리 학교 과학실은 실험에 필요한 도구를 완벽히 갖추고 있다.<br>2. 선생님과 인사할 때는 허리를 굽혀 바른 예의를 갖추어야 한다.", "물건을 준비하는 것뿐만 아니라 사람으로서의 올바른 기본기를 닦는 아주 훌륭한 도덕적 태도랍니다."],
      ["개구쟁이", "action", 1, "행동이 얌전하지 않고 아주 심하게 장난을 치며 노는 아이를 귀엽게 부르는 파생어예요.", "우리 모둠의 최고 개구쟁이 지훈이 덕분에 딱딱했던 조별 활동 시간이 웃음바다가 되었다.", "심한 장난을 치는 단점이 있지만 분위기를 띄우는 귀여운 매력을 가졌을 때 주로 부르는 애칭입니다."],
      ["거드름", "heart", 2, "스스로 잘난 체하며 남들 앞에서 아주 거만하고 우쭐거리며 구는 얄미운 태도예요.", "이번 수학 단원 평가에서 혼자 백 점을 맞았다고 친구들 앞에서 거드름을 피우면 미움을 받을 수 있다.", "거만함보다는 남을 배려하는 겸손한 태도를 갖추는 것이 진정한 실력자이자 멋진 6학년의 모습이라는 걸 잊지 마세요."],
      ["거칠다", "heart", 1, "1. 물체의 표면이 매끄럽지 못하고 까슬까슬한 상태예요.<br>2. 사람의 말이나 행동이 부드럽지 못하고 험한 상태예요.", "1. 찬 바람을 많이 맞으며 뛰어놀았더니 손등이 거칠어졌다.<br>2. 화가 난다고 거친 말을 쓰면 친구에게 큰 상처를 주게 된다.", "물리적인 촉감과 사람의 험한 태도를 동시에 나타낼 수 있는 활용도 높은 형용사입니다."],
      ["걱정", "heart", 1, "안심이 되지 않아 속을 태우며 마음이 불안하고 괴로운 아주 자연스러운 감정 상태예요.", "내가 체육 시간에 다쳐서 양호실에 가자, 단짝 친구가 몹시 걱정스러운 표정으로 달려와 주어 고마웠다.", "우리가 매일 쓰는 순우리말로 누군가를 아끼기 때문에 생겨나는 따뜻한 마음이기도 해요."],
      ["걷다", "action", 1, "1. 두 다리를 번갈아 떼어 옮기며 바닥을 나아가는 동작이에요.<br>2. 늘어지거나 덮인 것을 위로 끌어 올리는 행동이에요.<br>3. 벌여 놓은 것을 거두어 치우는 일이에요.", "1. 시원한 가을바람을 맞으며 공원을 나란히 걸었다.<br>2. 더운 여름날 바닥 청소를 하기 위해 소매를 무릎까지 걷어 올렸다.<br>3. 비가 오려고 해서 마당에 널어둔 빨래를 재빨리 걷었다.", "전혀 다른 3가지 뜻이 있으니 문맥에 따라 헷갈리지 않게 잘 구분해서 써보세요."],
      ["걸싸다", "action", 3, "동작이 답답하지 않게 아주 날래고, 일을 처리하는 솜씨가 빠르고 시원시원하다는 칭찬이에요.", "청소 당번인 민지는 성격이 아주 걸싸서 넓은 복도 청소를 빗자루질 몇 번으로 순식간에 끝내버렸다.", "능력이 뛰어나고 융통성이 있어 굼뜨지 않게 척척 일을 해내는 아주 유능한 친구를 칭찬할 때 써보세요."],
      ["겪다", "action", 1, "1. 어렵고 힘든 일이나 새롭고 중요한 사건을 몸소 부딪쳐 치러내는 행동이에요.<br>2. 사람을 사귀어 지내보는 일이에요.", "1. 체육대회 준비를 하며 친구들과 다투고 화해하는 과정을 겪었다.<br>2. 겉보기엔 무뚝뚝해도 직접 겪어보니 아주 다정한 친구였다.", "자신의 몸과 마음으로 직접 체험하거나 사람을 사귀어 볼 때 쓰는 가치 있는 동사입니다."],
      ["견디다", "heart", 1, "당장 몹시 힘들고 아프지만 포기하지 않고 그 어려움을 꾹 참고 버티어 내는 굳센 힘이에요.", "오래달리기를 할 때 숨이 턱까지 차오르는 고통을 꾹 참고 끝까지 견디어 낸 내 자신이 무척 자랑스러웠다.", "어려움을 극복하고 더 단단하게 성장하는 6학년 아이들의 훌륭한 인내심과 의지를 보여주는 멋진 낱말입니다."],
      ["곁", "daily", 1, "어떤 대상의 아주 가까운 양옆이나 주변 공간을 뜻하는 아주 다정하고 심리적인 거리를 나타내는 말이에요.", "내가 수학 문제를 틀려서 몹시 속상해하고 있을 때, 짝꿍이 곁으로 조용히 다가와 따뜻하게 위로해 주었다.", "단순한 물리적 옆자리를 넘어 마음으로 의지하고 보호해 주는 아주 따뜻한 관계의 자리를 뜻하기도 한답니다."],
      ["고개", "nature", 1, "1. 산이나 언덕을 넘어가도록 비탈지게 나 있는 길이에요.<br>2. 사람이나 동물의 목 윗부분을 뜻해요.<br>3. 일을 처리할 때 겪는 위기나 고비예요.", "1. 숨을 헐떡이며 가파른 고개를 넘어 교실에 도착했다.<br>2. 선생님의 칭찬을 듣고 쑥스러워 고개를 푹 숙였다.<br>3. 이번 시험 준비의 가장 힘든 고개를 무사히 넘겼다.", "자연의 지형과 사람의 신체, 그리고 위기의 순간까지 세 가지 완벽히 다른 뜻을 가졌습니다."],
      ["고르다", "action", 1, "1. 여럿 중에서 마음에 들거나 기준에 알맞은 것을 뽑아내는 행동이에요.<br>2. 울퉁불퉁하지 않고 상태가 고르게 정돈된 상태예요.<br>3. 날씨나 상태가 평소처럼 순조로운 상태예요.", "1. 도서관에 가서 주말에 읽을 재미있는 소설책을 골랐다.<br>2. 운동장의 흙이 파인 곳 없이 아주 고르게 잘 다듬어져 있다.<br>3. 오늘은 바람 한 점 없이 아주 고른 날씨다.", "선택을 뜻하는 동사와 가지런하다는 뜻의 형용사로 쓰이는 필수 단어입니다."],
      ["고스란히", "daily", 2, "누가 함부로 건드리거나 빼내지 않아서 조금도 축나거나 상함 없이 원래 있던 모양 그대로인 완벽한 상태예요.", "학교 운동장에서 주운 5천 원 지폐를 파출소에 가져다주었더니 주인의 품으로 고스란히 돌아갈 수 있었다.", "상태나 물건이 전혀 훼손되지 않고 온전하게 잘 보존되었을 때 문장을 아주 고급스럽게 꾸며주는 예쁜 부사입니다."],
      ["고약하다", "heart", 2, "1. 맛이나 냄새 따위가 코를 찌를 듯이 몹시 나쁜 상태예요.<br>2. 사람의 마음씨가 남을 괴롭힐 정도로 지독하게 심술궂은 상태예요.<br>3. 날씨나 사정이 몹시 나쁘고 험한 상태예요.", "1. 오래된 하수구에서 아주 고약한 냄새가 진동을 했다.<br>2. 놀부처럼 남을 시기하는 고약한 심보를 가지면 친구들이 떠나간다.<br>3. 오늘따라 날씨가 비바람이 몰아치며 아주 고약하다.", "악취를 묘사할 때와 사람의 나쁜 본성을 꼬집을 때 아주 강력하게 씁니다."],
      ["고즈넉하다", "heart", 2, "주변이 시끄럽지 않고 아주 고요하고 평화로우며 아늑한 느낌을 주어 마음이 차분해지는 상태예요.", "방과 후 아무도 남지 않은 도서관의 고즈넉한 분위기 속에서 혼자 조용히 동화책을 읽으니 집중이 정말 잘 되었다.", "시끄러운 소음이 사라진 뒤 찾아오는 마음이 편안해지는 조용한 장소나 시간의 분위기를 묘사하는 아주 멋진 형용사예요."],
      ["고치다", "action", 1, "1. 병이나 아픈 곳을 치료하여 낫게 하는 일이에요.<br>2. 고장 나거나 낡은 것을 손보아 쓰게 하는 일이에요.<br>3. 잘못된 단점이나 나쁜 버릇을 바로잡는 일이에요.", "1. 의사 선생님께서 나의 지독한 감기를 고쳐 주셨다.<br>2. 주말에 아빠와 함께 펑크 난 자전거 바퀴를 고쳤다.<br>3. 자주 지각하는 나의 나쁜 게으름 버릇을 기필코 고치겠다.", "병, 고장 난 물건, 그리고 나의 단점을 모두 낫게 만드는 아주 훌륭하고 긍정적인 행동입니다."],
      ["곧장", "action", 1, "굽은 길로 빙 돌아가거나 딴 데로 한눈팔아 새지 않고 목적지를 향해 똑바로 쭉 나아가는 단호한 모양이에요.", "오늘 학교 수업이 끝나면 피시방이나 놀이터에서 헤매지 말고 집으로 곧장 가야 부모님이 걱정하지 않으신다.", "망설임 없이 빠르고 정확하게 직진하는 행동을 묘사할 때 쓰며, 바르고 곧은 마음가짐을 은유할 때도 유용합니다."],
      ["골짜기", "nature", 1, "크고 높은 산과 산 사이에 길고 깊게 푹 파여 있어서 물이 고여 흐르기 좋은 아주 깊은 지형을 말해요.", "현장체험학습으로 산에 갔을 때 깊은 골짜기 사이로 맑고 시원한 계곡물이 세차게 흘러내리는 경쾌한 소리를 들었다.", "소리를 지르면 메아리가 크게 울려 퍼지는 자연의 웅장한 지형으로, 인생의 아주 힘들고 우울한 시기를 비유하기도 해요."],
      ["곯다", "action", 2, "1. 과일 따위의 속이 물러서 상하는 일이에요.<br>2. 제때 밥을 먹지 못해 속이 비어 배가 고픈 상태예요.<br>3. 억울한 일로 몹시 속상하여 마음이 썩어 들어가는 일이에요.", "1. 사과상자에서 곯은 사과를 골라내어 버렸다.<br>2. 아침밥을 거르고 왔더니 배를 곯아 꼬르륵 소리가 났다.<br>3. 억울한 오해를 받아 속이 곯을 대로 곯았다.", "물리적으로 배가 고프거나 과일이 썩은 것부터, 마음이 병들고 아플 때까지 폭넓게 비유합니다."],
      ["곰곰이", "heart", 1, "한 가지 일에 대해 마음을 가라앉히고 여러모로 차분하게 아주 깊고 진지하게 생각하는 조용한 모양이에요.", "내가 중학교에 가서 진짜로 하고 싶은 꿈이나 장래 희망이 무엇인지 주말 내내 책상에 앉아 곰곰이 생각하며 일기를 썼다.", "글씨를 쓸 때 소리 나는 대로 '곰곰히'로 잘못 쓰는 경우가 아주 많은데, '곰곰이'가 올바른 표준어 맞춤법이라는 점 꼭 기억하세요!"],
      ["곰살갑다", "heart", 2, "말투나 행동이 무뚝뚝하지 않고 성질이 아주 부드럽고 다정하며 싹싹하게 친절하다는 기분 좋은 뜻이에요.", "전학을 와서 교실에서 혼자 쭈뼛거리는 나에게, 먼저 곰살갑게 다가와 상냥한 인사를 건네준 짝꿍이 눈물 나게 고마웠다.", "마치 곰돌이 인형처럼 포근하고 다정한 친구의 성격을 아주 멋지게 칭찬할 때 꼭 어울리는 훌륭한 고유어 형용사입니다."],
      ["곱다", "daily", 1, "1. 모양이나 색깔, 소리나 사람의 마음씨가 예쁘고 아름다운 상태예요.<br>2. 추위 때문에 손가락이 굳어 감각이 없고 뻣뻣해진 상태예요.", "1. 거친 욕설을 빼고 고운 말을 쓰면 학급 분위기가 따뜻해진다.<br>2. 한겨울에 장갑을 안 껴서 추위에 손이 곱아 글씨가 안 써진다.", "아름답다는 뜻의 형용사와 손이 얼었다는 뜻의 형용사가 소리만 같을 뿐 전혀 다른 뜻을 지녔습니다."],
      ["구르다", "action", 1, "1. 둥근 물체가 바닥에 닿아 빙글빙글 돌며 자리를 옮기는 모양이에요.<br>2. 사람이 누운 채로 이리저리 뒹굴거나 도는 모양이에요.<br>3. 발로 바닥을 세게 구르며 치는 행동이에요.", "1. 힘차게 찬 축구공이 모래밭까지 시원하게 굴러갔다.<br>2. 체육 시간에 매트 위에서 앞으로 구르기를 연습했다.<br>3. 몹시 억울하고 화가 나서 방바닥에 발을 구르며 소리쳤다.", "상황이 점점 나빠지거나 커질 때 '눈덩이처럼 구르다'라고 비유로도 쓰이는 생생한 순우리말 동사입니다."],
      ["구름", "nature", 1, "공기 중의 수증기가 엉겨 붙어 무리가 되어 높은 하늘에 신비롭게 떠 있는 아주 친숙하고 예쁜 자연 현상이에요.", "미술 시간에 파란 크레파스로 맑은 가을 하늘을 칠하고 그 위에 하얀 물감으로 솜사탕 같은 뭉게구름을 두둥실 예쁘게 그렸다.", "먹구름, 양떼구름, 쌘구름 등 생김새와 특징에 따라 수십 가지의 재미있는 고유어 이름으로 나뉘는 기상 현상의 대표 단어랍니다."],
      ["구쁘다", "food", 3, "배 속이 허전하여 무언가를 자꾸 먹고 싶다는 뜻을 가진, 식욕이 당길 때 쓰는 아주 재미있고 낯선 옛말이에요.", "점심시간에 밥을 조금 남겼더니 오후 4시쯤 하교 시간이 되자 어김없이 입이 구쁘기 시작하여 떡볶이집으로 향했다.", "출출하고 입이 심심해서 군것질이 당길 때 '나 지금 너무 구쁘다!'라고 친구들에게 멋지게 써먹어 보세요."],
      ["까불다", "action", 1, "1. 곡식을 키에 담아 위아래로 흔들어 먼지를 날려 보내는 농사일이에요.<br>2. 행동이 얌전하지 못하고 함부로 가볍게 장난치는 모습이에요.", "1. 할머니께서 키에 콩을 담아 위아래로 까불며 먼지를 털어내셨다.<br>2. 수업 시간에 까불다가 선생님께 지적을 받고 부끄러웠다.", "곡식을 터는 조상들의 지혜로운 행동이, 아이들의 점잖지 못한 장난을 뜻하는 말로 넓게 쓰이게 되었습니다."],
      ["까칠하다", "heart", 1, "1. 야위거나 메말라 피부 표면이 몹시 거친 상태예요.<br>2. 사람의 성질이 부드럽지 못하고 신경질적이라 원만하지 않은 상태예요.", "1. 겨울철에 로션을 바르지 않았더니 볼이 까칠하게 텄다.<br>2. 요즘 작은 농담에도 예민하게 반응하고 까칠하게 대답하게 된다.", "피부의 메마름과 예민하고 짜증이 많은 성격을 묘사할 때 모두 찰떡같이 쓰이는 단어입니다."],
      ["깜깜하다", "nature", 1, "1. 빛이 전혀 없어서 앞이 보이지 않을 정도로 어두운 상태예요.<br>2. 희망이나 대책이 없어 어떻게 해야 할지 막막한 심정이에요.<br>3. 어떤 사실에 대한 기억이나 소식이 전혀 없는 상태예요.", "1. 밤에 불을 끄고 누우니 방 안이 너무 깜깜해서 무서웠다.<br>2. 시험지를 받았는데 배운 내용이 하나도 기억나지 않아 눈앞이 깜깜했다.<br>3. 어릴 때 친구의 얼굴이 지금은 깜깜하게 기억나지 않는다.", "물리적인 어둠뿐만 아니라 사람의 앞날이 안 보이고 당황스러운 감정을 기가 막히게 표현해 줍니다."],
      ["깜냥", "heart", 2, "스스로 어떠한 일을 해낼 수 있는 본인의 능력이나 수준, 혹은 한계를 뜻하는 아주 줏대 있는 고유어예요.", "남들이 뭐라 하든 신경 쓰지 않고 나는 내 깜냥껏 내가 할 수 있는 최선의 노력을 다해 숙제를 마쳤다.", "자신의 능력 안에서 남에게 의지하지 않고 묵묵히 노력할 때 쓰기 좋은 다부지고 단단한 느낌의 칭찬입니다."],
      ["깜빡", "action", 1, "1. 불빛 따위가 잠깐 밝았다가 사라지는 눈부신 모양이에요.<br>2. 순간적으로 기억이나 의식을 잃어버리는 일상적인 실수 모양이에요.", "1. 밤하늘에 반딧불이 불빛이 깜빡 빛났다가 사라졌다.<br>2. 허둥지둥 등교하느라 수학 노트를 가방에 넣는 것을 깜빡했다.", "기억력이 흐려져서 무언가를 잊어버렸을 때 가장 많이 변명으로 등장하는 친숙한 귀여운 부사입니다."],
      ["깜찍하다", "daily", 1, "생김새가 아주 작고 귀여우며, 하는 행동이 눈치가 빠르고 영리해서 사랑스럽다는 뜻의 칭찬이에요.", "지민이가 새로 사 온 필통에 달린 아주 깜찍한 고양이 열쇠고리가 우리 반 여학생들 사이에서 엄청난 인기를 끌었다.", "단순히 귀여운 것을 넘어서 체구는 작지만 행동이 아주 야무지고 센스가 넘칠 때 콕 집어 칭찬하는 말이에요."],
      ["꼬집다", "action", 1, "1. 손가락으로 살을 단단히 잡아 비트는 물리적인 행동이에요.<br>2. 남의 아픈 약점이나 잘못을 아주 매섭게 지적하여 아프게 하는 일이에요.<br>3. 어떤 사실을 콕 집어내어 지적하는 행동이에요.", "1. 동생이 장난을 치며 내 팔을 세게 꼬집어서 따끔했다.<br>2. 친구가 짝꿍의 콤플렉스를 꼬집어 말하는 바람에 큰 싸움이 났다.<br>3. 선생님은 우리 반의 문제점을 정확히 꼬집어 말씀하셨다.", "물리적인 통증보다, 친구의 기분을 나쁘게 하거나 핵심을 찌를 때의 예리함을 비유합니다."],
      ["꼼수", "action", 1, "정정당당한 방법이 아니라 쩨쩨하고 얕은 수단이나 꾀를 부려 상황을 유리하게 넘어가려는 얄미운 방법이에요.", "청소 시간에 쓰레기 당번을 피하려고 몰래 꼼수를 부리다가 결국 반장에게 들켜서 화장실 청소까지 하게 되었다.", "게임을 할 때 규칙을 어기고 편법을 쓰는 얄미운 반칙을 뜻하는 말로 아이들 사이에서 아주 자주 쓰이는 현실적인 단어입니다."],
      ["꼼꼼하다", "heart", 1, "빈틈이 없이 아주 차분하고 조심스럽게 일을 끝까지 완벽하게 처리하는 훌륭하고 훌륭한 성격이에요.", "중요한 단원 평가 수학 시험을 다 풀고 나서 시간이 남았길래, 계산 실수한 곳이 없는지 꼼꼼하게 처음부터 다시 검토를 했다.", "덜렁대지 않고 실수를 줄여주기 때문에 중학교에 진학하기 전 6학년 학생들에게 꼭 필요한 가장 좋은 습관 중 하나랍니다."],
      ["꾀", "heart", 1, "어려운 일이나 복잡한 상황을 잘 뚫고 나오기 위해 머리를 써서 생각해 낸 묘하고 영리한 지혜나 수단이에요.", "토끼와 거북이 이야기에서 토끼는 빠른 발만 믿었지만, 거북이는 꾀를 내어 포기하지 않고 끈기 있게 결승선을 통과했다.", "지혜와 비슷하지만 약간 잔머리를 굴린다는 느낌이 있어 '잔꾀를 부리다'처럼 얌체 같은 행동을 혼낼 때도 사용됩니다."],
      ["꾸벅꾸벅", "action", 1, "1. 졸음이 와서 머리가 무거워 자꾸 앞으로 수그러지는 모양이에요.<br>2. 남에게 인사를 여러 번 연속해서 깊숙이 하는 공손한 모양이에요.", "1. 늦게까지 게임을 했더니 수업 내내 꾸벅꾸벅 졸고 말았다.<br>2. 교장 선생님을 뵙고 반갑게 꾸벅꾸벅 인사를 드렸다.", "밀려오는 수마(잠)를 이기지 못하는 일상과, 예의 바르게 인사하는 두 가지 모습을 모두 생생하게 그려내는 소리말입니다."],
      ["꿀꺽", "action", 1, "1. 입안에 고인 침이나 물을 단숨에 삼키는 소리예요.<br>2. 남의 물건을 몰래 가로채어 제 것으로 만드는 얄미운 모양이에요.<br>3. 참았던 말이나 울음을 속으로 억지로 참아 넘기는 모양이에요.", "1. 체육을 마치고 시원한 얼음물을 꿀꺽 단숨에 들이마셨다.<br>2. 주운 돈을 경찰서에 주지 않고 몰래 꿀꺽 삼키면 안 된다.<br>3. 화가 났지만 싸우지 않기 위해 할 말을 꿀꺽 삼켰다.", "식욕을 돋우는 물 마시는 소리부터 욕심과 인내심까지 뜻이 기가 막히게 확장되는 유쾌한 의성어입니다."],
      ["꿈", "heart", 1, "1. 잠을 잘 때 깨어 있을 때처럼 여러 가지 현상을 보는 일이에요.<br>2. 실현시키고 싶은 미래의 희망이나 목표예요.<br>3. 실현될 가능성이 아주 없는 헛된 기대나 생각이에요.", "1. 어젯밤에 구름 위를 훨훨 날아다니는 신비한 꿈을 꾸었다.<br>2. 나는 커서 훌륭한 로봇 공학자가 되겠다는 꿈을 품었다.<br>3. 공부는 안 하고 백 점을 맞길 바라다니 헛된 꿈을 버려라.", "인간의 무한한 상상력과 장래 희망을 뜻하는, 두 글자 한자어 '희망'을 완벽하게 압도하는 가장 아름다운 고유어입니다."]
    ];

    const wordGrid = document.getElementById('wordGrid');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const consonantContainer = document.getElementById('consonantContainer');
    const categoryContainer = document.getElementById('categoryContainer');
    const resultCount = document.getElementById('resultCount');
    const emptyState = document.getElementById('emptyState');
    const totalWordsBadge = document.getElementById('totalWordsBadge');
    const paginationContainer = document.getElementById('paginationContainer');
    const pageInfoText = document.getElementById('pageInfoText');
    const bookmarkCount = document.getElementById('bookmarkCount');

    const CATEGORY_MAP = {
      "nature": { label: "자연과 날씨", icon: "fa-leaf", color: "text-emerald-600", bg: "bg-emerald-100" },
      "heart": { label: "마음과 태도", icon: "fa-heart", color: "text-rose-500", bg: "bg-rose-100" },
      "action": { label: "움직임과 성장", icon: "fa-person-running", color: "text-sky-500", bg: "bg-sky-100" },
      "daily": { label: "우리네 일상", icon: "fa-house", color: "text-amber-600", bg: "bg-amber-100" },
      "time": { label: "시간과 계절", icon: "fa-clock", color: "text-indigo-500", bg: "bg-indigo-100" },
      "food": { label: "음식과 감각", icon: "fa-utensils", color: "text-orange-500", bg: "bg-orange-100" }
    };
    const CONSONANTS = ['ㄱ', 'ㄴ', 'ㄷ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅅ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
    const ITEMS_PER_PAGE = 24;

    function loadBookmarks() {
      try {
        const saved = JSON.parse(localStorage.getItem('koreanWordBookmarks'));
        return Array.isArray(saved) ? saved : [];
      } catch (e) { return []; }
    }

    function saveBookmarks() {
      try { localStorage.setItem('koreanWordBookmarks', JSON.stringify(bookmarkedWords)); } 
      catch (e) {}
    }

    let allWords = [];
    let filteredWords = [];
    let currentConsonant = null;
    let currentCategory = null;
    let currentLevel = 'all';
    let showBookmarksOnly = false;
    let currentPage = 1;
    let bookmarkedWords = loadBookmarks();

    function getInitialConsonant(word) {
      const startChar = word.charCodeAt(0);
      if (startChar >= 0xAC00 && startChar <= 0xD7A3) {
        const initialIndex = Math.floor((startChar - 0xAC00) / 588);
        const initials = ["ㄱ", "ㄲ", "ㄴ", "ㄷ", "ㄸ", "ㄹ", "ㅁ", "ㅂ", "ㅃ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅉ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
        return initials[initialIndex];
      }
      return "";
    }

    function init() {
      allWords = RAW_WORDS.map((data, index) => {
        return {
          id: index, word: data[0], consonant: getInitialConsonant(data[0]),
          category: data[1], level: data[2], meaning: data[3], example: data[4], tip: data[5]
        };
      });
      allWords.sort((a, b) => a.word.localeCompare(b.word));
      totalWordsBadge.innerText = `${allWords.length}단어 수록`;
      updateBookmarkCount();
      renderConsonantFilters();
      renderCategoryFilters();
      pickRandomTodayWord();
      applyFiltersAndRender(1);
    }

    function renderConsonantFilters() {
      consonantContainer.innerHTML = '';
      CONSONANTS.forEach(c => {
        const count = allWords.filter(w => w.consonant === c).length;
        const btn = document.createElement('button');
        btn.onclick = () => setConsonantFilter(c);
        btn.className = `flex flex-col items-center justify-center p-2 rounded-2xl border-2 transition-all active:scale-95 ${currentConsonant === c ? 'border-emerald-500 bg-emerald-50 shadow-md' : 'border-slate-100 bg-white hover:border-emerald-200 hover:bg-slate-50 shadow-sm'}`;
        btn.innerHTML = `<span class="text-xl sm:text-2xl font-fun font-bold ${currentConsonant === c ? 'text-emerald-700' : 'text-slate-700'}">${c}</span><span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full ${currentConsonant === c ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-400 mt-1'}">${count}</span>`;
        consonantContainer.appendChild(btn);
      });
    }

    function renderCategoryFilters() {
      categoryContainer.innerHTML = '';
      const catCounts = {};
      allWords.forEach(w => catCounts[w.category] = (catCounts[w.category] || 0) + 1);
      Object.entries(CATEGORY_MAP).forEach(([key, info]) => {
        if (!catCounts[key]) return;
        const btn = document.createElement('button');
        btn.onclick = () => setCategoryFilter(key);
        btn.className = `px-3.5 py-2 rounded-xl text-xs font-bold border transition-all active:scale-95 flex items-center gap-1.5 ${currentCategory === key ? `bg-white ${info.color} border-${info.color.split('-')[1]}-400 shadow-md transform scale-105` : `bg-slate-50 text-slate-500 border-slate-200 hover:bg-slate-100`}`;
        btn.innerHTML = `<i class="fa-solid ${info.icon}"></i> ${info.label} <span class="opacity-60 text-[10px] ml-1">(${catCounts[key]})</span>`;
        categoryContainer.appendChild(btn);
      });
    }

    function setConsonantFilter(c) { currentConsonant = (currentConsonant === c) ? null : c; renderConsonantFilters(); applyFiltersAndRender(1); }
    function setCategoryFilter(cat) { currentCategory = (currentCategory === cat) ? null : cat; renderCategoryFilters(); applyFiltersAndRender(1); }

    function setLevelFilter(lvl) {
      currentLevel = lvl;
      ['all', 1, 2, 3].forEach(l => {
        const b = document.getElementById(`levelBtn-${l}`);
        if(b) b.className = (l === lvl) ? "px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow-sm transition transform scale-105" : "px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition";
      });
      applyFiltersAndRender(1);
    }

    function toggleBookmarkFilter() {
      showBookmarksOnly = !showBookmarksOnly;
      const btn = document.getElementById('bookmarkTabBtn');
      if (showBookmarksOnly) {
        btn.className = "whitespace-nowrap px-3 py-2 rounded-xl text-xs sm:text-sm font-bold border-2 border-amber-400 bg-amber-100 text-amber-900 flex items-center gap-1.5 shadow-md transition transform scale-105";
        btn.innerHTML = `<i class="fa-solid fa-star text-amber-600"></i><span>단어장 보는 중</span><span class="bg-amber-600 text-white rounded-full px-1.5 py-0.2 text-[11px] font-bold">${bookmarkedWords.length}</span>`;
      } else {
        btn.className = "whitespace-nowrap px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-amber-300 bg-amber-50 text-amber-800 hover:bg-amber-100 flex items-center gap-1.5 shadow-sm transition active:scale-95";
        btn.innerHTML = `<i class="fa-solid fa-star text-amber-500"></i><span>내 단어장</span><span id="bookmarkCount" class="bg-amber-500 text-white rounded-full px-1.5 py-0.2 text-[11px] font-bold">${bookmarkedWords.length}</span>`;
      }
      applyFiltersAndRender(1);
    }

    function handleSearch() {
      const q = searchInput.value.trim();
      clearSearchBtn.classList.toggle('hidden', !q);
      applyFiltersAndRender(1);
    }

    function clearSearch() { searchInput.value = ''; clearSearchBtn.classList.add('hidden'); applyFiltersAndRender(1); }
    function clearConsonantFilter() { currentConsonant = null; renderConsonantFilters(); applyFiltersAndRender(1); }

    function resetFilters() {
      searchInput.value = ''; clearSearchBtn.classList.add('hidden');
      currentConsonant = null; currentCategory = null; currentLevel = 'all'; showBookmarksOnly = false;
      const bBtn = document.getElementById('bookmarkTabBtn');
      bBtn.className = "whitespace-nowrap px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-amber-300 bg-amber-50 text-amber-800 hover:bg-amber-100 flex items-center gap-1.5 shadow-sm transition active:scale-95";
      bBtn.innerHTML = `<i class="fa-solid fa-star text-amber-500"></i><span>내 단어장</span><span id="bookmarkCount" class="bg-amber-500 text-white rounded-full px-1.5 py-0.2 text-[11px] font-bold">${bookmarkedWords.length}</span>`;
      renderConsonantFilters(); renderCategoryFilters(); setLevelFilter('all'); document.getElementById('sortSelect').value = 'nameAsc';
      applyFiltersAndRender(1);
    }

    function applyFiltersAndRender(page = 1) {
      currentPage = page;
      const query = searchInput.value.trim().toLowerCase();
      const sortVal = document.getElementById('sortSelect').value;

      filteredWords = allWords.filter(w => {
        if (showBookmarksOnly && !bookmarkedWords.includes(w.id)) return false;
        if (currentConsonant && w.consonant !== currentConsonant) return false;
        if (currentCategory && w.category !== currentCategory) return false;
        if (currentLevel !== 'all' && w.level !== currentLevel) return false;
        if (query && !(w.word.toLowerCase().includes(query) || w.meaning.toLowerCase().includes(query) || w.example.toLowerCase().includes(query))) return false;
        return true;
      });

      filteredWords.sort((a, b) => {
        if (sortVal === 'nameAsc') return a.word.localeCompare(b.word);
        if (sortVal === 'nameDesc') return b.word.localeCompare(a.word);
        if (sortVal === 'levelAsc') return a.level - b.level || a.word.localeCompare(b.word);
        if (sortVal === 'levelDesc') return b.level - a.level || a.word.localeCompare(b.word);
      });

      resultCount.innerText = `${filteredWords.length}개`;
      const totalPages = Math.ceil(filteredWords.length / ITEMS_PER_PAGE);
      if (totalPages > 0) {
        pageInfoText.innerText = `(${currentPage} / ${totalPages} 페이지)`;
        pageInfoText.classList.remove('hidden');
      } else { pageInfoText.classList.add('hidden'); }

      renderGrid(); renderPagination(totalPages);
    }

    function renderGrid() {
      wordGrid.innerHTML = '';
      if (filteredWords.length === 0) {
        emptyState.classList.remove('hidden'); emptyState.classList.add('flex'); return;
      } else {
        emptyState.classList.add('hidden'); emptyState.classList.remove('flex');
      }

      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const paginated = filteredWords.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      paginated.forEach(w => {
        const isBookmarked = bookmarkedWords.includes(w.id);
        const catInfo = CATEGORY_MAP[w.category] || { label: '기타', color: 'text-slate-500', bg: 'bg-slate-100', icon: 'fa-cube' };
        
        const card = document.createElement('div');
        card.className = "bg-white rounded-3xl p-5 border border-slate-100 shadow-sm cursor-pointer card-hover relative group flex flex-col items-center justify-center min-h-[140px]";
        card.onclick = (e) => { if(!e.target.closest('button.bookmark-btn')) openWordModal(w.id); };
        
        card.innerHTML = `<div class="absolute top-4 left-4 flex gap-1.5"><span class="${catInfo.bg} ${catInfo.color} text-[10px] font-extrabold px-2 py-0.5 rounded flex items-center gap-1"><i class="fa-solid ${catInfo.icon}"></i> ${catInfo.label}</span></div><div class="absolute top-3 right-3"><button class="bookmark-btn text-xl transition-transform hover:scale-125 active:scale-95 ${isBookmarked ? 'text-amber-400' : 'text-slate-200 hover:text-amber-200'}" onclick="toggleBookmark(${w.id}, event)" title="단어장에 추가/해제"><i class="fa-${isBookmarked ? 'solid' : 'regular'} fa-star"></i></button></div><h3 class="text-3xl font-extrabold text-slate-800 font-fun tracking-wide group-hover:text-emerald-600 transition-colors mt-2">${w.word}</h3><div class="absolute bottom-4 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1 text-xs font-bold text-emerald-500 bg-emerald-50 px-3 py-1 rounded-full"><i class="fa-solid fa-hand-pointer"></i> 뜻풀이 보기</div>`;
        wordGrid.appendChild(card);
      });
    }

    function renderPagination(totalPages) {
      paginationContainer.innerHTML = '';
      if (totalPages <= 1) return;

      const createBtn = (text, page, disabled = false, active = false) => {
        const btn = document.createElement('button');
        btn.innerHTML = text; btn.disabled = disabled;
        btn.onclick = () => { window.scrollTo({top: 0, behavior: 'smooth'}); applyFiltersAndRender(page); };
        let classes = "w-9 h-9 rounded-xl flex items-center justify-center text-sm font-bold transition ";
        if (active) classes += "bg-emerald-500 text-white shadow-md transform scale-110";
        else if (disabled) classes += "bg-slate-50 text-slate-300 cursor-not-allowed";
        else classes += "bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-emerald-600";
        btn.className = classes; return btn;
      };

      paginationContainer.appendChild(createBtn('<i class="fa-solid fa-chevron-left"></i>', currentPage - 1, currentPage === 1));
      let startP = Math.max(1, currentPage - 2); let endP = Math.min(totalPages, currentPage + 2);
      
      if (startP > 1) {
        paginationContainer.appendChild(createBtn('1', 1));
        if (startP > 2) { const dots = document.createElement('span'); dots.className = "text-slate-400 px-1"; dots.innerText = "..."; paginationContainer.appendChild(dots); }
      }
      for (let i = startP; i <= endP; i++) { paginationContainer.appendChild(createBtn(i, i, false, i === currentPage)); }
      if (endP < totalPages) {
        if (endP < totalPages - 1) { const dots = document.createElement('span'); dots.className = "text-slate-400 px-1"; dots.innerText = "..."; paginationContainer.appendChild(dots); }
        paginationContainer.appendChild(createBtn(totalPages, totalPages));
      }
      paginationContainer.appendChild(createBtn('<i class="fa-solid fa-chevron-right"></i>', currentPage + 1, currentPage === totalPages));
    }

    function toggleBookmark(id, event) {
      if (event) event.stopPropagation();
      const index = bookmarkedWords.indexOf(id);
      if (index === -1) { bookmarkedWords.push(id); } else { bookmarkedWords.splice(index, 1); }
      saveBookmarks(); updateBookmarkCount();
      const modalBtn = document.getElementById('modalBookmarkBtn');
      if(modalBtn && !document.getElementById('wordModal').classList.contains('hidden')) {
        const isBook = bookmarkedWords.includes(id);
        modalBtn.innerHTML = `<i class="fa-${isBook ? 'solid' : 'regular'} fa-star ${isBook ? 'text-amber-400' : 'text-slate-300'}"></i>`;
      }
      applyFiltersAndRender(currentPage);
    }

    function updateBookmarkCount() {
      const count = bookmarkedWords.length;
      const countEl = document.getElementById('bookmarkCount');
      if (countEl) countEl.innerText = count;
    }

    function speakWord(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR'; utterance.rate = 0.85; utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      } else { alert("이 브라우저에서는 음성 듣기를 지원하지 않습니다."); }
    }

    function openWordModal(id) {
      const w = allWords.find(item => item.id === id); if (!w) return;
      const catInfo = CATEGORY_MAP[w.category] || { label: '기타', bg: 'bg-slate-100', color: 'text-slate-500', icon: 'fa-cube' };
      document.getElementById('modalCategoryBadge').className = `text-xs font-extrabold px-3 py-1.5 rounded-xl shadow-sm ${catInfo.bg} ${catInfo.color}`;
      document.getElementById('modalCategoryBadge').innerHTML = `<i class="fa-solid ${catInfo.icon} mr-1"></i> ${catInfo.label}`;
      document.getElementById('modalLevelBadge').innerText = `${w.level}단계`;
      document.getElementById('modalLevelBadge').className = `text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-200 text-slate-600 bg-white`;
      document.getElementById('modalTitle').innerText = w.word;
      
      // innerHTML로 변경하여 <br> 등 HTML 태그 렌더링 지원
      document.getElementById('modalMeaning').innerHTML = w.meaning;
      document.getElementById('modalExample').innerHTML = w.example; 
      
      document.getElementById('modalTip').innerText = w.tip;
      const isBookmarked = bookmarkedWords.includes(w.id);
      const bBtn = document.getElementById('modalBookmarkBtn');
      bBtn.innerHTML = `<i class="fa-${isBookmarked ? 'solid' : 'regular'} fa-star ${isBookmarked ? 'text-amber-400' : 'text-slate-300'}"></i>`;
      bBtn.onclick = () => toggleBookmark(w.id);
      document.getElementById('modalAudioBtn').onclick = () => speakWord(w.word);
      document.getElementById('modalPracticeShortcutBtn').onclick = () => { closeWordModal(); openPracticeModal(w.id); };
      const modal = document.getElementById('wordModal'); const card = document.getElementById('modalCard');
      modal.classList.remove('hidden'); document.body.classList.add('modal-open');
      setTimeout(() => { card.classList.remove('scale-95', 'opacity-0'); card.classList.add('scale-100', 'opacity-100'); }, 10);
    }

    function closeWordModal() {
      const modal = document.getElementById('wordModal'); const card = document.getElementById('modalCard');
      card.classList.remove('scale-100', 'opacity-100'); card.classList.add('scale-95', 'opacity-0');
      setTimeout(() => { modal.classList.add('hidden'); document.body.classList.remove('modal-open'); }, 200);
    }

    function handleModalClick(e, modalId) {
      if (e.target.id === modalId) {
        if(modalId === 'wordModal') closeWordModal();
        if(modalId === 'practiceModal') closePracticeModal();
        if(modalId === 'quizModal') closeQuizModal();
      }
    }

    function pickRandomTodayWord() {
      const candidates = allWords.filter(w => w.level <= 2);
      const w = candidates[Math.floor(Math.random() * candidates.length)] || allWords[0];
      if (!w) return;
      const catInfo = CATEGORY_MAP[w.category] || { label: '기타' };
      document.getElementById('todayWordCategory').innerText = catInfo.label;
      document.getElementById('todayWordLevel').innerText = `${w.level}단계`;
      document.getElementById('todayWordTitle').innerText = w.word;
      
      // innerHTML로 변경
      document.getElementById('todayWordMeaning').innerHTML = w.meaning;
      document.getElementById('todayWordExample').innerHTML = w.example; 
      
      const card = document.getElementById('todayWordTitle').parentElement.parentElement;
      card.classList.add('opacity-50', 'scale-[0.98]');
      setTimeout(() => { card.classList.remove('opacity-50', 'scale-[0.98]'); card.style.transition = 'all 0.4s ease'; }, 150);
    }

    function openPracticeModal(preselectId = null) {
      const modal = document.getElementById('practiceModal');
      modal.classList.remove('hidden'); document.body.classList.add('modal-open');
      document.getElementById('practiceWordSearch').value = ''; filterPracticeOptions();
      if (preselectId !== null) { document.getElementById('practiceWordSelect').value = preselectId; updatePracticeWordDetail(); }
      document.getElementById('practiceSentenceInput').value = ''; handlePracticeInput();
    }

    function closePracticeModal() { document.getElementById('practiceModal').classList.add('hidden'); document.body.classList.remove('modal-open'); }

    function filterPracticeOptions() {
      const q = document.getElementById('practiceWordSearch').value.trim().toLowerCase();
      const select = document.getElementById('practiceWordSelect'); select.innerHTML = '';
      let options = allWords; if (q) { options = allWords.filter(w => w.word.toLowerCase().includes(q)); }
      if(options.length === 0) {
        select.innerHTML = `<option value="">검색 결과가 없습니다.</option>`;
        document.getElementById('practiceWordMeaningHint').innerText = "단어를 찾아주세요."; return;
      }
      options.forEach(w => { const opt = document.createElement('option'); opt.value = w.id; opt.innerText = w.word; select.appendChild(opt); });
      updatePracticeWordDetail();
    }

    function updatePracticeWordDetail() {
      const id = parseInt(document.getElementById('practiceWordSelect').value);
      const w = allWords.find(x => x.id === id);
      if (w) { document.getElementById('practiceWordMeaningHint').innerHTML = `<span class="font-bold text-sky-600">[${w.word}]</span> ${w.meaning}`; handlePracticeInput(); }
    }

    // 스마트 고유어 활용형 검사 함수
    function checkWordUsed(text, word) {
      if (text.includes(word)) return true;

      // 1. '하다', '거리다', '대다', '이다' 등으로 끝나는 단어 처리
      if (word.endsWith('하다') || word.endsWith('이다') || word.endsWith('대다')) {
        if (text.includes(word.slice(0, -2))) return true;
      }
      if (word.endsWith('거리다')) {
        if (text.includes(word.slice(0, -3))) return true;
      }

      // 2. '다'로 끝나는 동사/형용사 불규칙 활용 검사
      if (word.endsWith('다')) {
        const stem = word.slice(0, -1);
        if (text.includes(stem)) return true;

        if (stem.endsWith('ㅂ')) {
          const base = stem.slice(0, -1);
          if (text.includes(base + '워') || text.includes(base + '운') || text.includes(base + '웠') || text.includes(base + '와')) return true;
        }

        if (stem.endsWith('ㄷ')) {
          const lBase = String.fromCharCode(stem.charCodeAt(stem.length - 1) + 1);
          if (text.includes(lBase + '어') || text.includes(lBase + '으') || text.includes(lBase + '었')) return true;
        }

        if (stem.endsWith('르') && stem.length >= 2) {
          const prevChar = stem.charCodeAt(stem.length - 2);
          const rBase = String.fromCharCode(prevChar + 8); 
          if (text.includes(rBase + '러') || text.includes(rBase + '라') || text.includes(rBase + '렀') || text.includes(rBase + '랐')) return true;
        }
        
        if (stem === '크') { if (text.includes('커') || text.includes('컸')) return true; }
        if (stem === '쓰') { if (text.includes('써') || text.includes('썼')) return true; }
        
        if (stem.endsWith('쁘')) { 
          const base = stem.slice(0, -1);
          if (text.includes(base + '빠') || text.includes(base + '뻐') || text.includes(base + '빴') || text.includes(base + '뻤')) return true;
        }
        
        if (stem.endsWith('ㅅ')) {
          const noS = String.fromCharCode(stem.charCodeAt(stem.length - 1) - 19);
          if (text.includes(noS + '어') || text.includes(noS + '아') || text.includes(noS + '은') || text.includes(noS + '었') || text.includes(noS + '았')) return true;
        }
      }

      return false;
    }

    // 개선된 문장 짓기 검사 함수 적용
    function handlePracticeInput() {
      const id = parseInt(document.getElementById('practiceWordSelect').value);
      const w = allWords.find(x => x.id === id); 
      const input = document.getElementById('practiceSentenceInput'); 
      const text = input.value.trim();
      
      document.getElementById('practiceCharCount').innerText = `${text.length}자`;
      
      const successBox = document.getElementById('practiceSuccessBox'); 
      const checkMsg = document.getElementById('practiceWordCheckMsg');
      
      if (!w || text.length === 0) {
        successBox.classList.add('hidden'); 
        checkMsg.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 문장에 단어를 넣어보세요.`;
        checkMsg.className = "text-slate-400 flex items-center gap-1"; 
        input.classList.remove('ring-emerald-400', 'border-emerald-300', 'bg-emerald-50/30'); 
        return;
      }
      
      if (checkWordUsed(text, w.word)) {
        if (text.length >= 10) { 
          successBox.classList.remove('hidden'); 
          checkMsg.innerHTML = `<i class="fa-solid fa-check text-emerald-500"></i> 단어가 훌륭하게 활용되었습니다!`;
          checkMsg.className = "text-emerald-600 flex items-center gap-1 font-bold"; 
          input.classList.add('ring-emerald-400', 'border-emerald-300', 'bg-emerald-50/30');
        } else {
          successBox.classList.add('hidden'); 
          checkMsg.innerHTML = `<i class="fa-solid fa-spinner text-amber-500"></i> 문장을 조금 더 길게 완성해 보세요.`;
          checkMsg.className = "text-amber-500 flex items-center gap-1"; 
          input.classList.remove('ring-emerald-400', 'border-emerald-300', 'bg-emerald-50/30');
        }
      } else {
        successBox.classList.add('hidden'); 
        checkMsg.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-400"></i> 아직 <b>'${w.word}'</b> 단어가 들어가지 않았어요. (활용형도 가능해요!)`;
        checkMsg.className = "text-rose-500 flex items-center gap-1"; 
        input.classList.remove('ring-emerald-400', 'border-emerald-300', 'bg-emerald-50/30');
      }
    }

    let currentQuizWord = null; let quizScore = 0;

    function openQuizModal() {
      const modal = document.getElementById('quizModal'); modal.classList.remove('hidden'); document.body.classList.add('modal-open');
      quizScore = 0; updateQuizScoreDisplay(); generateNewQuiz();
    }
    function closeQuizModal() { document.getElementById('quizModal').classList.add('hidden'); document.body.classList.remove('modal-open'); }
    function updateQuizScoreDisplay() { document.getElementById('quizScoreText').innerText = `${quizScore}점`; }

    function generateNewQuiz() {
      document.getElementById('quizFeedback').classList.add('hidden'); document.getElementById('nextQuizBtn').classList.add('hidden');
      const optionsContainer = document.getElementById('quizOptions'); optionsContainer.innerHTML = ''; optionsContainer.classList.remove('pointer-events-none');
      const shuffled = [...allWords].sort(() => 0.5 - Math.random()); currentQuizWord = shuffled[0];
      if (!currentQuizWord) return;
      const options = [currentQuizWord, shuffled[1], shuffled[2], shuffled[3]].sort(() => 0.5 - Math.random());
      
      // 퀴즈 창에서도 줄바꿈 인식
      document.getElementById('quizMeaning').innerHTML = currentQuizWord.meaning;
      
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left px-5 py-4 rounded-xl border-2 border-slate-100 bg-white hover:bg-emerald-50 hover:border-emerald-200 text-slate-700 font-extrabold text-lg transition-all shadow-sm focus:outline-none";
        btn.innerText = opt.word; btn.onclick = () => handleQuizAnswer(opt.id, btn, optionsContainer); optionsContainer.appendChild(btn);
      });
    }

    function handleQuizAnswer(selectedId, btnElement, container) {
      container.classList.add('pointer-events-none'); 
      const feedback = document.getElementById('quizFeedback'); const nextBtn = document.getElementById('nextQuizBtn');
      Array.from(container.children).forEach(child => {
        if(child.innerText === currentQuizWord.word) {
           child.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-800'); child.innerHTML += ' <i class="fa-solid fa-circle-check ml-2 text-emerald-500"></i>';
        } else { child.classList.add('opacity-50'); }
      });
      feedback.classList.remove('hidden');
      if (selectedId === currentQuizWord.id) {
        quizScore += 10; updateQuizScoreDisplay(); btnElement.classList.add('ring-4', 'ring-emerald-200', 'transform', 'scale-105');
        feedback.className = "mt-4 p-4 rounded-xl text-center text-sm font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 shadow-sm animate-bounce";
        
        // 정답 피드백 예문에서 양옆 큰따옴표 제거
        feedback.innerHTML = `정답입니다! 👏 아주 잘했어요. <br><span class="text-xs font-normal mt-1 block text-emerald-600">${currentQuizWord.example}</span>`; 
        
        speakWord("정답");
      } else {
        btnElement.classList.remove('opacity-50'); btnElement.classList.add('bg-rose-50', 'border-rose-300', 'text-rose-700', 'ring-4', 'ring-rose-100');
        feedback.className = "mt-4 p-4 rounded-xl text-center text-sm font-bold bg-rose-50 text-rose-700 border border-rose-200 shadow-sm";
        feedback.innerHTML = `아쉽네요! 정답은 <b>'${currentQuizWord.word}'</b> 입니다. <br><span class="text-xs font-normal mt-1 block text-rose-500 cursor-pointer hover:underline" onclick="openWordModal(${currentQuizWord.id})">단어장에 추가하고 복습해 볼까요?</span>`;
      }
      nextBtn.classList.remove('hidden');
    }

    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
  </script>
</body>
