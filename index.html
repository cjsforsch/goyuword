      ["살포시", "action", 2, "1. 포근하게 눈이나 비가 아주 가볍게 소리 없이 내리는 모양이에요.<br>2. 어떤 행동이나 물건을 놓을 때 아주 가볍고 부드럽게 조심스럽게 하는 모양이에요.", "1. 밤사이에 함박눈이 살포시 내려 온 세상을 하얗게 덮었다.<br>2. 창문으로 날아 들어온 작은 나비가 내 지우개에 살포시 내려앉았다.", "'사뿐사뿐'이 걷는 모습이라면, '살포시'는 물건을 놓거나 미소를 지을 때 아주 예쁘게 쓰입니다."],
      ["살피다", "action", 1, "무언가를 주의 깊게 두루두루 쳐다보거나 상황을 꼼꼼하게 알아보는 행동이에요.", "단원 평가 시험지를 제출하기 전에 혹시나 틀린 문제가 없는지 처음부터 꼼꼼히 살폈다.", "남의 눈치를 살피다, 주변을 살피다처럼 조심스럽게 관찰하는 6학년의 성숙한 태도를 나타냅니다."],
      ["새기다", "action", 1, "1. 글씨나 그림을 파서 남기는 일이에요.<br>2. 가르침이나 다짐을 마음에 잊지 않도록 깊이 간직하는 일이에요.<br>3. 동물이 먹은 것을 다시 게워 내어 잘게 씹는 일이에요.", "1. 미술 시간에 고무판에 내 이름표를 정성껏 새겼다.<br>2. 교장 선생님의 훈화 말씀을 내 마음속 깊이 단단하게 새겼다.<br>3. 소가 그늘에 누워 여물을 되새김질하며 평화롭게 새기고 있다.", "물리적으로 도장을 새기는 것뿐만 아니라, 은혜나 다짐을 마음속에 영원히 저장할 때 멋지게 쓰여요."],
      ["새록새록", "action", 2, "1. 어떤 생각이나 느낌, 기억이 자꾸 새롭게 연달아 생겨나는 모양이에요.<br>2. 아주 새로운 일이 잇달아 자꾸 일어나는 모양이에요.", "1. 앨범을 넘겨보니 1학년 때 친구들과 뛰놀던 추억이 새록새록 떠오른다.<br>2. 동아리 활동을 하며 코딩의 재미가 새록새록 느껴져 무척 즐겁다.", "지나간 아름다운 추억이나 잊고 있던 좋은 아이디어가 계속 샘솟듯 떠오를 때 찰떡인 부사입니다."],
      ["새벽", "time", 1, "어두운 밤이 지나고 날이 밝아오기 시작하는 아주 이른 아침의 맑은 시간이에요.", "수학여행의 설렘 때문에 밤잠을 설치다가 결국 창밖으로 동이 트는 새벽을 맞았다.", "어둠이 끝나고 새로운 하루가 시작되는 희망차고 고요한 시간을 상징하는 멋진 고유어예요."],
      ["새침하다", "heart", 2, "마음속으로는 안 그러면서 일부러 짐짓 딴청을 피우며 차갑고 도도한 태도를 보이는 거예요.", "내가 장난을 치며 사과를 건넸지만 짝꿍은 삐친 듯 새침한 표정으로 앞만 보았다.", "진짜로 화가 난 것은 아니지만 살짝 토라져서 얌전을 빼는 친구의 귀여운 표정을 묘사할 때 써요."],
      ["샘", "heart", 2, "1. 땅에서 물이 솟아 나오는 웅덩이나 그런 곳이에요.<br>2. 남이 잘되거나 좋은 것을 가진 것을 질투하는 마음이에요.", "1. 등산을 하다가 옹달샘에서 시원한 물을 떠 마셨다.<br>2. 짝꿍이 대상을 타자 진심으로 축하하면서도 속으로 작은 샘이 났다.", "땅에서 솟아나는 물을 뜻하는 명사와 질투 감정을 나타내는 명사가 소리만 같은 동음이의어입니다."],
      ["서늘하다", "nature", 1, "1. 온도가 낮아 살갗에 닿는 기운이 약간 차갑고 시원한 느낌이 드는 상태예요.<br>2. 놀라거나 무서워서 몹시 두렵고 섬뜩한 느낌이 드는 심리적 상태예요.", "1. 달리기를 하고 땀이 났는데 등 뒤로 서늘한 바람이 불어 기분이 상쾌해졌다.<br>2. 무서운 공포 영화를 보고 났더니 한여름인데도 등골이 서늘했다.", "기온의 시원함과 두려운 감정을 모두 기가 막히게 표현하는 훌륭한 형용사입니다."],
      ["서럽다", "heart", 1, "억울하거나 슬픈 마음이 가슴속에 가득 차서 눈물이 날 만큼 원통하고 괴로운 감정이에요.", "동생이 내 물건을 망가뜨렸는데 엄마가 나만 혼내셔서 너무 서럽고 억울했다.", "단순히 슬픈 것을 넘어서 내 마음을 남이 알아주지 않아 억울한 감정이 섞여 있을 때 주로 씁니다."],
      ["서리", "nature", 2, "1. 늦가을에 수증기가 얼어붙어 풀잎에 하얗게 덮이는 기상 현상이에요.<br>2. 시골에서 남의 과일이나 곡식을 몰래 따 먹는 장난을 뜻하는 옛말이에요.", "1. 차가운 아침, 화단에 핀 국화꽃잎 위로 하얀 서리가 눈처럼 소복하게 내려앉았다.<br>2. 옛날 아이들은 배가 고프면 이웃집 밭에서 수박 서리를 하곤 했다.", "자연 현상과 시골의 장난을 뜻하는 완전히 다른 뜻의 단어이니 잘 구별해서 써야 합니다."],
      ["서슴다", "action", 2, "결단을 내리지 못하고 자꾸 머뭇거리거나 주저하는 태도로, 주로 '서슴지 않다'로 쓰여요.", "우리 반 반장은 친구가 곤란할 때 눈치 보지 않고 서슴지 않고 나서서 도움을 준다.", "망설이지 않고 당당하게 행동하는 용기 있는 친구를 칭찬할 때 '서슴없이 행동하다'라고 씁니다."],
      ["서투르다", "action", 1, "어떤 일을 많이 해보지 않아서 익숙하지 못하고 일 처리하는 솜씨가 어설프다는 뜻이에요.", "아직 피코더 연주가 서투르지만, 매일 포기하지 않고 30분씩 연습해서 무대에 꼭 서고 싶다.", "누구나 처음에는 서투를 수밖에 없으니 좌절하지 말고 꾸준히 노력해야 한다는 것을 기억하세요."],
      ["섣부르다", "action", 3, "상황을 깊이 생각하지 않고 가볍고 성급하게 행동하거나, 솜씨가 아주 설고 어설프다는 뜻이에요.", "아직 진짜 속마음을 듣지도 않고 섣부르게 오해하여 화를 낸 내 행동이 너무 경솔하고 후회되었다.", "실수하기 쉬운 급한 성격이나 성급한 판단을 경계하고 차분함을 강조할 때 콕 집어 쓰는 말입니다."],
      ["선뜻", "action", 1, "마음에 아무런 망설임이나 내키지 않는 어려움 없이 시원스럽고 가볍게 행동하는 모양이에요.", "무거운 과학 상자를 혼자 들고 가는 나를 보고, 지훈이가 선뜻 다가와 들어주어 고마웠다.", "조건을 따지지 않고 남을 위해 시원하게 양보하거나 도와줄 때 사람의 멋진 성품을 보여주는 부사예요."],
      ["설레다", "heart", 1, "앞으로 일어날 일에 대한 기대감이나 두려움으로 마음이 가라앉지 않고 두근거리는 상태예요.", "내일모레 드디어 6학년 수학여행을 떠날 생각을 하니 가슴이 설레어서 밤잠을 설치고 말았다.", "새 학기 첫날이나 소풍 전날처럼 가장 기분 좋고 행복한 두근거림을 뜻하는 예쁜 고유어랍니다."],
      ["소나기", "nature", 1, "1. 여름철에 갑자기 먹구름이 끼면서 세차게 쏟아지다가 곧 뚝 그치는 비예요.<br>2. 어떤 일이나 비난 따위가 한꺼번에 몹시 세차게 몰아치는 상황을 비유해요.", "1. 하굣길에 하늘에서 갑자기 굵은 소나기가 쏟아져 처마 밑으로 피했다.<br>2. 숙제를 안 한 친구에게 선생님의 소나기 같은 꾸중이 쏟아졌다.", "사람의 땀방울을 식혀주는 자연 현상이며, 아주 거센 상황을 비유할 때도 훌륭합니다."],
      ["소담하다", "nature", 3, "꽃이나 과일의 생김새가 풍성하고 탐스럽거나, 음식이 아주 넉넉하고 먹음직스러운 상태예요.", "가을 운동회 날, 엄마가 싸주신 도시락 안에는 소담하게 빚은 주먹밥이 가득 들어 있었다.", "아주 작고 앙증맞은 것보다는 풍성하고 넉넉해서 보기에 마음이 흐뭇해지는 모습을 칭찬할 때 써요."],
      ["소리", "daily", 1, "물체가 부딪치거나 떨려서 우리 귀를 자극하여 듣게 되는 모든 현상을 가리키는 고유어예요.", "조용한 도서관에서 책장을 넘기는 바스락거리는 소리조차 크게 들려서 조심스럽게 숨을 쉬었다.", "새소리, 빗소리, 웃음소리처럼 다른 단어 뒤에 붙어서 세상의 모든 청각을 예쁘게 표현해 줍니다."],
      ["속", "daily", 1, "1. 겉으로 드러나지 않는 사물의 안쪽이에요.<br>2. 사람의 보이지 않는 마음 깊은 곳이나 생각이에요.<br>3. 음식을 먹고 소화시키는 위나 장을 뜻해요.", "1. 맛있는 수박을 반으로 갈랐더니 붉고 단 속이 꽉 차 있었다.<br>2. 겉으로는 화난 척 틱틱거렸지만, 내 속마음은 친구와 화해하고 싶었다.<br>3. 매운 떡볶이를 급하게 먹었더니 속이 쓰리고 아파서 우유를 마셨다.", "사물의 내부, 마음, 소화 기관 등 우리 생활에서 가장 자주 쓰이는 아주 중요한 다의어입니다."],
      ["솜씨", "daily", 1, "손을 놀려 물건을 멋지게 만들거나 어떤 어려운 일을 훌륭하게 처리해 내는 재주와 능력이에요.", "가정 시간에 바느질을 하는데 짝꿍의 꼼꼼한 바느질 솜씨가 아주 뛰어나서 모두 감탄했다.", "재능이라는 한자어 대신에 손재주나 일 처리 능력을 칭찬할 때 쓰면 훨씬 정겨운 느낌을 줍니다."],
      ["수다", "action", 1, "쓸데없이 말을 많이 하는 짓, 또는 친구들끼리 가벼운 이야기를 아주 즐겁게 오래 나누는 행동이에요.", "쉬는 시간 10분 동안 삼삼오오 모여 어제 본 드라마 이야기를 하며 신나게 수다를 떨었다.", "너무 시끄럽게 떠드는 것은 좋지 않지만, 친구들과 우정을 나누는 가벼운 수다는 교실의 활력소랍니다."],
      ["수월하다", "action", 2, "일이 까다롭거나 힘들지 않아 해내기가 아주 십상이고 쉽다는 뜻을 가진 부드러운 형용사예요.", "평소에 매일 복습을 해 둔 덕분에 이번 단원 평가는 생각보다 아주 수월하게 풀 수 있었다.", "'쉽다'는 말보다 조금 더 과정이 매끄럽고 편안하게 진행되었다는 느낌을 줄 때 고급스럽게 쓰입니다."],
      ["수줍다", "heart", 1, "성격이 활발하지 못하고 남들 앞에 서면 부끄러움을 타거나 몹시 쑥스러워하는 마음이에요.", "몹시 수줍음이 많던 민지가 무대에서 당당하게 춤을 추는 모습을 보고 모두가 깜짝 놀랐다.", "나쁜 성격이 아니라 조심스럽고 순수한 성품을 뜻하며, 용기를 냈을 때 칭찬의 포인트가 됩니다."],
      ["숨", "daily", 1, "1. 사람이나 동물이 코와 입으로 공기를 들이마시고 내쉬는 기운이에요.<br>2. 배추나 채소 따위가 소금에 절여져 빳빳한 기운이 죽고 시들해진 상태예요.", "1. 전력 질주를 끝내고 나니 심장이 쿵쿵 뛰고 가쁜 숨이 턱 끝까지 차올랐다.<br>2. 김장을 하기 위해 배추를 소금물에 푹 담가 숨을 팍 죽여 놓았다.", "생명을 유지하는 호흡뿐만 아니라 채소가 부드러워진 물리적 상태를 기가 막히게 비유합니다."],
      ["술래", "action", 2, "숨바꼭질이나 술래잡기 놀이에서 몰래 숨은 사람을 찾아내는 중요한 역할을 맡은 사람이에요.", "가위바위보에서 진 내가 술래가 되어 열을 셀 동안 친구들은 재빠르게 도망쳐 숨었다.", "우리나라 전통 놀이에서 빠질 수 없는 역할의 이름으로, 옛날 도둑을 잡던 순찰꾼의 이름에서 유래했어요."],
      ["스스럼", "heart", 2, "상대방을 대할 때 조심스럽거나 부끄러운 마음이 없어 아주 편안하고 스스럼없는 상태예요.", "매일 얼굴을 보며 자란 우리는 어떤 비밀을 털어놓아도 스스럼이 없을 정도로 편안한 단짝이다.", "어려운 어른을 대할 때가 아니라, 허물없이 아주 가까운 관계의 편안함을 묘사할 때 쓰는 명사입니다."],
      ["스미다", "action", 2, "1. 물이나 연기 따위가 틈 속으로 배어드는 현상이에요.<br>2. 감동적인 마음이나 느낌이 속으로 아주 깊이 번져가는 심리적 현상이에요.", "1. 새로 산 텐트에 빗물이 스며들어 바닥이 조금 축축해졌다.<br>2. 선생님의 따뜻한 위로의 말씀이 내 마음속 깊이 스며들어 눈물이 났다.", "눈에 보이지 않게 아주 서서히 번지며 스며드는 문학적이고 부드러운 동사입니다."],
      ["슬기", "heart", 2, "세상의 이치와 사리를 바르게 판단하고 닥친 일을 아주 현명하게 잘 처리해 내는 지혜로운 마음이에요.", "의견 충돌로 다툴 뻔했지만, 서로 조금씩 양보하는 슬기를 발휘하여 과제를 완벽하게 끝마쳤다.", "책에서 배운 지식을 뛰어넘어, 삶에서 일어나는 문제들을 지혜롭게 해결하는 성숙한 태도입니다."],
      ["슬프다", "heart", 1, "억울한 일을 당하거나 사랑하는 대상을 잃어 마음이 몹시 아프고 괴로워 눈물이 나는 감정이에요.", "10년 동안 키우던 강아지가 무지개다리를 건넜을 때 내 마음은 이루 말할 수 없이 슬프고 허전했다.", "사람이 느끼는 가장 자연스럽고 깊은 감정 중 하나로, 이 감정을 잘 이겨내면 마음이 더욱 성장한답니다."],
      ["시나브로", "time", 3, "어떤 변화가 눈에 띄지 않게 모르는 사이에 조금씩 조금씩 아주 천천히 일어나는 모양을 뜻하는 부사예요.", "매일 밤 30분씩 꾸준히 읽었더니 그 두꺼웠던 책도 어느새 시나브로 마지막 장을 향해 가고 있었다.", "갑작스러운 변화가 아니라 계절이 바뀌듯 아주 자연스럽고 서서히 일어나는 긍정적인 변화를 문학적으로 표현할 때 써요."],
      ["시름", "heart", 3, "마음에 깊이 걸려 있어서 쉽게 풀리지 않는 근심이나 막막한 걱정을 뜻하는 아주 무거운 고유어예요.", "시험 성적이 떨어져서 며칠 동안 시름에 빠져 있었지만, 부모님의 격려 덕분에 다시 일어났다.", "'걱정'이라는 말보다 훨씬 마음 깊은 곳에서 오랫동안 떠나지 않는 아련하고 진지한 고민을 표현할 때 씁니다."],
      ["시샘", "heart", 2, "자기가 가질 수 없는 남의 좋은 물건이나 성과를 부러워하면서 얄밉게 여기는 마음이에요.", "수학 경시대회에서 1등을 한 짝꿍을 축하하면서도, 속으로 아주 작은 시샘이 일어나는 건 어쩔 수 없었다.", "봄에 꽃이 피는 것을 질투하는 늦추위를 '꽃샘추위'라고 하듯이, 사람의 귀여운 질투를 뜻하는 파생어랍니다."],
      ["실마리", "daily", 2, "1. 감겨 있는 실의 첫머리라는 물리적인 뜻이에요.<br>2. 복잡하게 얽힌 일이나 사건을 쉽게 풀어 나갈 수 있는 첫 번째 단서나 힌트예요.", "1. 엉킨 털실 뭉치에서 겨우 실마리를 찾아내어 풀기 시작했다.<br>2. 도무지 안 풀리던 어려운 과학 문제였는데 선생님의 작은 힌트가 사건의 실마리가 되었다.", "어려운 상황의 엉킨 매듭을 푸는 출발점을 비유하는 아주 훌륭한 명사입니다."],
      ["심부름", "action", 1, "남이 시키는 일을 도와주기 위해 다른 곳에 대신 다녀오거나 어떤 일을 아주 성실하게 해주는 일이에요.", "저녁을 준비하시는 엄마를 돕기 위해 슈퍼에 가서 두부를 사 오는 심부름을 씩씩하게 다녀왔다.", "귀찮은 일이 아니라 가족을 돕는 기특한 행동이자, 어릴 때 자립심과 책임감을 기르는 아주 좋은 훈련이죠."],
      ["싹싹하다", "heart", 1, "눈치가 아주 빠르고 행동이나 말투가 뻣뻣하지 않으며, 남을 아주 상냥하고 부드럽게 대하는 성격이에요.", "전학 온 첫날부터 처음 보는 친구들에게 싹싹하게 인사를 건네는 지호는 금세 인기스타가 되었다.", "무뚝뚝한 태도와 반대되는 성품으로, 어른들이 아주 좋아하고 사회성이 뛰어난 태도를 칭찬하는 말입니다."],
      ["쏠쏠하다", "heart", 2, "어떤 일의 품질이나 수준, 혹은 거기서 얻는 재미나 이익이 기대했던 것보다 꽤 괜찮고 훌륭하다는 뜻이에요.", "벼룩시장에서 안 쓰는 장난감을 팔았더니 생각보다 번 돈이 쏠쏠해서 갖고 싶었던 학용품을 샀다.", "큰 대박은 아니더라도 작은 일상에서 기대 이상의 큰 기쁨이나 소소한 만족감을 톡톡히 느꼈을 때 아주 찰떡입니다."],
      ["쑥스럽다", "heart", 1, "하는 짓이나 어떤 모양이 몹시 어색하고 부자연스러워서 얼굴이 붉어질 만큼 남 앞에 나서기 부끄러운 감정이에요.", "미술 시간에 내가 그린 그림을 반 친구들 앞에서 들어 올려 발표하려고 하니 너무 쑥스러웠다.", "나쁜 짓을 해서 창피한 것이 아니라, 주목을 받아 칭찬을 듣거나 낯선 일을 할 때 느끼는 귀엽고 자연스러운 감정이에요."],
      ["씨름", "action", 1, "1. 두 사람이 샅바를 잡고 서로의 힘과 기술을 겨루어 상대를 쓰러뜨리는 전통 스포츠예요.<br>2. 아주 어렵고 힘든 과제나 상황을 포기하지 않고 악착같이 이겨내려고 끈질기게 애쓰는 행동이에요.", "1. 명절날 텔레비전에서 천하장사 씨름 대회를 재미있게 시청했다.<br>2. 도저히 풀리지 않는 수학 문제 한 문제와 두 시간 동안 끈질기게 씨름을 하여 결국 풀어냈다.", "모래판 위에서 하는 실제 경기뿐만 아니라, 힘든 일을 포기하지 않고 이겨낼 때 비유로 씁니다."],
      ["씨앗", "nature", 1, "1. 식물의 열매 속에 숨어 있다가 새로운 생명과 싹을 틔우는 바탕이에요.<br>2. 어떤 일이나 사건이 일어나게 되는 근본적인 원인이나 희망의 불씨를 비유해요.", "1. 화분에 심은 해바라기 씨앗이 며칠 뒤 예쁜 새싹을 틔우는 것을 보았다.<br>2. 우리가 오늘 흘린 땀방울이 훗날 훌륭한 성공의 씨앗이 될 것이다.", "지금은 보잘것없어 보이지만 나중에 아주 훌륭하게 성장할 무한한 잠재력을 상징하는 낱말입니다."],
      ["씩씩하다", "heart", 1, "가지고 있는 기운이나 행동하는 태도가 기가 죽지 않고 아주 굳세고 당당하며 힘이 넘치는 모습이에요.", "넘어져서 무릎이 까졌지만 나는 울지 않고 훌훌 털고 일어나 씩씩하게 걸어가 소독을 받았다.", "겁을 먹거나 주눅 들지 않고 어려움에 용감하게 맞서는 가장 학생답고 멋진 건강한 에너지를 칭찬할 때 항상 쓰이는 형용사입니다."],
      ["생채기", "daily", 2, "1. 손톱이나 뾰족한 물건 따위에 할퀴어 피부에 아주 작게 생긴 찰과상이에요.<br>2. 남의 말실수나 행동으로 인해 마음에 입은 아주 작은 상처를 비유해요.", "1. 장미꽃을 관찰하다가 가시에 긁혀 손가락에 작은 생채기가 났다.<br>2. 친구가 무심코 뱉은 장난 섞인 말에 내 마음에 작은 생채기가 생겼다.", "큰 사고로 난 무서운 상처가 아니라 일상생활에서 생기는 가벼운 찰과상이나 마음의 상처를 비유합니다."],
      ["사투리", "daily", 1, "표준어가 아니라 어느 한 지역에서만 대대로 전해져 내려와 널리 쓰는 아주 정겹고 독특한 우리말이에요.", "부산에서 전학 온 지훈이가 무심코 내뱉는 사투리 억양은 들을수록 아주 구수하고 정겨웠다.", "방언이라고도 부르며 우리말의 다양성과 각 지역의 따뜻한 문화와 풍습이 고스란히 담겨 있는 귀중한 보물입니다."],
      ["소꿉", "daily", 2, "어린아이들이 어른들의 밥 짓기나 살림살이를 귀엽게 흉내 내며 놀 때 쓰는 작고 앙증맞은 장난감 그릇들이에요.", "유치원 시절 흙과 나뭇잎을 섞어 반찬을 만들고 플라스틱 소꿉 그릇에 담아 놀던 추억이 생생하다.", "어린 시절의 순수함과 추억을 떠올리게 하는 단어로 지금은 커버린 6학년 친구들이 동심을 돌아볼 때 문학적으로 쓰면 예쁩니다."],
      ["생각", "heart", 1, "사람이 머리를 써서 사물을 헤아리고 이치에 맞게 판단하며 창의적인 아이디어를 만들어 내는 마음의 작용이에요.", "친구와 다투고 나서 곰곰이 내 잘못을 생각해보니, 내일 먼저 사과하기로 결심했다.", "한자어 사고(思考)와 같지만 우리 조상들이 아주 옛날부터 순수하게 써온 멋진 고유어로, 뇌와 마음이 성장하는 과정을 나타냅니다."],
      ["살리다", "action", 1, "1. 죽어가는 사람이나 동물을 다시 살게 만드는 도덕적인 일이에요.<br>2. 자신이 가진 특색이나 아주 좋은 장점을 묻히지 않고 겉으로 훌륭하게 돋보이게 하는 일이에요.", "1. 의사 선생님께서 교통사고가 난 환자의 귀중한 목소리를 살려내셨다.<br>2. 나는 그림을 그릴 때 특기인 화려한 색칠 솜씨를 마음껏 살려 아주 멋진 작품을 완성했다.", "생명을 구한다는 뜻 외에도, 6학년 친구들이 각자 가진 개성과 놀라운 재능을 세상에 뽐낼 때 적극적으로 응원하는 동사입니다."],
      ["아기자기하다", "heart", 1, "1. 여러 가지가 오밀조밀하게 어울려 예쁜 모양이에요.<br>2. 잔재미가 있고 몹시 즐거운 모양이에요.", "1. 미술 시간에 모둠 친구들과 아기자기하게 소품을 만들었다.<br>2. 우리 가족은 주말마다 공원을 산책하며 아기자기한 일상을 보낸다.", "작고 귀여운 것들이 조화롭게 모여 있을 때 쓰는 예쁜 칭찬이에요."],
      ["아끼다", "action", 1, "1. 물건을 소중히 여기어 함부로 쓰지 않는 행동이에요.<br>2. 사람이나 사물을 마음속 깊이 사랑하고 위하는 행동이에요.", "1. 용돈을 아껴서 부모님 생신 선물을 샀다.<br>2. 선생님께서는 우리 반 학생들 한 명 한 명을 진심으로 아끼신다.", "물건을 절약할 때뿐만 아니라 친구를 소중히 생각할 때도 쓰는 훌륭한 말입니다."],
      ["아람", "nature", 2, "밤이나 도토리 따위가 충분히 익어 저절로 벌어진 탐스러운 상태예요.", "가을 산에 오르니 밤나무에 아람이 가득 열려 있었다.", "가을의 풍성함을 상징하는 아름다운 순우리말 명사랍니다."],
      ["아름", "daily", 1, "두 팔을 둥글게 모아서 만든 둘레를 재는 단위예요.", "가을 산에서 밤을 한 아름 주워 와서 가족들과 구워 먹었다.", "풍성하고 넉넉한 마음을 표현할 때 '한 아름 안겨주다'라고 써요."],
      ["아련하다", "heart", 2, "1. 눈으로 보기에 모습이 아주 희미하고 어렴풋한 느낌이에요.<br>2. 기억이나 감정이 뚜렷하지 않고 애틋한 느낌이에요.", "1. 안개 낀 산속에서 저 멀리 아련하게 불빛이 보였다.<br>2. 졸업을 앞두니 1학년 때 친구들과 놀던 기억이 아련하게 떠오른다.", "오래된 옛 추억을 감성적으로 떠올릴 때 글쓰기에 활용하기 아주 좋아요."],
      ["아우르다", "action", 2, "여러 개를 하나로 모아 한 덩어리나 한 판이 되게 묶는 행동이에요.", "우리 반 반장은 친구들의 다양한 의견을 하나로 잘 아우르는 능력이 있다.", "리더십을 발휘하여 모두를 조화롭게 이끄는 모습을 칭찬하는 동사입니다."],
      ["아우성", "action", 2, "여럿이 기세 좋게 지르는 큰 소리나 아우성치는 모양이에요.", "피구 대회에서 우승하자 우리 반 아이들이 기쁨의 아우성을 질렀다.", "많은 사람이 한꺼번에 감정을 폭발시키며 소리치는 아주 역동적인 단어예요."],
      ["아지랑이", "nature", 1, "봄날에 햇빛이 강하게 쬘 때 공기가 아른거리는 자연 현상이에요.", "따뜻한 봄날 아스팔트 위로 아지랑이가 피어오르는 것을 보았다.", "만물이 소생하는 따뜻한 봄의 기운을 가장 잘 보여주는 낱말입니다."],
      ["알차다", "action", 1, "1. 열매나 곡식 따위의 속이 빈 곳 없이 꽉 차 있는 상태예요.<br>2. 어떤 일의 내용이 아주 훌륭하고 실속이 있다는 뜻이에요.", "1. 가을 들판에 알차게 여문 벼 이삭들이 고개를 숙이고 있다.<br>2. 여름방학 동안 계획을 잘 세워 알찬 시간을 보내고 개학을 맞이했다.", "속이 텅 빈 것과 반대로 내용이나 실력이 아주 충실할 때 칭찬으로 씁니다."],
      ["안개", "nature", 1, "1. 수증기가 지표면 가까이에 하얗게 떠 있는 몽환적인 기상 현상이에요.<br>2. 어떤 일의 전망이 몹시 흐려져 막막한 상태를 비유해요.", "1. 아침에 일어나니 안개가 자욱하게 껴서 세상이 하얗게 보였다.<br>2. 수학 문제를 도무지 풀 수가 없어서 머릿속에 안개가 낀 것처럼 답답했다.", "구름이 땅 가까이 내려온 자연 현상과, 앞길이 안 보이는 막막한 심리를 모두 표현해요."],
      ["안다미로", "food", 3, "담은 것이 그릇에 넘치도록 풍성하고 많게라는 뜻의 부사예요.", "할머니께서는 배고픈 손자를 위해 밥을 안다미로 듬뿍 담아 주셨다.", "식당 인심이 아주 넉넉하거나 사랑이 꽉 찼을 때 쓰기 좋은 고급스러운 표현이에요."],
      ["안달", "heart", 2, "속을 태우며 몹시 조급하게 굴거나 안타까워하는 마음이에요.", "주문한 택배가 빨리 오기를 안달하며 하루 종일 창밖만 바라보았다.", "마음이 여유롭지 못하고 발을 동동 구르는 조급한 상태를 꼬집어 줍니다."],
      ["알뜰하다", "action", 1, "1. 돈이나 물건을 아끼고 규모 있게 잘 써서 낭비하지 않는 태도예요.<br>2. 일이나 살림을 정성껏 규모 있게 챙기는 훌륭한 모습이에요.", "1. 용돈 기입장을 꼼꼼히 쓰며 알뜰하게 모은 돈으로 책을 샀다.<br>2. 우리 엄마는 집안일을 항상 알뜰하고 깔끔하게 챙기신다.", "6학년 어린이들이 꼭 가져야 할 아주 훌륭한 경제적 습관을 뜻해요."],
      ["앙증맞다", "heart", 1, "모양이 아주 작으면서도 어울리게 귀엽고 깜찍하다는 칭찬이에요.", "친구가 가방에 매달고 온 작은 곰 인형이 너무 앙증맞고 예뻤다.", "단순히 귀여운 것을 넘어 체구에 맞게 아주 똘똘하고 예쁠 때 써요."],
      ["애틋하다", "heart", 2, "1. 섭섭하고 안타까워 애가 타는 마음이에요.<br>2. 몹시 아끼고 사랑하는 깊고 다정한 정이에요.", "1. 전학 가는 단짝 친구와 손을 꼭 잡으며 애틋한 작별 인사를 나누었다.<br>2. 할머니의 낡은 사진첩에는 가족을 향한 애틋한 사랑이 듬뿍 담겨 있다.", "사랑과 아쉬움이 진하게 섞여 있는 아주 감성적이고 따뜻한 마음입니다."],
      ["야무지다", "action", 1, "사람의 행동이나 일 처리가 빈틈이 없이 단단하고 똑 부러진 모습이에요.", "동생은 나이는 어리지만 자기 물건을 스스로 잘 챙기는 야무진 아이다.", "어른들이 일 처리를 아주 완벽하게 잘하는 어린이를 칭찬할 때 가장 많이 써요."],
      ["어렴풋하다", "heart", 2, "1. 기억이나 모습이 뚜렷하지 않고 흐릿하여 잘 생각나지 않는 상태예요.<br>2. 소리 따위가 아주 멀거나 작아서 뚜렷하게 들리지 않는 상태예요.", "1. 어릴 적 할아버지와 함께 낚시했던 추억이 어렴풋하게 남아 있다.<br>2. 깊은 밤 밖에서 어렴풋하게 개 짖는 소리가 들려왔다.", "'아련하다'와 비슷하지만, 기억이나 형체가 확실하지 않음을 강조할 때 더 자주 씁니다."],
      ["어림", "action", 2, "정확히 세거나 재지 않고 대강 짐작으로 헤아려 보는 일이에요.", "이 유리병에 사탕이 몇 개나 들어 있을지 눈으로 대충 어림해 보았다.", "수학 시간에도 배우는 유용한 짐작 방법으로 생활 속에서 아주 많이 쓰여요."],
      ["어우러지다", "action", 1, "여럿이 자연스럽게 조화되어 한 덩어리를 훌륭하게 이루는 모습이에요.", "비빔밥은 여러 가지 나물과 고추장이 맛있게 어우러진 우리 전통 음식이다.", "친구들이 다투지 않고 서로 단합하여 멋진 결과를 낼 때도 사용할 수 있습니다."],
      ["언뜻", "time", 1, "생각이나 모습이 아주 짧은 시간 동안 스치듯 나타나는 모양이에요.", "길을 걷다가 언뜻 좋은 아이디어가 떠올라 재빨리 수첩에 메모했다.", "'갑자기'보다 훨씬 짧고 순간적으로 번쩍하는 찰나의 느낌을 잘 살려줘요."],
      ["얼", "heart", 2, "1. 사물을 바르게 헤아리는 정신의 줏대나 중심이 되는 기운이에요.<br>2. 정신이 헷갈려 어리둥절하거나 멍한 상태를 뜻해요.", "1. 국사 시간에 나라를 지킨 위인들의 자랑스러운 얼을 훌륭하게 물려받자고 다짐했다.<br>2. 무서운 놀이기구를 탔더니 얼이 빠져서 한참 동안 멍하니 서 있었다.", "정신과 영혼을 아우르는 뜻과, 당황하여 멍해진 뜻을 모두 가진 한 글자 단어입니다."],
      ["얼결", "time", 2, "놀랍거나 복잡한 일을 당하여 몹시 어수선하고 당황스러운 순간이에요.", "얼음에 미끄러져 넘어지는 얼결에 짝꿍의 옷소매를 꽉 잡고 말았다.", "나도 모르게 무의식적으로 행동이 튀어나왔을 때 변명처럼 쓰기도 하는 부사예요."],
      ["얼룩", "daily", 1, "1. 빛깔이 고르지 못하고 점이나 줄이 섞인 동물의 무늬예요.<br>2. 옷에 묻은 더러운 자국이나, 마음에 지워지지 않는 상처를 비유해요.", "1. 동물원에서 흑백의 아름다운 얼룩 무늬를 가진 얼룩말을 보았다.<br>2. 미술 시간에 흰 도화지에 물감이 떨어져 옷에 예쁜 얼룩이 생겼다.", "동물의 무늬를 표현할 때도 쓰고, 옷이나 물건에 묻은 자국을 뜻할 때도 씁니다."],
      ["얽매다", "action", 2, "1. 끈이나 줄 따위로 이리저리 단단히 묶는 행동이에요.<br>2. 마음대로 행동하지 못하게 어떤 일에 구속하는 일이에요.", "1. 등산을 가기 전에 신발 끈을 풀리지 않게 단단히 얽매었다.<br>2. 스마트폰 게임에만 얽매여 있지 말고 밖으로 나가 친구들과 뛰어놀아야 한다.", "자유를 빼앗기고 한곳에 고정되어 옴짝달싹 못 하는 답답한 상황을 비유해요."],
      ["엄청나다", "action", 1, "정도나 양이 보통이 아니고 지나치게 크고 많다는 뜻이에요.", "지진이 일어난 나라에 세계 각국에서 엄청난 양의 구호물품을 보내주었다.", "아주 크거나 많음을 강조할 때 일상에서 가장 흔하게 쓰이는 형용사입니다."],
      ["어엿하다", "heart", 2, "행동이나 태도가 남에게 꿀림 없이 아주 당당하고 의젓한 상태예요.", "철부지였던 동생도 이제 학교에 입학하더니 어엿한 초등학생이 다 되었다.", "어리광을 부리지 않고 제 몫을 훌륭히 해내는 늠름한 모습을 칭찬하는 낱말입니다."],
      ["여울", "nature", 2, "강이나 바다 바닥이 얕거나 폭이 좁아 물살이 세게 흐르는 곳이에요.", "여름방학 때 계곡에 놀러 가서 물살이 빠른 여울에서 신나게 물놀이를 했다.", "물이 경쾌하고 맑게 흐르는 모습을 담고 있어서 순우리말 이름으로도 인기가 많아요."],
      ["여름", "time", 1, "봄과 가을 사이의 아주 덥고 식물이 무성하게 잘 자라는 계절이에요.", "여름이 되면 맴맴 우는 매미 소리를 들으며 시원한 수박을 먹는 것이 최고다.", "'열매가 열리다'에서 유래된 아주 풍성하고 생명력이 넘치는 계절의 이름입니다."],
      ["영글다", "action", 2, "1. 벼나 사과 같은 곡식이나 과일이 다 여물어 익는 현상이에요.<br>2. 사람의 생각이나 실력이 꽉 차서 훌륭하게 성숙해지는 일이에요.", "1. 가을 햇살을 받아 사과나무의 열매들이 탐스럽고 빨갛게 영글어 갔다.<br>2. 매일 꾸준히 독서를 하니 나의 지식과 생각이 옹골차게 영글었다.", "노력 끝에 생각과 실력이 완벽하게 성숙해지는 성장의 과정을 칭찬할 때 써요."],
      ["오달지다", "heart", 3, "1. 마음에 쏙 들 정도로 흡족하고 흐뭇하여 기분이 좋다는 뜻이에요.<br>2. 일 처리가 허술한 데가 없이 몹시 야무지고 실속이 있다는 뜻이에요.", "1. 시험공부를 열심히 해서 100점을 맞았더니 마음이 아주 오달지고 뿌듯했다.<br>2. 우리 반 반장은 체구는 작지만 매사에 오달지게 일을 잘 처리한다.", "'야무지다'와 비슷하면서도 마음이 꽉 차오르는 흐뭇함을 아주 잘 나타내는 말이에요."],
      ["오롯하다", "daily", 2, "모자라거나 빠진 것이 없이 아주 온전하고 꽉 차 있는 상태예요.", "주말 오후에 아무에게도 방해받지 않고 책을 읽으며 오롯한 나만의 시간을 보냈다.", "누구에게도 빼앗기지 않은 아주 완벽하고 정성스러운 상태를 표현할 때 최고입니다."],
      ["오순도순", "action", 1, "여럿이 정답게 모여 이야기하거나 사이좋게 지내는 예쁜 모양이에요.", "가족들이 거실에 모여 앉아 귤을 까먹으며 오순도순 다정하게 대화를 나누었다.", "가족이나 친구들끼리 다투지 않고 화목하게 지내는 아주 평화로운 분위기랍니다."],
      ["옹골차다", "heart", 2, "겉모습뿐만 아니라 실속이 있게 속이 꽉 차 있어서 듬직하다는 뜻이에요.", "우리 반 반장은 체구는 작지만 실력이 옹골차서 모두가 믿고 따른다.", "알맹이가 부실하지 않고 아주 알차게 꽉 찬 훌륭한 사람이나 물건을 칭찬합니다."],
      ["옹기종기", "action", 1, "크기가 다르고 작은 것들이 흩어지지 않고 귀엽게 모여 있는 모양이에요.", "비가 그치자 나뭇잎 위에 맺힌 물방울들이 옹기종기 모여 반짝거렸다.", "크고 웅장한 느낌보다는 작고 귀여운 것들이 모여 있는 사랑스러운 풍경을 묘사해요."],
      ["우람하다", "nature", 2, "생김새가 몹시 크고 웅장하여 듬직하고 위엄이 넘치는 상태예요.", "우리 동네 입구에는 500년이나 된 우람한 느티나무가 마을을 든든히 지켜주고 있다.", "산이나 나무, 혹은 체격이 아주 커다랗고 힘이 세 보일 때 늠름함을 나타냅니다."],
      ["우러르다", "action", 2, "1. 아래에서 위를 향하여 고개를 쳐들고 올려다보는 물리적인 행동이에요.<br>2. 훌륭한 사람을 마음속 깊이 존경하고 따르는 훌륭한 태도예요.", "1. 밤하늘을 우러러보며 반짝이는 별자리를 친구와 함께 찾았다.<br>2. 나라를 위해 희생하신 위인들의 숭고한 정신을 마음 깊이 우러러보았다.", "고개를 들어 하늘을 보는 행동이 누군가를 존경하는 도덕적 태도로 확장되었어요."],
      ["우물", "daily", 1, "물을 긷기 위하여 땅을 깊이 파서 깨끗한 지하수가 고이게 한 시설이에요.", "옛날 사람들은 동네 한가운데 있는 우물에 모여 물을 긷고 빨래를 하며 정을 나누었다.", "지금은 수도꼭지에 밀려 사라졌지만 조상들의 소중한 삶의 터전이었던 고유어입니다."],
      ["우수수", "nature", 1, "나뭇잎이나 열매 따위가 바람에 흔들려 한꺼번에 많이 떨어지는 소리예요.", "가을바람이 세차게 불자 은행나무 가지에서 노란 잎들이 우수수 떨어져 내렸다.", "어떤 일이나 물건이 한꺼번에 많이 떨어지는 역동적인 모습을 생생하게 그려냅니다."],
      ["웃음", "heart", 1, "1. 기쁘거나 흐뭇할 때 얼굴을 활짝 펴거나 즐거운 소리를 내는 일이에요.<br>2. 남의 흉을 보거나 얕보며 짓는 비웃음을 뜻하기도 해요.", "1. 우리 반 교실은 언제나 친구들의 밝은 웃음소리가 끊이지 않고 울려 퍼진다.<br>2. 발표를 하다가 실수를 해서 친구들의 웃음을 살까 봐 몹시 긴장했다.", "가장 아름다운 표정이기도 하지만, 남을 비웃을 때 쓰는 조소의 뜻도 가집니다."],
      ["으뜸", "daily", 1, "1. 많은 것 가운데 가장 첫째가 되거나 최고로 뛰어난 것을 뜻해요.<br>2. 어떤 일의 근본이나 바탕이 되는 가장 중요한 중심을 뜻해요.", "1. 우리 학교 도서관은 책이 많고 깨끗해서 우리 동네에서 단연 으뜸이다.<br>2. 학생의 본분 중 으뜸은 열심히 배우고 친구들과 사이좋게 지내는 것이다.", "한자어인 '최고(最高)'나 '일등'을 완벽하게 우리말로 바꿔 쓸 수 있는 훌륭한 단어입니다."],
      ["으스름", "nature", 3, "빛 따위가 눈부시지 않고 몹시 흐리거나 어스름하여 침침한 상태예요.", "해 지는 저녁, 으스름한 달빛이 골목길을 부드럽게 비추며 운치를 더해주었다.", "대낮처럼 밝지 않고 은은하게 어둑어둑해지는 낭만적이고 신비로운 분위기를 자아냅니다."],
      ["윤슬", "nature", 1, "햇빛이나 달빛에 비치어 반짝반짝 아름답게 빛나는 잔물결이에요.", "바람이 부는 한강 수면 위로 은빛 윤슬이 보석처럼 반짝이는 풍경이 무척 아름다웠다.", "풍경을 묘사할 때 글을 아주 고급스럽고 시적으로 만들어 주는 가장 사랑받는 고유어예요."],
      ["이바지", "action", 2, "어떤 일에 실질적으로 훌륭하게 도움이 되게 하는 긍정적인 행동이나 기여예요.", "훌륭한 과학자가 되어서 우리나라의 과학 기술 발전에 크게 이바지하고 싶다.", "자신의 능력과 노력을 아끼지 않고 남과 사회를 위해 헌신하는 아주 멋진 뜻을 가졌습니다."],
      ["이슬", "nature", 1, "1. 밤사이에 공기 중의 수증기가 풀잎이나 꽃잎 따위에 맺힌 맑은 물방울이에요.<br>2. 눈물이나, 아주 짧고 덧없는 인생을 비유하는 문학적인 말이에요.", "1. 이른 아침 화단에 피어 있는 나팔꽃 잎사귀에 맑고 영롱한 이슬이 맺혀 있었다.<br>2. 독립운동가들은 조국을 위해 기꺼이 형장의 이슬로 사라지셨다.", "맑고 깨끗한 자연 현상이지만 덧없는 희생이나 눈물을 뜻할 때 아주 서정적으로 씁니다."],
      ["이울다", "nature", 3, "1. 꽃이나 잎이 시들어 떨어지는 쓸쓸한 현상이에요.<br>2. 달빛이 점점 약해져 저물거나, 기운이나 세력이 쇠약해지는 모양이에요.", "1. 늦가을이 되자 화려하게 피었던 장미꽃도 서서히 이울며 내년을 기약했다.<br>2. 새벽이 되자 하늘의 달빛도 서서히 이울고 동이 트기 시작했다.", "자연이 지는 모습이나 사람의 기운이 약해지는 현상을 문학적으로 부드럽게 표현합니다."],
      ["잎새", "nature", 1, "나무의 잎사귀를 아주 예스럽고 문학적으로 부드럽게 부르는 단어예요.", "시원한 가을바람이 불자 노랗게 물든 은행 잎새 하나가 내 어깨 위로 사뿐히 떨어졌다.", "'마지막 잎새'라는 소설 제목처럼 식물의 잎을 아주 서정적이고 아련하게 묘사할 때 써요."],
      ["아깝다", "heart", 1, "1. 가치 있는 것이 버려지거나 쓰이지 못해 마음이 안타까운 감정이에요.<br>2. 어떤 일을 거의 해낼 뻔했다가 아슬아슬하게 실패하여 애석한 감정이에요.", "1. 스케치북의 빈 공간이 많이 남았는데 그냥 버리기가 아까워서 연습장으로 다시 썼다.<br>2. 피구 경기에서 마지막까지 남았는데 선을 밟아 아깝게 지고 말았다.", "물건을 절약하는 착한 마음뿐만 아니라 놓쳐버린 기회에 대한 아쉬움을 솔직하게 나타냅니다."],
      ["엉성하다", "daily", 1, "1. 물건의 짜임새가 촘촘하지 못하고 틈이 넓어 허술한 상태예요.<br>2. 일 처리가 꼼꼼하지 못해 아주 허술하고 부족한 상태예요.", "1. 나뭇가지로 엉성하게 지은 오두막집 사이로 찬 바람이 쌩쌩 불어왔다.<br>2. 숙제를 급하게 벼락치기로 했더니 내용이 너무 엉성해서 지적을 받았다.", "물건의 생김새가 부실하거나 계획이 완벽하지 못할 때 따끔하게 꼬집어 주는 낱말입니다."],
      ["아름답다", "heart", 1, "1. 보이는 모양이나 풍경이 훌륭하여 마음에 큰 기쁨과 만족을 주는 칭찬이에요.<br>2. 마음씨나 행동이 훌륭하여 남에게 큰 감동을 주는 칭찬이에요.", "1. 가을 산을 붉게 물들인 단풍의 모습이 한 폭의 그림처럼 무척 아름답다.<br>2. 이웃을 위해 자기 용돈을 모아 기부하는 지민이의 마음씨가 세상에서 가장 아름답다.", "단순히 외모가 예쁜 것을 뛰어넘어 사람의 내면과 행동의 가치를 극찬하는 최고의 형용사입니다."],
      ["울림", "heart", 1, "1. 소리가 넓게 울려 퍼지는 물리적인 현상이에요.<br>2. 훌륭한 말이나 행동이 사람의 마음 깊은 곳까지 진하게 전해지는 큰 감동이에요.", "1. 산속에서 종을 치니 그 커다란 울림이 계곡을 타고 멀리 퍼져 나갔다.<br>2. 합창 대회에서 친구들이 하나 되어 부른 노래는 내 가슴에 깊은 울림을 주었다.", "종소리의 물리적인 여운처럼 훌륭한 글이나 행동이 마음속에 남기는 진한 감동을 뜻해요."],
      ["자랑", "heart", 1, "자기와 관계있는 훌륭한 점을 남에게 드러내어 뽐내는 일이에요.", "미술 대회에서 상을 받은 동생은 온 가족에게 상장을 보여주며 자랑을 했다.", "자신감을 표현하는 건 좋지만, 지나친 자랑은 친구들의 눈살을 찌푸리게 할 수 있어요."],
      ["자락", "daily", 2, "1. 옷이나 천 따위의 아래로 길게 늘어진 넓은 조각을 뜻하는 단어예요.<br>2. 산이나 안개 따위가 넓게 퍼진 아랫부분을 문학적으로 비유하는 말이에요.", "1. 갑작스러운 소나기에 엄마의 겉옷 자락 속으로 쏙 숨어 비를 피했다.<br>2. 산자락에 핀 예쁜 들꽃들을 보며 가족들과 맑은 공기를 듬뿍 마셨다.", "옷의 아랫부분뿐만 아니라 자연의 완만한 형태를 묘사할 때도 아주 예쁘게 쓰입니다."],
      ["자라다", "action", 1, "1. 사람이나 동식물이 길이나 부피가 커지는 생물학적인 현상이에요.<br>2. 사람의 실력이나 생각, 지식 따위가 훌륭하게 발전하고 성장하는 일이에요.", "1. 교실 화분에 심어둔 방울토마토가 방학 동안 내 키만큼 훌쩍 자라 있었다.<br>2. 매일 꾸준히 독서를 하니 나의 글쓰기 실력과 지식이 쑥쑥 자라났다.", "몸이 크는 것뿐만 아니라, 눈에 보이지 않는 능력이 발전할 때도 적극적으로 써보세요."],
      ["자르다", "action", 1, "1. 물건을 베거나 끊어서 동강이 나게 분리하는 물리적인 행동이에요.<br>2. 맺었던 관계를 끊거나 남의 요구를 단호하게 거절하는 모양을 뜻해요.", "1. 실과 시간에 가위를 아주 조심스럽게 사용하여 옷감을 반듯하게 잘랐다.<br>2. 친구의 무리하고 엉뚱한 부탁을 무 자르듯 단호하게 자르고 거절했다.", "'무 자르듯 하다'는 속담은 결정을 망설이지 않고 아주 단호하게 내린다는 멋진 뜻이에요."],
      ["자주", "time", 1, "같은 일이나 행동이 잇따라 거듭해서 아주 여러 번 일어나는 모양이에요.", "건강을 위해 쉬는 시간마다 교실 창문을 열고 환기를 자주 시켜 주는 것이 좋다.", "횟수가 많다는 뜻의 부사로, 일기나 감상문을 쓸 때 시간의 흐름을 나타내기 좋습니다."],
      ["잔뜩", "action", 1, "1. 어떤 한도에 닿을 때까지 빈틈없이 아주 꽉 차게 가득한 상태예요.<br>2. 화나 긴장 같은 어떤 감정이 마음속에 몹시 심하게 차오른 상태예요.", "1. 가을 소풍을 가는 날, 가방 안에는 엄마가 싸주신 간식이 잔뜩 들어 있었다.<br>2. 동생이 내 소중한 장난감을 망가뜨려서 나는 잔뜩 화가 나고 말았다.", "공간이 꽉 찬 것뿐만 아니라 '잔뜩 긴장했다'처럼 감정이 몹시 심해졌을 때도 흔히 써요."],
      ["잔디", "nature", 1, "땅을 덮어 가꾸기 위해 심는 아주 작고 부드러운 여러해살이 풀이에요.", "체육 시간에 축구공을 차며 학교 운동장 한쪽에 깔린 푹신한 초록색 잔디 위를 신나게 달렸다.", "우리 주변에서 흔히 볼 수 있는 아주 끈질긴 생명력을 가진 친숙한 고유어 식물입니다."],
      ["잠", "daily", 1, "눈을 감고 몸과 마음의 활동을 쉬면서 무의식 상태에 빠지는 일이에요.", "어젯밤 늦게까지 책을 읽느라 잠을 설쳤더니 아침에 눈을 뜨기가 몹시 힘들었다.", "나비잠, 그루잠, 꽃잠처럼 '잠' 뒤에 예쁜 우리말이 붙어 다양한 파생어를 만들어 낸답니다."],
      ["잠자코", "action", 2, "아무 말도 하지 않고 조용히 가만히 있는 얌전한 태도를 뜻해요.", "도서관에서는 친구와 수다를 떨지 않고 잠자코 책을 읽는 것이 올바른 공공 예절이다.", "'잠깐'은 한자어(暫間)이지만, '잠자코'는 순우리말이니 국어 시간에 알아두면 아주 유용해요."],
      ["잡다", "action", 1, "1. 물건을 손으로 움켜쥐고 놓지 않는 물리적인 행동이에요.<br>2. 도망가는 것을 붙잡아 꼼짝 못 하게 제압하는 행동이에요.<br>3. 기회나 방향, 분위기 따위를 내 것으로 차지하거나 정하는 일이에요.", "1. 계주 달리기에서 내가 넘어져 속상해할 때 짝꿍이 내 손을 꽉 잡아 주었다.<br>2. 용감한 경찰 아저씨가 재빠르게 도망치는 도둑을 꽉 잡아서 감옥에 넣으셨다.<br>3. 학예회 연습을 할 때 반장인 내가 나서서 우리 반의 어수선한 분위기를 꽉 잡았다.", "무언가를 쥐는 행동부터 기회를 잡다, 방향을 잡다 등 국어에서 가장 다양하게 활용되는 으뜸 동사예요."],
      ["잦다", "time", 2, "1. 어떤 일이 거듭 일어나는 시간의 간격이 매우 짧고 빠르다는 뜻이에요.<br>2. 끓던 국물이나 물기가 바닥으로 졸아들어 점점 분량이 줄어드는 현상이에요.", "1. 올여름에는 비가 내리는 날이 유난히 잦아서 맑은 하늘을 보기가 참 힘들었다.<br>2. 냄비에서 보글보글 끓던 맛있는 찌개 국물이 어느새 바닥에 잦아들었다.", "'잦은 지각'처럼 시간적인 의미로 많이 쓰지만, 액체가 줄어들 때도 멋지게 쓰는 고유어입니다."],
      ["잽싸다", "action", 2, "행동이나 눈치가 아주 재빠르고 날래어 굼뜨지 않은 날렵한 모습이에요.", "피구 경기 중에 나를 향해 날아오는 공을 잽싸게 피하고 역공을 펼쳐 환호를 받았다.", "동작이 답답하지 않고 바람처럼 빠를 때 칭찬의 의미를 듬뿍 담아 쓸 수 있는 부드러운 말이에요."],
      ["저녁", "time", 1, "해가 지고 어스름해질 무렵부터 밤이 되기 전까지의 아주 고요한 시간이에요.", "운동장에서 신나게 축구를 하다 보니 어느새 해가 지고 서늘한 저녁이 찾아왔다.", "하루의 수고를 마치고 온 가족이 식탁에 모여 오순도순 정을 나누는 가장 따뜻한 시간의 이름이죠."],
      ["저물다", "nature", 1, "1. 해가 져서 세상이 어두워지는 자연의 시간적인 변화예요.<br>2. 어떤 시기나 한 해가 완전히 지나가고 끝나간다는 비유적인 뜻이에요.", "1. 해가 서산 너머로 붉게 저물고 가로등 불빛이 하나둘 켜지기 시작했다.<br>2. 어느덧 6학년의 한 해도 훌쩍 저물어가며 아쉬운 졸업이 성큼 다가오고 있다.", "해가 지는 자연 현상뿐만 아니라 '한 해가 저물어간다'라고 시적으로 멋지게 표현해 보세요."],
      ["저버리다", "action", 3, "1. 마땅히 지켜야 할 도리를 잊어버리고 어기는 나쁜 일이에요.<br>2. 남이 나에게 준 굳은 믿음이나 기대를 배반하고 등지는 행동이에요.", "1. 부모님의 깊은 은혜를 잊고 저버리는 것은 사람으로서 올바르지 못한 행동이다.<br>2. 나를 반장으로 뽑아준 친구들의 소중한 기대를 끝까지 저버리지 않겠다고 다짐했다.", "약속이나 믿음을 깰 때 쓰는 아주 진지하고 묵직한 동사로 성숙한 책임감을 강조할 때 씁니다."],
      ["저절로", "action", 1, "남의 힘을 빌리거나 억지로 하지 않아도 제 힘으로 자연스럽게 이루어지는 모양이에요.", "재미있는 코미디 영화를 보니 웃음을 참으려 해도 입가에 저절로 미소가 지어졌다.", "억지로 노력하지 않아도 물 흐르듯 자연스럽게 어떤 감정이나 행동이 우러나올 때 가장 잘 어울려요."],
      ["적시다", "action", 1, "1. 물이나 액체가 묻어 물건이 축축하게 젖게 만드는 행동이에요.<br>2. 어떤 깊은 감정이나 훌륭한 분위기에 흠뻑 빠지게 하는 일이에요.", "1. 비가 오는 날 물웅덩이를 세게 밟는 바람에 운동화와 양말을 흠뻑 적시고 말았다.<br>2. 아주 슬프고 감동적인 영화가 우리 가족 모두의 마음을 뜨거운 눈물로 적셨다.", "가뭄 끝에 내린 단비가 땅을 적시듯, 훌륭한 이야기가 우리의 마음을 감동으로 적실 때 씁니다."],
      ["절레절레", "action", 1, "아니라고 강하게 부정하거나 몹시 어이가 없을 때 머리를 가볍게 양옆으로 흔드는 모양이에요.", "동생이 내 간식을 몰래 먹었냐고 묻자 절대 아니라고 고개를 절레절레 흔들며 부인했다.", "말을 하지 않고도 나의 반대 의사나 황당함을 생생하게 보여줄 수 있는 아주 유쾌한 몸짓 의태어랍니다."],
      ["젊다", "action", 1, "1. 나이가 한창때에 있어 늙지 않고 혈기가 왕성하며 싱싱한 상태예요.<br>2. 생각이나 태도가 낡지 않고 아주 긍정적이고 새롭다는 뜻이에요.", "1. 우리 할아버지는 머리가 하얗게 세셨지만 체력만큼은 청년처럼 젊고 건강하시다.<br>2. 우리 담임 선생님은 항상 긍정적이고 젊은 생각으로 우리 반을 유쾌하게 이끌어 주신다.", "신체적인 나이뿐만 아니라 포기하지 않고 도전하는 열정적인 마음가짐을 칭찬할 때 쓰는 멋진 말이에요."],
      ["점잖다", "heart", 2, "말이나 행동이 가볍지 않고 아주 신중하며 예의 바르고 품위가 있다는 뜻이에요.", "우리 반 부회장은 평소에는 장난꾸러기지만, 회의를 진행할 때는 아주 점잖고 어른스러운 태도를 보인다.", "나불거리거나 까불지 않고 속이 깊은 사람을 칭찬할 때 가장 먼저 떠오르는 아주 훌륭한 고유어입니다."],
      ["접다", "action", 1, "1. 종이나 천 따위를 꺾어서 겹치게 하는 물리적인 행동이에요.<br>2. 자신의 생각이나 고집을 굽히고 남의 의견을 존중하여 따르는 행동이에요.", "1. 미술 시간에 색종이를 반으로 예쁘게 접어 가위로 오렸더니 아름다운 눈꽃이 완성되었다.<br>2. 모둠 토의에서 내 고집을 양보하고 접은 뒤 친구의 훌륭한 의견을 기꺼이 따랐다.", "물리적인 행동 외에도 모둠 토의에서 '고집을 접다'처럼 멋진 양보를 나타낼 때 유용해요."],
      ["젖다", "action", 1, "1. 물이 배어들어 몸이나 옷이 축축하게 되는 물리적인 현상이에요.<br>2. 어떤 깊은 감정이나 분위기에 흠뻑 빠져드는 심리적인 상태예요.", "1. 갑자기 쏟아진 소나기에 교복이 흠뻑 젖었지만 친구와 빗속을 달리는 기분은 상쾌했다.<br>2. 옛 추억이 담긴 앨범을 보며 나는 아련하고 따뜻한 감상에 흠뻑 젖어 들었다.", "물에 젖는 것뿐만 아니라 '옛 추억에 젖다', '슬픔에 젖다'처럼 마음속 깊은 감정 상태를 아름답게 비유합니다."],
      ["조금", "daily", 1, "분량이나 정도가 아주 적거나, 시간의 길이나 공간의 거리가 매우 짧다는 뜻을 가진 부사예요.", "어제보다 날씨가 조금 추워지긴 했지만, 따뜻하게 옷을 챙겨 입고 씩씩하게 학교로 향했다.", "아주 작고 사소한 정도를 나타낼 때 '약간(若干)'이라는 한자어 대신 쓰면 훨씬 정겹고 부드러운 우리말이 됩니다."],
      ["조마조마", "heart", 1, "앞으로 닥칠 일이나 결과가 몹시 걱정되어 마음이 몹시 초조하고 불안하게 졸여지는 모양이에요.", "릴레이 달리기에서 우리 반 선수가 넘어질 뻔한 아찔한 순간에 모두가 조마조마한 마음으로 가슴을 쓸어내렸다.", "긴장되는 경기나 중요한 시험 결과를 기다릴 때 심장이 쿵쿵 뛰는 생생한 마음 상태를 귀엽게 표현한 말이에요."],
      ["조바심", "heart", 2, "일이 뜻대로 되지 않을까 봐 마음을 놓지 못하고 몹시 조마조마하여 안타깝게 속을 태우는 마음이에요.", "약속 시간이 다 되어 가는데도 단짝 친구가 나타나지 않자 늦을까 봐 조바심이 나서 발을 동동 구르기 시작했다.", "마음의 여유가 없이 아주 다급하고 걱정스러운 상태를 묘사할 때 '조바심을 내다'로 흔히 쓰이는 훌륭한 고유어입니다."],
      ["조촐하다", "daily", 3, "사람의 행동이나 물건, 혹은 잔치 따위가 화려하지는 않지만 아주 아담하고 깔끔하며 정갈하다는 뜻이에요.", "거창한 파티는 아니었지만 친한 친구 두세 명만 모여 조촐하게 치른 내 생일 파티는 세상에서 가장 행복했다.", "사치스럽고 낭비하는 겉치레보다는 규모는 작더라도 마음과 정성이 아주 가득 담긴 소박하고 예쁜 모습을 칭찬합니다."],
      ["졸다", "action", 1, "1. 피곤하거나 잠이 부족해서 앉은 채로 눈이 감기며 고개를 꾸벅거리는 생리 현상이에요.<br>2. 찌개나 국물 따위의 물이 증발하여 분량이 줄어드는 것을 뜻하는 동음이의어예요.", "1. 어젯밤 늦게까지 게임을 하느라 푹 자지 못했더니 수학 시간 내내 꾸벅꾸벅 졸았다.<br>2. 냄비 불을 끄는 것을 깜빡하는 바람에 맛있는 찌개 국물이 짜게 푹 졸아버렸다.", "참으려 해도 쏟아지는 잠과 액체가 줄어드는 현상을 동시에 나타내는 아주 재밌는 단어입니다."],
      ["졸졸", "nature", 1, "1. 시냇물이나 도랑물이 가볍게 끊이지 않고 계속해서 맑게 흘러내리는 소리예요.<br>2. 어린아이나 동물이 남의 뒤를 바짝 붙어서 계속 쫓아다니는 귀여운 모양이에요.", "1. 산속 계곡에 갔더니 맑은 물이 조약돌 사이를 졸졸 흐르는 소리가 들려 무척 평화로웠다.<br>2. 우리 집 강아지는 내가 학교에서 돌아오면 반갑다며 내 뒤만 졸졸 따라다닌다.", "자연의 맑은 물소리를 뜻할 뿐만 아니라, 껌딱지처럼 따라다니는 귀여운 행동을 묘사할 때도 잘 어울려요."],
      ["좀처럼", "time", 2, "아무리 애를 쓰거나 시간이 지나도 어지간해서는 그 일이 쉽게 일어나지 않는다는 뜻을 가진 부사예요.", "평소에는 얌전하던 민수가 오늘은 단단히 화가 났는지 선생님의 달램에도 좀처럼 화를 풀지 않았다.", "주로 '좀처럼 ~하지 않다'처럼 문장의 뒤에 부정하는 말과 짝을 지어서 굳게 변하지 않는 뚝심을 표현할 때 씁니다."],
      ["좁다", "daily", 1, "1. 어떤 장소의 면적이나 길의 폭이 작아서 다니거나 쓰기 불편한 물리적 상태예요.<br>2. 사람의 생각이나 포용력이 크지 못하고 아주 편협하여 이해심이 부족한 상태예요.", "1. 골목길이 너무 좁아서 차 한 대가 간신히 지나갈 정도라 벽에 바짝 비켜서야 했다.<br>2. 나와 다른 의견을 무조건 틀렸다고 화를 내는 것은 마음이 좁은 어리석은 사람이다.", "공간의 크기를 나타낼 뿐만 아니라 남을 이해하지 못하는 옹졸한 사람을 '마음이 좁다'라고 따끔하게 비판할 때도 써요."],
      ["좇다", "action", 2, "1. 눈에 보이지 않는 목표나 이상, 행복 따위를 포기하지 않고 끝까지 추구하는 일이에요.<br>2. 훌륭한 사람의 뜻이나 의견을 깎아내리지 않고 존중하여 바르게 따르는 행동이에요.", "1. 훌륭한 축구 선수가 되겠다는 굳은 꿈을 좇아 매일 땀 흘리며 성실하게 연습에 매진했다.<br>2. 위인전에 나오는 옛 성인들의 훌륭한 가르침을 좇아 바르고 정직한 사람이 되어야겠다.", "눈에 보이는 사람을 뛰어가서 잡는 것은 '쫓다'이고, 눈에 보이지 않는 꿈이나 가르침을 따를 때는 '좇다'가 올바른 맞춤법입니다."],
      ["주눅", "heart", 2, "부끄럽거나 무서워서 몹시 기운을 펴지 못하고 마음이 잔뜩 움츠러드는 불쌍하고 안타까운 태도예요.", "선생님께 숙제를 안 해왔다고 꾸중을 들은 뒤, 하루 종일 주눅이 들어서 친구들과 신나게 어울려 놀지 못했다.", "실수했다고 너무 주눅 들지 말고 6학년답게 씩씩하게 잘못을 인정하고 다시 도전하는 당당한 태도가 훨씬 멋집니다."],
      ["주름", "daily", 1, "1. 피부가 늙어서 겹치거나 꺾여 움푹 파인 자국으로 세월의 위대한 흔적을 보여주는 말이에요.<br>2. 천이나 종이 따위가 구겨지거나 접혀서 반듯하게 겹쳐진 자국을 뜻해요.", "1. 활짝 웃으실 때마다 할머니의 눈가에 깊게 파인 주름은 우리 가족을 위해 평생 고생하신 위대하고 아름다운 흔적이다.<br>2. 외출하기 전 셔츠를 다림질하여 반듯하게 잡힌 주름을 보니 내 마음까지 단정해진다.", "종이가 구겨진 것뿐만 아니라 노인의 얼굴에 핀 주름처럼 세월의 깊이와 존경스러움을 문학적으로 비유할 때 자주 씁니다."],
      ["주춤하다", "action", 2, "어떤 행동을 하려다가 갑자기 멈칫하며 몹시 망설이거나 뒤로 물러서는 소극적인 태도예요.", "무서운 놀이기구를 타려고 씩씩하게 줄을 섰지만 막상 내 차례가 되자 겁이 나서 발걸음이 주춤하고 멈춰 섰다.", "자신 있게 앞으로 나아가지 못하고 주저하는 모습을 표현하며, 두려움을 이겨내라는 격려의 문맥에서 자주 등장해요."],
      ["줄기", "nature", 1, "1. 식물이 뿌리에서 영양분을 빨아들여 위로 뻗어 나가는 굵고 튼튼한 갈래예요.<br>2. 빗방울이 세차게 쏟아지는 굵은 가닥이나 물이 힘차게 뻗어 흐르는 갈래예요.<br>3. 이야기나 사상 따위의 중심이 되는 아주 중요한 뼈대나 흐름이에요.", "1. 비가 그친 뒤 화단의 튼튼한 해바라기 줄기에서 예쁜 잎이 쑥쑥 돋아났다.<br>2. 여름날 소나기가 거센 물줄기가 되어 창문을 뚫을 듯 세차게 때렸다.<br>3. 책을 다 읽은 후 복잡한 이야기의 큰 줄기를 훌륭하게 요약하여 독서록에 적었다.", "식물의 기둥 역할뿐만 아니라 사건의 중심이 되는 흐름을 '이야기의 큰 줄기'라고 비유적으로 멋지게 표현하기도 합니다."],
      ["줄곧", "time", 1, "어떤 행동이나 상태가 처음부터 끝까지 끊어지지 않고 계속해서 똑같이 이어지는 끈기 있는 모양이에요.", "오늘 아침 등교할 때부터 하교할 때까지 쉬지 않고 줄곧 비가 내려서 운동장에서 체육수업을 하지 못해 무척 아쉬웠다.", "어떤 일에 집중하여 변함없이 뚝심 있게 해내는 사람의 성실한 태도를 칭찬하거나 긴 시간의 연속을 표현할 때 씁니다."],
      ["줍다", "action", 1, "바닥에 떨어지거나 흩어져 있는 물건을 허리를 굽혀 손으로 집어 드는 일상적이고 양심적인 행동이에요.", "하굣길에 복도 바닥에 떨어진 남의 지우개를 줍고는 모른 척 지나가지 않고 분실물 바구니에 정직하게 넣어두었다.", "단순한 물리적 행동이지만 환경 정화 활동이나 떨어진 물건을 찾아주는 정직함 등 6학년의 도덕적인 행동을 잘 보여줍니다."],
      ["지니다", "action", 1, "1. 어떤 물건을 잃어버리지 않게 자기 몸에 늘 간직하여 가지고 있는 물리적인 일이에요.<br>2. 훌륭한 성품이나 뛰어난 재능, 좋은 기억 따위를 마음속에 바탕으로 갖추는 일이에요.", "1. 할머니께서 주신 작은 부적을 지갑 속에 소중하게 지니고 다니며 건강을 빌었다.<br>2. 우리 반 친구들은 모두 남을 먼저 배려하는 아주 따뜻하고 고운 마음씨를 지니고 있다.", "물건을 소지한다는 뜻 외에도 '따뜻한 마음씨를 지니다'처럼 사람의 변하지 않는 훌륭한 성격이나 가치를 표현할 때 아주 좋아요."],
      ["지레", "time", 3, "어떤 일이 일어나기도 전에 미리 짐작하거나 겁을 먹고 앞질러서 성급하게 행동하는 모양을 뜻하는 부사예요.", "아직 시험을 보지도 않았는데 문제가 무척 어려울 것이라고 지레 겁을 먹고 포기하는 것은 6학년답지 않은 태도이다.", "주로 '지레짐작하다', '지레 포기하다'처럼 결과를 보기도 전에 섣부르게 판단하는 행동을 따끔하게 충고할 때 씁니다."],
      ["지르다", "action", 1, "1. 크고 높은 목소리로 시원하게 소리를 내거나 억눌린 감정을 폭발시키는 일이에요.<br>2. 마른 장작 따위에 불을 붙여 태우거나, 윷놀이에서 윷말을 써서 상대의 말을 잡는 행동이에요.<br>3. 가던 길을 빙 돌지 않고 똑바로 가로질러서 빠르게 가는 행동이에요.", "1. 피구 대회에서 우리 반이 역전승을 거두는 순간, 너무 기뻐서 펄쩍 뛰며 환호성을 질렀다.<br>2. 가을이 되면 농부 아저씨들은 해충을 없애기 위해 마른 논둑에 불을 지르신다.<br>3. 늦잠을 자서 학교에 지각하지 않으려고 좁은 골목길을 쏜살같이 질러서 뛰어갔다.", "소리를 크게 내는 감정의 폭발부터 지름길로 가는 역동성까지 아주 다양한 상황에서 등장하는 재밌는 동사입니다."],
      ["지새우다", "action", 2, "어떤 일에 푹 빠지거나 걱정거리가 있어서 잠을 자지 않고 고스란히 뜬눈으로 밤을 꼴딱 넘겨버리는 일이에요.", "가족들과 함께 떠나는 첫 해외여행에 대한 기대감과 설렘 때문에 도저히 잠이 오지 않아 거의 뜬눈으로 밤을 지새웠다.", "단순히 늦게 잔다는 뜻을 넘어서 설렘, 아픔, 혹은 굳은 다짐 때문에 잠을 잊은 아주 문학적이고 깊은 감정의 표현입니다."],
      ["지저귀다", "nature", 1, "작고 귀여운 새들이 기분 좋게 잇따라 소리를 내어 아주 맑고 예쁘게 우는 사랑스러운 소리예요.", "이른 아침 창문을 여니 학교 화단의 나뭇가지에서 참새 떼가 짹짹 지저귀며 상쾌하게 새로운 하루의 시작을 알려 주었다.", "자연의 평화로움과 아침의 생기 넘치는 분위기를 가장 아름답게 그려낼 수 있는 국어 시간 단골 순우리말 동사랍니다."],
      ["지치다", "heart", 1, "1. 어렵고 힘든 일을 너무 오래 해서 기운이 쏙 빠지거나 몹시 시달려 의욕이 사라진 피곤한 상태예요.<br>2. 얼음판 위에서 썰매나 스케이트를 타고 앞으로 쌩쌩 미끄러져 달리는 재미있는 행동이에요.", "1. 뙤약볕 아래에서 땀을 흘리며 두 시간 연속으로 체육을 했더니 기진맥진하여 너무 지쳤다.<br>2. 겨울방학에 꽁꽁 언 강물 위에서 친구들과 신나게 썰매를 지치며 시간 가는 줄 모르고 놀았다.", "육체적인 피로와 마음의 피곤함을 뜻하는 동사이자, 스케이트를 탄다는 뜻의 훌륭한 동음이의어입니다."],
      ["지키다", "action", 1, "1. 위험한 적으로부터 소중한 것을 안전하게 보호하고 방어하는 훌륭한 일이에요.<br>2. 다른 사람과 맺은 소중한 약속이나 규칙을 어기지 않고 그대로 따르는 도덕적인 행동이에요.", "1. 경찰 아저씨들은 밤낮없이 우리 동네의 평화와 안전을 든든하게 지켜 주신다.<br>2. 아무리 귀찮고 힘들더라도 친구와의 약속 시간은 무슨 일이 있어도 꼭 지키는 것이 진정한 신뢰다.", "나쁜 사람을 막는 경찰관의 행동뿐만 아니라, 학교의 도덕과 규칙을 올바르게 따르는 굳센 의지를 보여줍니다."],
      ["짓다", "action", 1, "1. 재료를 들여 집이나 옷을 새로 만들거나 맛있는 밥을 조리하여 새로 만드는 일이에요.<br>2. 시나 소설 같은 글을 새롭게 쓰거나, 사람의 이름이나 노래의 제목을 새로 정하는 일이에요.<br>3. 어떠한 감정을 나타내는 표정을 새롭게 꾸며내어 얼굴에 띠는 행동이에요.", "1. 엄마께서 퇴근 후 피곤하신 몸을 이끌고 정성껏 지어주신 따뜻한 밥상은 세상에서 가장 맛있다.<br>2. 국어 시간에 가을의 아름다움을 주제로 멋진 시를 지어 친구들 앞에서 낭송했다.<br>3. 짝꿍이 건넨 생일 선물을 열어본 동생이 너무 좋아서 입가에 함박웃음을 활짝 지었다.", "건축, 요리, 글짓기, 그리고 표정을 짓다 등 무에서 유를 창조하는 사람의 모든 훌륭한 활동을 아우르는 위대한 고유어입니다."],
      ["짙다", "nature", 1, "1. 색깔이나 화장이 보통보다 훨씬 강하고 뚜렷하여 아주 선명한 상태를 말해요.<br>2. 안개나 연기, 구름 따위가 틈이 보이지 않을 정도로 아주 빽빽하고 꽉 찬 상태예요.<br>3. 어떤 경향이나 의심 같은 마음의 상태가 보통보다 아주 강하게 나타나는 느낌이에요.", "1. 가을이 깊어지면서 산의 나무들은 짙고 강렬한 붉은 단풍 빛으로 아름답게 물들기 시작했다.<br>2. 아침에 짙은 안개가 자욱하게 껴서 학교 가는 길에 앞이 잘 보이지 않아 조심조심 걸었다.<br>3. 그 친구가 거짓말을 하고 있다는 의심이 짙어져서 결국 솔직하게 진실을 물어보았다.", "색깔의 선명함부터 빽빽한 안개, 그리고 마음속 굳은 확신이나 의심까지 아주 넓게 활용되는 형용사입니다."],
      ["쭈뼛거리다", "action", 1, "사람들 앞에 서는 것이 부끄럽거나 겁이 나서 시원스럽게 나서지 못하고 몸을 자꾸 움츠리며 몹시 망설이는 모양이에요.", "새 학기 첫날 자기소개 시간에 반 친구들의 시선이 모두 나에게 쏠리자 부끄러워서 고개를 푹 숙인 채 쭈뼛거리며 모기만 한 목소리로 말했다.", "자신감이 부족해서 행동을 선뜻 하지 못하는 쑥스러운 마음을 몸의 움직임으로 아주 생생하고 귀엽게 보여주는 낱말입니다."],
      ["찌푸리다", "action", 1, "1. 기분이 나쁘거나 화가 나서 미간이나 얼굴 전체의 근육을 잔뜩 찡그리는 모양이에요.<br>2. 날씨가 구름이 잔뜩 끼어 해가 보이지 않고 아주 어둡고 흐려진 궂은 상태예요.", "1. 내가 실수로 부딪혔을 때, 화를 내며 얼굴을 찌푸리지 않고 오히려 괜찮냐고 먼저 물어봐 준 친구에게 감동했다.<br>2. 아침부터 하늘이 잔뜩 찌푸리고 있더니 결국 하굣길에 굵은 소나기가 시원하게 쏟아졌다.", "사람의 언짢은 감정을 보여주는 얼굴 표정이자, 비가 오기 직전의 잔뜩 흐리고 어두운 하늘을 비유할 때도 기가 막히게 잘 어울려요."],
      ["쩌렁쩌렁", "action", 2, "목소리나 소리가 좁은 공간이나 넓은 운동장을 아주 꽉 채울 만큼 몹시 크고 높게 울려 퍼지는 웅장하고 힘찬 소리예요.", "체육대회 아침, 교장 선생님께서 마이크도 없이 쩌렁쩌렁 울리는 큰 목소리로 우리들의 안전을 당부하시며 힘찬 응원의 말씀을 전해주셨다.", "목소리에 아주 큰 기백과 자신감이 넘쳐서 주변 사람들을 압도할 때 쓰는 의성어로, 씩씩하고 용기 있는 리더의 목소리를 칭찬할 때 써보세요."],
      ["짤막하다", "daily", 1, "1. 물건의 길이나 사람의 키가 보통보다 조금 짧은 듯하여 아담하고 귀여운 상태예요.<br>2. 글이나 말의 길이가 길지 않고 핵심만 담겨 지루하지 않게 짧고 간결한 상태예요.", "1. 우리 집 강아지는 다리가 짤막해서 아장아장 걷는 모습이 무척 앙증맞고 귀엽다.<br>2. 선생님께서 우리 반 친구들 모두에게 짤막하지만 진심이 듬뿍 담긴 감동적인 편지를 한 통씩 써 주셨다.", "글이나 말이 길고 지루하지 않게 핵심만 담겨 있을 때, 혹은 아주 귀엽고 다부진 느낌을 줄 때 칭찬하는 좋은 단어입니다."],
      ["차갑다", "nature", 1, "1. 닿은 느낌이 서늘하게 춥거나 온도가 무척 낮은 상태예요.<br>2. 사람의 태도나 성격이 다정하지 않고 쌀쌀맞고 냉정한 상태예요.", "1. 체육을 마치고 교실로 돌아와 아주 차가운 얼음물을 단숨에 들이마셨다.<br>2. 내가 사과를 건넸지만 친구는 차가운 표정으로 대답하며 고개를 돌렸다.", "온도가 낮을 때뿐만 아니라 남을 배려하지 않는 냉정한 성격을 비유할 때도 써요."],
      ["차분하다", "heart", 2, "성격이나 분위기가 촐랑대지 않고 조용하게 가라앉아 있는 듬직한 모습이에요.", "우리 반 반장은 예상치 못한 위기 상황에서도 당황하지 않고 차분하게 문제를 해결한다.", "'침착(沈着)하다'라는 한자어 대신 쓰면 훨씬 부드럽고 예쁜 순우리말이랍니다."],
      ["차지다", "food", 2, "1. 밥이나 떡이 끈기가 아주 많아서 입에 척척 달라붙는 맛있는 상태예요.<br>2. 사람의 손끝이나 솜씨가 야무지고 옹골차서 일 처리가 단단한 모양이에요.", "1. 할머니께서 갓 지어 주신 햅쌀밥이 아주 차지고 윤기가 좌르르 흘렀다.<br>2. 우리 모둠장은 일 처리가 아주 차지어서 발표 자료를 빈틈없이 완성해 냈다.", "일상생활에서 '찰지다'라고 잘못 쓰는 경우가 아주 많은데, 올바른 표준어는 '차지다'입니다."],
      ["착하다", "heart", 1, "사람의 마음씨나 행동이 삐뚤어지지 않고 바르며 어질다는 뜻의 칭찬이에요.", "항상 남을 배려하고 양보하는 지민이의 착한 마음씨는 우리 반 모두가 인정한다.", "너무 흔해서 한자어(善) 같지만, 우리 민족이 아주 옛날부터 써온 순우리말 파생어예요."],
      ["찰랑찰랑", "nature", 1, "컵이나 그릇에 액체가 가득 차서 아주 잔잔하고 예쁘게 흔들리는 모양이에요.", "주전자의 물을 컵에 찰랑찰랑할 때까지 가득 따라서 짝꿍에게 조심스럽게 건네주었다.", "물이 넘칠 듯 말 듯 흔들리는 경쾌한 소리나 모습을 귀엽게 표현하는 부사입니다."],
      ["찰박찰박", "action", 2, "깊지 않은 얕은 물이나 진흙을 발로 가볍게 자꾸 밟을 때 나는 경쾌한 소리예요.", "비가 그친 뒤, 동생이 장화를 신고 물웅덩이를 찰박찰박 밟으며 신나게 뛰어놀았다.", "빗물이나 시냇물을 밟으며 걷는 모습을 아주 생동감 있게 묘사해 주는 소리말이랍니다."],
      ["참", "heart", 1, "1. 거짓이나 꾸밈이 없이 아주 바르고 진실하다는 뜻의 명사예요.<br>2. 진실하다는 뜻 외에도 '참 예쁘다'처럼 진짜로, 매우라는 뜻의 부사로도 쓰여요.", "1. 내가 한 말이 거짓말이 아니라 정말로 참이라는 것을 친구들에게 끝까지 설득했다.<br>2. 가을 하늘이 참 높고 파란 주말에 가족들과 공원으로 산책을 다녀왔다.", "거짓 없는 진실을 뜻하기도 하고, 정도가 심함을 나타내는 부사로도 널리 쓰입니다."],
      ["참다", "heart", 1, "1. 웃음이나 눈물, 또는 아픔이나 화나는 감정을 겉으로 드러내지 않고 꾹 억누르는 힘이에요.<br>2. 배고픔이나 추위, 졸음 같은 육체적인 고통을 겪어내며 견디는 일이에요.", "1. 친구가 얄미운 장난을 쳤지만 교실에서 싸우지 않기 위해 화나는 마음을 꾹 참았다.<br>2. 점심시간이 아직 멀었는데 배가 너무 고파서 수업 시간에 꼬르륵 소리를 참느라 혼났다.", "감정과 고통을 묵묵히 억누르고 견뎌내는 6학년의 성숙함을 보여주는 단어입니다."],
      ["참되다", "heart", 2, "거짓이 없이 아주 올바르고 진실하며 훌륭하다는 뜻을 가진 형용사예요.", "어려운 이웃을 위해 남몰래 봉사하는 것이야말로 참된 6학년의 훌륭한 모습이다.", "'참(진실)'이라는 명사에 '-되다'가 붙어 만들어진 파생어로 올바른 인성을 칭찬할 때 씁니다."],
      ["찬찬하다", "heart", 3, "사람의 성질이나 일 처리하는 솜씨가 덜렁대지 않고 아주 꼼꼼하고 차분하다는 뜻이에요.", "시험지를 제출하기 전에 혹시나 실수한 곳이 없는지 처음부터 찬찬하게 다시 훑어보았다.", "꼼꼼하고 진중한 태도를 뜻하는 말로, 한자어 같지만 당당한 우리말 형용사입니다."],
      ["찾다", "action", 1, "1. 모르는 것을 알아내거나 잃어버린 것을 다시 얻기 위해 여기저기 살피는 행동이에요.<br>2. 정성이나 목적을 가지고 어떤 장소나 사람을 향해 가는 일이에요.<br>3. 맡겨두었던 물건이나 돈을 돌려받아 가져오는 행동이에요.", "1. 체육 시간에 잃어버린 실내화 주머니를 찾기 위해 운동장 구석구석을 뒤졌다.<br>2. 주말에 부모님과 함께 시골 할아버지 댁을 찾아가서 맛있는 저녁을 먹었다.<br>3. 은행에 가서 지난번에 저축해 두었던 용돈을 현금으로 찾아왔다.", "물건을 구하는 것부터 방문, 예금 인출까지 아주 다양한 뜻을 가진 핵심 동사예요."],
      ["채", "daily", 2, "어떤 상태가 변하지 않고 이미 되어 있는 그대로 있다는 뜻을 나타내는 의존명사예요.", "너무 피곤해서 겉옷도 벗지 못한 채로 침대에 눕자마자 깊은 잠에 곯아떨어졌다.", "항상 앞말의 수식을 받아 띄어 써야 하며, 상황이 유지됨을 표현할 때 문장에 자연스럽게 녹아듭니다."],
      ["채다", "action", 2, "남이 숨기려 하는 어떤 일이나 마음을 재빨리 알아내어 눈치챈다는 뜻의 동사예요.", "내가 뒤에서 몰래 다가가 깜짝 놀라게 하려고 했지만 눈치 빠른 짝꿍이 벌써 채고 돌아보았다.", "주로 '눈치를 채다', '낌새를 채다'처럼 직감적으로 상황을 파악하는 영리함을 나타낼 때 써요."],
      ["채비", "daily", 2, "어떤 일을 하기 위하여 필요한 물건을 미리 갖추어 차리거나 마음의 준비를 하는 일이에요.", "내일 아침 일찍 현장체험학습을 가기 위해 오늘 밤에 꼼꼼하게 배낭 채비를 마쳤다.", "준비(準備)라는 한자어를 완벽하게 대체할 수 있는 아주 예스럽고 품격 있는 순우리말 명사예요."],
      ["채우다", "action", 1, "1. 모자란 것을 더하여 분량이 꽉 차게 만드는 일이에요.<br>2. 열리지 않도록 단추나 자물쇠를 단단히 잠그는 행동이에요.<br>3. 아이나 가축에게 먹이나 물을 배부르게 먹이는 일이에요.", "1. 빈 물통에 시원한 보리차를 가득 채우고 뚜껑을 꽉 닫았다.<br>2. 교실 문을 나서며 도난 방지를 위해 자물쇠를 단단히 채웠다.<br>3. 농부 아저씨께서 외양간의 소에게 맛있는 여물을 가득 채워 주셨다.", "물리적으로 공간을 가득하게 만드는 것뿐만 아니라 잠그는 행동도 뜻하는 다의어입니다."],
      ["처음", "time", 1, "어떤 일이나 행동, 또는 시간이나 차례의 맨 앞을 가리키는 시간 명사예요.", "자전거를 처음 배울 때는 넘어질까 봐 무서웠지만 포기하지 않고 연습해서 결국 성공했다.", "모든 것의 시작을 의미하며 인생의 도전과 경험을 이야기할 때 빠질 수 없는 단어입니다."],
      ["처마", "daily", 2, "비나 눈을 막기 위해 한옥이나 집의 지붕이 벽 밖으로 길게 튀어나온 끝부분이에요.", "갑자기 소나기가 쏟아져서 허둥지둥 근처 한옥의 넓은 처마 밑으로 들어가 비를 피했다.", "조상들의 훌륭한 건축 지혜가 담긴 고유어로, 처마 끝에 떨어지는 빗물 소리는 무척 낭만적이랍니다."],
      ["처지다", "action", 2, "1. 물건이 위에서 아래로 무게 때문에 축 늘어지는 모양이에요.<br>2. 실력이나 성적이 남들보다 뒤떨어져서 처져 있는 상태예요.", "1. 무거운 책을 너무 많이 넣었더니 책 가방 밑바닥이 아래로 툭 처졌다.<br>2. 수학 시험 성적이 다른 친구들에 비해 조금 처져서 남몰래 속상했다.", "물리적으로 늘어지는 것과 성적이 뒤떨어지는 상황을 뜻하며, '쳐지다'로 잘못 쓰지 않도록 주의하세요."],
      ["척", "daily", 2, "사실은 그렇지 않은데 겉으로만 그럴듯하게 꾸미는 거짓된 태도를 꼬집는 의존명사예요.", "숙제를 안 해놓고 다 한 척 거짓말을 했다가 결국 선생님께 들켜서 크게 꾸지람을 들었다.", "아는 척, 잘난 척처럼 진실되지 못한 태도를 비판할 때 주로 쓰여 항상 올바른 마음을 가지도록 교훈을 줍니다."],
      ["철", "time", 1, "1. 봄, 여름, 가을, 겨울처럼 자연의 기온에 따라 일 년을 넷으로 나눈 계절이에요.<br>2. 농사나 과일, 해산물 등 어떤 일이 가장 알맞게 성황을 이루는 시기를 뜻해요.", "1. 나는 과일 중에서 여름철에 시원한 에어컨 바람을 맞으며 먹는 수박을 제일 좋아한다.<br>2. 지금은 가을이라 집 앞 시장에 맛있는 햇밤과 대추가 한창 제철을 맞았다.", "계절을 뜻할 뿐만 아니라 과일이 가장 맛있는 시기를 뜻하는 '제철'이라는 말도 여기서 왔어요."],
      ["철", "heart", 1, "어린아이의 티를 벗고 사리를 바르게 분별할 줄 아는 성숙하고 지혜로운 힘이에요.", "항상 떼만 쓰던 동생이 엄마의 어깨를 주물러 드리는 것을 보니 이제 제법 철이 든 것 같다.", "계절이 바뀌는 자연의 이치를 아는 것에서 유래하여 사람이 정신적으로 성장함을 칭찬하는 멋진 말이에요."],
      ["철렁", "heart", 1, "몹시 놀라거나 덜컥 당황하여 가슴이 갑자기 크게 무너져 내려앉는 심리적인 소리나 모양이에요.", "지갑을 집에 두고 온 줄 알고 가슴이 철렁 내려앉았는데, 다행히 가방 밑바닥에서 찾았다.", "무거운 물체가 부딪히는 소리이기도 하지만, 놀란 감정을 아주 생생하게 묘사하는 감정의 의태어입니다."],
      ["철철", "nature", 2, "1. 물이나 눈물 따위의 액체가 밖으로 넘쳐흐르는 아주 역동적인 모양이에요.<br>2. 사람에게서 매력이나 기운이 겉으로 숨김없이 가득 뿜어져 나오는 모습을 비유해요.", "1. 장마철에 비가 몹시 많이 내리자 산골짜기 계곡물이 철철 넘쳐흐르며 무서운 기세를 보였다.<br>2. 우리 반 반장은 인성이 너무 훌륭해서 사람을 대할 때 매력이 철철 넘쳐흐른다.", "액체가 쏟아지는 모습뿐만 아니라 매력이 넘치는 사람을 비유적으로 칭찬할 때도 씁니다."],
      ["첫", "time", 1, "시간이나 차례가 맨 처음이라는 뜻을 더해 주는 아주 설레고 소중한 관형사예요.", "수학여행을 가는 첫날, 친구들과 함께 버스에 오르는 순간부터 기대감에 가슴이 두근거렸다.", "뒤에 오는 명사와 띄어 써야 하며 첫인상, 첫사랑처럼 어떤 일의 시작을 알리는 두근거리는 말입니다."],
      ["초라하다", "daily", 2, "겉모양이 아주 볼품없고 궁색하여 다른 것과 비교해 보기에 부끄럽고 안타까운 상태예요.", "친구들의 화려한 학용품들 사이에서 몽당연필만 쥔 내 손이 문득 초라하게 느껴졌다.", "물건이 낡은 것뿐만 아니라 남들보다 뒤떨어졌다고 생각될 때 겪는 마음의 쓸쓸함을 잘 나타냅니다."],
      ["초롱초롱", "nature", 1, "밤하늘의 별빛이나 아이들의 눈망울이 흐리지 않고 아주 맑고 또렷하게 빛나는 예쁜 모양이에요.", "수업 시간에 선생님의 재미있는 옛날이야기를 듣는 우리 반 친구들의 눈망울이 별빛처럼 초롱초롱했다.", "호기심이 가득 차고 생기가 넘치는 아주 긍정적인 눈빛을 칭찬할 때 국어 시간에 가장 많이 쓰이는 부사입니다."],
      ["촉촉하다", "nature", 1, "마르지 않고 젖은 듯이 물기가 살짝 배어 있어 살갗이나 흙이 아주 부드럽고 생기 있는 상태예요.", "가랑비가 내린 뒤 학교 화단의 흙이 촉촉해져서 지렁이들이 땅 위로 꼬물꼬물 기어 나오기 시작했다.", "감동을 받아서 눈물로 눈가가 물들 때 '눈가가 촉촉해지다'라고 문학적으로 아주 예쁘게 비유할 수 있어요."],
      ["촘촘하다", "daily", 2, "1. 그물이나 바느질 등의 사이나 틈이 매우 좁고 빽빽하여 아주 세밀한 상태예요.<br>2. 계획이나 일의 진행 과정이 빈틈없이 아주 야무지게 짜여 있는 상태예요.", "1. 방충망에 구멍이 난 곳을 실로 촘촘하게 꿰매어 모기가 절대 교실로 들어오지 못하게 했다.<br>2. 이번 시험을 위해 세운 학습 계획표가 아주 촘촘해서 그대로 실천하면 성적이 오를 것이다.", "그물이 잘 짜인 물리적 모습뿐만 아니라 사람의 계획이나 생각이 빈틈이 없을 때도 칭찬으로 씁니다."],
      ["촐랑거리다", "action", 2, "성격이 침착하지 못하고 가벼워 자꾸 경솔하게 까불며 가볍게 움직이는 얄미운 모양이에요.", "선생님께서 진지하게 말씀을 하시는데 뒤에서 촐랑거리며 장난을 치던 지훈이가 결국 주의를 받았다.", "에너지가 넘치는 것도 좋지만, 분위기를 파악하지 못하고 가벼운 행동을 하는 것을 따끔하게 꼬집는 동사예요."],
      ["총총하다", "nature", 3, "1. 밤하늘에 별이 아주 촘촘하고 빽빽하게 널려 있어 아름답게 빛나는 상태예요.<br>2. 정신이 흐리지 않고 아주 맑고 또렷하게 살아 있는 상태예요.<br>3. 마음이 바빠 걸음을 매우 바쁘게 서두르는 모양이에요.", "1. 밤하늘을 올려다보니 도시에서는 볼 수 없는 맑고 총총한 별들이 쏟아질 듯 빛났다.<br>2. 할아버지께서는 연세가 드셨음에도 눈빛이 여전히 총총하셔서 젊은이 못지않다.<br>3. 약속 시간에 늦을까 봐 발걸음을 총총하며 지하철역을 향해 바쁘게 달렸다.", "별이 빛나는 밤하늘, 맑은 눈빛, 바쁜 걸음까지 다채롭게 쓰이는 멋진 순우리말입니다."],
      ["추다", "action", 1, "아름다운 음악이나 신나는 장단에 맞추어 몸이나 손발을 덩실덩실 움직이며 춤을 나타내는 일이에요.", "학예회 무대에서 우리 모둠은 유행하는 케이팝 음악에 맞춰 신나게 춤을 추어 큰 박수갈채를 받았다.", "감정과 리듬을 몸으로 표현하는 가장 즐거운 예술 활동을 뜻하는 아주 짧고 강렬한 동사입니다."],
      ["추레하다", "daily", 3, "옷차림이나 겉모양이 깔끔하지 못하고 생기가 없어 아주 후줄근하고 볼품없는 상태예요.", "주말 내내 씻지도 않고 구겨진 잠옷 차림으로 추레하게 소파에 누워 있다가 엄마에게 잔소리를 들었다.", "깔끔하지 못한 외모나 피곤에 지친 어두운 안색을 꼬집거나 표현할 때 쓰이는 아주 사실적인 낱말이에요."],
      ["추리다", "action", 2, "1. 어수선하게 흩어져 있는 물건이나 짐을 보기 좋게 정돈하여 추리는 행동이에요.<br>2. 여럿이 복잡하게 섞여 있는 가운데서 조건에 맞는 중요한 것만 쏙쏙 뽑아 가려내는 일이에요.", "1. 이사 가기 전 방안에 어지럽게 널브러져 있던 짐들을 상자에 차곡차곡 잘 추렸다.<br>2. 도서관에서 숙제에 필요한 책 중 내게 가장 도움이 될 만한 책 세 권만 신중하게 추렸다.", "물건을 정리하는 행동과 수많은 정보 중 알짜배기만 골라내는 똑똑한 일 처리 능력을 모두 뜻합니다."],
      ["추스르다", "action", 2, "1. 가누기 힘든 몸을 억지로 바로잡아 가누는 물리적인 행동이에요.<br>2. 몹시 흩어지거나 슬픈 일이나 마음을 수습하여 단단히 가다듬는 심리적인 일이에요.", "1. 감기에 걸려 아팠지만 억지로 몸을 추스르고 일어나 중요한 단원 평가를 무사히 치렀다.<br>2. 친구와 다투고 속상했지만 마음을 잘 추스르고 먼저 다가가 화해의 손을 내밀었다.", "몸을 바로잡는 행동과 슬픔을 이겨내고 마음을 굳세게 다잡는 아주 어른스러운 행동이에요."],
      ["춥다", "nature", 1, "날씨의 기온이 몹시 낮아 몸이나 뺨이 서늘하고 얼어붙을 듯이 찬 느낌이 드는 겨울의 감각이에요.", "겨울방학 날, 찬 바람이 너무 매섭고 추워서 두꺼운 패딩 지퍼를 목 끝까지 꾹 올리고 집에 왔다.", "기온이 낮은 것뿐만 아니라 사람들의 관심이 없어 마음이 외롭고 시릴 때 '마음이 춥다'라고 쓰기도 합니다."],
      ["출렁출렁", "action", 1, "가득 찬 물이나 매달린 출렁다리 따위가 아주 크고 부드럽게 연달아 흔들리는 시원한 모양이에요.", "바닷가 방파제에 서 있으니 거대한 파도가 일며 바닷물이 출렁출렁 바위를 때리는 무척 시원했다.", "액체나 다리가 크게 흔들리는 모습을 생생하게 묘사하여 읽기만 해도 시원해지는 역동적인 부사입니다."],
      ["치다", "action", 1, "1. 손이나 몽둥이 같은 물건으로 세게 때리는 물리적인 행동이에요.<br>2. 피아노나 북 따위의 악기를 손가락으로 두드려 소리를 내어 연주하는 일이에요.<br>3. 경기에서 점수를 얻거나 비가 내리고 바람이 부는 자연 현상이 일어나는 것을 뜻해요.", "1. 동생이 내 장난감을 망가뜨렸다고 화가 나서 등짝을 찰싹 치고 말았다.<br>2. 음악 시간에 친구들이 부르는 노랫소리에 맞추어 피아노 반주를 훌륭하게 쳐서 칭찬을 받았다.<br>3. 오늘 오후에 우리 동네 야구 경기장에서 홈런을 치는 멋진 경기가 열린다.", "때리다, 연주하다, 현상이 일어나다 등 국어에서 가장 뜻이 많고 다양하게 활용되는 으뜸 동사예요."],
      ["치다꺼리", "action", 3, "남의 자질구레하고 귀찮은 일을 곁에서 묵묵히 보살펴서 도와주거나 뒤처리를 해 주는 고마운 일이에요.", "명절날 친척 동생들이 어질러 놓은 장난감을 치우고 밥을 먹이는 등 온갖 치다꺼리를 하느라 하루가 갔다.", "주로 어른들이 아이를 돌보거나 힘든 뒤처리를 도맡아 할 때 쓰는 말로 부모님의 희생과 사랑을 알 수 있어요."],
      ["치닫다", "action", 2, "1. 어떤 곳을 향해 위로 아주 빠르게 달음질쳐 올라가는 모습이에요.<br>2. 일이 걷잡을 수 없이 아주 심한 상태나 극단적인 상황으로 나아가는 모양이에요.", "1. 점심시간 종이 울리자마자 1등으로 밥을 먹기 위해 급식실을 향해 계단을 미친 듯이 치달았다.<br>2. 친구와의 사소한 오해가 풀리지 않고 결국 감정이 험악한 싸움으로 치달아 안타까웠다.", "물리적으로 위를 향해 전력 질주하는 역동적인 모습과 감정이 악화되는 상황을 모두 나타냅니다."],
      ["치대다", "action", 3, "1. 귀찮을 정도로 남에게 몹시 기대어 조르거나 보채는 행동이에요.<br>2. 밀가루 반죽 따위를 차지게 하려고 손으로 꾹꾹 주무르는 요리 행동이에요.", "1. 어린 동생이 장난감을 사달라며 엄마의 다리에 매달려 치대는 통에 결국 엄마가 화를 내셨다.<br>2. 요리 시간에 선생님의 설명에 따라 밀가루 반죽을 손으로 열심히 치대어 쫄깃하게 만들었다.", "반죽을 쫄깃하게 만드는 물리적 행동과, 남에게 달라붙어 귀찮게 구는 심리적 행동을 동시에 뜻합니다."],
      ["치르다", "action", 2, "1. 무슨 중요한 일이나 끔찍한 사건을 직접 겪어 내는 일이에요.<br>2. 물건을 사고 마땅히 내야 할 돈이나 대가를 지불하는 행동이에요.", "1. 떨리는 마음으로 중학교 배치 고사를 무사히 치르고 나니 가슴속 무거운 체증이 내려갔다.<br>2. 엄마는 백화점에서 마음에 드는 운동호를 사고 카드로 정직하게 값을 치르셨다.", "'치루다'로 잘못 쓰는 경우가 아주 많은데, '시험을 치르다', '값을 치르다'처럼 '치르다'가 올바른 맞춤법입니다."],
      ["치밀다", "action", 2, "1. 꾹 참았던 분노나 화, 구역질 같은 격렬한 감정이나 기운이 속에서 솟아오르는 상태예요.<br>2. 식물이나 줄기 따위가 위를 향해 쑥 뻗어나가는 모양이에요.", "1. 친구가 내 소중한 일기장을 몰래 훔쳐본 것을 알게 되었을 때 속에서 뜨거운 화가 치밀어 올랐다.<br>2. 따뜻한 봄이 되자 화단에 심어둔 새싹들이 흙을 뚫고 위로 쑥 치밀어 올랐다.", "참을 수 없는 분노가 솟구치는 감정뿐만 아니라 새싹이 돋아나는 자연의 모습도 멋지게 표현합니다."],
      ["치솟다", "action", 2, "1. 불길이나 물가 따위가 위를 향해 아주 세차게 뻗어 오르며 솟아오르는 역동적인 모습이에요.<br>2. 가치나 인기, 물가 같은 수치가 위로 급격하게 엄청나게 오르는 현상이에요.", "1. 캠핑장에서 모닥불을 피우자 장작이 타들어가며 붉은 불길이 밤하늘을 향해 높이 치솟았다.<br>2. 최근 채소 농사가 흉년이 드는 바람에 배추와 무의 물가가 하늘 높은 줄 모르고 치솟았다.", "불길이 오르는 물리적 현상과 물가나 인기가 급상승하는 경제·사회적 현상을 모두 훌륭하게 뜻합니다."],
      ["치우다", "action", 1, "1. 어질러진 물건들을 깨끗하게 제자리로 정리하거나 밖으로 치워 없애는 행동이에요.<br>2. 방해되는 장애물이나 골치 아픈 일을 해결하여 없애는 일이에요.", "1. 미술 시간이 끝난 뒤 책상 위에 널브러져 있던 색종이 조각을 쓰레기통에 말끔히 치웠다.<br>2. 이번 주말에는 그동안 미루어 두었던 방 안의 묵은 먼지와 골칫거리 숙제를 말끔히 치워야겠다.", "공간을 청소하는 훌륭한 습관이자 방해되는 일을 말끔히 해결하는 든든한 행동을 뜻합니다."],
      ["치우치다", "action", 2, "어떤 일에 대한 생각이나 행동이 한가운데 바르지 못하고 어느 한쪽으로 쏠려서 공평하지 못한 잘못된 상태예요.", "모둠 토의를 할 때 반장은 누구 한 사람의 의견에 치우치지 않고 모두의 이야기를 공평하게 들어주었다.", "편견을 가지거나 불공평한 태도를 꼬집는 낱말로 중립과 배려가 중요한 학급 생활에서 아주 가치 있게 쓰이는 단어입니다."],
      ["치레", "daily", 3, "어떤 일의 실속보다는 남의 눈에 띄는 겉모습만을 보기 좋게 꾸미거나 남을 칭찬하여 추켜세우는 조금 가벼운 일이에요.", "생일 선물을 줄 때 값비싼 포장지로 화려하게 겉치레를 하기보다는 진심이 담긴 작은 손 편지를 주는 것이 감동이다.", "겉만 번지르르하고 속이 비어 있는 얄팍한 태도를 경계하며, 주로 '인사치레', '겉치레'처럼 다른 말 뒤에 붙습니다."],
      ["치렁치렁", "daily", 2, "옷이나 머리카락, 혹은 나뭇가지 따위가 땅에 닿을 정도로 아주 길고 거추장스럽게 축 늘어진 무거운 모양이에요.", "아침에 늦잠을 자는 바람에 머리를 빗지도 못하고 허리까지 내려오는 머리카락을 치렁치렁 늘어뜨린 채 등교했다.", "단정하지 못하고 지저분하게 길게 늘어진 모습을 실감 나게 나타내며 빗버들이 가지를 길게 늘어뜨린 풍경에도 아주 잘 어울려요."],
      ["칠칠하다", "action", 3, "1. 성질이나 솜씨, 일 처리가 아주 반듯하고 꼼꼼하며 야무지다는 뜻의 칭찬이에요.<br>2. 일상생활에서 주로 '못하다'나 '않다'와 짝을 지어 덜렁거리고 칠면조처럼 덤벙대는 모습을 꾸짖는 말이에요.", "1. 우리 언니는 손끝 야무지게 바느질을 참 칠칠하게 잘해서 엄마의 칭찬을 자주 받는다.<br>2. 오늘따라 실내화 주머니도 잃어버리고 넘어지니 엄마께서 넌 왜 이렇게 매사에 칠칠하지 못하냐고 하셨다.", "원래는 칭찬이지만 일상에서는 덜렁거림을 꾸짖는 반대 의미로 훨씬 많이 쓰이는 독특한 고유어입니다."],
      ["칭얼거리다", "action", 2, "어린아이가 몹시 졸리거나 불만이 있어서 짜증을 내며 자꾸 투정을 부리고 우는 귀찮고 시끄러운 모양이에요.", "마트 장난감 코너에서 로봇을 사달라며 바닥에 주저앉아 칭얼거리는 동생을 달래느라 애를 먹었다.", "아직 철이 들지 않은 어린아이의 떼쓰는 얄미운 모습을 아주 생생하게 묘사하는 파생어로 6학년 형님들은 절대 해서는 안 될 행동이랍니다."],
      ["축축하다", "nature", 1, "물기나 습기가 배어 있어서 만졌을 때 마르지 않고 몹시 젖어 있는 듯한 눅눅하고 무거운 느낌의 상태예요.", "비 오는 날 우산을 쓰고 하교했는데도 신발 안으로 빗물이 스며들어 양말이 하루 종일 축축해서 찝찝했다.", "촉촉하다가 긍정적이고 생기 있는 물기라면 축축하다는 불쾌하고 과하게 젖어 있는 아주 차가운 물기를 뜻하는 절묘한 차이가 있답니다."],
      ["캄캄하다", "nature", 1, "1. 빛이 전혀 없어서 앞이 보이지 않을 정도로 아주 어두운 상태예요.<br>2. 기억이나 앞날의 전망이 뚜렷하지 않고 캄캄하여 막막한 상태예요.", "1. 밤에 불을 끄고 누우니 방 안이 너무 캄캄해서 억지로 눈을 감고 잠을 청했다.<br>2. 시험지를 받았는데 배운 내용이 하나도 기억나지 않아 눈앞이 캄캄했다.", "물리적인 어둠뿐만 아니라 앞날이 막막할 때 감정을 표현할 때도 아주 훌륭하게 씁니다."],
      ["캐다", "action", 1, "1. 땅속에 묻힌 감자나 고구마 따위를 파내어 밖으로 드러내는 일이에요.<br>2. 드러나지 않은 숨겨진 사실이나 비밀을 끈질기게 파고들어 밝혀내는 일이에요.", "1. 할머니와 함께 텃밭에서 호미로 흙을 파고 통통한 고구마를 캤다.<br>2. 명탐정이 꽁꽁 숨겨진 사건의 비밀을 끈질기게 캐어 결국 범인을 잡아냈다.", "자연에서 작물을 얻을 때와 보이지 않는 진실을 알아낼 때 모두 쓰는 멋진 다의어예요."],
      ["커다랗다", "daily", 1, "사물의 크기나 부피가 보통을 넘어 아주 몹시 크다는 뜻의 형용사예요.", "생일날 친구에게 커다란 곰 인형을 선물로 받고 기분이 날아갈 듯 무척 좋았다.", "'크다'보다 훨씬 부피감이 있고 웅장한 느낌을 줄 때 글쓰기에 아주 좋습니다."],
      ["켕기다", "heart", 2, "1. 마음속으로 잘못한 일이 있어 찔리거나 불안하여 몹시 두근거리는 상태예요.<br>2. 팽팽하게 당겨진 줄이나 끈이 마주 당기는 힘을 받아 아주 팽팽해지는 현상이에요.", "1. 숙제를 안 하고 다 했다고 거짓말을 했더니 선생님 눈을 마주치기가 속으로 몹시 켕겼다.<br>2. 연날리기할 때 거센 바람이 불어 하늘의 연줄이 팽팽하게 켕겼다.", "양심에 찔리는 심리와 줄이 당겨지는 물리적 현상을 모두 뜻하는 신기한 동사입니다."],
      ["켜다", "action", 1, "1. 성냥이나 라이터로 불을 붙이거나 스위치를 눌러 전등이나 기계를 작동시키는 일이에요.<br>2. 몸의 관절이나 근육을 쭉 늘여서 펴는 행동이에요.<br>3. 바이올린이나 첼로 같은 현악기의 줄을 활로 문질러 소리를 내는 연주예요.<br>4. 톱으로 나무를 양쪽에서 밀고 당기며 자르는 일이에요.<br>5. 갈증이 나서 물을 벌컥벌컥 들이마시는 행동이에요.", "1. 날이 어두워지자 아버지가 거실의 전등을 환하게 켜시고 뉴스를 보셨다.<br>2. 아침에 일어나 시원하게 기지개를 켜며 잠을 깨웠다.<br>3. 음악 시간에 무대 위에서 바이올린을 멋지게 켜는 연습을 했다.<br>4. 옛날 목수 아저씨들이 톱을 켜서 커다란 나무를 반듯하게 잘라내었다.<br>5. 목이 너무 말라서 시원한 보리차 한 컵을 단숨에 들이켜 꿀꺽 마셨다.", "하나의 단어에 무려 5가지가 넘는 뜻이 있는 아주 활용도가 높고 중요한 으뜸 동사랍니다."],
      ["켁켁", "action", 1, "목에 가시나 음식물이 잘못 걸려 숨이 막히는 바람에 고통스럽게 자꾸 내는 짧은 기침 소리예요.", "점심시간에 매운 떡볶이를 급하게 먹다가 고춧가루가 목에 걸려 한참 동안 켁켁 기침을 했다.", "호흡이 곤란해지는 당황스러운 순간이나 사레가 들린 실수를 가장 실감 나고 재미있게 보여줘요."],
      ["캑캑거리다", "action", 2, "목에 무엇이 걸리거나 숨이 차서 자꾸 숨 막히는 소리를 연달아 내는 행동이에요.", "오래달리기를 꼴찌로 마치고 결승선에 들어온 지훈이가 숨을 헐떡이며 켑캑거렸다.", "아주 힘들고 지쳐서 호흡이 거친 모양을 묘사할 때 쓰면 문장이 생생해져요."],
      ["칼", "daily", 1, "요리를 하거나 종이를 자를 때 쓰는, 날이 날카롭게 서 있는 도구예요.", "미술 시간에 칼을 사용할 때는 손을 다치지 않도록 아주 조심해야 한다.", "무엇인가를 자르고 가르는 가장 직관적이고 오래된 순우리말 명사입니다."],
      ["칼질", "action", 2, "1. 칼을 써서 물건을 베거나 써는 요리나 작업 행동이에요.<br>2. 어떤 조직이나 예산을 마음대로 줄이거나 구조 조정하는 것을 비유해요.", "1. 엄마의 빠르고 정확한 도마 위 칼질 소리가 주방에 경쾌하게 울려 퍼졌다.<br>2. 회사에서 경영이 어려워지자 대대적인 예산 칼질을 시작했다.", "'칼'이라는 명사에 행동을 뜻하는 '-질'이 붙어 만들어진 아주 유용한 파생어랍니다."],
      ["칼칼하다", "food", 2, "1. 음식 맛이 맵거나 후추 맛이 강하여 자극적인 느낌이 드는 상태예요.<br>2. 목이 조금 말라서 시원한 물을 마시고 싶거나 까칠한 상태예요.", "1. 엄마가 끓여주신 김치찌개는 청양고추가 들어가서 국물 맛이 아주 시원하고 칼칼했다.<br>2. 먼지를 많이 마셨더니 목이 칼칼해서 물을 벌컥벌컥 마셨다.", "그냥 '맵다'는 말보다 훨씬 입맛을 당기고 개운한 맛을 묘사할 때 어울려요."],
      ["컬컬하다", "food", 3, "목이 몹시 말라서 물이 마시고 싶거나, 음식 맛이 약간 맵고 찌르는 듯한 느낌이에요.", "체육 시간에 오래달리기를 하고 났더니 목이 컬컬해서 시원한 물을 한 컵 다 마셨다.", "'칼칼하다'와 비슷하지만 느낌이 조금 더 어둡고 묵직한 상황에 어울리는 형용사입니다."],
      ["캄캄하다", "nature", 1, "1. 빛이 전혀 없어서 앞이 보이지 않을 정도로 아주 어두운 상태예요.<br>2. 기억이나 앞날의 전망이 뚜렷하지 않고 캄캄하여 막막한 상태예요.", "1. 밤에 불을 끄고 누우니 방 안이 너무 캄캄해서 억지로 눈을 감고 잠을 청했다.<br>2. 시험지를 받았는데 배운 내용이 하나도 기억나지 않아 눈앞이 캄캄했다.", "물리적인 어둠뿐만 아니라 앞날이 막막할 때 감정을 표현할 때도 아주 훌륭하게 씁니다."],
      ["컴컴하다", "nature", 2, "1. 빛이 약하거나 어두침침하여 컴컴한 상태예요.<br>2. 사람의 속마음이 겉과 다르게 엉큼하고 나쁜 꿍꿍이가 숨어 있는 상태를 비유해요.", "1. 비가 오려는지 대낮인데도 하늘이 구름에 잔뜩 가려 컴컴해지고 바람이 불었다.<br>2. 남의 것을 훔치고도 반성하지 않는 저 친구는 속이 참 컴컴하다.", "날씨가 어두워지는 물리적 현상과 사람의 나쁜 속마음을 꼬집을 때 모두 씁니다."],
      ["카랑카랑", "action", 2, "목소리나 소리가 맑고 높아서 아주 또렷하게 쇳소리처럼 울리는 모양이에요.", "우리 반 반장은 회의를 진행할 때 카랑카랑 울리는 목소리로 모두의 시선을 집중시킨다.", "자신감 넘치고 아주 맑은 사람의 목소리를 칭찬할 때 국어 시간에 자주 쓰이는 말입니다."],
      ["캐다", "action", 2, "1. 땅속에 묻힌 것을 파내어 밖으로 드러내는 일이에요.<br>2. 숨겨진 사실이나 비밀을 끈질기게 파고들어 밝혀내는 일이에요.", "1. 할머니와 함께 텃밭에서 호미로 흙을 파고 통통한 고구마를 캤다.<br>2. 명탐정이 꽁꽁 숨겨진 사건의 비밀을 끈질기게 캐어 결국 범인을 잡아냈다.", "자연에서 작물을 얻을 때와 보이지 않는 진실을 알아낼 때 모두 쓰는 멋진 동사예요."],
      ["커다랗다", "daily", 1, "사물의 크기나 부피가 보통을 넘어 아주 몹시 크다는 뜻의 형용사예요.", "생일날 친구에게 커다란 곰 인형을 선물로 받고 기분이 날아갈 듯 무척 좋았다.", "'크다'보다 훨씬 부피감이 있고 웅장한 느낌을 줄 때 글쓰기에 아주 좋습니다."],
      ["켕기다", "heart", 3, "1. 마음속으로 잘못한 일이 있어 불안하거나 양심에 찔리는 상태예요.<br>2. 마주 당기는 힘이 아주 팽팽하게 팽해지는 현상이에요.", "1. 숙제를 안 하고 거짓말을 해서 속이 켕겼는데 선생님이 이름을 부르셨다.<br>2. 연날리기할 때 거센 바람이 불어 하늘의 연줄이 팽팽하게 켕겼다.", "양심에 찔리는 심리와 줄이 당겨지는 물리적 현상을 모두 뜻하는 신기한 동사입니다."],
      ["켜", "daily", 3, "포개어 놓은 물건의 낱낱의 층을 뜻하는 아주 예스럽고 낯선 명사예요.", "시루떡을 만들 때 쌀가루와 팥고물을 한 켜 한 켜 정성껏 번갈아 쌓아 올렸다.", "떡이 쌓인 모습이나 지층이 겹겹이 쌓인 층을 셀 때 쓰는 멋진 고유어 단위입니다."],
      ["켜켜이", "daily", 2, "여러 개의 물건이 층층이 차곡차곡 포개어져 쌓여 있는 모양을 뜻하는 예쁜 부사예요.", "오래된 창고를 열어보니 버려진 옛날 책들 위로 먼지가 켜켜이 두껍게 쌓여 있었다.", "마음속에 오랜 슬픔이나 아름다운 추억이 깊이 쌓인 모습을 시적으로 비유할 때 씁니다."],
      ["켜다", "action", 2, "1. 성냥이나 라이터로 불을 붙이거나 스위치를 눌러 전등이나 기계를 작동시키는 일이에요.<br>2. 몸의 관절이나 근육을 쭉 늘여서 펴는 행동이에요.<br>3. 바이올린이나 첼로 같은 현악기의 줄을 활로 문질러 소리를 내는 연주예요.<br>4. 톱으로 나무를 양쪽에서 밀고 당기며 자르는 일이에요.<br>5. 갈증이 나서 물을 벌컥벌컥 들이마시는 행동이에요.", "1. 날이 어두워지자 아버지가 거실의 전등을 환하게 켜시고 뉴스를 보셨다.<br>2. 아침에 일어나 시원하게 기지개를 켜며 잠을 깨웠다.<br>3. 음악 시간에 무대 위에서 바이올린을 멋지게 켜는 연습을 했다.<br>4. 옛날 목수 아저씨들이 톱을 켜서 커다란 나무를 반듯하게 잘라내었다.<br>5. 목이 너무 말라서 시원한 보리차 한 컵을 단숨에 들이켜 꿀꺽 마셨다.", "하나의 단어에 무려 5가지가 넘는 뜻이 있는 아주 활용도가 높고 중요한 으뜸 동사랍니다."],
      ["켸켸묵다", "daily", 3, "물건이나 어떤 생각 따위가 아주 오래되어 낡고 시대에 뒤떨어졌다는 뜻이에요.", "할아버지 댁 다락방에서 아주 켸켸묵은 옛날 사진첩을 발견하고 시간 가는 줄 모르고 구경했다.", "낡은 물건뿐만 아니라 고리타분하고 옛날 방식인 고집스러운 생각을 꼬집을 때도 씁니다."],
      ["켤레", "daily", 1, "신발이나 양말, 장갑처럼 두 개가 짝을 이루는 물건을 세는 우리말 단위예요.", "비 오는 날 운동화가 젖어서 내일 신을 뽀송뽀송한 새 양말 한 켤레를 가방에 챙겼다.", "반드시 쌍으로 이루어진 물건을 정확하게 세는 아주 일상적이고 훌륭한 고유어입니다."],
      ["코", "daily", 1, "1. 냄새를 맡고 숨을 쉬는 얼굴의 돌출된 기관이에요.<br>2. 뜨개질이나 그물을 짤 때 엮는 실의 낱낱의 고리를 뜻해요.", "1. 추운 날 밖에 오래 서 있었더니 코가 빨개지고 콧물이 났다.<br>2. 털실로 서른 코를 잡아 따뜻한 목도리를 정성껏 떴다.", "신체 부위를 뜻할 뿐만 아니라 그물이나 뜨개질의 그물눈을 셀 때도 똑같이 쓰는 명사예요."],
      ["코빼기", "daily", 2, "사람의 얼굴이나 코를 속되게 이르는 말로, 주로 남이 아주 안 보일 때 쓰는 파생어예요.", "우리 모둠에서 제일 게으른 지훈이는 오늘 청소 시간이 되자 코빼기도 보이지 않고 도망갔다.", "'코빼기도 안 보인다'처럼 누군가 전혀 나타나지 않는 얄미운 상황을 재미있게 묘사합니다."],
      ["쾨쾨하다", "daily", 2, "오래 보관한 물건이나 썩은 음식에서 비위에 거슬릴 정도로 지독하게 나는 찌든 냄새예요.", "오랫동안 신지 않던 젖은 운동화를 신발장에서 꺼냈더니 쾨쾨한 곰팡이 냄새가 진동했다.", "환기를 잘하지 않은 방이나 아주 오래된 물건에서 나는 불쾌한 냄새를 정확히 짚어냅니다."],
      ["퀴퀴하다", "daily", 1, "상하고 찌든 냄새가 난다는 뜻으로, 쾨쾨하다보다 느낌이 훨씬 더 강하고 센 형용사예요.", "청소를 오랫동안 하지 않은 구석진 창고 문을 열자 퀴퀴한 먼지 냄새가 확 코를 찔렀다.", "냄새의 강도에 따라 쾨쾨하다와 퀴퀴하다를 적절히 구분해서 쓰면 어휘력이 아주 풍부해져요."],
      ["쿰쿰하다", "food", 2, "김치나 찌개 따위가 푹 익어서 나는 약간 시큼하면서도 찌든 듯한 특이한 냄새예요.", "할머니 댁 부엌에 들어가니 청국장을 끓이시는지 구수하면서도 쿰쿰한 냄새가 났다.", "불쾌하고 나쁜 냄새라기보다는 발효된 음식에서 나는 고향의 향기 같은 구수한 냄새를 뜻해요."],
      ["크다", "daily", 1, "1. 사물의 부피나 넓이가 보통을 넘어 커다란 상태예요.<br>2. 사람의 키나 신체, 능력이 자라서 훌륭해지는 일이에요.<br>3. 소리나 목소리가 울려 퍼질 때 웅장하고 높은 상태예요.", "1. 여름방학 동안 매일 우유를 마셨더니 키가 훌쩍 커서 작년 옷이 작아졌다.<br>2. 나는 커서 세상을 이롭게 만드는 훌륭한 과학자가 되겠다.<br>3. 도서관에서 친구와 얘기할 때는 소리를 크게 크게 키우면 안 된다.", "몸이 자라는 것뿐만 아니라 꿈과 목소리, 부피가 커질 때 모두 쓰는 기본 동사입니다."],
      ["크기", "daily", 1, "사물의 길이나 넓이, 부피가 어느 정도로 크거나 작은지를 잴 수 있게 나타내는 명사예요.", "미술 시간에 찰흙으로 내 주먹만 한 크기의 예쁜 그릇을 정성껏 빚어 만들었다.", "'크다'라는 동사에서 기원하여 물건의 척도를 재는 수학과 과학에서 가장 중요한 명사가 되었습니다."],
      ["큼직하다", "daily", 1, "물건이나 음식의 크기가 보기에 시원스러울 정도로 꽤 커서 넉넉한 느낌이 드는 모양이에요.", "할머니께서 명절날 아주 큼직하고 먹음직스러운 사과를 깎아 접시에 가득 담아 주셨다.", "'크다'보다 좀 더 구체적으로 탐스럽고 푸짐한 느낌을 줄 때 칭찬의 뜻으로 자주 씁니다."],
      ["큼지막하다", "daily", 2, "큼직하다보다 훨씬 더 커서 눈에 확 띌 정도로 매우 넉넉하고 커다란 모양이에요.", "아빠께서 퇴근길에 내 얼굴보다 더 큼지막한 수박을 한 통 사 오셔서 온 가족이 배불리 먹었다.", "크기의 단계를 '크다 < 큼직하다 < 큼지막하다'로 넓혀가며 글쓰기에 활용해 보세요."],
      ["키", "daily", 2, "1. 사람이나 동물의 정수리까지의 길이를 뜻하는 신장이에요.<br>2. 배의 방향을 조종하는 키(타)나, 곡식의 티끌을 고르는 전통 농기구예요.", "1. 내 키가 훌쩍 자란 것을 기뻐하며 매년 문가에 서서 키를 재어 보았다.<br>2. 우리 모둠의 방향을 잡는 훌륭한 키를 잡는 반장이 되기로 다짐했다.", "신장이라는 뜻 외에도 중요한 방향을 결정하는 장치를 가리키는 유용한 동음이의어예요."],
      ["키질", "action", 3, "곡식에 섞인 검불이나 먼지를 날려 보내기 위해 농기구인 '키'에 담고 위아래로 까부는 일이에요.", "민속촌에서 옛날 농부들이 알곡을 가려내기 위해 땀 흘려 키질을 하는 모습을 직접 체험해 보았다.", "요즘은 보기 힘든 전통 농사 방식이지만 조상들의 지혜로운 노동을 생생하게 보여주는 행동입니다."],
      ["키우다", "action", 1, "1. 동식물을 보살펴 자라게 하는 일이에요.<br>2. 자신의 실력이나 꿈, 기업 등을 훌륭하게 발전시키는 행동이에요.", "1. 집에서 예쁜 화분을 키우면서 매일 물을 주고 말을 걸어주었더니 잎이 푸르게 자랐다.<br>2. 나는 매일 책을 읽고 공부하며 나의 멋진 꿈을 쑥쑥 키워나가고 있다.", "'크다'에 누군가가 그렇게 하도록 돕는다는 사동의 의미가 듬뿍 들어간 책임감 있는 동사랍니다."],
      ["키다리", "daily", 1, "또래 친구들보다 키가 유난히 아주 큰 사람을 정겹거나 장난스럽게 부르는 파생어 명사예요.", "우리 반에서 키가 제일 커서 항상 맨 뒷자리에 앉는 민수의 별명은 우리들의 키다리 아저씨다.", "'키'에 '-다리'가 붙어서 만들어진 말로, 아주 길쭉하고 듬직한 사람을 친근하게 부를 때 써요."],
      ["쾌", "daily", 3, "말린 북어나 조기 스무 마리를 하나로 묶어서 세는 우리나라 고유의 단위 명사예요.", "명절 제사를 지내기 위해 시장에 가신 어머니께서 아주 질 좋은 잘 마른 북어 한 쾌를 사 오셨다.", "조상들의 넉넉한 생활 지혜가 듬뿍 담긴 셈을 나타내는 단위로 국어 시간에 꼭 배우는 단어입니다."],
      ["콜콜하다", "heart", 3, "어떤 일의 내용이 하나하나 아주 잗달고 지나칠 정도로 세세하고 꼼꼼하다는 뜻이에요.", "내 짝꿍은 성격이 몹시 꼼꼼해서 준비물을 챙길 때마다 미주알고주알 콜콜하게 다 확인한다.", "속속들이 파고들거나 아주 구체적이고 치밀한 성격을 칭찬할 때 써보면 아주 유식해 보이는 말입니다."],
      ["콩", "food", 1, "둥글고 단단하며 밥에 넣어 먹거나 두부, 간장의 훌륭한 재료가 되는 단백질이 풍부한 식물 열매예요.", "편식을 고치기 위해 오늘은 급식에 나온 콩밥을 남기지 않고 젓가락으로 꼭꼭 씹어 다 먹었다.", "작고 단단한 것을 상징하여 여러 가지 재미있는 비유와 관용구의 튼튼한 뿌리가 됩니다."],
      ["퀭하다", "nature", 2, "눈알이 쑥 들어가고 눈빛이 생기가 없이 몹시 피곤하거나 아파 보이는 상태예요.", "어젯밤 늦게까지 책을 읽느라 잠을 못 잤더니 아침에 거울을 보니 눈이 퀭하게 쑥 들어가 있었다.", "피곤함이나 허탈함을 얼굴 표정으로 아주 실감 나고 사실적으로 묘사하는 훌륭한 형용사입니다."],
      ["쿵", "action", 1, "1. 크고 무거운 덩치가 바닥에 떨어질 때 나는 둔탁한 소리에요.<br>2. 놀라거나 충격을 받아 가슴이 내려앉는 심리적 상태를 비유해요.", "1. 체육 시간에 매트 위에서 앞구르기를 하다가 균형을 잃고 바닥으로 쿵 떨어졌다.<br>2. 선생님께서 갑자기 시험을 본다고 말씀하시자 내 가슴이 쿵 하고 내려앉았다.", "물리적인 충돌 소리뿐만 아니라 깜짝 놀란 마음을 표현할 때도 아주 훌륭하게 비유합니다."],
      ["쿵쿵", "action", 1, "크고 무거운 발걸음이나 물체가 연달아 둔탁하게 울리며 떨어지는 시끄러운 소리예요.", "아파트 층간 소음을 줄이기 위해 실내에서는 뒤꿈치를 들고 쿵쿵 걷지 않도록 조심해야 한다.", "무겁고 조심성 없는 발걸음을 경계하고 남을 배려할 때 자주 등장하는 생생한 의성어예요."],
      ["쾅", "action", 1, "크고 무거운 물건이 갑자기 바닥에 떨어지거나 아주 단단하게 부딪힐 때 나는 크고 강렬한 소리예요.", "바람이 세게 불어 교실 뒷문이 쾅 하고 닫히는 바람에 조용히 책을 읽던 친구들이 놀랐다.", "아주 큰 충격이나 충돌의 순간을 가장 실감 나고 짧게 표현하는, 글쓰기에서 빠질 수 없는 부사랍니다."],
      ["쾅쾅", "action", 1, "무거운 물건이나 발걸음이 단단한 바닥에 연달아 세게 부딪히며 내는 요란한 소리예요.", "화가 난 지훈이가 쾅쾅 무거운 발소리를 내며 복도를 걸어가서 선생님께 주의를 받았다.", "층간 소음이나 화가 나서 문을 세게 두드리는 거친 행동을 생생하게 묘사하는 소리말이에요."],
      ["콱", "action", 1, "갑자기 힘을 모아 냅다 찌르거나, 길이 꽉 막혀서 도무지 나아갈 수 없는 답답한 모양을 나타내는 부사예요.", "고속도로에 차가 너무 많아 콱 막히는 바람에 목적지에 도착하는 데 엄청난 시간이 걸렸다.", "시야나 생각이 답답하게 막혔을 때, 혹은 남의 약점을 아주 강하게 지적할 때 문장을 맛깔나게 꾸며줍니다."],
      ["콸콸", "nature", 1, "많은 양의 물이나 액체가 한꺼번에 아주 시원하고 기세 좋게 쏟아져 흐르는 맑고 통쾌한 모양이에요.", "가뭄 끝에 단비가 온 뒤, 메말랐던 계곡에서 맑은 물이 콸콸 쏟아져 내리는 것을 보니 내 마음도 시원해졌다.", "아주 경쾌하고 시원한 자연의 물소리로, 6학년 친구들이 일기나 시를 쓸 때 문장을 가슴 뻥 뚫리게 만들어 줍니다."],
      ["쿵더쿵", "action", 2, "방앗간에서 곡식을 찧는 디딜방아나 절구 따위가 바닥에 무겁게 떨어지며 내는 전통적이고 듬직한 소리예요.", "시골 마을 어귀를 지나가는데 방앗간에서 쿵더쿵 고소한 떡을 찧는 경쾌한 소리가 골목에 울려 퍼졌다.", "지금은 보기 힘들어진 전통 농기구의 둔탁하고 규칙적인 리듬감 있는 소리로 정겨운 고향의 향수를 불러일으킵니다."],
      ["쿠당탕", "action", 2, "크고 무거운 물건들이 요란하게 부서지거나 무너지며 한꺼번에 떨어지는 무서운 소리예요.", "지진 대피 훈련 중 실수로 청소함을 건드려 빗자루와 대걸레가 쿠당탕 쏟아져 깜짝 놀랐다.", "여러 개의 물건이 요란스럽게 넘어지는 소리로, 우당탕보다 조금 더 둔탁하고 무거운 느낌을 줍니다."],
      ["쿨쿨", "action", 1, "몹시 피곤하여 아주 깊은 잠이 들어서 크고 규칙적으로 고르게 숨을 쉬거나 기분 좋게 코를 고는 소리예요.", "수련회에서 늦게까지 베개 싸움을 하느라 지친 친구들이 방에 눕자마자 모두가 쿨쿨 깊은 잠에 곯아떨어졌다.", "주변의 시끄러운 소리도 모를 정도로 아주 달콤하고 깊게 숙면을 취하는 사람의 가장 평화로운 모습을 보여줘요."],
      ["콜록콜록", "action", 1, "감기나 먼지 때문에 가슴속 깊은 곳에서 기침이 멈추지 않고 연달아 계속 나오는 아픈 소리예요.", "겨울이 되어 날씨가 추워지자 교실 곳곳에서 콜록콜록 기침 소리가 들려 선생님께서 창문을 닫아 주셨다.", "아픈 사람의 기침 소리를 생생하게 묘사하는 대표적인 소리말로, 듣기만 해도 목이 아플 것 같은 의성어입니다."],
      ["켁켁", "action", 1, "목에 가시나 음식물이 잘못 걸려 숨이 막히는 바람에 고통스럽게 자꾸 내는 짧은 기침 소리예요.", "점심시간에 매운 떡볶이를 허겁지겁 급하게 먹다가 고춧가루가 목에 걸려 한참 동안 켁켁 기침을 하며 물을 마셨다.", "호흡이 곤란해지는 당황스러운 순간이나 사레가 들린 실수를 가장 실감 나고 재미있게 보여주는 소리말입니다."],
      ["킁킁", "action", 1, "어떤 냄새를 꼼꼼히 맡으려고 콧구멍으로 콧김을 자꾸 짧게 내뿜으며 숨을 들이마시는 소리예요.", "엄마가 부엌에서 맛있는 요리를 하시자, 냄새를 맡은 강아지가 꼬리를 흔들며 다가와 코를 대고 킁킁 냄새를 맡았다.", "강아지가 코를 씰룩이는 귀여운 모습이나, 맛있는 냄새의 정체를 찾으려는 아이들의 호기심 어린 행동을 묘사합니다."],
      ["타다", "action", 1, "1. 불에 타서 재가 되거나 형체가 없어지는 물리적인 현상이에요.<br>2. 차나 배, 자전거 등의 탈것에 올라타는 행동이에요.<br>3. 부끄러움이나 계절의 변화 같은 감정이나 영향을 쉽게 느끼는 일이에요.<br>4. 커피나 설탕 가루 등에 물을 섞어서 액체를 만드는 행동이에요.", "1. 장작이 활활 타올라 어느새 하얀 재만 소복하게 남았다.<br>2. 아침에 자전거를 타고 뙤약볕을 달리다 얼굴이 새까맣게 탔다.<br>3. 선생님이 칭찬을 해주시자 쑥스러워서 부끄러움을 몹시 탔다.<br>4. 컵에 따뜻한 코코아 가루를 넣고 뜨거운 물을 부어 맛있게 탔다.", "물리적인 연소부터 탈것 탑승, 심리적 느낌, 음료를 만드는 것까지 무려 4가지 이상의 뜻을 가진 으뜸 다의어입니다."],
      ["타래", "daily", 2, "실이나 노끈 따위를 엉키지 않게 둥글게 묶어 놓은 뭉치를 뜻하는 정겨운 단위 명사예요.", "가정 시간에 뜨개질을 하려고 털실 한 타래를 사서 동그랗게 모양을 잡아 풀기 시작했다.", "가락엿이나 실 뭉치를 세는 단위로도 쓰이는 조상들의 생활 지혜가 담긴 아주 예쁜 우리말입니다."],
      ["타박타박", "action", 1, "다리에 힘이 빠져 몹시 피곤하거나 지친 걸음으로 힘없이 천천히 걷는 소리나 모양이에요.", "체육 시간에 땀을 뻘뻘 흘리며 오래달리기를 끝내고 기운이 쏙 빠져서 타박타박 교실로 걸어왔다.", "씩씩한 '성큼성큼'과 반대로 체력이나 의욕이 바닥난 걸음걸이를 아주 생생하게 보여주는 부사예요."],
      ["탁", "action", 1, "1. 숨이 갑자기 콱 막히거나 통쾌하게 끊어지는 순간의 짧은 소리나 모양이에요.<br>2. 단단한 물건이 서로 세게 부딪힐 때 나는 맑고 짧은 소리예요.", "1. 달리기를 하다가 숨이 탁 막히거나 어려운 수학 문제를 풀고 무릎을 탁 쳤다.<br>2. 탁자에 책을 탁 내려놓으며 조용히 하라고 반장이 소리쳤다.", "막힌 것이 끊어지거나 갑작스러운 깨달음을 얻는 아주 강렬하고 극적인 순간을 묘사할 때 제격입니다."],
      ["탁탁", "action", 1, "마른 장작이 타면서 튀거나, 단단한 바닥이나 물건을 연달아 아주 세게 치는 맑은 소리예요.", "캠핑장에서 모닥불을 피웠더니 마른 장작이 탁탁 소리를 내며 타올라 분위기가 무척 낭만적이었다.", "불똥이 튀는 소리나 옷에 묻은 먼지를 시원하게 털어내는 아주 경쾌한 소리를 표현할 때 쓰기 좋습니다."],
      ["탄탄하다", "action", 2, "1. 물건이나 끈이 팽팽하고 짜임새가 있어 쉽게 끊어지지 않고 튼튼한 상태예요.<br>2. 사람의 실력이나 기초가 아주 굳세고 흔들림 없이 야무진 상태예요.", "1. 두꺼운 노끈으로 상자를 십자 모양으로 탄탄하게 묶어 택배로 부쳤다.<br>2. 초등학교 때 수학의 기초를 탄탄하게 다져 놓으면 중학교에 가서도 쉽게 풀 수 있다.", "'튼튼하다'보다 조금 더 짜임새가 야무지고 내면의 기초나 구조가 훌륭할 때 쓰는 파생 형용사입니다."],
      ["탐탁하다", "heart", 3, "모양이나 태도, 혹은 어떤 일의 결과가 마음에 쏙 들어 아주 흡족하고 만족스럽다는 뜻이에요.", "친구의 퉁명스러운 사과 태도가 영 탐탁하지 않았지만, 이번 한 번만 너그럽게 용서해 주기로 했다.", "보통 긍정보다는 '탐탁하지 않다'나 '탐탁잖다'처럼 부정어와 함께 쓰여 불만을 점잖게 표현할 때 씁니다."],
      ["탓", "heart", 1, "1. 어떤 부정적인 현상이 생겨난 원인이나 까닭을 뜻해요.<br>2. 남을 핑계 삼아 원망하는 이유로 삼는 일이에요.", "1. 시험 성적이 떨어진 것은 평소에 노력하지 않은 내 탓이다.<br>2. 내 실수가 분명한데도 자꾸 남의 탓을 하는 것은 훌륭한 태도가 아니다.", "나쁜 결과를 핑계 댈 때 주로 쓰이며, 좋은 일에는 '덕분'이라는 아름다운 말을 쓰는 것이 올바릅니다."],
      ["탓하다", "action", 2, "잘못된 일이나 안 좋은 결과의 원인을 남이나 억울한 상황의 핑계로 돌려 원망하는 행동이에요.", "내 실수가 분명한데도 인정하지 않고 자꾸 남을 탓하는 것은 6학년 형님답지 못한 부끄러운 태도이다.", "'탓'이라는 명사에 '-하다'가 붙은 파생어로, 스스로 책임감을 강조하고 반성할 때 아주 중요한 동사랍니다."],
      ["태우다", "action", 1, "1. 불에 타서 재가 되게 만들거나 속을 썩이며 애를 태우는 일이에요.<br>2. 사람이나 짐을 차나 배 따위의 탈것에 오르게 하여 목적지로 데려가는 일이에요.", "1. 쓰레기를 함부로 태우면 환경에 나쁘며, 동생이 안 들어와 속을 태웠다.<br>2. 소풍을 갈 때 어린 동생을 내 옆자리에 다정하게 태우고 출발했다.", "물건을 불사르거나 마음을 졸이는 뜻과 남을 탑승시킬 때 모두 쓰이는 다의어입니다."],
      ["탱탱하다", "nature", 2, "피부나 물건 따위가 수분과 탄력이 가득 차서 아주 팽팽하고 생기가 넘치는 건강한 상태예요.", "포도나무에서 갓 딴 젤리처럼 탱탱한 포도알을 한 입 베어 물자 달콤한 과즙이 터졌다.", "과일이 옹골차게 익었거나 탄력이 좋은 물건을 묘사할 때 글의 식감과 생동감을 살려줍니다."],
      ["터", "daily", 1, "1. 집이나 건물을 지었거나 지을 아주 넓은 자리에요.<br>2. 어떤 일이 이루어지는 든든한 바탕이나 유래를 뜻해요.", "1. 우리 학교는 아주 오래전 옛날 선비들이 공부하던 서당이 있던 터에 지어졌다.<br>2. 독서 습관은 평생의 실력을 기르는 아주 훌륭한 배움의 터가 된다.", "삶의 보금자리를 뜻하는 '삶의 터전'처럼 공간적이고 심리적인 튼튼한 바탕을 의미하는 고유어예요."],
      ["터무니", "heart", 2, "어떤 일이나 말이 생기게 된 정당한 까닭이나 우리가 믿을 수 있는 든든한 근거라는 뜻이에요.", "어제 우리 동네에 귀신이 나타났다는 터무니없는 헛소문을 믿고 두려워하는 친구는 없었다.", "주로 '터무니없다'의 형태로 쓰여서 말도 안 되는 거짓말이나 황당한 억지를 따끔하게 꼬집어 줍니다."],
      ["터덜터덜", "action", 1, "다리에 힘이 쑥 빠져서 걸음을 아주 무겁고 힘없이 자꾸 걷는 피곤한 소리나 짠한 모양이에요.", "운동회에서 이어달리기를 꼴찌로 마친 지훈이가 땀을 흘리며 터덜터덜 교실로 걸어 들어왔다.", "기운이 넘치는 '성큼성큼'과 반대로 체력이나 의욕이 바닥나서 위로가 필요한 상황을 생생하게 보여줍니다."],
      ["터뜨리다", "action", 1, "1. 꽉 차 있는 풍선이나 물건을 찢어지게 하거나 터지게 만드는 일이에요.<br>2. 꾹꾹 참았던 울음이나 분노, 웃음 같은 감정을 한꺼번에 밖으로 쏟아내는 행동이에요.", "1. 파티가 끝나고 장식했던 알록달록한 풍선들을 바늘로 찔러 터뜨렸다.<br>2. 우리 반이 우승을 차지하자, 그동안 맘고생했던 친구들이 기쁨의 눈물을 터뜨렸다.", "풍선을 터뜨리는 물리적 행동과 감정의 폭발을 모두 나타내는 훌륭한 파생어입니다."],
      ["터지다", "action", 1, "1. 속에 가득 찬 압력을 이기지 못해 찢어지거나 구멍이 뚫리는 현상이에요.<br>2. 참고 있던 억눌린 감정이나 웃음, 울음이 밖으로 왈칵 쏟아져 나오는 일이에요.", "1. 풍선이 뻥 하고 터지는 소리에 깜짝 놀라서 귀를 막았다.<br>2. 친구의 너무 웃긴 농담에 결국 꾹 참았던 웃음이 빵 터지고 말았다.", "물건이 부서지는 것과 굳게 닫혀 있던 감정이 활짝 열리는 것을 동시에 표현할 수 있는 동사예요."],
      ["턱", "daily", 1, "1. 사람의 얼굴 아래쪽 입이 있는 뼈 부분이에요.<br>2. 어떤 행동을 할 수 있는 만한 까닭이나 타당한 이치를 뜻해요.", "1. 추운 겨울에는 외투 지퍼를 턱 끝까지 꼼꼼히 올려야 감기에 안 걸린다.<br>2. 내가 너를 배신할 턱이 없으니 내 진심을 믿어주렴.", "신체 부위와 이치(까닭)를 동시에 뜻하여 문맥에 따라 아주 다양하게 해석되는 놀라운 동음이의어입니다."],
      ["털", "nature", 1, "사람이나 동물의 피부에서 자라나는 가늘고 긴 실 모양의 부드럽고 따뜻한 털 가닥이에요.", "추운 겨울이 다가오자 우리 집 강아지가 따뜻하게 겨울을 나려고 부드러운 털이 자라났다.", "새의 깃털, 양의 양털처럼 동물의 체온을 따뜻하게 보호해 주는 아주 중요하고 기초적인 순우리말이에요."],
      ["털다", "action", 1, "1. 두드리거나 흔들어서 묻은 먼지나 흙을 떨어내는 시원한 행동이에요.<br>2. 저금통이나 주머니를 뒤져 가진 돈을 남김없이 몽땅 다 꺼내어 쓰는 비유예요.", "1. 체육을 마치고 겉옷에 묻은 흙먼지를 손으로 툭툭 털어내었다.<br>2. 모아둔 돼지저금통을 모두 털어 부모님이 드릴 생신 선물을 샀다.", "방을 청소하는 물리적 행동과 가진 돈을 전부 쓴다는 표현이 모두 가능한 멋진 다의어입니다."],
      ["털썩", "action", 1, "크고 무거운 몸이나 물건이 바닥에 힘없이 갑자기 무너져 내리며 떨어지는 소리나 지친 모양이에요.", "하루 종일 놀이공원을 돌아다녀 다리가 아팠던 나는 집에 오자마자 거실 소파에 털썩 주저앉았다.", "의욕이나 다리 힘이 풀려 털썩 주저앉는 사람의 지친 심리와 행동을 아주 사실적이고 생동감 있게 묘사해요."],
      ["털털하다", "heart", 1, "사람의 성격이나 행동이 예민하거나 까다롭지 않고 아주 수더분하고 소탈한 긍정적인 모양이에요.", "우리 반 반장은 작은 농담에 화내지 않고 매사에 털털하고 너그러워서 인기가 아주 많다.", "남의 시선을 지나치게 신경 쓰지 않고 둥글둥글 편안하게 대하는 6학년의 성숙한 인성을 칭찬할 때 씁니다."],
      ["테", "daily", 2, "그릇이나 안경 따위의 둘레를 둥글게 둘러싼 선이나 아주 얇은 띠를 뜻하는 훌륭한 고유어예요.", "시력이 나빠져서 새로 안경을 맞췄는데 둥글고 까만 뿔테 안경이 내 얼굴형에 잘 어울렸다.", "어떤 사물의 바깥쪽 둘레를 의미하며, '테두리'라는 중요한 파생어의 뼈대가 되는 아주 기본 명사입니다."],
      ["토라지다", "heart", 1, "마음이 상하거나 섭섭해서 기분이 틀어지고 뾰로통하게 삐친 얼굴을 하는 귀여운 행동이에요.", "내가 짝꿍의 새 지우개를 허락 없이 썼다가 짝꿍이 단단히 토라져서 말을 걸지 않았다.", "진짜 크게 분노한 것보다는 섭섭함이 섞인 귀여운 삐침을 나타낼 때 일기장에 쓰기 좋은 동사랍니다."],
      ["토막", "daily", 1, "크고 긴 물건을 썰거나 꺾어서 뚝뚝 나눈 낱낱의 조각이나 짧은 이야기의 한 부분을 뜻해요.", "엄마가 저녁 반찬으로 맛있는 갈치 한 토막을 노릇노릇하게 구워 주셨다.", "생선을 자른 조각뿐만 아니라, 기억나지 않는 짧은 '토막잠'처럼 아주 다양하게 널리 쓰여요."],
      ["토닥토닥", "heart", 1, "어린아이나 슬퍼하는 사람을 달래려고 등을 아주 가볍고 따뜻하게 연달아 두드려주는 사랑스러운 모양이에요.", "시험을 망치고 우울해하는 단짝 친구의 등을 토닥토닥 두드려 주며 다정하게 위로했다.", "위로와 공감의 마음이 듬뿍 담긴 의태어로, 6학년 친구들이 타인에게 배려심을 보여줄 때 가장 따뜻한 행동입니다."],
      ["톨", "daily", 2, "밤이나 쌀, 마늘 같은 곡식의 아주 작고 단단한 낱알을 하나하나 세는 우리나라 고유의 수 단위예요.", "가을 산에서 주운 알밤 한 톨도 길에 버리지 않고 소중하게 주머니에 담아 가져왔다.", "아주 작고 소중한 곡식을 세는 단위로 조상들의 알뜰한 농경 생활을 엿볼 수 있는 정겨운 명사입니다."],
      ["통", "daily", 1, "1. 물건을 담는 속이 빈 둥근 그릇이나 상자를 뜻해요.<br>2. 어떤 일을 도무지 전혀 하지 못하겠다는 강한 부정의 부사예요.", "1. 교실 뒤편에 있는 휴지통에 쓰레기를 깨끗하게 버리고 돌아왔다.<br>2. 휴지통에 쓰레기를 버렸는데도 오늘 배운 어려운 수학 문제는 통 모르겠다.", "물건을 담는 쓰레기통이라는 명사와, '통 모르겠다'라는 부정의 부사로 전혀 다르게 쓰입니다."],
      ["통통", "action", 1, "작은 배가 물 위를 가볍게 나아가거나, 작고 동그란 공이 가볍고 경쾌하게 자꾸 튀는 소리나 모양이에요.", "체육 시간에 새로 산 농구공을 운동장 바닥에 통통 튀기며 슛 연습을 했다.", "무거운 '쿵쿵' 소리와 달리 아주 작고 가벼우며 탄력이 넘치는 물체의 경쾌한 움직임을 그려냅니다."],
      ["통통하다", "nature", 1, "사람의 몸이나 동물의 살이 쪄서 아주 귀엽고 보기 좋을 정도로 포동포동한 상태를 뜻해요.", "어릴 때는 밥을 잘 먹어서 볼살이 통통하게 올랐던 내 동생이 지금은 훌쩍 자랐다.", "뚱뚱해서 미련해 보이는 것이 아니라 건강하고 애교가 넘치는 아주 귀여운 칭찬의 뜻이 담겨 있어요."],
      ["투덕투덕", "action", 2, "사람들이 사소하고 가벼운 일로 사이가 틀어져서 잇따라 가볍게 다투거나 토라지는 소리나 모양이에요.", "쉬는 시간마다 나와 지훈이는 장난감 이야기로 투덕투덕 다투지만 하교할 때는 손을 잡고 간다.", "심각한 싸움이 아니라 친구들 사이의 아주 가볍고 귀여운 말다툼을 묘사할 때 아주 좋습니다."],
      ["투덜투덜", "action", 1, "마음에 들지 않거나 억울해서 남이 알아듣기 힘들게 낮은 목소리로 자꾸 불평하는 모양이에요.", "청소 당번이 아닌데 쓰레기통을 비우라는 지시를 받고 속으로 투덜투덜 불만을 말하며 빗자루를 들었다.", "대놓고 화를 내지는 못하지만 속으로 쌓인 억울함을 작은 입술의 움직임으로 표현하는 의태어입니다."],
      ["투박하다", "daily", 2, "생김새나 모양이 솜씨가 없어 아주 세련되지 못하고 둔하며 거칠고 투박한 상태를 말해요.", "시골 할머니께서 투박한 솜씨로 듬성듬성 썰어 끓여주신 된장찌개는 유명한 식당보다 맛있었다.", "화려한 겉모습은 부족할지 몰라도 그 안에 담긴 깊은 정성을 따뜻하게 문학적으로 묘사할 때 쓰여요."],
      ["투정", "action", 1, "무엇이 모자라거나 마음에 들지 못마땅하여 어린아이처럼 자꾸 떼를 쓰며 조르는 얄미운 행동이에요.", "6학년이나 되었는데도 밥상머리에서 반찬이 맛없다고 엄마에게 떼를 쓰며 투정을 부리는 것은 부끄럽다.", "자신의 감정을 바르게 통제하지 못하고 남에게 억지를 부리는 아주 미성숙한 태도를 따끔하게 지적할 때 씁니다."],
      ["툴툴", "action", 2, "마음에 들지 않아 남에게 들릴 정도로 자꾸 퉁명스럽게 불평을 늘어놓거나 먼지를 가볍게 터는 모양이에요.", "지우개를 주워 달라고 부탁하자 짝꿍이 귀찮은 표정을 지으며 툴툴거리며 주워 주었다.", "입이 대발이나 나와서 상대방을 무안하게 만드는 불친절하고 매끄럽지 못한 퉁명스러운 태도를 꼬집습니다."],
      ["퉁명스럽다", "heart", 2, "묻는 말에 대답하는 말투나 남을 대하는 태도가 다정하지 못하고 무뚝뚝하여 쌀쌀맞은 성격이에요.", "전학 온 친구가 친해지고 싶어 말을 걸었는데 너무 긴장해서 퉁명스럽게 대답하고 말았다.", "속마음은 그렇지 않은데 겉으로 나가는 말이 거칠어서 오해를 사기 쉬우니 부드럽게 고쳐야 할 말투입니다."],
      ["퉁퉁", "action", 1, "크고 무거운 물건이 바닥에 부딪히는 소리거나, 살이나 얼굴이 병이 나서 심하게 부어오른 안타까운 모양이에요.", "슬픈 영화를 보고 밤새 울고 잤더니 아침에 일어났을 때 두 눈이 붕어처럼 퉁퉁 부어 있었다.", "가벼운 '통통'과는 달리 심하게 물이나 눈물에 불어서 거대하게 부풀어 오른 상태를 생생하게 묘사해요."],
      ["퉁퉁하다", "nature", 1, "살이 몹시 쪄서 통통한 것을 넘어서 몸집이 아주 크고 미련해 보일 정도로 부어 있는 뚱뚱한 상태예요.", "겨울 방학 내내 방에서 간식만 먹었더니 배가 퉁퉁하게 살이 쪄서 바지가 맞지 않았다.", "'통통하다'가 귀여운 애교라면, '퉁퉁하다'는 비만에 가까워 건강을 조심해야 할 상태를 경계하는 말입니다."],
      ["툭", "action", 1, "불쑥 앞으로 튀어나오거나, 굵은 끈이나 줄 따위가 갑자기 힘을 받아 끊어지는 아주 짧고 놀라운 모양이에요.", "길을 걷다가 생각 없이 바닥에 있는 돌멩이를 툭 찼는데 남의 자동차 타이어에 맞았다.", "의도하지 않고 무심코 튀어나오는 말인 '툭 던지다'처럼 아무 생각 없이 벌어지는 상황을 표현해요."],
      ["툭툭", "action", 1, "무심코 가볍고 연달아 던지거나 치는 모양으로, 남의 몸을 잇따라 가볍게 찌르거나 치는 행동이에요.", "수업 시간에 지훈이가 장난을 치려고 뒤에서 자꾸 연필로 내 등을 툭툭 찔러서 짜증이 났다.", "먼지를 가볍게 털어내는 경쾌한 소리이기도 하지만, 남을 귀찮게 건드리는 얄미운 장난을 묘사할 때도 씁니다."],
      ["튀기다", "food", 1, "끓는 기름에 반죽을 넣어 익혀 내거나, 손가락 끝을 굽혔다가 힘을 주어 퉁기며 펴는 행동이에요.", "엄마가 바삭바삭하게 튀겨주신 치킨을 먹으며 손가락으로 윷놀이 말을 튕기며 신나게 놀았다.", "맛있는 요리 방법인 튀김의 어원이 되는 동사이자, 고무줄을 퉁겨 날려버리는 물리적인 탄력을 나타냅니다."],
      ["튀다", "action", 1, "공처럼 탄력 있는 물건이 위로 솟구쳐 오르거나, 무리 속에서 남들과 달라 눈에 아주 확 띄는 상태예요.", "우리 반 민수는 체육 시간에 공이 어디로 튈지 모르는 순발력을 가졌고 톡톡 튀는 매력이 있다.", "공이 튀어 오르는 모습과 사람의 개성이 아주 강렬하고 독특한 것을 칭찬할 때 모두 훌륭하게 씁니다."],
      ["토닥이다", "action", 1, "마음이 상하거나 슬퍼하는 사람을 위로하기 위해 등을 부드럽게 가볍고 따뜻하게 두드려 주는 행동이에요.", "속상해서 눈물을 흘리는 친구의 어깨를 토닥이며 위로해 주었다.", "상처받은 마음을 따뜻한 손길로 감싸 안아 주는 다정한 행동을 뜻하는 아름다운 순우리말입니다."],
      ["티나다", "action", 1, "숨기려 하거나 애쓴 모양이 겉으로 분명하게 드러나는 상태예요.", "새로 산 옷을 입고 왔더니 친구가 금방 티가 난다며 예쁘다고 칭찬해 주었다.", "어떤 변화나 감정이 숨겨지지 않고 자연스럽게 겉으로 드러날 때 자주 쓰입니다."],
      ["투명하다", "nature", 1, "빛이 잘 통하여 속이 환하게 들여다보일 만큼 맑고 깨끗한 상태예요.", "가을 하늘이 워낙 맑고 투명해서 멀리 있는 산까지 아주 잘 보였다.", "유리처럼 맑은 성질을 뜻할 뿐만 아니라 거짓 없는 솔직한 마음을 비유할 때도 쓰입니다."],
      ["틀다", "action", 1, "1. 나사나 수도꼭지, 손잡이를 꼬아서 돌리는 물리적인 행동이에요.<br>2. 몸이나 생각의 방향을 다른 쪽으로 완전히 돌려 바꾸는 일이에요.<br>3. 라디오나 티브이 같은 전자기기의 전원을 켜서 작동시키는 일이에요.", "1. 수도꼭지를 꽉 틀어막아 물을 절약하고 양치를 했다.<br>2. 학교로 가는 길을 빙 돌아서 반대 방향으로 틀어 새로운 골목길을 갔다.<br>3. 집에 오자마자 좋아하는 음악을 들으려고 오디오를 신나게 틀었다.", "수도꼭지를 돌리는 행동부터 방향 전환, 전원 켜기까지 다양한 뜻을 가진 훌륭한 동사입니다."],
      ["틈", "time", 1, "1. 두 물체 사이에 벌어진 좁은 틈새나 공간이에요.<br>2. 어떤 일을 하는 사이에 생기는 아주 짧은 시간의 여유나 짬이에요.", "1. 책상과 벽 사이의 아주 좁은 틈으로 지우개가 굴러 들어가버렸다.<br>2. 숙제가 너무 많았지만 쉬는 시간이 나는 틈을 타서 간신히 다 끝냈다.", "물리적인 균열을 뜻하기도 하지만 바쁜 일상 속에서 잠깐의 여유를 뜻하는 시간 명사로 아주 소중해요."],
      ["티", "daily", 1, "1. 먼지처럼 아주 작고 가벼운 티끌이나 부스러기예요.<br>2. 훌륭한 사람이나 사물에 생긴 아주 작고 사소한 흠집이나 결점을 비유해요.", "1. 바람이 불자 먼지와 티끌이 날려 눈에 작은 티가 들어가 비볐다.<br>2. 반장은 얼굴도 잘생기고 성격도 좋지만 가끔 덜렁대는 게 유일한 옥의 티다.", "'티끌 모아 태산'이라는 속담에 등장하는 먼지라는 뜻으로 사람의 작은 단점을 너그럽게 포용할 때 써요."],
      ["티격태격", "action", 1, "서로의 생각이나 의견이 맞지 않아 큰 싸움은 아니지만 가볍게 자꾸 말다툼을 벌이며 다투는 귀여운 모양이에요.", "쉬는 시간마다 나와 지훈이는 좋아하는 연예인 이야기로 티격태격 말다툼을 하지만 하교할 때는 어깨동무를 한다.", "심각한 폭력이 아니라 친한 단짝 친구들 사이에서 벌어지는 정겹고 애정 어린 말다툼을 뜻합니다."],
      ["튼튼하다", "nature", 1, "1. 사람의 몸이 잔병치레 없이 아주 건강한 상태예요.<br>2. 만들어진 물건이나 구조가 헐거나 쉽게 부서지지 않고 아주 견고한 상태예요.", "1. 매일 아침 밥을 든든하게 먹고 운동을 열심히 했더니 감기 안 걸리고 튼튼하게 잘 보냈다.<br>2. 이번에 새로 지은 학교 강당 건물은 지진이 와도 끄떡없을 만큼 아주 튼튼하다.", "우리 몸의 면역력이 훌륭한 건강한 상태와 건물이 흔들리지 않는 굳건함을 모두 뜻하는 필수 형용사입니다."],
      ["파다", "action", 1, "1. 땅이나 구덩이를 옴폭하게 파내어 공간을 만드는 물리적인 행동이에요.<br>2. 뾰족한 도구로 단단한 물건에 글씨나 도장을 새기는 일이에요.<br>3. 보이지 않는 숨겨진 진실이나 비밀을 끈질기게 알아내는 것을 비유해요.", "1. 할머니와 텃밭에서 호미로 흙을 파고 통통한 고구마를 캐내었다.<br>2. 미술 시간에 고무판을 도구로 파내어 내 이름이 적힌 판화 도장을 만들었다.<br>3. 명탐정은 꽁꽁 숨겨진 사건의 비밀을 끝까지 파헤쳐 진실을 밝혀내었다.", "흙을 파내는 물리적 행동뿐만 아니라 진실을 파헤치는 비유적 표현까지 아주 유용하게 쓰입니다."],
      ["파랗다", "nature", 1, "맑은 가을 하늘이나 깊은 바다처럼 아주 밝고 짙은 푸른빛을 띠는 색깔이에요.", "구름 한 점 없이 파란 하늘을 보니 내 마음까지 시원하고 상쾌하게 뻥 뚫리는 기분이었다.", "무서워서 얼굴이 창백해질 때도 '겁에 질려 입술이 파랗게 질리다'라고 생생하게 표현합니다."],
      ["파르스름하다", "nature", 2, "완전한 파란색은 아니지만 엷게 파란빛이 은은하게 감도는 아주 예쁜 색깔이에요.", "새벽 일찍 일어나 창밖을 보니 동이 트기 직전의 파르스름한 하늘이 신비롭게 빛나고 있었다.", "보통 '파랗다'보다 훨씬 감성적이고 부드러운 색감을 묘사할 때 글을 아름답게 꾸며줍니다."],
      ["파릇파릇", "nature", 1, "봄날에 새싹이나 풀잎이 여기저기에서 파랗게 막 돋아나는 아주 싱그러운 모양이에요.", "봄비가 내리고 나니 화단에 묻어두었던 씨앗에서 파릇파릇 새싹이 돋아나 생기가 넘쳤다.", "생명이 막 피어나는 새봄의 상쾌한 풍경을 묘사할 때 가장 잘 어울리는 의태어 부사랍니다."],
      ["팍", "action", 1, "1. 갑자기 세게 찌르거나 치는 모양이나 소리예요.<br>2. 안 나던 냄새가 아주 강하게 코를 찌르는 모양을 뜻해요.", "1. 답답한 마음에 주먹으로 책상을 팍 치며 억울함을 호소했다.<br>2. 오래된 서랍을 열자 곰팡이 냄새가 코를 팍 찔러서 인상을 찌푸렸다.", "동작이나 냄새가 아주 순식간에 강하게 느껴질 때 짧고 굵게 쓰여 생동감을 더해줍니다."],
      ["팍팍하다", "food", 2, "1. 음식에 물기나 끈기가 없어 퍽퍽하여 삼키기 힘든 상태예요.<br>2. 사람의 생활이 여유가 전혀 없고 몹시 고단하고 각박한 상태를 비유해요.", "1. 삶은 고구마를 물 없이 먹었더니 목이 팍팍하게 메어 얼른 물을 마셨다.<br>2. 요즘은 숙제와 학원이 너무 많아 내 하루하루의 삶이 팍팍하게 느껴진다.", "음식의 식감뿐만 아니라 여유 없이 바쁘게 살아가는 심리적 고단함을 묘사하는 멋진 다의어입니다."],
      ["팔", "daily", 1, "사람의 어깨에서 손목까지 이어지는 신체의 양쪽 가지 부분을 뜻하는 아주 짧고 중요한 명사예요.", "체육 시간에 오래 매달리기를 했더니 팔 근육이 몹시 뻐근하고 후들거려서 젓가락질하기 힘들었다.", "신체 부위를 나타낼 뿐만 아니라 '팔이 안으로 굽다'처럼 자기와 친한 사람을 챙기는 속담에도 등장해요."],
      ["팔다", "action", 1, "1. 돈을 받고 물건의 소유권을 남에게 넘기는 경제적인 행동이에요.<br>2. 마땅히 보아야 할 곳을 안 보고 딴전이나 다른 곳에 정신을 쏟는 것을 비유해요.", "1. 벼룩시장에서 작년에 안 쓰는 장난감들을 깨끗이 닦아 팔았다.<br>2. 수업 시간에 선생님 말씀을 안 듣고 한눈을 팔다가 그만 지적을 받았다.", "물건을 판매한다는 뜻 외에 '한눈을 팔다', '정신을 팔다'처럼 시선을 다른 곳에 빼앗길 때도 유용해요."],
      ["팔딱팔딱", "action", 1, "살아있는 물고기가 아주 힘차게 뛰거나, 긴장하여 심장이 빠르고 거세게 뛰는 역동적인 모양이에요.", "아빠와 낚시로 잡은 물고기가 양동이 안에서 팔딱팔딱 뛰는 것을 보니 심장도 같이 뛰었다.", "'콩닥콩닥'보다 훨씬 더 힘이 넘치고 거칠게 움직이는 생명력과 긴장감을 묘사할 때 씁니다."],
      ["팔랑팔랑", "action", 1, "나비나 얇은 종이 따위가 가벼운 바람에 아주 부드럽고 가볍게 잇달아 날리거나 흔들리는 모양이에요.", "봄바람이 불자 나무에서 떨어진 벚꽃 잎들이 내 머리 위로 팔랑팔랑 춤을 추며 예쁘게 떨어졌다.", "아주 가볍고 얇은 물체가 경쾌하게 흔들리는 아름다운 모습을 시각적으로 그려내는 소리말입니다."],
      ["팥", "food", 1, "여름엔 빙수에, 겨울엔 동지 팥죽에 들어가는 아주 붉은색을 띠는 둥글고 단단한 맛있는 곡식이에요.", "동짓날 할머니께서 귀신을 쫓아준다며 달콤하고 따뜻한 붉은 팥죽을 끓여 주셔서 두 그릇이나 먹었다.", "'콩 심은 데 콩 나고 팥 심은 데 팥 난다'는 속담처럼 결과는 원인에 따라 결정된다는 교훈을 줍니다."],
      ["패", "daily", 2, "1. 노름이나 놀이에서 승부를 가리기 위해 쓰는 여러 장의 딱지나 카드 한 벌이에요.<br>2. 같이 어울려 다니는 사람들의 작은 무리나 떼를 지어 묶어 부르는 고유어예요.", "1. 명절에 친척들과 모여 앉아 윷놀이를 하며 윷패를 나누어 가졌다.<br>2. 점심시간이 되자 우리 반 남학생들은 두 패로 나뉘어 운동장에서 축구 시합을 했다.", "놀이 도구의 종류를 뜻하기도 하고, 무리 지어 다니는 사람들을 속되게 이를 때도 씁니다."],
      ["패다", "action", 2, "1. 도끼나 몽둥이로 장작을 세게 내리쳐서 쪼개는 일이에요.<br>2. 벼나 보리 따위의 곡식에서 이삭이 막 나오는 자연 현상을 뜻해요.", "1. 옛날 머슴은 추운 겨울을 나기 위해 도끼로 굵은 장작을 단단히 팼다.<br>2. 가을 들판에는 농부의 땀을 먹고 자란 벼가 황금빛으로 탐스럽게 팼다.", "물건을 세게 치는 거친 행동과 곡식이 자라나는 아주 평화로운 자연 현상을 모두 가진 훌륭한 다의어예요."],
      ["팽그르르", "action", 1, "작고 가벼운 물체가 아주 빠르고 가볍게 한 바퀴 휙 도는 날렵한 모양이에요.", "복도를 뛰어가다가 미끄러운 바닥에 발을 헛디뎌 몸이 팽그르르 돌면서 엉덩방아를 찧을 뻔했다.", "갑자기 고개를 휙 돌리거나 어지러워서 눈앞이 빙글 도는 모습을 실감 나고 재미있게 보여줍니다."],
      ["팽이", "daily", 1, "나무를 깎아 끝에 쇠구슬을 박고 채로 치거나 끈으로 감아 돌리며 노는 둥근 전통 장난감이에요.", "겨울방학 때 할아버지와 꽁꽁 언 얼음판 위에서 끈으로 팽이를 치며 누가 오래 돌리나 내기를 했다.", "빙글빙글 도는 모습 때문에 '머리가 팽이처럼 돈다'라고 바쁘거나 어지러운 상황을 빗대어 말하기도 해요."],
      ["팽팽하다", "action", 2, "1. 당겨진 줄이나 끈이 아주 곧고 팽팽하게 당겨져 있는 물리적인 상태예요.<br>2. 두 사람의 힘이나 실력이 우열을 가릴 수 없이 엇비슷하여 팽팽하게 맞서는 상태예요.", "1. 줄다리기 결승전에서 두 팀의 힘이 너무 팽팽해서 밧줄이 끊어질 듯 팽팽하게 굳었다.<br>2. 전교 회장 선거에서 두 후보의 지지율이 끝까지 아주 팽팽하게 맞서 긴장감이 넘쳤다.", "줄이 당겨진 물리적인 힘과, 승부를 예상할 수 없는 막상막하의 심리적 긴장감을 모두 표현합니다."],
      ["퍼뜩", "action", 2, "어떤 생각이나 기억이 아주 갑자기 머릿속에 번쩍하고 떠오르거나 순간적으로 재빨리 움직이는 모양이에요.", "도무지 안 풀리던 어려운 수학 문제를 보며 고민하던 중, 갑자기 선생님의 공식이 퍼뜩 떠올랐다.", "'문득'보다 훨씬 순간적이고 섬광처럼 번쩍 깨달음을 얻는 놀라운 순간을 묘사하는 맛깔난 부사예요."],
      ["퍼지다", "action", 1, "1. 소문이 널리 알려지거나 냄새, 열기가 넓은 공간으로 흩어지며 번져 나가는 일이에요.<br>2. 액체나 반죽 등이 좁지 않고 넓게 바닥으로 번져 흩어지는 모양이에요.", "1. 내가 계주 역전승을 거두었다는 자랑스러운 소문이 전교생에게 순식간에 쫙 퍼졌다.<br>2. 냄비에 부어둔 핫케이크 반죽이 동그랗게 열을 받아 사방으로 넓게 퍼져 나갔다.", "소문이나 냄새가 번지는 것뿐만 아니라 액체가 퍼지는 물리적 현상까지 두루 쓰입니다."],
      ["퍼렇다", "nature", 1, "파랗다보다 색깔이 조금 더 어둡고 무겁고 짙은 푸른빛을 띠는 서늘한 느낌의 형용사예요.", "계단에서 넘어져 무릎을 다쳤는데 다음 날 멍이 시퍼렇게 들어서 걸을 때마다 아팠다.", "멍이 든 피부나 깊고 차가운 바다의 색을 묘사할 때 '파랗다'보다 훨씬 무겁고 강렬한 느낌을 줍니다."],
      ["퍽", "action", 1, "1. 생각했던 것보다 그 정도가 꽤 훌륭하게 많거나 알맞다는 뜻의 부사예요.<br>2. 아주 무거운 물건을 갑자기 세게 치거나 부딪힐 때 나는 둔탁한 소리말이에요.", "1. 오늘 급식으로 나온 스파게티는 내 입맛에 퍽 잘 맞아서 남기지 않고 다 먹었다.<br>2. 운동장에서 축구를 하다가 친구가 내 어깨를 퍽 치고 장난을 쳐서 깜짝 놀랐다.", "정도가 아주 심하다는 부사적 쓰임과 단단하게 부딪히는 소리말이 합쳐진 활용도 으뜸 단어입니다."],
      ["펄럭펄럭", "action", 1, "크고 넓은 천이나 깃발 따위가 강한 바람에 아주 세차게 연달아 흔들리며 나부끼는 씩씩한 모양이에요.", "운동회 아침, 맑은 가을 하늘 높이 매달린 만국기가 시원한 바람을 타고 펄럭펄럭 춤을 췄다.", "'팔랑팔랑'보다 훨씬 크고 거친 물건이 역동적으로 바람에 흔들리는 웅장하고 힘찬 모습을 그려냅니다."],
      ["펄펄", "nature", 1, "1. 눈이 바람에 날려 크고 가볍게 흩날리는 모양이에요.<br>2. 물이 아주 뜨겁게 마구 끓어오르거나 열이 심하게 나는 모양이에요.<br>3. 사람의 기운이나 에너지가 넘쳐서 활기찬 모양을 뜻해요.", "1. 한겨울 하늘에서 함박눈이 펄펄 내렸고 감기에 걸린 동생은 이마가 펄펄 끓었다.<br>2. 방학을 맞이하여 우리 모둠 친구들은 아침부터 기운이 펄펄 넘쳐서 뛰어놀았다.", "눈이 내리는 모습, 펄펄 끓는 물, 기운이 넘치는 상태까지 다양하게 쓰이는 멋진 부사입니다."],
      ["펑", "action", 1, "풍선이나 폭탄 따위가 속에 갇힌 공기를 터뜨리며 갑자기 아주 크게 울리는 폭발 소리예요.", "생일 파티를 준비하며 풍선을 불다가 그만 바늘에 찔려 펑 하고 터지는 바람에 깜짝 놀랐다.", "막혔던 가슴이 시원하게 뚫릴 때 '가슴이 펑 뚫리다'라고 답답함이 해소되는 통쾌함을 비유하기도 해요."],
      ["펑펑", "action", 1, "1. 크고 굵은 눈이 아주 탐스럽고 많이 쏟아지는 모양이에요.<br>2. 참았던 눈물이 한꺼번에 걷잡을 수 없이 쏟아지는 모양을 뜻해요.", "1. 겨울 산 정상에 올랐더니 함박눈이 펑펑 쏟아져 내려 온통 하얗게 변했다.<br>2. 운동회에서 우리 반이 아쉽게 져서 릴레이 마지막 주자였던 반장이 눈물을 흘렸다.", "눈이나 눈물처럼 속에 갇혀 있던 액체나 자연물이 아낌없이 마구 쏟아지는 감성적인 부사예요."],
      ["펴다", "action", 1, "1. 굽거나 접힌 것을 곧게 바르게 펴거나 책이나 지도 등을 열어보는 행동이에요.<br>2. 구김살을 없애고 얼굴 표정을 밝게 하거나 억눌렸던 재능을 마음껏 발휘하는 일이에요.", "1. 수업 종이 울리자 국어사전을 활짝 펴고 오늘 배울 단어를 찾았다.<br>2. 어깨를 곧게 펴고 당당한 자세로 발표를 시작하자 자신감이 생겼다.", "주름을 펴는 물리적 행동과, '뜻을 펴다', '기를 펴다'처럼 재능을 되찾는 훌륭한 동사예요."],
      ["포개다", "daily", 1, "물건 따위를 차곡차곡 위로 겹쳐서 가지런히 쌓아 올려 정리하는 아주 정돈된 일상 행동이에요.", "미술 시간이 끝난 뒤, 친구들이 사용한 스케치북을 번호순으로 예쁘게 포개어 교탁 위에 올려두었다.", "흩어진 것을 단정하게 겹쳐서 모아두는 6학년 친구들의 꼼꼼하고 깔끔한 정리 정돈 습관을 나타냅니다."],
      ["포근하다", "heart", 1, "1. 날씨가 겨울치고는 바람이 없고 따뜻하고 부드러운 상태예요.<br>2. 사람의 마음씨가 아주 너그럽고 정이 많거나 안긴 느낌이 몹시 편안한 상태예요.", "1. 바람이 불어 추웠지만 엄마가 감아 주신 목도리가 너무 포근해서 마음까지 녹았다.<br>2. 오랜만에 만난 할머니의 따뜻한 품에 안기니 세상에서 가장 포근하고 안전했다.", "물리적인 따뜻함뿐만 아니라 마음씨가 아주 너그럽고 정이 많은 사람을 칭찬할 때도 씁니다."],
      ["포동포동", "daily", 1, "아이의 얼굴이나 살이 아주 귀엽게 찌고 올라서 보기 좋을 정도로 통통하고 예쁜 모양이에요.", "오랜만에 만난 갓난아기 사촌 동생의 포동포동한 볼을 손가락으로 찔러보니 부드러웠다.", "어른의 비만이 아니라 젖살이 올라 아주 사랑스럽고 건강한 어린아이의 귀여운 뺨을 칭찬할 때 써요."],
      ["폭", "action", 1, "엄마의 품처럼 따뜻하고 부드러운 곳에 아주 푹 파묻혀 아늑하게 안기거나 가려지는 모양을 뜻하는 부사예요.", "천둥소리에 깜짝 놀란 강아지가 꼬리를 내리고 내 품 안으로 폭 안겨서 등을 쓰다듬어 주었다.", "가슴속 깊이 아주 포근하고 편안하게 안기는 모양을 나타내며 글에 따뜻함과 애정을 듬뿍 불어넣어 줍니다."],
      ["폴짝폴짝", "action", 1, "발을 모으고 가볍게 솟구쳐 위로 연달아 자꾸 뛰는 개구리나 아이들의 아주 귀엽고 경쾌한 모양이에요.", "수학 시험에서 백 점을 맞은 지훈이가 너무 기뻐서 복도를 폴짝폴짝 뛰어가다 주의를 받았다.", "'펄쩍펄쩍'보다 체구가 작고 귀여운 동물이나 아이들이 기분이 날아갈 듯 기뻐서 가볍게 뛰는 소리말이에요."],
      ["퐁당퐁당", "action", 1, "작고 가벼운 돌 따위가 맑은 물에 연달아 떨어지며 기분 좋고 맑게 울려 퍼지는 귀여운 소리예요.", "시냇가에 앉아 동요를 흥얼거리며 맑은 물속으로 작은 조약돌을 퐁당퐁당 던졌다.", "크고 무거운 '풍덩'과 달리, 아주 작고 경쾌한 돌이 물에 빠지는 맑은 소리를 내어 동요로도 유명하죠."],
      ["푸다", "action", 1, "물이나 국, 밥처럼 액체나 가루로 된 것을 바가지나 숟가락 같은 도구로 떠서 밖으로 덜어내는 일이에요.", "할머니 댁 마당의 깊은 우물에서 시원하고 맑은 물을 바가지로 가득 푸고 나니 땀이 식었다.", "그릇에 음식을 담기 위해 국자로 '국을 푸다'처럼 매일 먹는 식사 시간에 아주 자주 쓰는 식생활 으뜸 동사랍니다."],
      ["푸드덕", "action", 1, "크고 날랜 새가 놀라서 갑자기 날개를 크고 힘차게 치며 날아오르거나 거칠게 홰를 치는 요란한 소리예요.", "산길을 조용히 걷고 있는데 덤불 속에서 꿩 한 마리가 푸드덕 소리를 내며 날아올라 깜짝 놀랐다.", "정적인 분위기를 깨고 새가 아주 거세고 놀라게 날아오르는 생동감 넘치는 역동적인 순간을 묘사합니다."],
      ["푸르다", "nature", 1, "구름 한 점 없는 맑은 가을 하늘이나 넓고 깊은 바다처럼 아주 맑고 선명하게 파란빛을 띠는 상태예요.", "운동회 날 아침, 맑고 푸른 하늘 높이 우리들의 꿈과 희망을 실은 오색 풍선들이 날아올랐다.", "색깔을 뜻할 뿐만 아니라 청춘이나 희망처럼 '푸른 꿈을 안고'라고 긍정적이고 벅찬 미래를 은유할 때 최고입니다."],
      ["푸릇푸릇", "nature", 1, "이른 봄에 돋아나는 새싹이나 나뭇잎 따위가 곳곳에서 파릇하게 생기를 띠며 돋아나는 아주 싱싱한 모양이에요.", "추운 겨울이 지나고 따뜻한 봄바람이 불자 학교 화단 나뭇가지마다 새싹이 푸릇푸릇 돋아났다.", "생명이 막 기지개를 켜는 새봄의 가장 싱그럽고 활기찬 에너지를 문학적으로 보여주는 예쁜 의태어입니다."],
      ["푸석푸석", "food", 2, "1. 음식에 물기나 끈기가 전혀 없어 퍽퍽하고 거칠게 바스라지는 상태예요.<br>2. 사람의 얼굴이나 피부가 잠을 못 자서 생기 없이 붓고 까칠한 상태예요.", "1. 며칠 동안 상온에 방치된 오래된 빵을 먹었더니 식감이 푸석푸석해서 목이 메었다.<br>2. 어젯밤 늦게까지 게임을 하느라 잠을 설쳤더니 아침에 거울을 보니 얼굴이 푸석푸석했다.", "물기가 말라 바스라지는 음식의 퍽퍽한 질감과 피곤에 지친 사람의 피부 상태를 모두 나타냅니다."],
      ["푸짐하다", "food", 1, "음식이나 물건의 양이 모자람 없이 아주 넉넉하고 흐뭇할 정도로 많아서 마음이 아주 넉넉하다는 뜻이에요.", "외할머니 댁에 가니 할머니께서 우리를 위해 잡채와 갈비찜을 상다리가 부러지도록 푸짐하게 차려 놓으셨다.", "'풍성(豊盛)하다'라는 한자어를 완벽하게 대신하여 우리 고유의 넉넉한 인심과 사랑을 정겹게 보여주는 형용사입니다."],
      ["푹", "action", 1, "1. 찌개나 고기 따위가 아주 무르고 부드럽게 잘 익는 모양이에요.<br>2. 잠을 방해받지 않고 아주 깊고 달콤하게 자는 상태를 뜻해요.<br>3. 가늘고 날카로운 것에 아주 깊이 찔리거나 깊게 빠지는 모양이에요.", "1. 엄마가 오랜 시간 푹 끓여주신 닭백숙은 고기가 아주 연하고 국물이 진했다.<br>2. 주말 내내 쌓였던 피로를 풀기 위해 거실에서 낮잠을 푹 자고 일어났다.<br>3. 진흙탕 길을 걷다가 실수로 발을 푹 디뎌서 운동화가 진흙으로 더러워졌다.", "무르게 익는 요리 상태, 깊은 숙면, 깊이 빠지는 물리적 현상까지 폭넓게 쓰이는 다의어입니다."],
      ["푹신하다", "daily", 1, "매트리스나 소파 따위가 앉거나 누웠을 때 딱딱하지 않고 아주 보드랍게 쑥 들어가는 편안하고 아늑한 느낌이에요.", "체험학습을 다녀와서 다리가 아팠는데, 거실의 푹신한 소파에 몸을 기대니 피로가 싹 가셨다.", "무겁고 딱딱한 것과 반대로 우리 몸을 편안하고 기분 좋게 감싸주는 부드러운 쿠션이나 눈밭의 촉감을 나타낼 때 써요."],
      ["풀", "nature", 1, "1. 나무가 아닌 줄기가 부드러운 풀과 식물을 통틀어 이르는 말이에요.<br>2. 종이나 천을 단단히 붙이기 위해 밀가루나 쌀가루를 쑤어서 만든 접착제예요.<br>3. 사람의 꺾인 기운이나 의욕이 기가 죽어 약해진 상태를 비유해요.", "1. 들판에 돋아난 파란 풀을 뽑다가 종이에 베어 풀로 밴드를 붙였다.<br>2. 옛날 사람들은 한옥 문을 바를 때 쑤어둔 밀가루 풀을 붓으로 칠해 붙였다.<br>3. 시험을 망치고 속이 상해 친구의 놀림에 몹시 기가 죽어 풀이 죽고 말았다.", "식물, 접착제, 기운이라는 전혀 다른 3가지 뜻을 문맥에 따라 구별해 쓰는 국어의 대표적인 동음이의어입니다."],
      ["풀다", "action", 1, "1. 단단히 묶이거나 꼬인 매듭을 끄르는 일이에요.<br>2. 복잡하고 어려운 문제나 사건의 답을 알아내거나 해결하는 일이에요.<br>3. 콧물이나 쌓인 피로, 억울한 오해를 시원하게 해소하는 일이에요.", "1. 운동화를 신으려고 꽉 묶였던 신발 끈을 천천히 풀었다.<br>2. 도무지 안 풀리던 어려운 수학 문제의 정답을 스스로 마침내 찾아내었다.<br>3. 훌쩍이는 코를 시원하게 풀고 쌓였던 피로와 긴장을 말끔히 풀었다.", "하나의 단어로 매듭, 문제, 콧물, 피로, 화 등 수많은 것을 해결하고 시원하게 해소하는 해결사의 역할을 하는 위대한 동사예요."],
      ["품", "heart", 1, "1. 어머니가 두 팔을 벌려 안을 때의 따뜻한 가슴 공간이나 그 안이에요.<br>2. 어떤 일을 해내는 데 드는 육체적인 힘이나 고생스러운 수고로운 노동을 뜻해요.", "1. 천둥소리에 무서워하는 동생을 따뜻한 품에 꽉 안아 주며 다정하게 달래주었다.<br>2. 오늘 학교 화단 청소는 생각보다 손이 많이 가고 품이 아주 많이 드는 고된 일이었다.", "사람의 가장 따뜻하고 안전한 가슴과 일하는 노동력을 동시에 뜻하여 인간의 사랑과 땀방울을 상징합니다."],
      ["품다", "action", 1, "1. 소중한 것을 가슴에 꼭 껴안거나 새가 알을 품어 까는 자연의 섭리에요.<br>2. 훌륭한 마음이나 장래 희망, 원대한 꿈을 마음속에 깊이 간직하는 일이에요.", "1. 암탉이 병아리를 까기 위해 정성껏 알을 품듯이 따뜻하게 보호했다.<br>2. 나는 커서 세상을 이롭게 만드는 훌륭한 과학자가 되겠다는 멋진 꿈을 품었다.", "생명을 탄생시키는 위대한 자연의 섭리뿐만 아니라 우리 학생들이 원대한 장래 희망을 가질 때 쓰는 멋진 말이에요."],
      ["품앗이", "daily", 2, "옛날 농촌에서 힘든 농사일을 서로 거들어 주며 힘을 보태고 그 은혜를 다시 땀방울로 갚아 주는 상부상조의 전통적인 협동 일이에요.", "가을 추수 때 우리 조상들은 품앗이를 통해 이웃의 일을 내 일처럼 돕고 정을 나누었다.", "서양에는 없는 우리 민족만의 아주 아름다운 협동 정신과 배려를 상징하는 낱말로 도덕 시간에 꼭 배우는 자랑스러운 단어랍니다."],
      ["풋내기", "daily", 2, "어떤 일에 아직 경험이 턱없이 부족하여 일 처리가 서투르고 아주 어설픈 초보자나 어린 사람을 조금 낮추어 귀엽게 부르는 말이에요.", "비록 지금은 바느질이 서투른 풋내기지만 포기하지 않고 매일 연습해서 멋진 인형을 완성하겠다.", "'풋(덜 익은)'이라는 접두사가 붙어 만들어진 파생어로, 누구나 처음엔 풋내기로 시작해 전문가가 된다는 희망을 주는 명사입니다."],
      ["풍덩", "action", 1, "크고 무거운 돌이나 사람이 깊은 물속에 아주 세게 떨어지거나 뛰어들 때 나는 크고 시원하고 요란한 소리예요.", "더운 여름날 계곡에 놀러 가서 차갑고 맑은 물속으로 풍덩 뛰어들었더니 더위가 다 날아갔다.", "'퐁당'보다 물체가 훨씬 크고 물이 튀어 오르는 반경이 넓어 더 시원하고 역동적인 여름철의 기분 좋은 물놀이를 연상시킵니다."],
      ["피", "daily", 1, "1. 우리 몸속 혈관을 타고 온몸을 돌며 생명을 유지하는 붉은 액체예요.<br>2. 논에 심은 벼 사이에 섞여 자라 영양분을 뺏는 나쁜 잡초를 일컫는 말이에요.", "1. 병원에서 건강 검진을 위해 붉은 피를 뽑는 것은 몹시 긴장되고 무서운 일이다.<br>2. 농부 아저씨가 벼가 잘 자라도록 논에서 나쁜 피를 뽑아내는 일은 땀 흘리는 노력이다.", "혈액이라는 뜻 외에도 가짜 벼 행세를 하는 잡초를 뜻하여 '피 땀 흘려 가꾼 논'처럼 글짓기에 쓰여요."],
      ["피다", "action", 1, "1. 봄이 되어 식물의 꽃봉오리가 예쁘게 벌어지거나 연기가 모락모락 피어오르는 일이에요.<br>2. 어려운 사정이 조금 나아지거나 사람의 얼굴에 기분 좋은 웃음꽃이 환하게 퍼지는 일이에요.", "1. 학교 화단에 샛노란 개나리가 활짝 피고 굴뚝에서 연기가 모락모락 피어올랐다.<br>2. 오랜만에 만난 우리 반 친구들의 얼굴에도 덩달아 행복한 웃음꽃이 활짝 피어났다.", "꽃이나 연기가 피어나는 자연 현상을 사람의 웃음과 기쁨에 비유하여 우리의 마음을 가장 환하게 만들어 줍니다."],
      ["피리", "daily", 1, "대나무나 쇠, 플라스틱에 구멍을 뚫어 입으로 공기를 불어 넣고 손가락으로 구멍을 막았다 열었다 하며 아름다운 소리를 내는 관악기예요.", "음악 시간에 단소나 리코더 같은 피리를 불 때 맑고 고운 소리가 나도록 호흡을 조절하여 연주했다.", "동화 '피리 부는 사나이'처럼 사람의 마음을 홀리는 신비하고 맑은 소리를 내는 가장 오래되고 친숙한 우리 고유의 훌륭한 악기 이름입니다."],
      ["핑", "action", 1, "1. 눈에 눈물이 갑자기 가득 고이는 모양을 뜻하는 부사예요.<br>2. 갑자기 어지러워서 머리가 순간적으로 휙 도는 아찔한 현상이에요.<br>3. 돌멩이가 바람을 가르고 아주 빠르게 날아가는 소리나 모양이에요.", "1. 졸업식 날 선생님의 감동적인 편지를 듣고 코끝이 찡해지며 눈에 눈물이 핑 돌았다.<br>2. 자리에서 갑자기 벌떡 일어났더니 머리가 핑 돌면서 현기증이 나서 주저앉았다.<br>3. 내 귀 옆으로 아이가 던진 야구공이 핑 하고 무섭게 스쳐 지나갔다.", "감동과 현기증, 그리고 빠른 비행 소리라는 전혀 다른 신체 반응과 물리 현상을 묘사하는 짧은 부사입니다."],
      ["하늘", "nature", 1, "1. 땅의 위로 끝없이 넓게 펼쳐져 있는 맑고 텅 빈 거대한 공간이에요.<br>2. 기적이나 운명, 또는 절대적인 존재를 비유적으로 이르는 말이에요.", "1. 가을이 되니 구름 한 점 없이 파랗고 높은 하늘이 마음을 시원하게 해준다.<br>2. 아무리 힘든 역경이 닥쳐도 하늘은 스스로 돕는 자를 돕는다고 믿으며 노력했다.", "새가 나는 물리적인 공간뿐만 아니라 '하늘이 돕다'처럼 기적이나 운명을 비유할 때도 쓰여요."],
      ["하루", "time", 1, "아침부터 밤이 지나 다음 날 아침이 오기 전까지의 스물네 시간이에요.", "오늘 하루도 친구들과 신나게 놀고 숙제도 스스로 끝내서 무척 보람찼다.", "'이틀', '사흘'처럼 날짜를 세는 아주 훌륭하고 기본적인 순우리말 시간 명사입니다."],
      ["하마터면", "action", 2, "조금만 잘못하였더라면 아주 큰 위험이나 실수를 겪을 뻔한 아찔한 상황을 뜻해요.", "비 오는 날 복도에서 뛰다가 하마터면 크게 넘어져서 다칠 뻔했다.", "과거의 아찔했던 순간을 되돌아보며 안도감을 느낄 때 문장 맨 앞에 쓰는 부사예요."],
      ["하얗다", "nature", 1, "눈이나 우유처럼 맑고 밝은 색깔로, 티가 없이 아주 깨끗한 상태예요.", "겨울밤 소리 없이 내린 하얀 눈이 운동장을 덮어 온 세상이 도화지처럼 변했다.", "색깔을 뜻할 뿐만 아니라 너무 놀라서 '머릿속이 하얗게 변했다'라고 표현할 때도 씁니다."],
      ["하품", "action", 1, "졸리거나 피곤할 때 나도 모르게 입이 크게 벌어지며 숨을 깊이 들이마시고 내쉬는 일이에요.", "어젯밤 늦게까지 책을 읽었더니 수업 시간에 자꾸 하품이 나와서 입을 가리느라 혼났다.", "피곤함을 나타내는 가장 솔직하고 자연스러운 우리 몸의 생리 현상입니다."],
      ["한결", "daily", 2, "1. 형세나 정도가 전보다 훨씬 더 두드러지게 나은 모양이에요.<br>2. 마음가짐이나 방향이 오직 한길로 변함없는 상태를 뜻해요.", "1. 아침에 일어나서 따뜻한 물로 샤워를 하고 나니 기분이 한결 상쾌해졌다.<br>2. 우리는 어떤 유혹에도 흔들리지 않고 한결같은 마음으로 꿈을 향해 나아갔다.", "'훨씬'이라는 말보다 조금 더 부드럽고 긍정적인 변화나 변함없는 믿음을 비교할 때 씁니다."],
      ["할퀴다", "action", 1, "1. 손톱이나 짐승의 날카로운 발톱 따위로 긁어서 상처를 내거나 거칠게 찢는 행동이에요.<br>2. 거센 바람이나 폭풍우가 지나가며 지형이나 건물에 큰 상처를 남기는 것을 비유해요.", "1. 동네 길고양이에게 다가가 장난을 치려다가 고양이가 앞발로 손등을 할퀴었다.<br>2. 지난밤 태풍이 무섭게 마을을 할퀴고 지나간 자리에 부러진 나뭇가지가 가득했다.", "피부에 상처가 나는 물리적 행동과 자연재해가 남긴 아픔을 비유할 때 모두 쓰입니다."],
      ["함부로", "action", 1, "어떤 일을 조심성 없이 깊이 생각하지 않고 자기 마음대로 마구 하는 나쁜 태도예요.", "아무리 화가 난다고 해도 친구에게 함부로 거친 말을 내뱉는 것은 절대 해서는 안 된다.", "남을 배려하지 않고 선을 넘는 무례한 행동을 따끔하게 꾸짖을 때 쓰는 단어입니다."],
      ["함빡", "action", 2, "분량이나 정도가 모자람 없이 그릇이나 마음에 아주 가득 차 있는 넉넉한 모양이에요.", "할머니께서는 오랜만에 놀러 온 손자의 얼굴을 보며 함빡 웃음을 지으셨다.", "'흠뻑'보다 조금 더 따뜻하고 부드러운 느낌을 주어 미소나 웃음을 꾸며줄 때 아주 잘 어울려요."],
