<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반짝반짝 우리말 고유어 대사전 (초등 6학년)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'], fun: ['"Gaegu"', 'cursive'] },
          colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } }
        }
      }
    }
  </script>
  <style>
    .card-hover { transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.2), 0 8px 10px -6px rgba(16, 185, 129, 0.1); }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
    .modal-open { overflow: hidden; }
    .word-highlight { background: linear-gradient(120deg, #dcfce7 0%, #dcfce7 100%); background-repeat: no-repeat; background-size: 100% 40%; background-position: 0 88%; }
  </style>
</head>
<body class="bg-gradient-to-br from-amber-50/60 via-emerald-50/50 to-sky-50/60 text-slate-800 min-h-screen flex flex-col font-sans selection:bg-emerald-200">

  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-emerald-100 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 cursor-pointer" onclick="resetFilters()">
        <span class="text-3xl p-2 bg-emerald-100 rounded-2xl shadow-inner text-emerald-600"><i class="fa-solid fa-book-bookmark"></i></span>
        <div>
          <h1 class="text-xl sm:text-2xl font-fun font-bold text-emerald-800 tracking-wide flex items-center gap-2">우리말 고유어 대사전<span class="text-xs font-sans font-bold bg-emerald-500 text-white px-2 py-0.5 rounded-full shadow-sm" id="totalWordsBadge">로딩중...</span></h1>
          <p class="text-xs text-slate-500 hidden sm:block">초등학교 6학년 국어 연계 • 아름다운 우리말 탐험</p>
        </div>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0 custom-scroll">
        <button id="bookmarkTabBtn" onclick="toggleBookmarkFilter()" class="whitespace-nowrap px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-amber-300 bg-amber-50 text-amber-800 hover:bg-amber-100 flex items-center gap-1.5 shadow-sm transition active:scale-95">
          <i class="fa-solid fa-star text-amber-500"></i><span>내 단어장</span><span id="bookmarkCount" class="bg-amber-500 text-white rounded-full px-1.5 py-0.2 text-[11px] font-bold">0</span>
        </button>
        <button onclick="openPracticeModal()" class="whitespace-nowrap px-3 py-2 rounded-xl text-xs sm:text-sm font-bold bg-sky-50 text-sky-700 hover:bg-sky-100 border border-sky-200 flex items-center gap-1.5 transition active:scale-95">
          <i class="fa-solid fa-pen-to-square text-sky-500"></i><span>문장 짓기 노트</span>
        </button>
        <button onclick="openQuizModal()" class="whitespace-nowrap px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white shadow-sm flex items-center gap-1.5 transition active:scale-95">
          <i class="fa-solid fa-gamepad"></i><span>낱말 퀴즈</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-5 flex flex-col gap-5">
    <section class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-emerald-100 relative overflow-hidden bg-gradient-to-r from-emerald-50/80 via-white to-sky-50/60">
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div class="space-y-2">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1 shadow-sm"><i class="fa-solid fa-sparkles"></i> 오늘의 추천 고유어</span>
            <span id="todayWordCategory" class="text-xs text-slate-500 bg-white px-2 py-0.5 rounded-lg border font-medium">자연</span>
            <span id="todayWordLevel" class="text-xs text-emerald-700 bg-emerald-100/70 font-semibold px-2 py-0.5 rounded-lg">1단계 (기초)</span>
          </div>
          <div class="flex items-baseline gap-3 pt-1">
            <h2 id="todayWordTitle" class="text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-tight word-highlight">불러오는 중</h2>
            <button onclick="speakWord(document.getElementById('todayWordTitle').innerText)" class="text-emerald-600 hover:text-emerald-700 text-xl transition-transform hover:scale-110" title="발음 듣기"><i class="fa-solid fa-volume-high"></i></button>
          </div>
          <p id="todayWordMeaning" class="text-slate-700 text-sm sm:text-base font-medium leading-relaxed"></p>
          <div class="bg-white/60 p-3 rounded-xl border border-white mt-2 inline-block"><p id="todayWordExample" class="text-sm text-slate-600 italic"></p></div>
        </div>
        <button onclick="pickRandomTodayWord()" class="px-4 py-2.5 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold rounded-2xl border border-slate-200 shadow-sm transition active:scale-95 flex items-center gap-2 shrink-0">
          <i class="fa-solid fa-shuffle text-emerald-500"></i> 다른 낱말 보기
        </button>
      </div>
    </section>

    <section class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-5">
      <div class="relative group">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400 group-focus-within:text-emerald-500 transition-colors"><i class="fa-solid fa-magnifying-glass text-lg"></i></span>
        <input type="text" id="searchInput" placeholder="단어, 뜻, 예문을 검색해 보세요." class="w-full pl-12 pr-24 py-3.5 bg-slate-50 hover:bg-slate-100/60 focus:bg-white text-slate-800 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm font-medium transition-all shadow-inner" oninput="handleSearch()" />
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-3 px-3 my-auto h-8 text-xs font-bold text-slate-500 hover:text-slate-800 bg-slate-200/60 hover:bg-slate-300/60 rounded-xl transition-colors">지우기</button>
      </div>
      <div>
        <div class="flex items-center justify-between mb-2.5">
          <label class="text-xs sm:text-sm font-bold text-slate-600 flex items-center gap-1.5"><span class="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center"><i class="fa-solid fa-shapes"></i></span>자음으로 찾기</label>
          <button onclick="clearConsonantFilter()" class="text-xs text-emerald-600 hover:text-emerald-700 font-bold bg-emerald-50 px-2 py-1 rounded-lg">전체 보기</button>
        </div>
        <div class="grid grid-cols-7 sm:grid-cols-14 gap-1.5 sm:gap-2" id="consonantContainer"></div>
      </div>
      <div class="flex flex-col lg:flex-row gap-4 pt-4 border-t border-slate-100">
        <div class="flex-1">
          <label class="text-xs font-bold text-slate-500 mb-2 block">주제별 테마</label>
          <div class="flex flex-wrap items-center gap-1.5" id="categoryContainer"></div>
        </div>
        <div class="lg:border-l lg:border-slate-100 lg:pl-4">
          <label class="text-xs font-bold text-slate-500 mb-2 block">6학년 맞춤 난이도</label>
          <div class="flex items-center gap-1.5">
            <button onclick="setLevelFilter('all')" id="levelBtn-all" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow-sm transition">전체</button>
            <button onclick="setLevelFilter(1)" id="levelBtn-1" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🌱 1단계(기초)</button>
            <button onclick="setLevelFilter(2)" id="levelBtn-2" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🌿 2단계(실력)</button>
            <button onclick="setLevelFilter(3)" id="levelBtn-3" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🌳 3단계(도전)</button>
          </div>
        </div>
      </div>
    </section>

    <section class="space-y-4 flex-grow">
      <div class="flex flex-wrap items-center justify-between px-1 gap-3">
        <div class="text-sm font-bold text-slate-700 flex items-center gap-2">
          <span>발견한 고유어</span><span id="resultCount" class="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full text-xs font-extrabold shadow-sm">0개</span><span id="pageInfoText" class="text-xs text-slate-400 font-normal hidden sm:inline"></span>
        </div>
        <div class="flex items-center gap-2 text-xs">
          <select id="sortSelect" onchange="applyFiltersAndRender(1)" class="bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-slate-700 font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm cursor-pointer hover:bg-slate-50 transition">
            <option value="nameAsc">가나다순 (ㄱ~ㅎ)</option>
            <option value="nameDesc">역순 (ㅎ~ㄱ)</option>
            <option value="levelAsc">쉬운 순서</option>
            <option value="levelDesc">어려운 순서</option>
          </select>
        </div>
      </div>
      <div id="wordGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div id="paginationContainer" class="flex flex-wrap items-center justify-center gap-2 pt-6 pb-4"></div>
      <div id="emptyState" class="hidden flex-col items-center justify-center p-16 text-center bg-white rounded-3xl border-2 border-dashed border-slate-200">
        <div class="w-16 h-16 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center text-2xl mb-4"><i class="fa-solid fa-face-sad-tear"></i></div>
        <h3 class="text-lg font-bold text-slate-700">앗, 해당하는 고유어를 찾지 못했어요.</h3>
        <button onclick="resetFilters()" class="mt-6 px-5 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-bold rounded-xl shadow-sm transition active:scale-95 flex items-center gap-2"><i class="fa-solid fa-rotate-right"></i> 모든 필터 초기화</button>
      </div>
    </section>
  </main>

  <!-- 모달 영역 -->
  <div id="wordModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4" onclick="handleModalClick(event, 'wordModal')">
    <div class="bg-white rounded-[2rem] max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-100 relative transform transition-all scale-95 opacity-0 duration-200" id="modalCard">
      <button onclick="closeWordModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center transition-colors text-lg"><i class="fa-solid fa-xmark"></i></button>
      <div class="space-y-5">
        <div class="flex items-center gap-2">
          <span id="modalCategoryBadge" class="text-xs font-bold px-3 py-1.2 rounded-xl shadow-sm"></span><span id="modalLevelBadge" class="text-xs font-bold px-3 py-1.2 rounded-xl border"></span>
        </div>
        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
          <div class="flex items-end gap-3">
            <h2 id="modalTitle" class="text-4xl font-extrabold text-slate-800 tracking-tight"></h2>
            <button id="modalAudioBtn" class="text-emerald-500 hover:text-emerald-600 text-2xl p-1 mb-1 transition-transform hover:scale-110" title="발음 듣기"><i class="fa-solid fa-circle-play"></i></button>
          </div>
          <button id="modalBookmarkBtn" class="text-3xl p-2 transition transform hover:scale-110 active:scale-125"><i class="fa-regular fa-star text-slate-300"></i></button>
        </div>
        <div class="space-y-4 pt-2">
          <div><p class="text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">뜻풀이</p><p id="modalMeaning" class="text-slate-800 text-lg font-bold leading-relaxed break-keep"></p></div>
          <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100/50"><p class="text-xs font-bold text-emerald-700 mb-2 flex items-center gap-1.5"><i class="fa-solid fa-pen-fancy"></i> 이렇게 문장으로 써요</p><p id="modalExample" class="text-emerald-900 text-sm font-medium leading-relaxed italic break-keep"></p></div>
          <div class="bg-amber-50 p-4 rounded-2xl border border-amber-100/50"><p class="text-xs font-bold text-amber-700 mb-2 flex items-center gap-1.5"><i class="fa-regular fa-lightbulb"></i> 6학년 돋보기 팁</p><p id="modalTip" class="text-amber-900 text-sm font-medium leading-relaxed break-keep"></p></div>
        </div>
      </div>
      <div class="mt-8 flex flex-col sm:flex-row justify-between items-center gap-3">
        <button id="modalPracticeShortcutBtn" class="w-full sm:w-auto px-5 py-3 bg-sky-50 hover:bg-sky-100 text-sky-700 text-sm font-bold rounded-xl transition flex items-center justify-center gap-2 border border-sky-200"><i class="fa-solid fa-pen-nib"></i> 이 단어로 문장 짓기</button>
        <button onclick="closeWordModal()" class="w-full sm:w-auto px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-xl transition shadow-md">확인</button>
      </div>
    </div>
  </div>

  <div id="practiceModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4" onclick="handleModalClick(event, 'practiceModal')">
    <div class="bg-white rounded-[2rem] max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-100 relative">
      <button onclick="closePracticeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center transition-colors text-lg"><i class="fa-solid fa-xmark"></i></button>
      <div class="space-y-5">
        <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
          <span class="w-10 h-10 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center text-lg font-bold shadow-inner"><i class="fa-solid fa-book-journal-whills"></i></span>
          <div><h3 class="text-xl font-extrabold text-slate-800">나만의 문장 짓기 노트</h3><p class="text-xs font-medium text-slate-500">배운 고유어를 넣어 멋진 문장을 완성해 보세요!</p></div>
        </div>
        <div class="space-y-4">
          <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
            <label class="block text-xs font-bold text-slate-600 mb-2">1. 사용할 고유어 선택하기</label>
            <div class="flex gap-2">
              <input type="text" id="practiceWordSearch" placeholder="단어 검색..." class="w-1/3 bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400 outline-none transition" oninput="filterPracticeOptions()" />
              <select id="practiceWordSelect" onchange="updatePracticeWordDetail()" class="w-2/3 bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400 cursor-pointer shadow-sm"></select>
            </div>
            <div class="mt-3 p-3 bg-white rounded-xl border border-slate-100"><p id="practiceWordMeaningHint" class="text-sm text-slate-700 font-medium"></p></div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-2">2. 나만의 문장 쓰기</label>
            <textarea id="practiceSentenceInput" rows="4" placeholder="선택한 고유어를 포함해서 자연스러운 문장을 지어보세요." class="w-full bg-slate-50 hover:bg-white border-2 border-slate-200 rounded-2xl p-4 text-sm font-medium focus:bg-white focus:outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100 transition-all resize-none shadow-inner" oninput="handlePracticeInput()"></textarea>
            <div class="flex justify-between items-center mt-2 px-1 text-xs font-bold text-slate-400">
              <span id="practiceWordCheckMsg" class="flex items-center gap-1"><i class="fa-solid fa-circle-exclamation"></i> 문장에 단어를 넣어주세요.</span><span id="practiceCharCount">0자</span>
            </div>
          </div>
          <div id="practiceSuccessBox" class="hidden p-4 bg-emerald-50 border-2 border-emerald-200 rounded-2xl text-emerald-800 text-sm font-bold flex items-start gap-3 shadow-sm transform transition-all">
            <i class="fa-solid fa-face-smile-wink text-emerald-500 text-2xl mt-0.5"></i>
            <div><p>참 잘했어요! 👏</p><p class="text-xs text-emerald-600 font-medium mt-1">고유어를 아주 자연스럽게 활용한 멋진 문장입니다.</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="quizModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4" onclick="handleModalClick(event, 'quizModal')">
    <div class="bg-white rounded-[2rem] max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-100 relative">
      <button onclick="closeQuizModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center transition-colors text-lg"><i class="fa-solid fa-xmark"></i></button>
      <div class="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
        <span class="w-10 h-10 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center text-xl shadow-inner"><i class="fa-solid fa-crown"></i></span>
        <div><h3 class="text-xl font-extrabold text-slate-800">우리말 척척박사 퀴즈</h3><p class="text-xs font-medium text-slate-500">설명을 읽고 알맞은 고유어를 맞춰보세요!</p></div>
      </div>
      <div id="quizQuestionBox" class="space-y-5">
        <div class="bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 relative">
          <span class="absolute -top-3 left-4 text-xs font-bold text-white bg-emerald-500 px-3 py-1 rounded-full shadow-sm">문제</span>
          <p id="quizMeaning" class="text-slate-800 font-bold text-base mt-2 min-h-[60px] flex items-center leading-relaxed break-keep"></p>
        </div>
        <div id="quizOptions" class="grid grid-cols-1 gap-2.5"></div>
        <div id="quizFeedback" class="hidden p-4 rounded-xl text-center text-sm font-bold shadow-sm transition-all transform scale-95"></div>
        <div class="flex justify-between items-center pt-4 border-t border-slate-100">
          <div class="flex flex-col"><span class="text-[10px] font-bold text-slate-400 uppercase">내 점수</span><span id="quizScoreText" class="text-lg font-extrabold text-emerald-600">0점</span></div>
          <button id="nextQuizBtn" onclick="generateNewQuiz()" class="hidden px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-xl transition shadow-md flex items-center gap-2">다음 문제 도전 <i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 
    const RAW_WORDS = [
      ["가꾸다", "action", 1, "식물이나 외모를 정성껏 보살펴서 잘 자라게 하거나 보기 좋게 만드는 일이에요.", "봄이 되어 교실 창가에 있는 화분 속 꽃에 물을 주며 정성껏 가꾸었다.", "'꿈을 가꾸다'처럼 자신의 실력이나 목표를 훌륭하게 키워갈 때도 멋지게 쓰는 말이에요."],
      ["가누다", "action", 2, "몸의 자세나 정신을 똑바로 차리거나 흩어지지 않게 가다듬는 행동을 뜻해요.", "체육 시간에 오래달리기를 하고 나서 숨을 헐떡이며 겨우 몸을 가누었다.", "주로 '몸을 가누다', '마음을 가누다'처럼 아프거나 힘들 때 중심을 잡는 의미로 씁니다."],
      ["가득", "daily", 1, "분량이나 수효가 정해진 범위나 그릇 안에 빈틈없이 꽉 차 있는 모양이에요.", "가을 소풍날, 내 가방 안에는 엄마가 싸주신 맛있는 김밥과 과자가 가득 들어 있었다.", "공간이 꽉 찬 것뿐만 아니라 '자신감이 가득하다'처럼 감정이 넘쳐흐를 때도 자주 써요."],
      ["가리키다", "action", 1, "손가락이나 물건을 어떤 방향이나 대상을 향하게 하여 집어내는 행동이에요.", "선생님께서 지휘봉으로 칠판에 적힌 중요한 수학 공식을 가리키며 설명해 주셨다.", "'가르치다(알려주다)'와 발음이 비슷해서 헷갈리기 쉬우니 쓸 때 조심해야 하는 단어예요."],
      ["가르치다", "action", 1, "지식이나 기술, 올바른 도리 등을 남이 깨닫거나 익히도록 알려 주는 일이에요.", "수학 문제를 몰라서 헤매고 있을 때, 짝꿍이 다가와서 친절하게 푸는 방법을 가르쳐 주었다.", "선생님이 학생을 지도하는 것뿐만 아니라 친구끼리 서로 좋은 것을 나눌 때도 쓰는 동사입니다."],
      ["가름", "daily", 2, "사물이나 상황을 쪼개거나 나누어 따로따로 구별되게 하는 판단이나 기준이에요.", "오늘 열린 피구 대회에서 우리 반과 옆 반의 승패 가름은 마지막 단 1분에 결정되었다.", "새로운 것으로 바꾼다는 뜻의 '갈음'과는 완전히 다른 뜻의 단어이니 맞춤법에 유의하세요."],
      ["가만히", "action", 1, "몸을 움직이지 않거나 아무 말 없이 잠잠하게, 또는 속으로 몰래 하는 모양이에요.", "수업 시간에 떠들지 않고 자리에 가만히 앉아 선생님의 말씀을 귀 기울여 들었다.", "주변을 방해하지 않고 평화롭게 있는 태도나 조심스러운 움직임을 나타낼 때 주로 씁니다."],
      ["가물거리다", "action", 2, "작은 불빛이 자꾸 어두워졌다 밝아졌다 하거나, 기억이 날 듯 말 듯 흐릿한 상태예요.", "어릴 적 아주 재미있게 놀았던 추억인데, 시간이 오래 지나서인지 머릿속에서 자꾸 가물거린다.", "불빛이 흔들리는 물리적인 현상뿐만 아니라, 정신이나 기억이 뚜렷하지 않을 때 아주 잘 어울려요."],
      ["가시", "nature", 1, "식물의 줄기나 잎, 또는 동물의 몸에 바늘처럼 뾰족하게 돋아나 찌르는 뾰족한 부분이에요.", "산길을 걷다가 장미 넝쿨에 스쳤는데 뾰족한 가시에 찔려 손등에 작은 상처가 났다.", "남의 마음을 찌르는 독한 말이나 나쁜 태도를 '가시 돋친 말'이라고 문학적으로 비유하기도 해요."],
      ["가엽다", "heart", 2, "다른 사람이나 동물의 처지가 마음이 아플 만큼 안되고 불쌍하다는 따뜻한 마음이에요.", "비 오는 날 길가에서 덜덜 떨고 있는 버려진 강아지가 너무 가여워서 집으로 데려왔다.", "'가엾다'와 똑같은 뜻으로 쓰이는 복수 표준어로, 남을 동정하고 배려하는 착한 마음을 뜻해요."],
      ["가운데", "daily", 1, "여럿이 있는 속이나 안, 혹은 어떤 공간이나 시간의 가장 중심이 되는 곳을 말해요.", "우리 반 친구들이 둥글게 모여 앉았고, 나는 그 가운데에 서서 당당하게 발표를 시작했다.", "물리적인 정중앙뿐만 아니라 '회의를 하는 가운데'처럼 어떤 일이 진행되는 도중을 나타내기도 해요."],
      ["가을", "time", 1, "여름과 겨울 사이의 계절로, 잎이 붉게 물들고 곡식을 거두어들이는 수확의 시기예요.", "가을이 되니 학교 뒤뜰의 은행나무 잎이 노랗게 물들고 시원한 바람이 불어오기 시작했다.", "우리나라의 아름다운 사계절 중 풍성함과 독서를 상징하는 아주 아름다운 고유어 명칭입니다."],
      ["가장", "daily", 1, "여럿 가운데 어느 것보다 정도가 높거나 으뜸이 되게라는 뜻을 가진 훌륭한 부사예요.", "우리 반에서 달리기가 가장 빠른 민수는 이번 체육대회 계주 마지막 주자로 뽑혔다.", "한자어인 '제일(第一)'을 완벽하게 대체할 수 있는 아주 자연스럽고 예쁜 순우리말입니다."],
      ["가지런하다", "daily", 2, "여럿이 줄지어 있는 모양이 들쭉날쭉하지 않고 나란하며 아주 고르게 정돈된 상태예요.", "체육관에 들어가기 전, 입구에 벗어둔 친구들의 실내화가 삐뚤어지지 않고 아주 가지런했다.", "물건이 보기 좋게 정리된 모습뿐만 아니라, 글씨나 마음가짐이 바른 상태를 칭찬할 때 씁니다."],
      ["가탈", "daily", 3, "일이 순조롭게 나아가는 것을 방해하는 조건, 또는 이리저리 트집을 잡아 까다롭게 구는 일이에요.", "모둠 숙제를 하는데 지훈이가 자꾸 사소한 일로 가탈을 부려서 의견을 모으기가 힘들었다.", "별일 아닌 것에 괜한 불평을 늘어놓는 피곤한 행동을 아주 정확하게 꼬집어 주는 낱말입니다."],
      ["간지럽다", "heart", 1, "살갗에 무엇이 살짝 닿아 웃음이 날 만큼 찌릿하거나 기분 좋게 근질거리는 느낌이에요.", "친구와 귓속말을 하는데 친구의 숨결이 귀에 닿아 몹시 간지러워서 나도 모르게 웃음이 터졌다.", "쑥스러운 칭찬을 들어서 부끄러울 때 '귀가 간지럽다'라고 마음의 느낌을 표현할 때도 써요."],
      ["갈무리", "action", 2, "물건을 잘 정돈하여 안전하게 보관하거나, 하던 일을 깔끔하게 끝맺어 정리하는 일이에요.", "오늘 국어 시간에 배운 중요한 단어들을 내 노트에 예쁜 글씨로 잘 갈무리해 두었다.", "컴퓨터나 스마트폰에서 화면을 캡처해서 저장하는 기능도 요즘은 '갈무리'라고 순화해서 불러요."],
      ["갈피", "daily", 2, "겹쳐진 물건들의 사이, 또는 얽힌 사물이나 일의 가닥이 구별되는 뚜렷한 경계나 방향이에요.", "수학 문제가 너무 어려워서 도대체 어떻게 풀어야 할지 갈피를 잡지 못하고 한참을 고민했다.", "책장 사이를 뜻하는 말에서 출발해, 마음이나 생각의 방향을 정할 때 '갈피를 못 잡다'로 흔히 쓰여요."],
      ["감기다", "action", 1, "피곤하거나 졸려서 눈꺼풀이 스르르 내려와 덮이거나, 실이나 끈 따위가 다른 물체에 둘러지는 일이에요.", "어젯밤 늦게까지 책을 읽었더니 수업 시간에 자꾸 눈이 스르르 감겨서 허벅지를 꼬집으며 참았다.", "머리를 씻는 뜻인 '머리가 감기다'와는 다른 뜻으로, 저절로 눈이 닫히는 현상을 나타내는 동사예요."],
      ["감다", "action", 1, "비누나 샴푸를 써서 머리나 몸을 깨끗하게 씻어내는 일상적인 목욕 행동이에요.", "아침에 늦잠을 자는 바람에 머리도 제대로 감지 못하고 모자만 푹 눌러쓴 채 허둥지둥 등교했다.", "눈꺼풀을 내리다, 붕대를 두르다 등 여러 가지 뜻이 있는 아주 쓰임새가 많은 기본 동사입니다."],
      ["갑자기", "time", 1, "미처 대비하거나 생각할 겨를도 없이 아주 급하고 빠르게 일어나는 상황을 뜻해요.", "체육 시간에 맑았던 하늘에서 갑자기 굵은 소나기가 쏟아져서 반 친구들 모두 교실로 뛰어 들어갔다.", "예상치 못한 돌발 상황이 벌어져서 당황스러울 때 문장의 맨 앞에 가장 자주 붙는 고유어 부사예요."],
      ["강아지", "nature", 1, "개가 낳은 새끼를 아주 귀엽고 친근하게 부르는 널리 사랑받는 동물의 이름이에요.", "학교 가는 길에 꼬리를 흔들며 쫄랑쫄랑 따라오는 이웃집 하얀 강아지가 너무 귀여워 쓰다듬어 주었다.", "짐승의 새끼를 뜻하는 '-아지'가 개와 결합하여 파생된 말로, 송아지, 망아지도 같은 원리로 만들어졌어요."],
      ["갖추다", "action", 2, "어떤 목적을 위해 꼭 있어야 할 물건이나 조건, 또는 올바른 예절이나 태도를 빠짐없이 차리는 일이에요.", "6학년 형님답게 선생님과 인사를 나눌 때는 허리를 굽혀 바른 예의를 갖추어야 한다고 배웠다.", "물건을 준비하는 것뿐만 아니라 사람으로서의 올바른 기본기를 닦는 아주 훌륭한 도덕적 태도랍니다."],
      ["개구쟁이", "action", 1, "행동이 얌전하지 않고 아주 심하게 장난을 치며 노는 아이를 귀엽게 부르는 파생어예요.", "우리 모둠의 최고 개구쟁이 지훈이 덕분에 딱딱했던 조별 활동 시간이 웃음바다가 되었다.", "심한 장난을 치는 단점이 있지만 분위기를 띄우는 귀여운 매력을 가졌을 때 주로 부르는 애칭입니다."],
      ["거드름", "heart", 2, "스스로 잘난 체하며 남들 앞에서 아주 거만하고 우쭐거리며 구는 얄미운 태도예요.", "이번 수학 단원 평가에서 혼자 백 점을 맞았다고 친구들 앞에서 거드름을 피우면 미움을 받을 수 있다.", "거만함보다는 남을 배려하는 겸손한 태도를 갖추는 것이 진정한 실력자이자 멋진 6학년의 모습이라는 걸 잊지 마세요."],
      ["거칠다", "heart", 1, "물체의 표면이 매끄럽지 않거나, 사람의 말이나 행동이 부드럽지 못하고 거세고 험한 상태예요.", "가을 운동장에서 찬 바람을 많이 맞으며 뛰어놀았더니 손등과 입술이 까슬까슬하게 거칠어졌다.", "말이나 행동에 욕설이 섞이거나 예의가 없을 때도 '말이 거칠다'라고 표현하며 주의를 줍니다."],
      ["걱정", "heart", 1, "안심이 되지 않아 속을 태우며 마음이 불안하고 괴로운 아주 자연스러운 감정 상태예요.", "내가 체육 시간에 다쳐서 양호실에 가자, 단짝 친구가 몹시 걱정스러운 표정으로 달려와 주어 고마웠다.", "우리가 매일 쓰는 순우리말로 누군가를 아끼기 때문에 생겨나는 따뜻한 마음이기도 해요."],
      ["걷다", "action", 1, "두 다리를 번갈아 떼어 옮기며 발걸음을 앞으로 나아가게 하는 사람의 가장 기본적이고 건강한 동작이에요.", "학교가 끝나고 짝꿍과 함께 시원한 가을바람을 맞으며 동네 공원 한 바퀴를 기분 좋게 나란히 걸었다.", "커튼이나 소매를 걷어 올리다할 때 쓰는 동음이의어도 있지만, 이동을 나타내는 가장 흔하고 친숙한 고유어예요."],
      ["걸싸다", "action", 3, "동작이 답답하지 않게 아주 날래고, 일을 처리하는 솜씨가 빠르고 시원시원하다는 칭찬이에요.", "청소 당번인 민지는 성격이 아주 걸싸서 넓은 복도 청소를 빗자루질 몇 번으로 순식간에 끝내버렸다.", "능력이 뛰어나고 융통성이 있어 굼뜨지 않게 척척 일을 해내는 아주 유능한 친구를 칭찬할 때 써보세요."],
      ["겪다", "action", 1, "살아가면서 어렵고 힘든 일이나 새롭고 중요한 사건을 몸소 직접 부딪쳐 치러내는 행동이에요.", "체육대회 준비를 하며 친구들과 다투고 화해하는 과정을 겪으면서 우리는 한층 더 끈끈해졌다.", "책으로 배우는 것이 아니라 자신의 몸과 마음으로 직접 체험하고 이겨내는 아주 소중하고 가치 있는 경험입니다."],
      ["견디다", "heart", 1, "당장 몹시 힘들고 아프지만 포기하지 않고 그 어려움을 꾹 참고 버티어 내는 굳센 힘이에요.", "오래달리기를 할 때 숨이 턱까지 차오르는 고통을 꾹 참고 끝까지 견디어 낸 내 자신이 무척 자랑스러웠다.", "어려움을 극복하고 더 단단하게 성장하는 6학년 아이들의 훌륭한 인내심과 의지를 보여주는 멋진 낱말입니다."],
      ["곁", "daily", 1, "어떤 대상의 아주 가까운 양옆이나 주변 공간을 뜻하는 아주 다정하고 심리적인 거리를 나타내는 말이에요.", "내가 수학 문제를 틀려서 몹시 속상해하고 있을 때, 짝꿍이 곁으로 조용히 다가와 따뜻하게 위로해 주었다.", "단순한 물리적 옆자리를 넘어 마음으로 의지하고 보호해 주는 아주 따뜻한 관계의 자리를 뜻하기도 한답니다."],
      ["고개", "nature", 1, "산이나 언덕을 걸어서 넘어가도록 비탈지게 나 있는 길, 또는 일을 처리할 때의 아주 힘든 굽이를 말해요.", "숨을 헐떡이며 가파르고 높은 학교 앞 고개를 묵묵히 다 넘어 무사히 교실에 도착하니 몹시 뿌듯했다.", "사람의 목 윗부분을 뜻하는 단어와 글자는 똑같지만, 자연환경이나 인생의 힘든 위기를 상징할 때 쓰는 명사예요."],
      ["고르다", "action", 1, "여럿이 모여 있는 것들 중에서 자신의 마음에 들거나 기준에 알맞은 것을 뽑아 가려내는 아주 중요한 결정 행동이에요.", "도서관에 가서 이번 주말에 읽을 재미있는 추리 소설책을 신중하게 한참 동안 살피며 골랐다.", "울퉁불퉁하지 않고 상태가 고르게 정돈되었다는 뜻의 형용사로도 쓰이는 활용도가 아주 높은 필수 단어입니다."],
      ["고스란히", "daily", 2, "누가 함부로 건드리거나 빼내지 않아서 조금도 축나거나 상함 없이 원래 있던 모양 그대로인 완벽한 상태예요.", "학교 운동장에서 주운 5천 원 지폐를 파출소에 가져다주었더니 주인의 품으로 고스란히 돌아갈 수 있었다.", "상태나 물건이 전혀 훼손되지 않고 온전하게 잘 보존되었을 때 문장을 아주 고급스럽게 꾸며주는 예쁜 부사입니다."],
      ["고약하다", "heart", 2, "맛이나 냄새, 혹은 사람의 마음씨와 성질이 남을 괴롭힐 정도로 아주 나쁘고 지독하게 심술궂다는 뜻이에요.", "전래동화 속 놀부처럼 남을 시기하고 질투하는 고약한 심보를 가지면 주변에 진정한 친구들이 모두 다 떠나간다.", "코를 찌르는 악취를 묘사할 때도 고약한 냄새라고 흔히 표현하며, 나쁜 본성을 꼬집을 때 아주 강력하게 씁니다."],
      ["고즈넉하다", "heart", 2, "주변이 시끄럽지 않고 아주 고요하고 평화로우며 아늑한 느낌을 주어 마음이 차분해지는 상태예요.", "방과 후 아무도 남지 않은 도서관의 고즈넉한 분위기 속에서 혼자 조용히 동화책을 읽으니 집중이 정말 잘 되었다.", "시끄러운 소음이 사라진 뒤 찾아오는 마음이 편안해지는 조용한 장소나 시간의 분위기를 묘사하는 아주 멋진 형용사예요."],
      ["고치다", "action", 1, "병이 나서 아프거나 낡아서 고장 난 것을 손을 보아 원래의 좋고 건강한 상태로 낫게 만드는 아주 긍정적인 일이에요.", "자주 지각하는 나의 나쁜 게으름 버릇을 이번 학기에는 기필코 고치겠다고 새 다이어리에 굳게 다짐을 적었다.", "물건을 수리하는 것뿐만 아니라 자신의 단점이나 나쁜 습관을 훌륭하게 극복하여 바로잡는 성장의 행동을 뜻합니다."],
      ["곧장", "action", 1, "굽은 길로 빙 돌아가거나 딴 데로 한눈팔아 새지 않고 목적지를 향해 똑바로 쭉 나아가는 단호한 모양이에요.", "오늘 학교 수업이 끝나면 피시방이나 놀이터에서 헤매지 말고 집으로 곧장 가야 부모님이 걱정하지 않으신다.", "망설임 없이 빠르고 정확하게 직진하는 행동을 묘사할 때 쓰며, 바르고 곧은 마음가짐을 은유할 때도 유용합니다."],
      ["골짜기", "nature", 1, "크고 높은 산과 산 사이에 길고 깊게 푹 파여 있어서 물이 고여 흐르기 좋은 아주 깊은 지형을 말해요.", "현장체험학습으로 산에 갔을 때 깊은 골짜기 사이로 맑고 시원한 계곡물이 세차게 흘러내리는 경쾌한 소리를 들었다.", "소리를 지르면 메아리가 크게 울려 퍼지는 자연의 웅장한 지형으로, 인생의 아주 힘들고 우울한 시기를 비유하기도 해요."],
      ["곯다", "action", 2, "과일 속이 물러서 상하거나, 제때 밥을 굶어 속이 텅 비거나, 어떤 일로 몹시 속이 상하여 마음이 썩어 들어가는 일이에요.", "아침 늦잠을 자는 바람에 아침밥을 거르고 학교에 왔더니 2교시부터 배를 곯아 꼬르륵 소리가 크게 나 창피했다.", "물리적으로 배가 고플 때뿐만 아니라 억울한 일로 마음이 병들고 아플 때도 '속이 곯다'라고 깊은 슬픔을 표현한답니다."],
      ["곰곰이", "heart", 1, "한 가지 일에 대해 마음을 가라앉히고 여러모로 차분하게 아주 깊고 진지하게 생각하는 조용한 모양이에요.", "내가 중학교에 가서 진짜로 하고 싶은 꿈이나 장래 희망이 무엇인지 주말 내내 책상에 앉아 곰곰이 생각하며 일기를 썼다.", "글씨를 쓸 때 소리 나는 대로 '곰곰히'로 잘못 쓰는 경우가 아주 많은데, '곰곰이'가 올바른 표준어 맞춤법이라는 점 꼭 기억하세요!"],
      ["곰살갑다", "heart", 2, "말투나 행동이 무뚝뚝하지 않고 성질이 아주 부드럽고 다정하며 싹싹하게 친절하다는 기분 좋은 뜻이에요.", "전학을 와서 교실에서 혼자 쭈뼛거리는 나에게, 먼저 곰살갑게 다가와 상냥한 인사를 건네준 짝꿍이 눈물 나게 고마웠다.", "마치 곰돌이 인형처럼 포근하고 다정한 친구의 성격을 아주 멋지게 칭찬할 때 꼭 어울리는 훌륭한 고유어 형용사입니다."],
      ["곱다", "daily", 1, "모양새나 색깔, 혹은 사람의 마음씨와 말투가 거칠지 않고 아주 예쁘고 부드러우며 아름답다는 뜻이에요.", "친구들 사이에서 욕설을 빼고 바른말 고운 말을 꾸준히 쓰다 보면 우리 반의 분위기도 훨씬 따뜻하고 평화로워질 것이다.", "손이 얼어 뻣뻣해졌을 때 쓰는 '추위에 손이 곱다'라는 뜻의 또 다른 동음이의어가 있다는 재미있는 사실도 국어 시간에 배워보세요."],
      ["구르다", "action", 1, "둥근 물체가 땅바닥에 닿아 빙글빙글 돌면서 자리를 옮기거나, 사람이 바닥에 누워 이리저리 뒹구는 활동적인 모양이에요.", "체육 시간에 짝꿍이 힘차게 발로 찬 축구공이 흙먼지를 일으키며 운동장 저 끝 모래밭까지 시원하게 굴러갔다.", "눈덩이가 구를수록 점점 커지는 것처럼 상황이 점점 나빠지거나 커질 때 비유로도 쓰이며, 아주 동적이고 생생한 순우리말 동사입니다."],
      ["구름", "nature", 1, "공기 중의 수증기가 엉겨 붙어 무리가 되어 높은 하늘에 신비롭게 떠 있는 아주 친숙하고 예쁜 자연 현상이에요.", "미술 시간에 파란 크레파스로 맑은 가을 하늘을 칠하고 그 위에 하얀 물감으로 솜사탕 같은 뭉게구름을 두둥실 예쁘게 그렸다.", "먹구름, 양떼구름, 쌘구름 등 생김새와 특징에 따라 수십 가지의 재미있는 고유어 이름으로 나뉘는 기상 현상의 대표 단어랍니다."],
      ["구쁘다", "food", 3, "배 속이 허전하여 무언가를 자꾸 먹고 싶다는 뜻을 가진, 식욕이 당길 때 쓰는 아주 재미있고 낯선 옛말이에요.", "점심시간에 밥을 조금 남겼더니 오후 4시쯤 하교 시간이 되자 어김없이 입이 구쁘기 시작하여 떡볶이집으로 향했다.", "출출하고 입이 심심해서 군것질이 당길 때 '나 지금 너무 구쁘다!'라고 친구들에게 멋지게 써먹어 보세요."],
      ["까불다", "action", 1, "성격이나 행동이 조심성 없이 가볍고 점잖지 못하게 함부로 들떠서 행동하는 장난기 넘치는 모습이에요.", "수업 시간에 뒤를 돌아보며 까불다가 선생님께 지적을 받고 부끄러워서 얼굴이 새빨개졌다.", "호기심 많고 에너지가 넘치는 6학년 교실에서 가장 흔하게 볼 수 있는 행동이지만, 때로는 차분함도 필요하답니다."],
      ["까칠하다", "heart", 1, "야위거나 메말라 피부가 거칠거나, 사람의 성질이 부드럽지 못하고 신경질적이라 원만하지 않은 상태예요.", "사춘기가 시작되었는지 요즘 작은 농담에도 예민하게 반응하고 까칠하게 대답하는 내 모습이 가끔 낯설다.", "잠을 못 자서 얼굴이 까칠해졌을 때도 쓰지만, 예민하고 짜증이 많은 성격을 묘사할 때 아이들 사이에서 가장 많이 쓰이는 단어입니다."],
      ["깜깜하다", "nature", 1, "빛이 전혀 없어서 앞이 보이지 않을 정도로 아주 몹시 어두운 상태나, 앞으로 어떻게 해야 할지 막막한 심정이에요.", "밤에 불을 끄고 누우니 방 안이 너무 깜깜해서 조금 무서웠지만 억지로 눈을 감고 잠을 청했다.", "시험지를 받았는데 배운 내용이 하나도 기억나지 않아 '눈앞이 깜깜하다'라고 할 때 감정을 기가 막히게 표현해 줍니다."],
      ["깜냥", "heart", 2, "스스로 어떠한 일을 해낼 수 있는 본인의 능력이나 수준, 혹은 한계를 뜻하는 아주 줏대 있는 고유어예요.", "남들이 뭐라 하든 신경 쓰지 않고 나는 내 깜냥껏 내가 할 수 있는 최선의 노력을 다해 숙제를 마쳤다.", "자신의 능력 안에서 남에게 의지하지 않고 묵묵히 노력할 때 쓰기 좋은 다부지고 단단한 느낌의 칭찬입니다."],
      ["깜빡", "action", 1, "불빛 따위가 잠깐 밝았다가 사라지거나, 순간적으로 기억이나 의식을 잃어버리는 일상적인 실수 모양이에요.", "아침에 허둥지둥 등교하느라 책상 위에 올려둔 수학 숙제 노트를 그만 가방에 넣는 것을 깜빡하고 말았다.", "기억력이 흐려져서 무언가를 잊어버렸을 때 가장 많이 변명으로 등장하는 친숙한 귀여운 의태어 부사입니다."],
      ["깜찍하다", "daily", 1, "생김새가 아주 작고 귀여우며, 하는 행동이 눈치가 빠르고 영리해서 사랑스럽다는 뜻의 칭찬이에요.", "지민이가 새로 사 온 필통에 달린 아주 깜찍한 고양이 열쇠고리가 우리 반 여학생들 사이에서 엄청난 인기를 끌었다.", "단순히 귀여운 것을 넘어서 체구는 작지만 행동이 아주 야무지고 센스가 넘칠 때 콕 집어 칭찬하는 말이에요."],
      ["꼬집다", "action", 1, "손가락으로 살을 단단히 잡아 비틀거나, 남의 아픈 약점이나 잘못을 아주 매섭게 지적하여 아프게 하는 행동이에요.", "친구가 짝꿍의 콤플렉스를 콕 집어 꼬집어 말하는 바람에 결국 둘 사이에 큰 싸움이 벌어지고 말았다.", "물리적으로 살을 꼬집는 것보다, 친구의 기분을 나쁘게 하는 말로 약점을 지적할 때의 아픔을 아주 뼈아프게 비유합니다."],
      ["꼼수", "action", 1, "정정당당한 방법이 아니라 쩨쩨하고 얕은 수단이나 꾀를 부려 상황을 유리하게 넘어가려는 얄미운 방법이에요.", "청소 시간에 쓰레기 당번을 피하려고 몰래 꼼수를 부리다가 결국 반장에게 들켜서 화장실 청소까지 하게 되었다.", "게임을 할 때 규칙을 어기고 편법을 쓰는 얄미운 반칙을 뜻하는 말로 아이들 사이에서 아주 자주 쓰이는 현실적인 단어입니다."],
      ["꼼꼼하다", "heart", 1, "빈틈이 없이 아주 차분하고 조심스럽게 일을 끝까지 완벽하게 처리하는 훌륭하고 훌륭한 성격이에요.", "중요한 단원 평가 수학 시험을 다 풀고 나서 시간이 남았길래, 계산 실수한 곳이 없는지 꼼꼼하게 처음부터 다시 검토를 했다.", "덜렁대지 않고 실수를 줄여주기 때문에 중학교에 진학하기 전 6학년 학생들에게 꼭 필요한 가장 좋은 습관 중 하나랍니다."],
      ["꾀", "heart", 1, "어려운 일이나 복잡한 상황을 잘 뚫고 나오기 위해 머리를 써서 생각해 낸 묘하고 영리한 지혜나 수단이에요.", "토끼와 거북이 이야기에서 토끼는 빠른 발만 믿었지만, 거북이는 꾀를 내어 포기하지 않고 끈기 있게 결승선을 통과했다.", "지혜와 비슷하지만 약간 잔머리를 굴린다는 느낌이 있어 '잔꾀를 부리다'처럼 얌체 같은 행동을 혼낼 때도 사용됩니다."],
      ["꾸벅꾸벅", "action", 1, "졸음이 와서 머리가 무거워 자꾸 앞으로 수그러지는 모양이나, 인사를 여러 번 연속해서 깊숙이 하는 모양이에요.", "어젯밤 늦게까지 게임을 하느라 푹 자지 못했더니 1교시 수업 시간 내내 책상에 앉아 병든 닭처럼 꾸벅꾸벅 졸고 말았다.", "밀려오는 수마(잠)를 이기지 못하고 고개가 무겁게 떨어지는 학생들의 가장 솔직하고 피곤한 일상을 생생하게 그려내는 소리말입니다."],
      ["꾸지람", "action", 1, "아랫사람이 저지른 잘못을 어른이나 윗사람이 엄하게 꾸짖어 타이르는 교훈적인 말이나 행동이에요.", "준비물을 안 챙겨 와서 담임 선생님께 따끔한 꾸지람을 듣고 나니 다시는 덜렁대지 않겠다고 굳게 다짐하게 되었다.", "단순한 분노가 아니라 우리를 바른길로 이끌어주기 위해 어른들이 내리시는 사랑이 듬뿍 담긴 애정 어린 잔소리나 다름없어요."],
      ["꿀꺽", "action", 1, "입안에 고인 침이나 맛있는 음식물을 단숨에 삼키는 소리, 또는 남의 물건을 몰래 가로채어 제 것으로 만드는 모양이에요.", "체육 시간에 땀을 비 오듯 흘리고 나서 시원한 얼음물을 꿀꺽 단숨에 들이마셨더니 목구멍부터 가슴까지 시원해졌다.", "욕심이 나서 남의 칭찬이나 물건을 가로챘을 때 '남의 돈을 꿀꺽 삼키다'라고 얄미운 행동을 비유할 때도 기가 막히게 잘 어울립니다."],
      ["꿈", "heart", 1, "잠을 잘 때 일어나는 여러 가지 신비로운 현상이나, 앞으로 다가올 미래에 자신이 꼭 실현시키고 싶은 위대한 희망이에요.", "초등학교를 졸업하기 전에 나는 커서 세상을 이롭게 만드는 훌륭한 로봇 공학자가 되겠다는 멋진 꿈을 마음속에 품었다.", "인간의 무한한 상상력과 장래 희망을 뜻하는, 두 글자 한자어 '희망'을 완벽하게 압도하는 세상에서 가장 아름다운 한 글자 고유어입니다."],
      ["끄트머리", "daily", 1, "어떤 길고 긴 사물이나 넓은 장소, 혹은 오랫동안 이어진 일의 맨 끝이 되는 부분을 아주 구체적이고 정겹게 가리키는 파생어예요.", "급식 시간에 줄을 조금 늦게 서는 바람에 뱀처럼 길게 늘어선 줄의 맨 끄트머리에 간신히 자리를 잡고 내 차례가 오기를 기다렸다.", "단순히 한자어인 '끝(말)'이라고 하는 것보다 훨씬 우리말 특유의 부드럽고 구체적인 느낌을 주며 일상 대화에서 자연스럽고 유용하게 쓰입니다."],
      ["낌새", "heart", 2, "어떤 일이 일어나려고 하는 기미나, 남몰래 어떤 상황을 눈치챌 수 있는 은밀한 분위기나 상태예요.", "짝꿍이 아침부터 자꾸 내 필통 쪽을 힐끔거리는 것이 뭔가 나의 새 지우개를 빌려 가고 싶어 하는 낌새가 분명했다.", "수상한 일이나 거짓말을 알아차리는 직감적인 단서를 뜻하며, 눈치가 빠른 사람은 낌새를 아주 잘 챈다는 특징이 있습니다."],
      ["까닭", "heart", 1, "어떤 일이나 상태가 생기게 된 가장 근본적인 원인이나 구체적인 이유를 뜻하는 명사예요.", "선생님께서는 화를 내시기 전에 먼저 우리가 오늘 교실에서 다투게 된 까닭을 차분하게 처음부터 끝까지 설명해 보라고 하셨다.", "이유(理由)라는 한자어 대신 사용하면 글의 문맥이 훨씬 부드러워지고 정겨운 우리말의 아름다움을 살릴 수 있는 아주 좋은 단어랍니다."],
      ["꼬투리", "action", 2, "어떤 이야기나 사건의 실마리, 혹은 남을 헐뜯거나 비판할 만한 작은 흠집이나 거리를 뜻하는 재미있는 말이에요.", "모둠 친구가 발표 중에 작은 말실수를 했는데, 그것을 굳이 꼬투리 잡고 계속 얄밉게 놀리는 것은 배려심 없는 행동이다.", "원래는 콩이나 팥을 둥글게 감싸는 껍질을 부르는 이름에서 유래하여 어떤 일의 꼬리나 핑곗거리를 상징하게 된 단어입니다."],

      ["눈꽃", "nature", 1, "겨울철 나뭇가지 위에 눈이 하얗게 엉겨 붙어 마치 꽃처럼 핀 풍경이에요.", "설악산 나뭇가지마다 새하얀 눈꽃이 활짝 피어 장관을 이루었다.", "추운 겨울 산행에서 볼 수 있는 가장 아름다운 자연의 신비입니다."],
      ["눈썰미", "heart", 1, "어떤 것을 한두 번 보고도 그 방법이나 특징을 금방 알아채는 재능입니다.", "지수는 눈썰미가 뛰어나서 복잡한 종이접기도 한 번만 보고 척척 따라 한다.", "관찰력이 좋고 손재주가 뛰어난 사람을 칭찬하는 긍정적인 말이에요."],
      ["는개", "nature", 2, "안개비보다는 조금 굵고 이슬비보다는 가늘게 내리는 비예요.", "산길을 걷는데 는개가 촉촉하게 내려 머리카락에 이슬이 맺혔다.", "비의 굵기에 따라 안개비 < 는개 < 이슬비 < 가랑비 순서로 굵어져요."],

      ["나들목", "daily", 2, "나가고 들어오는 길목을 뜻하며, 고속도로의 인터체인지를 우리말로 바꾼 것입니다.", "차가 막혀서 고속도로 나들목을 빠져나오는 데 한참이 걸렸다.", "외래어를 아주 자연스럽고 예쁜 우리말로 순화한 대표적인 단어예요."],
      ["나래", "nature", 2, "'날개'를 뜻하는 아주 아름답고 서정적인 문학적 표현입니다.", "상상력의 나래를 마음껏 펼쳐서 너만의 멋진 이야기를 써 보렴.", "시나 소설에서 무한한 가능성을 비유할 때 '나래를 펴다'라고 씁니다."],
      ["낟알", "food", 2, "껍질을 아직 벗기지 않은 벼나 보리 같은 곡식의 알맹이입니다.", "참새들이 추수가 끝난 들판에서 떨어진 낟알을 주워 먹고 있다.", "농부의 땀방울이 맺힌 아주 작지만 소중한 식량을 뜻해요."],
      ["노을", "nature", 1, "해가 질 무렵 서쪽 하늘이 아름답게 붉은빛으로 물드는 현상이에요.", "저녁이 되자 하늘 전체가 불타는 듯한 붉은 노을로 덮였다.", "아침에 해가 뜰 때 붉게 물드는 현상은 '아침노을'이라고 부른답니다."],
      ["눈바래기", "action", 3, "멀리 배웅을 가지 않고 선 자리에서 눈으로만 멀리까지 배웅하는 모습이에요.", "할머니께서는 내가 탄 버스가 안 보일 때까지 눈바래기로 지켜보셨다.", "헤어짐의 아쉬움이 듬뿍 묻어나는 정다운 우리말입니다."],
      ["뉘엿뉘엿", "time", 1, "해나 달이 서서히 산이나 지평선 너머로 넘어가려고 하는 모양이에요.", "서산 너머로 해가 뉘엿뉘엿 지기 시작하자 주변이 어둑어둑해졌다.", "시간이 천천히 흘러가며 저무는 평화로운 저녁 풍경에 어울려요."],
      ["너울", "nature", 2, "바다에서 일어나는 아주 크고 세차게 넘실거리는 거대한 물결입니다.", "태풍이 다가오자 바다에는 커다란 너울이 일어 방파제를 때렸다.", "일반적인 파도보다 훨씬 스케일이 크고 무서운 물결을 뜻해요."],
      ["나긋나긋하다", "heart", 2, "사람의 태도나 성질이 뻣뻣하지 않고 아주 부드럽고 친절한 모습이에요.", "항상 미소를 지으며 나긋나긋하게 말씀하시는 선생님의 수업은 참 편안하다.", "딱딱하고 무서운 태도와 반대되는 아주 다정하고 부드러운 성격의 칭찬입니다."],
      ["나부끼다", "action", 1, "깃발이나 얇은 천, 나뭇잎 따위가 바람에 가볍게 이리저리 흔들리는 모습이에요.", "학교 운동장 국기 게양대 위로 태극기가 힘차게 나부끼고 있다.", "가볍고 경쾌하게 바람에 날리는 긍정적이고 활기찬 느낌을 줍니다."],
      ["남우세", "heart", 3, "남에게 비웃음이나 조롱을 받을 만한 부끄러운 일이나 태도를 말해요.", "큰소리를 치고서 정작 대회에서 꼴찌를 하니 남우세를 사게 되었다.", "부끄러운 일을 당하지 않도록 스스로 행동을 조심하자는 뜻이 담겨 있어요."],

      ["나이", "time", 1, "사람이나 동물이 태어나서부터 지금까지 살아온 햇수를 세는 말입니다.", "어느덧 나이를 한 살 더 먹고 6학년의 최고 형님이 되었으니 의젓하게 행동해야지.", "나무의 나이를 뜻하는 '나이테'도 이 단어에서 유래한 정겨운 표현입니다."],

      ["다스리다", "action", 2, "국가를 관리하거나, 끓어오르는 자신의 화와 감정을 꾹 누르고 진정시키는 일이에요.", "순간 화가 났지만 심호흡을 하며 마음을 차분히 다스리고 오해를 대화로 풀었다.", "나쁜 감정에 휩쓸리지 않고 스스로를 통제하는 아주 지혜롭고 어른스러운 행동이죠."],
      ["다잡다", "action", 2, "흐트러진 마음이나 태도를 다시 단단히 굳게 먹고 바로잡는 굳센 행동이에요.", "여름방학이 끝나고 2학기에는 더 열심히 공부하겠다고 굳게 마음을 다잡았다.", "게을러지거나 포기하고 싶을 때 스스로를 응원하고 결심을 굳힐 때 쓰는 말입니다."],
      ["다짜고짜", "action", 1, "상황이나 앞뒤 사정을 알아보지도 않고 무턱대고 급하게 행동하는 모양이에요.", "친구가 아침에 교실에 들어오자마자 인사도 없이 다짜고짜 나에게 따져 물어 황당했다.", "이유도 묻지 않고 막무가내로 급하게 행동하여 당황스러울 때 주로 쓰이는 부사입니다."],
      ["단골", "daily", 1, "늘 정해 놓고 자주 가는 친숙한 가게나, 자주 만나는 아주 친밀한 사람을 말해요.", "학교 앞 맛있는 분식집은 우리 모둠 친구들이 하굣길에 매일 출근하는 단골 식당이다.", "한자어 같지만 사실 우리 조상 대대로 쓰여온 아주 친숙하고 정겨운 순우리말이랍니다."],
      ["달구지", "daily", 2, "소나 말이 끄는 짐수레를 뜻하는 전통 농경 사회의 아주 요긴한 시골 교통수단이에요.", "민속촌 현장체험학습을 가서 소가 느릿느릿 끄는 낡은 나무 달구지를 직접 타 보았다.", "요즘 시대의 트럭이나 택배차 역할을 묵묵히 담당하던 조상들의 소중한 도구랍니다."],
      ["달큼하다", "food", 2, "맛이나 냄새가 혀끝에 닿았을 때 기분 좋을 정도로 알맞게 단 느낌을 주는 말이에요.", "할머니께서 가을에 정성껏 끓여주신 노란 단호박죽이 참 달큼하고 목 넘김이 좋다.", "설탕처럼 너무 강한 단맛이 아니라 자연스럽고 은은해서 기분 좋은 맛의 표준어예요."],
      ["달포", "time", 3, "한 달이 조금 넘는 기간을 뜻하는, 옛 선비들이 쓰던 멋진 시간 표현이에요.", "여름방학을 한 지 벌써 달포가 지났는데도 계획한 책을 다 읽지 못해 아쉬움이 남는다.", "한 달 남짓한 시간을 한 달이라는 말 대신 조금 어른스럽고 멋스럽게 표현하는 단어입니다."],
      ["더기", "nature", 3, "산이나 들에 있는 고원처럼 아주 높고 넓으며 평평한 땅을 뜻하는 자연 낱말이에요.", "힘들게 산 정상에 올랐더니 탁 트인 푸른 더기가 펼쳐져 있어서 시원한 바람을 맞았다.", "우리가 평소에 잘 모르는 지형 이름이지만, 아주 웅장하고 너른 땅을 묘사할 때 쓰입니다."],
      ["더듬거리다", "action", 1, "말을 유창하게 못하고 자꾸 막히거나, 보이지 않아 손으로 이리저리 만지며 찾는 모습이에요.", "수업 시간에 갑자기 발표를 하게 되자 긴장해서 얼굴이 빨개지고 말을 자꾸 더듬거렸다.", "어두운 곳에서 전등 스위치를 찾을 때 벽을 더듬거리다라고 물리적인 행동으로도 써요."],
      ["더위잡다", "action", 3, "높은 곳에 오르려고 무엇을 꽉 끌어당겨 잡거나, 남보다 앞서기 위해 몹시 애쓰는 모습이에요.", "클라이밍 체험장에서 위쪽의 돌을 굳세게 더위잡고 기어올라 마침내 꼭대기 정상에 섰다.", "어려움을 이겨내고 한 단계 더 위로 꿋꿋하게 올라가려는 훌륭한 노력을 뜻하기도 합니다."],
      ["덜렁이", "heart", 1, "차분하지 못하고 행동이나 성격이 몹시 가벼워 실수를 자주 하는 사람을 귀엽게 부르는 말이에요.", "우리 반 최고의 덜렁이인 나는 오늘도 꼼꼼히 챙기지 못하고 실내화 주머니를 집에 두고 왔다.", "귀여운 실수를 하는 친구의 별명으로 많이 쓰이지만, 고학년이 되면 꼼꼼해지려 노력해야 해요."],
      ["덤", "daily", 1, "물건을 살 때 주인이 정해진 양보다 고마운 마음으로 조금 더 얹어 주는 여분의 물건이에요.", "문방구 아주머니께서 지우개를 사자 인사성이 바르다며 덤으로 달콤한 사탕을 하나 쥐여 주셨다.", "계산적인 세상을 따뜻하게 만드는 우리나라 특유의 넉넉한 인심과 정을 느낄 수 있는 낱말입니다."],
      ["덧없다", "heart", 2, "시간이 너무 빨리 지나가서 허무하거나, 삶이 알맹이가 없어 보잘것없다는 아쉬운 뜻이에요.", "6학년 1학기가 눈 깜짝할 사이에 덧없이 훌쩍 지나가 버려 제대로 논 기억이 없어 아쉽다.", "시간의 쏜살같은 빠름이나 인생의 덧없음을 시나 문학 작품처럼 감성적으로 표현할 때 씁니다."],
      ["도담도담", "action", 1, "어린아이나 새싹이 탈 없이 튼튼하고 탐스럽게 쑥쑥 잘 자라는 긍정적인 모양을 뜻해요.", "교실 뒤편 화분에 심어둔 강낭콩이 도담도담 잎을 내며 하루가 다르게 무럭무럭 잘 자라고 있다.", "귀중한 생명이 건강하게 성장하기를 간절히 바라고 축복할 때 쓰는 아주 예쁜 순우리말 부사예요."],
      ["도란도란", "action", 1, "여럿이 모여 나지막한 목소리로 정답고 다정하게 웃음꽃을 피우며 이야기를 나누는 모습입니다.", "현장체험학습 버스 안에서 짝꿍과 도란도란 수다를 떠느라 목적지까지 가는 시간 가는 줄을 몰랐다.", "가족이나 친구들과의 오붓하고 따뜻한 대화 시간을 묘사할 때 가장 잘 어울리고 많이 쓰입니다."],
      ["도랑", "nature", 2, "시골 마을이나 들판에 물이 졸졸 흐르도록 좁고 길게 파놓은 아주 작은 물길이나 냇물이에요.", "여름방학 때 시골 외갓집 앞 도랑에서 송사리와 올챙이를 잡으며 바지 가랑이가 젖도록 놀았다.", "도랑 치고 가재 잡는다는 속담은 도랑 청소도 하고 가재도 얻듯 한 일로 두 이익을 얻는다는 뜻이에요."],
      ["도르리", "action", 3, "여러 사람이 음식을 똑같이 나누어 먹거나, 물건을 살 비용을 공평하게 나누어 내는 훌륭한 일이에요.", "모둠 과제가 끝나고 분식집에서 떡볶이를 맛있게 먹은 뒤 우리는 각자 용돈으로 공평하게 도르리를 했다.", "오늘날의 더치페이나 뿜빠이 같은 외국어를 완벽하게 대체할 수 있는 우리 조상들의 지혜로운 단어예요."],
      ["돋우다", "action", 2, "감정이나 기운이 높아지게 하거나, 밑을 괴어서 위로 도톰하게 쑥 높아지게 만드는 행동이에요.", "체육대회 때 응원 단장이 큰 목소리로 화이팅을 외치며 우리 반 선수들의 사기를 한껏 돋우어 주었다.", "화를 돋우다처럼 부정적인 감정을 부추길 때 쓰기도 하지만 입맛을 돋우다처럼 긍정적으로도 쓰입니다."],
      ["동무", "heart", 1, "늘 친하게 어울려 노는 친구나 단짝 짝꿍을 정겹고 따뜻하게 부르는 아주 훌륭한 옛말이에요.", "유치원 때부터 매일 등교를 같이하며 내 고민을 잘 들어주는 지훈이는 나의 가장 소중한 친한 동무다.", "어깨동무, 길동무처럼 어딘가를 사이좋게 함께하는 관계를 나타낼 때 뒤에 붙어서 예쁜 말을 만듭니다."],
      ["동아리", "daily", 1, "같은 뜻이나 같은 취미를 가진 사람들이 자발적으로 모여서 만든 즐겁고 유익한 학교 모임이나 단체예요.", "나는 평소에 컴퓨터 코딩과 로봇 조립을 아주 좋아해서 이번 학기에 과학 발명 동아리에 기쁘게 가입했다.", "학교생활에서 친구들과 공통의 관심사를 즐겁게 나누고 실력을 키울 수 있는 아주 좋은 교내 모임이죠."],
      ["동트다", "time", 1, "캄캄한 새벽에 동쪽에서 해가 떠오르며 온 세상이 서서히 희미하게 밝아지기 시작하는 희망찬 시간이에요.", "수련회 마지막 날 일출을 보려고 새벽 일찍 산에 올랐더니 저 멀리 바다에서 하늘이 동트는 모습이 장관이었다.", "길고 긴 어둠이 마침내 끝나고 새로운 희망의 시작이 열리는 아주 긍정적이고 벅찬 순간을 의미하는 말이에요."],
      ["두남받다", "heart", 3, "남에게 남다른 도움이나 특별한 돌봄과 사랑을 아주 듬뿍 받아 몸과 마음이 편안해지다는 따뜻한 뜻이에요.", "부모님의 조건 없는 따뜻한 사랑으로 두남받으며 자라난 나는 매사에 구김살 없이 늘 긍정적이고 밝게 컸다.", "누군가의 각별한 애정과 보살핌을 당연하게 여기지 않고 진심으로 감사하게 여길 때 쓰는 훌륭한 단어입니다."],
      ["두루뭉술하다", "heart", 2, "말이나 행동이 모나거나 정확하지 않고, 대충 둥글고 원만하게 엉너리로 스리슬쩍 넘어가는 어설픈 모습이에요.", "모둠 토의 시간에 구체적인 의견을 물어보자 준비를 안 한 지호가 대충 두루뭉술하게 변명하듯 얼버무려 대답했다.", "좋게 포장하면 성격이 둥글둥글하고 원만한 것이지만, 나쁘게 말하면 일 처리가 정확하거나 꼼꼼하지 않은 거예요."],
      ["두레", "daily", 2, "옛날 농촌에서 힘든 농사일을 서로 돕기 위해 마을 사람들이 자발적으로 뭉쳐서 만든 전통 협동 단체예요.", "우리 조상들은 바쁜 모내기 철이 오면 다 같이 두레를 만들어 내 논 네 논 가리지 않고 서로 땀 흘려 기쁘게 도와주셨다.", "도덕이나 사회 시간에 배우는 우리 민족 고유의 아름다운 상부상조와 협동 정신을 가장 잘 보여주는 역사적인 단어입니다."],
      ["둔덕", "nature", 2, "가운데가 밥그릇을 엎어놓은 것처럼 볼록하게 둥글게 솟아오른 작은 언덕이나 흙더미를 정겹게 부르는 말이에요.", "점심을 먹고 학교 뒤뜰의 푸른 둔덕에 친구들과 빙 둘러앉아 상쾌한 바람을 쐬며 오늘 저녁 메뉴에 대해 수다를 떨었다.", "가파르고 험한 산비탈보다는 높이가 낮고 둥글둥글해서 아이들이 굴러놀기 좋은 동네 뒷산이나 공원 같은 느낌을 줍니다."],
      ["둘레", "daily", 1, "어떤 사물이나 장소의 겉을 한 바퀴 빙 돌아가는 가장자리 선이나, 그 선을 따라 잰 길이의 단위를 뜻해요.", "체육 시간에 준비 운동으로 거대한 운동장 둘레를 세 바퀴나 전력 질주해 돌고 나니 숨이 턱 끝까지 헉헉 차올랐다.", "수학 시간에 다각형과 원의 성질을 배울 때 넓이와 함께 반드시 꼭 공식을 외우고 계산하게 되는 아주 중요한 개념입니다."],
      ["둥지", "nature", 1, "새나 짐승이 알을 낳고 새끼를 안전하게 기르기 위해 마른 나뭇가지나 푹신한 풀로 둥글게 엮어서 튼튼하게 만든 집이에요.", "학교 화단 커다란 은행나무 위에 까치 한 쌍이 부지런히 굵은 나뭇가지를 물어다 폭풍우에도 끄떡없는 둥지를 단단히 틀었다.", "동물들의 집뿐만 아니라 우리가 사랑하는 가족들이 오순도순 모여 사는 편안하고 아늑한 우리 집을 문학적으로 비유하기도 해요."],
      ["뒤뚱거리다", "action", 1, "무거운 몸이나 커다란 엉덩이를 좌우로 어설프게 크게 흔들며 중심을 잡지 못하고 불안하게 걷는 귀여운 모습이에요.", "동물원 눈밭에서 통통한 펭귄 무리가 짧은 다리로 뒤뚱거리며 물가로 아장아장 걷는 모습이 너무 우스꽝스럽고 귀여웠다.", "아기들이 막 걸음마를 배울 때나 통통한 동물들이 몸이 무거워 심하게 흔들리며 걷는 모습을 아주 생생하게 나타내는 의태어입니다."],
      ["뒤웅박", "daily", 3, "둥근 박을 반으로 쪼개지 않고 꼭지 부근만 작게 구멍을 뚫어 숟가락으로 속을 파내고 끈을 달아 만든 전통 바가지예요.", "가을에 지붕 위에 잘 익은 조롱박으로 단단한 뒤웅박을 만들어 귀한 씨앗을 안전하게 보관하던 조상들의 알뜰한 지혜가 엿보인다.", "여자의 운명은 뒤웅박 팔자라는 옛날 속담은 한 번 그 안에 갇히거나 매이면 운명을 스스로 바꾸고 빠져나오기 힘들다는 뜻이에요."],
      ["들러리", "action", 2, "어떤 행사의 주인공을 돋보이게 하기 위해 곁에 서서 옆을 장식하거나 주인공을 도와주는 든든한 조연 역할의 사람이에요.", "오늘 학예회 연극 무대에서 나는 비록 대사가 많은 주인공은 아니지만 주인공을 돕는 멋진 들러리 역할을 불평 없이 톡톡히 해냈다.", "남을 훌륭하게 돕는 역할을 뜻하지만, 때로는 내가 주도하지 못하고 남을 위해 헛고생을 했을 때 난 들러리만 섰어라며 섭섭함을 표현해요."],
      ["들마", "time", 3, "시장 거리의 가게나 상점들이 하루의 영업을 모두 마치고 문을 닫기 위해 물건을 정리할 무렵의 조용한 저녁 시간이에요.", "엄마 심부름으로 늦게 시장에 갔더니 이미 들마 시간이 다 되어서 상인 아주머니들이 남은 물건을 싸게 떨이로 팔며 정리하고 계셨다.", "치열하게 물건을 팔던 하루의 수고를 마감하고 가족이 기다리는 집으로 돌아갈 준비를 하는 상인들의 조금은 쓸쓸하고 조용한 시간입니다."],
      ["들썩이다", "action", 1, "어떤 가벼운 물건이나 사람의 몸이 흥분을 가라앉히지 못하고 위아래로 가볍게 자꾸 우쭐거리며 움직이는 신나는 모양이에요.", "모두가 간절히 기다리던 가을 체육대회 전날 밤, 반 친구들 모두가 1등을 하겠다는 기대감에 엉덩이가 들썩여서 밤잠을 설쳤다고 한다.", "너무 신나거나 흥분해서 엉덩이나 어깨를 가만히 두지 못하고 리듬을 탈 때 학생들의 일상생활에서 아주 자주 쓰는 경쾌한 표현이에요."],
      ["듬직하다", "heart", 1, "사람의 체격이 크거나 성격이 가볍지 않고 묵직해서, 다른 사람이 곁에 두기에 몹시 믿음직하고 든든하게 의지가 되는 느낌이에요.", "항상 솔선수범해서 남들이 싫어하는 궂은일을 불평 없이 묵묵히 도맡아 하는 우리 반 부회장은 선생님이 보시기에도 정말 듬직하다.", "외모가 귀엽다거나 잘생겼다는 가벼운 칭찬보다 인성이나 책임감이 훨씬 묵직하여 타인에게 깊은 신뢰를 주는 아주 훌륭하고 기분 좋은 칭찬이랍니다."],
      ["뜻", "heart", 1, "사람이 마음속에 굳게 품고 있는 생각이나 달성하려는 목표, 또는 낱말이나 문장이 가지고 있는 정확한 의미를 가리키는 뼈대 고유어예요.", "어려운 순우리말 사전의 단어 뜻을 하나하나 꼼꼼히 열심히 외워서 학교에서 열린 우리말 겨루기 골든벨 퀴즈 대회에서 영광의 1등을 차지했다.", "훌륭한 사람이 되겠다는 마음먹은 바를 이루겠다는 뜻을 품다라는 멋진 표현으로도 많이 쓰이며 언어 학습의 가장 기본이 되는 중요한 단어입니다."],
      ["뚱딴지", "daily", 1, "울퉁불퉁한 돼지감자를 일컫는 옛말이면서, 상황에 전혀 맞지 않게 엉뚱한 행동이나 어리석은 말을 불쑥 꺼내는 눈치 없는 사람을 비유해요.", "다들 진지한 표정으로 수학여행 장소를 고르기 위해 모둠 토의를 하고 있는데, 지훈이가 뚱딴지같이 저녁 메뉴 이야기를 꺼내서 흐름이 탁 끊겼다.", "진지한 분위기에 어울리지 않게 엉뚱한 소리를 하거나 맥락 없는 돌발 행동을 할 때 뚱딴지같은 소리 하지 말라며 가볍게 꼬집는 핀잔의 말이랍니다."],
      ["다듬다", "action", 1, "불필요한 부분을 잘라내어 모양을 가지런하고 예쁘게 정리하거나, 글이나 말을 매끄럽게 고치는 섬세한 행동이에요.", "엄마께서 저녁 찌개에 넣을 파와 마늘을 도마 위에서 깔끔하게 다듬으시는 동안, 나는 오늘 쓴 일기의 삐뚤어진 글씨와 어색한 문장을 예쁘게 다듬었다.", "외모를 단정하게 꾸미는 것뿐만 아니라 자신의 생각과 실력을 갈고닦아 더 훌륭하게 발전시키는 성장의 과정을 비유할 때도 쓰이는 아주 좋은 말입니다."],
      ["다락", "daily", 2, "방의 천장과 지붕 사이의 빈 공간에 물건을 넣어두기 위해 널빤지를 막아 만든, 옛날 집의 비밀스럽고 비좁은 수납 공간이에요.", "시골 할아버지 댁 안방 문 위에는 작은 다락이 있는데, 그곳에는 할아버지가 아끼시는 오래된 옛날 책과 신기한 골동품들이 먼지를 쓰고 가득 쌓여 있다.", "요즘 아파트에서는 보기 힘들지만 숨바꼭질하기에 딱 좋은 비밀 아지트 같은 느낌을 주며, 옛날 어린이 동화책에 단골로 등장하는 신비로운 장소랍니다."],
      ["다름없다", "heart", 1, "두 가지 사물이나 사람의 모습, 상황이 서로 똑같아서 견주어 보았을 때 차이점이 조금도 없다는 확실한 뜻이에요.", "매일 아침 나를 깨워주고 학교에 지각하지 않게 챙겨주는 짝꿍 지민이는 나에게 있어 진짜 친동생이나 다름없는 가장 소중하고 고마운 평생 단짝 친구다.", "비유를 할 때 아주 강력한 확신을 주는 단어로, 마치 진짜 그것과 똑같다는 점을 강조하고 싶을 때 다른 한자어보다 훨씬 피부에 와닿게 쓰이는 고유어입니다."],
      ["단출하다", "daily", 2, "가족의 수가 적어서 밥그릇이 적거나, 짐이나 옷차림이 복잡하지 않고 아주 가볍고 간편하다는 실용적인 뜻을 가졌어요.", "우리 가족은 이번 주말에 무거운 텐트를 챙기는 대신 작은 돗자리와 김밥만 싸서 아주 단출한 차림으로 가까운 한강 공원에 가볍게 소풍을 다녀왔다.", "욕심을 부려 짐을 잔뜩 바리바리 싸 들고 가는 것보다 꼭 필요한 것만 챙기는 아주 깔끔하고 지혜로운 생활 태도를 칭찬할 때 쓰기 좋은 부드러운 단어입니다."],
      ["닫집", "daily", 3, "옛날 궁궐이나 절에 가면 왕이 앉는 자리나 부처님 동상 바로 위 천장에 화려하게 나무를 조각해 매달아 놓은 작은 집 모양의 장식이에요.", "현장체험학습으로 방문한 경복궁 근정전에서 임금님이 앉으시던 어좌 위를 올려다보니 정교하게 조각된 두 마리의 용이 화려한 닫집을 늠름하게 감싸고 있었다.", "왕의 권위나 부처님의 신성함을 높여주기 위한 우리 전통 건축의 아름다운 예술품으로, 역사 시간에 궁궐 구조를 배울 때 꼭 알아두면 아는 척하기 좋은 단어랍니다."],
      ["달래다", "action", 1, "우는 아이의 기분을 맞춰 주어 울음을 그치게 하거나, 슬프고 억울한 마음이 든 사람을 부드러운 말로 어루만져 진정시키는 따뜻한 행동이에요.", "체육대회 이어달리기에서 넘어져서 바통을 놓친 바람에 엉엉 울고 있는 지훈이에게 다가가 1등보다 안 다친 게 다행이라며 어깨를 주무르며 따뜻하게 달랬다.", "갈증을 달래다처럼 배고픔이나 목마름 같은 육체적인 고통을 잠시 참게 만들 때도 쓰이지만, 가장 많이 쓰일 때는 상처받은 마음을 사랑으로 치유해 줄 때입니다."],
      ["덧붙이다", "action", 1, "이미 해 놓은 말이나 만들어 놓은 물건에다 자기의 생각이나 다른 물건을 추가로 조금 더 보태어 붙이는 행동이에요.", "모둠 토의 시간에 회장인 민수가 발표한 훌륭한 재활용 아이디어에, 내가 종이팩을 따로 모으자는 구체적인 실천 방법을 한마디 더 덧붙여서 완벽한 계획을 만들었다.", "단순히 더한다는 뜻의 한자어 추가(追加)하다보다 훨씬 우리말의 맛을 잘 살려주는 말로, 대화나 글쓰기를 할 때 내용의 뼈대에 살을 쏙쏙 붙여 풍성하게 만들 때 씁니다."],
      ["도리어", "action", 2, "상황이 기대했거나 예상했던 것과는 전혀 반대로, 오히려 앞뒤가 엉뚱하게 뒤바뀌어 버린 어이없는 상황을 나타내는 말이에요.", "동생이 내 숙제 노트를 찢어놓아서 화를 냈는데, 동생은 미안해하기는커녕 도리어 자기가 놀라 울음을 크게 터뜨리며 엄마에게 이르러 가서 몹시 황당하고 억울했다.", "적반하장처럼 잘못한 사람이 오히려 큰소리를 칠 때나, 좋은 의도로 한 일이 반대의 나쁜 결과를 가져왔을 때 변명하거나 억울함을 호소하기 좋은 유용한 부사입니다."],
      ["동그라미", "daily", 1, "컴퍼스를 빙 돌려 그은 선처럼 모난 곳이 없이 동그랗게 꽉 찬 모양을 뜻하는 기호이자 아주 예쁘고 긍정적인 우리말 이름이에요.", "수학 시험지를 채점할 때 선생님이 빨간 색연필로 크고 시원하게 쳐주시는 동그라미 표시는 백 점을 맞았을 때 세상을 다 가진 것처럼 기분 좋게 만드는 마법의 마크다.", "세모나 네모처럼 각진 곳이 없기 때문에 사람의 성격이 아주 원만하고 친구들과 둥글둥글 사이좋게 잘 지내는 좋은 성품을 칭찬할 때 동그라미 같은 성격이라고 비유해요."],
      ["두드러지다", "action", 1, "평평한 곳에서 어떤 부분이 툭 튀어나와 있거나, 많은 사람 속에서 어떤 사람의 성적이나 재능이 특별히 뛰어나 눈에 확 띄는 모습이에요.", "우리 반 아이들은 모두 각자의 장점이 있지만, 그중에서도 그림 그리기 대회만 나가면 항상 대상을 휩쓰는 지민이의 예술적 재능은 누가 봐도 가장 두드러지게 돋보인다.", "신체적인 특징(여드름이 두드러지다)을 나타낼 때도 쓰지만, 남들보다 훨씬 훌륭한 6학년 학생들의 실력이나 훌륭한 인성을 칭찬할 때 더욱 값지게 쓰이는 긍정적인 동사입니다."],
      ["드물다", "daily", 1, "어떤 일이나 물건이 흔하게 있지 않고 발생 횟수가 아주 적어 쉽게 찾아볼 수 없거나 몹시 귀하고 진귀하다는 상태를 뜻해요.", "아무리 스마트폰 게임이 유행하는 요즘이라지만, 쉬는 시간마다 도서관에 틀어박혀 두꺼운 백과사전만 읽는 민수 같은 학생은 전교에서도 찾아보기 힘들 정도로 아주 드문 경우다.", "흔하지 않다는 의미를 넘어 남들이 갖지 못한 희소성을 가져 가치가 높다는 뜻도 되니, 참 드문 인재다라는 칭찬을 들었다면 자신이 아주 특별하고 훌륭한 존재임을 자랑스러워해도 됩니다."],
      ["띠", "daily", 1, "옷이 벗겨지지 않도록 허리에 단단히 두르는 끈, 혹은 하늘이나 바다에 길고 선명하게 펼쳐진 색깔의 뭉친 무리를 묘사할 때 쓰는 말이에요.", "미술 시간에 붓에 다양한 물감을 묻혀 새하얀 도화지 가운데에 일곱 빛깔의 아름다운 무지개색 띠를 길고 굵게 그려 넣었더니 작품이 멋지게 완성되었다.", "태어난 해를 동물의 이름으로 나타내는 12지신 띠(쥐띠, 소띠, 호랑이띠 등)를 뜻하기도 하여 새해가 되면 올해는 무슨 띠의 해인지 꼭 확인하게 되죠."],
      ["마루", "daily", 1, "한옥에서 방과 방 사이나 방 앞에 널빤지를 깔아 만든 바닥이에요.", "여름방학에 할머니 댁 마루에 누워 수박을 먹으니 무척 시원했다.", "산이나 지붕의 가장 높은 꼭대기를 뜻할 때도 쓰는 순우리말이에요."],
      ["마중", "action", 1, "역이나 터미널 등에 나가서 오는 사람을 반갑게 맞이하는 일이에요.", "비가 쏟아지자 우산을 들고 정문 앞까지 동생을 마중 나갔다.", "반대로 떠나는 사람을 밖으로 나가서 보내는 일은 '배웅'이라고 해요."],
      ["마파람", "nature", 2, "뱃사람들이 남쪽에서 불어오는 바람을 부르는 고유어예요.", "따뜻한 마파람이 불어오자 교실 창가의 커튼이 살랑살랑 흔들렸다.", "'마파람에 게 눈 감추듯'은 음식을 아주 빨리 먹어 치운다는 속담이에요."],
      ["마냥", "action", 2, "부족함이 없이 실컷, 또는 언제까지나 줄곧 계속되는 모양이에요.", "방학이 마냥 계속될 것만 같았는데 어느새 개학 날이 코앞으로 다가왔다.", "어떤 상태나 행동이 끝없이 계속될 때 문장을 꾸며주는 부사입니다."],
      ["마뜩하다", "heart", 3, "제법 마음에 들 만큼 아주 만족스럽다는 뜻을 가진 형용사예요.", "친구의 제안이 마뜩하지 않았지만 모둠을 위해 일단 따르기로 했다.", "보통 '마뜩하지 않다'나 '마뜩잖다'처럼 부정하는 형태와 짝을 이뤄 씁니다."],
      ["마당", "daily", 1, "집의 앞이나 뒤에 평평하게 닦아 놓은 흙이나 시멘트 땅이에요.", "명절에 온 가족이 둥근 달이 뜬 마당에 모여 윷놀이를 하며 놀았다.", "'놀이마당'처럼 여럿이 모여 어떤 일을 벌이는 자리를 뜻하기도 해요."],
      ["마무리", "action", 1, "어떤 일의 끝을 맺는 일, 또는 그 일의 가장 마지막 부분이에요.", "모둠 발표를 잘 마무리하기 위해 우리가 알게 된 점을 한 문장으로 요약했다.", "시작만큼 끝맺음도 중요하다는 뜻으로 '마무리가 중요하다'고 말하죠."],
      ["마디", "daily", 1, "대나무나 뼈처럼 길게 이어진 것의 불룩하게 도드라진 부분이에요.", "대나무는 마디마다 힘을 모아 꺾이지 않고 하늘을 향해 곧게 자란다.", "'한마디', '두 마디'처럼 말이나 노래의 한 도막을 세는 단위로도 써요."],
      ["마실", "daily", 2, "동네 이웃집에 가볍게 놀러 가는 일을 정겹게 부르는 고유어예요.", "저녁을 드시고 난 할머니께서는 옆집으로 마실을 다녀오시겠다고 하셨다.", "사투리 같지만 국립국어원에 당당히 등재된 표준어랍니다."],
      ["마침내", "time", 1, "오랜 시간이나 힘든 과정을 지나 가장 끝에 이르러서를 뜻해요.", "몇 주 동안 땀 흘려 연습한 끝에 마침내 줄넘기 이단 뛰기를 성공했다.", "'드디어'나 '결국'과 비슷하지만 긴 노력 끝에 이루어졌을 때 잘 어울려요."],
      ["막내", "daily", 1, "여러 형제자매 가운데 맨 나중에 태어난 가장 어린 사람이에요.", "우리 집 막내인 나는 중학생 언니와 오빠에게 매일 사랑을 듬뿍 받는다.", "'막둥이'도 같은 뜻을 가진 귀엽고 정겨운 우리말이랍니다."],
      ["맏이", "daily", 1, "여러 형제자매 가운데 가장 먼저 태어난 맏아들이나 맏딸이에요.", "동생들을 돌보는 맏이로서 책임감을 가지고 항상 모범을 보이려 노력한다.", "장남이나 장녀라는 한자어를 대신해서 쓸 수 있는 아주 좋은 단어예요."],
      ["말갛다", "nature", 2, "티끌 하나 없이 깨끗하고 맑다는 뜻을 가진 부드러운 단어예요.", "세수를 하고 나온 동생의 얼굴이 솜털이 보일 정도로 말갛게 빛났다.", "국 같은 것이 진하지 않고 묽을 때나, 맑고 순수한 표정을 지을 때 써요."],
      ["맑다", "nature", 1, "잡스럽고 탁한 것이 전혀 섞이지 않고 아주 깨끗하다는 뜻이에요.", "비가 갠 뒤 맑은 하늘에 일곱 빛깔 무지개가 선명하게 떠올랐다.", "물이나 공기뿐만 아니라 '맑은 마음', '맑은 정신'처럼 눈에 안 보이는 것에도 써요."],
      ["매무새", "daily", 3, "옷을 다 입고 났을 때의 맵시나 깔끔한 모양새를 뜻해요.", "강당에서 발표를 하기 전에 거울을 보며 옷매무새를 단정하게 가다듬었다.", "주로 '매무새를 고치다', '매무새를 다듬다'라는 표현으로 함께 씁니다."],
      ["매듭", "daily", 1, "끈이나 실 따위를 단단히 묶어서 맺은 부분이에요.", "넘어지지 않도록 운동화 끈을 튼튼하게 매듭지어 묶고 달리기를 시작했다.", "'매듭을 짓다'는 어떤 일을 훌륭하게 잘 끝마친다는 비유로도 많이 쓰여요."],
      ["맵시", "daily", 2, "옷을 입거나 몸가짐을 했을 때 보기 좋게 어울리는 아름다운 모양이에요.", "한복을 곱게 차려입은 친구의 맵시가 평소보다 훨씬 단정하고 아름다웠다.", "'맵시 있다', '맵시를 부리다'처럼 단정하고 멋진 자태를 칭찬할 때 써요."],
      ["머금다", "action", 2, "물이나 눈물, 웃음 따위를 입 안이나 얼굴에 지니고 있는 행동이에요.", "전학을 가는 친구가 눈물을 글썽이며 슬픈 미소를 머금고 인사를 건넸다.", "아침이 되어 '이슬을 머금은 풀잎'처럼 물기를 품은 싱그러운 모습에도 써요."],
      ["머뭇거리다", "action", 1, "어떤 말이나 행동을 선뜻 하지 못하고 자꾸 망설이며 주저하는 모습이에요.", "정답을 알고 있었지만 혹시 틀릴까 봐 쑥스러워서 손을 들지 못하고 머뭇거렸다.", "자신감이 부족해서 행동을 미루는 모습으로, 용기를 내라는 격려가 필요해요."],
      ["메아리", "nature", 1, "산이나 골짜기에서 소리를 지르면 부딪혀서 되돌아 들리는 소리예요.", "산꼭대기에서 두 손을 모으고 '야호!' 하고 외치자 메아리가 길게 울려 퍼졌다.", "소리의 반사 현상으로, 남의 말에 똑같이 동조하는 것을 비유하기도 해요."],
      ["모둠", "daily", 1, "수업이나 어떤 활동을 함께하기 위해 몇 사람씩 묶은 작은 무리예요.", "우리 모둠은 역할을 공평하게 나누어 협동한 덕분에 과제를 가장 먼저 마쳤다.", "교실에서 흔히 쓰는 한자어 '조(組)'를 아름다운 우리말로 순화한 단어랍니다."],
      ["모락모락", "action", 1, "연기나 냄새 따위가 계속 가볍고 동그랗게 피어오르는 모양이에요.", "추운 겨울날 급식실에 들어서자 따끈한 국에서 김이 모락모락 피어올랐다.", "어린아이들이 무럭무럭 자라는 모양이나 긍정적인 생각이 자꾸 떠오를 때도 써요."],
      ["모래", "nature", 1, "바위나 돌이 아주 잘게 부서져서 이루어진 작고 고운 알갱이예요.", "여름휴가 때 바닷가 부드러운 모래 위에 친구와 함께 커다란 성을 쌓았다.", "자갈보다 작고 흙보다 큰 알갱이로, 바위의 풍화 작용을 보여주는 자연물입니다."],
      ["모시다", "action", 1, "웃어른이나 존경하는 사람을 가까이에서 받들거나 정성껏 대접하는 일이에요.", "주말에 부모님과 함께 할머니를 모시고 단풍이 예쁜 산으로 나들이를 다녀왔다.", "'데리다'의 높임말로, 어른을 대하는 예의 바른 태도를 나타내는 고유어입니다."],
      ["몽글몽글", "nature", 2, "어떤 덩어리가 아주 연하고 매끄럽게 둥글게 뭉쳐 있는 부드러운 모양이에요.", "점심 급식으로 나온 순두부찌개의 몽글몽글한 두부가 아주 고소하고 맛있었다.", "하늘에 둥글게 뭉쳐 떠오르는 귀여운 뭉게구름을 묘사할 때도 잘 어울려요."],
      ["무지개", "nature", 1, "비가 갠 뒤 대기 중의 수방울에 햇빛이 굴절되어 나타나는 일곱 빛깔의 반원이에요.", "여름날 시원하게 소나기가 그치자 하늘에 선명하고 거대한 무지개가 떠올랐다.", "과학 시간에 배우는 빛의 굴절 현상으로, 희망과 아름다움을 상징합니다."],
      ["미쁘다", "heart", 3, "사람이나 행동이 듬직하여 아주 믿음성이 있다는 뜻을 가진 고유어예요.", "약속한 것은 무조건 꼭 지키는 우리 반 부회장은 정말 미쁜 친구다.", "'믿음직하다'와 같은 뜻을 가졌으면서도 훨씬 예스럽고 문학적인 느낌을 줍니다."],
      ["무릅쓰다", "heart", 2, "힘들고 피하고 싶은 어려움이나 위험을 꾹 참고 견디며 행동하는 굳은 태도예요.", "소방관 아저씨들은 목숨을 잃을 위험을 무릅쓰고 불길 속으로 뛰어들어 생명을 구하셨다.", "'무릎쓰다'라고 잘못 쓰기 쉬운데, 인내심을 나타내는 '무릅쓰다'가 맞습니다."],
      ["문득", "action", 1, "어떤 생각이나 느낌이 예고 없이 아주 갑자기 머릿속에 떠오르는 모양이에요.", "하교하는 길에 문득 어제 읽은 동화책의 마지막 감동적인 장면이 떠올랐다.", "'갑자기'라는 말보다 조용히 스치듯 일어나는 느낌이 들어 글쓰기에 아주 좋아요."],
      ["물꼬", "daily", 2, "논에 물이 알맞게 넘나들도록 한쪽을 틔워 만들어 놓은 좁은 통로예요.", "비가 오자 농부 아저씨께서는 논에 가서 물꼬를 트고 물이 잘 흐르도록 하셨다.", "대화의 물꼬를 트다처럼 막혀 있던 어떤 일이 시작되도록 길을 열어줄 때도 써요."],
      ["미투리", "daily", 3, "삼이나 튼튼한 노끈 따위로 짚신처럼 정교하게 엮어 만든 옛날 신발이에요.", "현장체험학습으로 방문한 민속촌에서 조상들이 신던 삼 미투리를 직접 신어 보았다.", "일반 짚신보다 훨씬 질기고 튼튼해서 먼 길을 갈 때 유용하게 쓰던 신발입니다."],
      ["모꼬지", "action", 3, "놀이나 잔치 또는 특별한 목적을 가지고 여러 사람이 한곳에 모이는 일이에요.", "방학을 맞이하여 동네 친구들과 함께 놀이터에 모여 즐거운 모꼬지를 열었다.", "대학생들의 '엠티(MT)'나 모임을 대체할 수 있는 아주 정겹고 예쁜 고유어랍니다."],
      ["무녀리", "daily", 3, "짐승이 한 번에 낳은 여러 마리의 새끼 가운데 가장 먼저 나온 새끼를 말해요.", "우리 집 강아지가 낳은 여섯 마리 중 무녀리는 몸집이 작지만 아주 활발하다.", "가장 먼저 태어나서 약하다는 뜻으로, 행동이 조금 모자란 사람을 비유하기도 해요."],
      ["말미", "time", 3, "일정한 직업이나 바쁜 일에서 잠시 벗어나 쉴 수 있는 자유로운 시간이에요.", "아버지께서는 회사에서 며칠간의 말미를 얻어 가족과 함께 가을 여행을 떠나셨다.", "끝부분을 뜻하는 한자어 '말미'와 소리는 같지만 완전 다른 뜻의 순우리말입니다."],
      ["먹먹하다", "heart", 2, "귀가 막힌 듯 소리가 안 들리거나, 큰 슬픔이나 감동으로 가슴이 꽉 막힌 느낌이에요.", "친구들이 만들어준 롤링페이퍼를 읽으며 감동으로 가슴이 먹먹해져 눈물이 났다.", "비행기를 타고 높이 올라갈 때 귀가 먹먹해지는 물리적인 현상에도 똑같이 써요."],
      ["멀미", "daily", 1, "차나 배, 비행기를 탔을 때 그 흔들림 때문에 속이 울렁거리고 어지러운 증세예요.", "수학여행 때 버스를 너무 오래 탔더니 멀미가 나서 창문을 열고 시원한 바람을 쐬었다.", "자연스러운 생리 현상으로, 증세가 심할 때는 미리 약을 먹어두는 것이 좋아요."],
      ["몽땅", "action", 1, "어떤 물건이나 양을 하나도 남김없이 모두 다 거두어들인 모양을 뜻해요.", "맛있는 과자를 나 혼자 몽땅 먹어 치우기 전에 친구들과 공평하게 나누어 먹었다.", "'모두', '전부'라는 말과 뜻이 같지만 훨씬 발음이 가볍고 입에 잘 붙는 느낌이에요."],
      ["마음", "heart", 1, "사람이 사물을 느끼고 생각하고 헤아리는 아주 깊은 속의 긍정적인 힘이에요.", "전학 와서 외로워 보이는 친구에게 따뜻한 마음으로 먼저 다가가 다정하게 말을 걸었다.", "한자어 심(心)에 해당하는 가장 아름답고 근본적인 순우리말로 다양한 표현에 쓰여요."],
      ["무던하다", "heart", 2, "사람의 성격이나 태도가 까다롭지 않고 둥글둥글하며 너그럽다는 뜻이에요.", "내 짝꿍은 누가 장난을 쳐도 화내지 않고 웃어넘길 정도로 성격이 참 무던하다.", "예민하지 않고 주변 사람들을 편안하게 해주는 아주 좋은 성품을 칭찬하는 말이에요."],
      ["무렵", "time", 1, "어떤 일이나 현상이 일어나는 시기와 대략 일치하는 즈음이나 때를 뜻해요.", "학교 수업이 모두 끝나고 노을이 지기 시작할 무렵, 우리는 운동장에서 축구를 했다.", "정확한 시간은 아니지만 대략적인 시간의 흐름을 나타낼 때 쓰는 편리한 말입니다."],
      ["뭉클하다", "heart", 1, "어떤 감동적인 일 때문에 슬픔이나 벅찬 기쁨이 가슴에 꽉 차오르는 느낌이에요.", "올림픽에서 우리나라 선수가 금메달을 따고 눈물을 흘릴 때 내 가슴도 뭉클했다.", "머리로 이해하는 것이 아니라 마음 깊은 곳에서 진한 감동을 느낄 때의 감정입니다."],
      ["마침", "time", 1, "어떤 기회나 때, 혹은 조건에 아주 딱 알맞게 우연히 들어맞는 상황을 뜻해요.", "비가 와서 우산을 안 가져가 걱정했는데, 마침 하굣길에 엄마가 데리러 오셨다.", "운이 좋거나 타이밍이 기가 막히게 잘 맞았을 때 감탄사처럼 쓰는 부사예요."],
      ["망설이다", "action", 1, "이리저리 생각만 하고 마음을 확실하게 정하지 못한 채 결정을 주저하는 모습이에요.", "짜장면을 먹을지 짬뽕을 먹을지 한참을 망설이다가 결국 볶음밥을 주문했다.", "어떤 선택을 앞두고 고민하는 자연스러운 모습이지만 때로는 과감한 결단이 필요해요."],
      ["매만지다", "action", 2, "옷이나 머리 모양을 아주 단정하고 보기 좋게 손으로 잘 만져 다듬는 행동이에요.", "무대에 오르기 직전, 거울 앞에서 떨리는 손으로 옷깃을 가지런히 매만졌다.", "어떤 일을 더 완벽하게 하기 위해 끝까지 정성을 들여 손보는 세심한 태도입니다."],
      ["무치다", "food", 1, "나물이나 채소에 소금, 간장, 참기름 같은 양념을 넣고 골고루 섞어 반찬을 만드는 일이에요.", "실과 시간에 배운 대로 시금치를 살짝 데친 후 참기름과 소금을 넣고 조물조물 무쳤다.", "불에 익히지 않고 신선한 재료에 맛을 더하는 우리나라 고유의 맛있는 조리법이에요."],
      ["미끄럽다", "nature", 1, "물건의 표면이 거칠지 않고 아주 반질반질하여 물체가 쑥 미끄러지기 쉬운 상태예요.", "겨울에 눈이 내린 뒤 바닥이 꽁꽁 얼어붙어 몹시 미끄러우니 주머니에서 손을 빼고 걸어야 한다.", "말이나 글이 막힘없이 아주 자연스럽고 유창하게 흘러갈 때도 비유적으로 사용해요."],
      ["미루다", "action", 1, "원래 정해진 시간이나 날짜에 하지 않고 그 일을 나중으로 넘기는 행동이에요.", "오늘 해야 할 숙제를 내일로 미루고 놀다가 결국 밤늦게까지 졸음을 참으며 숙제를 마쳤다.", "자기의 책임이나 잘못을 남의 탓으로 돌려 떠넘길 때도 '책임을 미루다'라고 씁니다."],
      ["미끼", "daily", 1, "낚시를 할 때 물고기를 꾀어 잡으려고 낚싯바늘에 꿰는 지렁이나 작은 떡밥이에요.", "아빠와 낚시를 가서 바늘에 통통한 지렁이 미끼를 끼워 던지자마자 큰 물고기가 물었다.", "사람을 속여서 끌어들이기 위해 교묘하게 던지는 거짓 정보나 유혹을 비유하기도 해요."],
      ["밉다", "heart", 1, "어떤 사람의 말이나 행동이 눈에 거슬리고 마음에 들지 않아 싫은 감정이 드는 상태예요.", "친구와 심하게 다투고 난 뒤에는 그 친구의 얼굴조차 밉게 느껴져서 한동안 말을 안 했다.", "사람의 자연스러운 부정적 감정이지만, 이 감정을 잘 풀고 용서하는 것이 6학년의 성숙함이에요."],
      ["묶다", "action", 1, "흩어지기 쉬운 끈이나 줄 따위를 매듭을 지어 단단하게 얽어매는 물리적인 행동이에요.", "신문지와 재활용품들이 바람에 날아가지 않도록 노끈으로 십자 모양을 내어 튼튼하게 묶었다.", "규칙이나 약속으로 사람의 행동을 자유롭지 못하게 얽매는 상황을 비유할 때도 쓰인답니다."],

      ["바구니", "daily", 1, "대나무나 싸리 따위를 엮어서 물건을 담을 수 있게 만든 그릇이에요.", "가을 소풍을 갈 때 맛있는 샌드위치를 예쁜 바구니에 차곡차곡 담아 갔다.", "물건을 담아 나르는 데 아주 유용한 전통 생활 도구랍니다."],
      ["바다", "nature", 1, "지구 위에서 육지를 둘러싸고 있는 넓고 깊은 짠물이에요.", "여름 방학에 가족과 함께 푸른 바다로 여행을 떠나 시원하게 수영했다.", "우리에게 가장 친숙하지만 아주 오래전부터 쓰여 온 순우리말이에요."],
      ["바르다", "heart", 1, "마음이나 행동이 삐뚤어지지 않고 곧고 정당하다는 뜻이에요.", "거짓말을 하지 않고 항상 바르게 행동하는 것이 6학년의 멋진 모습이다.", "자세나 길이 굽지 않고 똑바로 곧게 나 있을 때도 똑같이 쓰는 말이에요."],
      ["바쁘다", "action", 1, "해야 할 일이 많아서 몹시 서두르며 틈이 없는 상태예요.", "아침에 늦잠을 자는 바람에 학교에 지각하지 않으려고 아주 바쁘게 뛰어갔다.", "시간이 부족할 만큼 급하게 행동할 때 주로 쓰는 친숙한 단어입니다."],
      ["바위", "nature", 1, "부피가 아주 크고 단단한 무거운 돌덩어리를 뜻해요.", "산 정상에 있는 커다란 바위에 올라앉아 우리 동네를 한눈에 내려다보았다.", "흔들림 없이 굳세고 변하지 않는 의지를 비유할 때 '바위 같다'고 표현해요."],
      ["바투", "daily", 3, "두 물체 사이나 시간의 간격이 아주 짧고 가깝게 바짝 붙은 모양이에요.", "칠판 글씨가 잘 보이지 않아서 의자를 책상 쪽으로 바투 당겨 앉았다.", "'가까이'라는 말보다 훨씬 바짝 다가선 느낌을 주는 순우리말 부사예요."],
      ["바탕", "daily", 1, "사물이나 현상을 이루는 가장 기본이 되는 뿌리나 밑바닥이에요.", "수학은 덧셈과 뺄셈 같은 기초 바탕이 튼튼해야 어려운 문제도 쉽게 풀 수 있다.", "사람의 타고난 성격이나 자질의 근본을 뜻하기도 하는 아주 중요한 단어입니다."],
      ["바람", "nature", 1, "기압의 차이 때문에 공기가 한곳에서 다른 곳으로 움직이는 현상이에요.", "가을이 되니 시원한 바람이 불어와 나뭇잎이 살랑살랑 기분 좋게 흔들린다.", "눈에 보이지는 않지만 우리가 항상 느끼고 살아가는 자연의 움직임이에요."],
      ["반갑다", "heart", 1, "보고 싶던 사람을 만나거나 좋은 일이 생겨서 마음이 몹시 즐겁다는 뜻이에요.", "전학 갔던 친구가 오랜만에 학교에 놀러 와서 너무 반가워 덥석 안아주었다.", "사람을 만났을 때 마음의 문을 활짝 열어주는 가장 따뜻하고 좋은 인사말이에요."],
      ["밝다", "nature", 1, "빛이 있어 환하거나, 마음이나 표정이 구김살 없이 환하다는 뜻이에요.", "어두운 밤이 지나고 아침이 되자 온 세상이 아침 햇살을 받아 밝게 빛났다.", "성격이 명랑하고 긍정적일 때도 '성격이 참 밝다'라고 칭찬합니다."],
      ["밤", "time", 1, "해가 져서 어두워진 때부터 다음 날 해가 뜨기 전까지의 고요한 시간이에요.", "어젯밤에는 밤하늘에 반짝이는 수많은 별들을 보며 속으로 소원을 빌었다.", "먹는 열매인 '밤'과 글자는 같지만 뜻이 다른 동음이의어 말이에요."],
      ["방긋", "action", 1, "입을 조금 벌리며 소리 없이 가볍고 예쁘게 웃는 모양이에요.", "동생이 나를 보며 방긋 웃어 주니 학교에서 쌓인 피로가 다 날아가는 것 같았다.", "'방긋방긋'처럼 두 번 겹쳐 쓰면 더 귀엽고 연속적인 느낌이 듭니다."],
      ["방울", "daily", 1, "물이 떨어지거나 맺힐 때 생기는 아주 작고 둥근 액체 덩어리예요.", "풀잎에 맺힌 맑은 이슬방울이 아침 햇살을 받아 보석처럼 반짝였다.", "동그란 모양을 뜻해서 딸랑딸랑 맑은 소리가 나는 쇠공인 '방울'도 같은 말이에요."],
      ["버겁다", "heart", 2, "어떤 일을 하거나 감당하기에 내 능력이나 힘에 몹시 벅차다는 뜻이에요.", "모둠 과제를 혼자서 다 끝내기에는 조금 버겁게 느껴져서 친구들에게 도움을 청했다.", "'힘들다'보다 나에게 주어진 짐이나 책임이 무겁다는 느낌을 잘 표현해 줍니다."],
      ["버금", "daily", 3, "으뜸(첫째)의 바로 다음, 즉 두 번째 자리를 뜻하는 멋진 고유어예요.", "우리 반 달리기 선수는 전교 1등에 버금가는 아주 빠르고 훌륭한 실력을 갖췄다.", "'버금가다'라는 표현으로 쓰여서 첫째만큼이나 훌륭하다는 칭찬이 됩니다."],
      ["버릇", "daily", 1, "오랫동안 자꾸 반복해서 몸에 아주 굳어져 버린 행동이나 습관이에요.", "긴장할 때마다 손톱을 깨무는 나쁜 버릇을 고치기 위해 의식적으로 노력하고 있다.", "좋은 행동에는 '습관'을, 고쳐야 할 행동에는 '버릇'을 자주 씁니다."],
      ["버무리다", "food", 2, "여러 가지 재료나 양념을 한데 쏟아 넣고 골고루 뒤섞어 비비는 행동이에요.", "할머니와 함께 배추에 빨간 양념을 골고루 버무리며 겨울 김장을 도왔다.", "무언가를 골고루 섞어 맛을 낼 때 쓰는 아주 맛깔스러운 전통 요리 용어입니다."],
      ["벗", "daily", 1, "마음이 아주 잘 맞고 친하게 어울리는 친구를 예스럽게 부르는 말이에요.", "너는 내가 기쁠 때나 슬플 때나 항상 내 곁을 지켜주는 진정한 나의 벗이다.", "'친구(親舊)'라는 한자어를 완벽하게 대신할 수 있는 가장 아름다운 고유어예요."],
      ["베풀다", "action", 1, "자신의 것을 아끼지 않고 남에게 신세나 좋은 혜택을 나누어 주는 행동이에요.", "어려운 이웃에게 따뜻한 사랑을 베푸는 연탄 배달 봉사 활동에 참여해 뿌듯했다.", "나눔과 배려를 실천할 때 어울리는 아주 너그럽고 멋진 도덕적인 동사입니다."],
      ["번개", "nature", 1, "비가 오는 날 구름과 구름 사이에서 전기가 부딪쳐 번쩍하고 빛나는 현상이에요.", "갑자기 하늘에서 번쩍하고 번개가 치더니 우르릉 쾅쾅 천둥소리가 이어졌다.", "행동이 몹시 빠를 때 '번개처럼 빠르다'라고 아주 날쌔게 비유하기도 해요."],

      ["벼락", "nature", 1, "구름과 땅 사이에서 전기가 떨어지며 번쩍이는 빛과 큰 소리를 내는 무서운 현상이에요.", "어젯밤 숲속의 커다란 소나무가 벼락을 맞아 새까맣게 타버렸다고 뉴스에 나왔다.", "아주 짧은 시간 안에 서둘러서 일을 해치우는 '벼락치기' 공부도 이 말에서 왔어요."],
      ["벼리다", "action", 3, "무뎌진 연장을 불에 달구어 날카롭게 만들거나, 마음을 단단히 먹고 각오를 다지는 일이에요.", "이번 가을 체육대회에서는 꼭 우승하겠다고 마음속으로 굳게 다짐을 벼렸다.", "칼을 날카롭게 갈듯이 자신의 결심을 아주 굳세게 다질 때 쓰는 비유적인 표현입니다."],
      ["별", "nature", 1, "맑은 밤하늘에 빛을 내며 반짝이는 수많은 천체들을 부르는 말이에요.", "시골 밤하늘을 올려다보니 셀 수 없이 많은 별이 쏟아질 듯 맑게 반짝였다.", "태양처럼 스스로 빛을 내는 천체를 뜻하는 가장 낭만적이고 아름다운 순우리말이에요."],
      ["보듬다", "action", 2, "사람이나 동물을 가슴에 바짝 붙여 따뜻하게 안아 주는 다정한 행동이에요.", "강아지가 천둥소리에 놀라 덜덜 떨고 있길래 품에 꼭 보듬어 주며 안심시켰다.", "단순히 안는 것을 넘어 마음까지 따뜻하게 감싸준다는 의미가 가득 담겨 있어요."],
      ["보람", "heart", 1, "어떤 일을 힘들게 해낸 뒤에 얻어지는 좋은 결과나 아주 뿌듯한 마음이에요.", "일주일 내내 맹연습한 학예회 연극 무대를 성공적으로 마치니 가슴 벅친 보람을 느꼈다.", "고된 노력 끝에 얻는 가장 달콤하고 긍정적인 감정을 뜻하는 멋진 고유어입니다."],
      ["보살피다", "action", 1, "약한 사람이나 동물을 정성을 기울여 보호하며 돕고 돌보아 주는 일이에요.", "방학 동안 부모님을 도와서 어린 동생을 밥도 챙겨주며 다정하게 보살피고 놀아주었다.", "사랑과 관심을 듬뿍 담아 누군가를 지켜준다는 훌륭하고 도덕적인 뜻을 가졌어요."],
      ["보슬보슬", "nature", 1, "눈이나 비가 바람 없이 아주 조용하고 가늘게 계속해서 내리는 모양이에요.", "이른 아침 창밖을 보니 보슬보슬 봄비가 내려 마당의 잔디가 촉촉하게 젖어 있었다.", "굵은 비가 아니라 부드럽고 얌전하게 내리는 비를 묘사할 때 소리 내어 읽기 참 예뻐요."],
      ["보태다", "action", 2, "모자라는 것을 더하여 채우거나, 남의 일에 힘이나 마음을 더해 돕는 행동이에요.", "어려운 이웃을 돕는 연말 모금 행사에 내 작은 용돈을 보태어 따뜻한 마음을 전했다.", "서로의 힘과 마음을 합쳐서 더 크게 만들 때 쓰는 아주 긍정적인 말입니다."],
      ["봄", "time", 1, "겨울이 지나고 날씨가 따뜻해져 새싹이 돋아나는 아름다운 계절이에요.", "봄이 오니 얼었던 땅이 녹고 화단에 노란 개나리가 활짝 피기 시작했다.", "만물이 새로 피어나고 희망찬 한 해가 시작되는 시기를 뜻하는 이름이죠."],
      ["볼", "daily", 1, "사람의 얼굴에서 코와 귀 사이에 있는 양쪽의 둥글고 넓적한 부분이에요.", "추운 겨울바람을 오래 맞고 서 있었더니 양쪽 볼이 빨갛게 사과처럼 얼어버렸다.", "'뺨'과 거의 같은 뜻이지만, 통통하고 귀여운 느낌을 줄 때 주로 '볼'이라고 씁니다."],
      ["부끄럽다", "heart", 1, "자신의 잘못이나 약점 때문에 남을 대하기가 떳떳하지 못하거나 수줍은 감정이에요.", "선생님께서 반 친구들 앞에서 나를 칭찬하시자 너무 쑥스럽고 부끄러워서 얼굴이 붉어졌다.", "자신의 잘못을 뉘우칠 줄 아는 부끄러움은 6학년에게 꼭 필요한 멋진 태도랍니다."],
      ["부드럽다", "heart", 1, "만졌을 때 뻣뻣하지 않고 연하거나, 사람의 성격과 태도가 아주 상냥하다는 뜻이에요.", "항상 부드러운 목소리로 먼저 인사해 주는 친구 덕분에 우리 반 분위기가 아주 훈훈하다.", "물건의 촉감뿐만 아니라 마음씨가 따뜻할 때도 널리 칭찬으로 쓰입니다."],
      ["부랴부랴", "action", 2, "어떤 일이 생겨서 아주 급하게 허둥지둥 서두르는 모양을 뜻하는 재미있는 말이에요.", "늦잠을 자는 바람에 아침밥도 못 먹고 부랴부랴 가방을 메고 학교로 뛰어갔다.", "'불이야 불이야'에서 온 말로, 불이 났을 때처럼 몹시 다급한 상황을 실감 나게 나타내요."],
      ["부시다", "nature", 1, "빛이 너무 강해서 눈을 마주 뜨고 바라보기 어려울 정도로 아주 환한 상태예요.", "아침에 창문을 쫙 여니 찬란하고 눈이 부신 햇살이 방 안으로 가득 쏟아져 들어왔다.", "'눈부시다'라고 합쳐서 외모가 아름답거나 실력이 훌륭한 것을 칭찬할 때도 자주 씁니다."],
      ["부지런하다", "heart", 1, "게으름을 피우지 않고 자기가 맡은 일을 꾸준하고 성실히 해내는 훌륭한 성격이에요.", "비가 오나 눈이 오나 매일 아침 일찍 일어나 규칙적으로 운동을 하시는 아빠는 참 부지런하시다.", "6학년 학생들이 꼭 가져야 할 가장 모범적이고 칭찬받아 마땅한 태도입니다."],
      ["부추기다", "action", 2, "남의 마음을 이리저리 꾀어서 어떤 일을 하도록 슬쩍 밀어 올리거나 꼬드기는 일이에요.", "친구들이 옆에서 할 수 있다고 자꾸 부추기는 바람에 용기를 내어 장기 자랑 무대에 올라갔다.", "주로 안 좋은 일에 꼬일 때 많이 쓰지만, 용기를 내도록 옆에서 격려할 때도 쓸 수 있어요."],
      ["부풀다", "action", 1, "부피가 커지거나, 앞으로 일어날 좋은 일에 대한 기대감으로 마음이 한껏 설레는 상태예요.", "내일 친구들과 떠나는 수학여행 생각에 잔뜩 부푼 마음을 안고 신나게 가방을 챙겼다.", "풍선에 바람이 들어가 커지는 것처럼 내 마음속의 기쁨과 희망이 가득 차오를 때 씁니다."],
      ["붉다", "nature", 1, "빛깔이 잘 익은 고추나 맑은 피처럼 아주 선명하고 짙은 빨간색을 띤 상태예요.", "가을이 깊어지자 학교 뒤뜰의 단풍나무 잎이 아주 곱고 붉게 물들어 장관을 이루었다.", "한자어 '적(赤)'을 대신하여 색깔을 가장 강렬하고 생생하게 표현하는 우리말 형용사입니다."],
      ["붐비다", "action", 1, "좁은 곳에 아주 많은 사람이나 차가 한꺼번에 모여들어 복잡하고 꽉 막힌 상태예요.", "주말에 인기 있는 놀이공원에 갔더니 사람들이 너무 많이 붐벼서 놀이기구를 타기 힘들었다.", "사람들이 북적북적 모여 활기차면서도 복잡한 장소의 모습을 생생하게 보여주는 말이에요."],
      ["비", "nature", 1, "대기 중의 수증기가 뭉쳐 물방울이 되어 하늘에서 땅으로 떨어지는 날씨 현상이에요.", "가뭄으로 쩍쩍 메말랐던 텃밭에 시원한 비가 쏟아져서 식물들이 금세 생기를 되찾았다.", "봄비, 가랑비, 소나기, 는개 등 내리는 굵기와 모습에 따라 아주 다양한 이름이 파생된답니다."],
      ["비나리", "action", 3, "남의 앞길이 순탄하고 행복하기를 진심으로 간절히 빌어 주는 따뜻한 행동이에요.", "졸업식 날, 교장 선생님께서는 우리들의 찬란한 중학교 생활을 위해 진심 어린 비나리를 해주셨다.", "누군가의 성공과 평안을 간절히 응원하고 축복할 때 쓰이는 감동적이고 예스러운 단어예요."],
      ["비로소", "time", 2, "어느 특정한 때가 되어서야 마침내, 또는 그제야 처음으로라는 뜻을 가진 부사예요.", "수학 시험을 망치고 나서야 비로소 평소에 매일 꾸준히 복습하는 것이 중요하다는 것을 깨달았다.", "어떤 일의 결과를 겪고 나서 늦게 큰 깨달음을 얻었을 때 문장을 꾸며주는 훌륭한 말입니다."],
      ["비롯하다", "action", 2, "어떤 사물이나 현상이 처음으로 시작되거나, 그것을 맨 처음으로 삼아 일컫는 말이에요.", "담임 선생님을 비롯한 우리 반 친구들 모두가 한마음으로 뭉쳐 체육대회 종합 우승을 이뤄냈다.", "가장 대표적인 것을 맨 앞에 내세우고 그 뒤에 다른 것들도 다 포함된다고 할 때 씁니다."],
      ["비치다", "nature", 1, "빛이 나서 환하게 되거나, 거울이나 물 따위에 어떤 것의 모습이 투명하게 나타나는 현상이에요.", "맑은 호수 수면 위로 웅장한 산의 푸른 모습이 거울처럼 투명하게 비치어 무척 아름다웠다.", "마음속의 생각이나 숨겨둔 의도가 나도 모르게 얼굴 표정을 통해 겉으로 살짝 드러날 때도 사용해요."],
      ["빌다", "action", 1, "바라는 바가 꼭 이루어지도록 마음속으로 신이나 하늘에 간절히 바라고 청하는 일이에요.", "생일 케이크에 꽂힌 촛불을 훅 불면서 우리 가족이 모두 건강하기를 속으로 간절히 빌었다.", "자신의 잘못을 용서해 달라고 진심으로 뉘우치며 사과할 때도 '선생님께 용서를 빌다'라고 해요."],
      ["빙그레", "action", 1, "입을 조금 벌리고 부드럽고 다정하게 소리 없이 웃는 아주 예쁜 표정이나 모양이에요.", "내가 정성껏 포장해 건넨 생일 선물을 받고 짝꿍이 빙그레 웃어 주어서 나도 덩달아 기분이 좋았다.", "소리 내어 크게 깔깔 웃는 것보다 마음속의 잔잔한 기쁨이 얼굴에 은은하게 퍼질 때 씁니다."],
      ["빛", "nature", 1, "우리 눈을 자극하여 사물을 볼 수 있게 해 주는 밝고 환한 기운이나 에너지예요.", "어두운 터널을 다 빠져나오자 눈부시게 밝은 빛이 쏟아져 들어와 저절로 안도감이 들었다.", "절망 속의 희망이나 위대한 영광을 상징하여 '세상의 빛이 되어라'처럼 비유적으로 아주 훌륭한 단어입니다."],
      ["뺨", "daily", 1, "사람의 얼굴에서 코의 양옆 부분으로, 감정이 드러나면 쉽게 붉어지는 곳이에요.", "겨울바람이 너무 차가워서 밖에 조금만 서 있었는데도 양쪽 뺨이 얼음장처럼 차가워졌다.", "부끄럽거나 화가 났을 때 마음속 감정이 가장 솔직하게 나타나는 얼굴 부위랍니다."],
            ["사람", "daily", 1, "생각을 하고 도구를 쓰며 서로 어울려 살아가는 우리 자신을 뜻해요.", "우리는 서로의 다름을 존중하고 배려할 줄 아는 따뜻한 사람이 되어야 한다.", "너무 흔해서 한자어 같지만, 사실 우리 민족이 아주 오래전부터 써 온 아름다운 고유어랍니다."],
      ["사랑", "heart", 1, "어떤 대상을 몹시 아끼고 귀중하게 여기는 가장 아름다운 마음이에요.", "반려견을 키우면서 작은 생명을 책임지고 보호하는 진짜 사랑의 의미를 배웠다.", "부모님의 사랑, 친구와의 우정, 나라를 사랑하는 마음 등 아주 넓고 깊게 쓰이는 단어예요."],
      ["사뭇", "action", 3, "생각했던 것과는 아주 딴판으로 다르거나, 마음에 아주 깊이 사무치게라는 뜻의 부사예요.", "오랜만에 만난 유치원 동창의 의젓해진 모습이 어릴 때의 개구쟁이 모습과는 사뭇 달랐다.", "어떤 분위기나 상황이 예전과 확연히 다를 때 글을 아주 고급스럽게 만들어주는 표현입니다."],
      ["사뿐사뿐", "action", 1, "발소리가 나지 않을 정도로 아주 가볍고 조심스럽게 걷는 얌전한 모양이에요.", "도서관에서는 다른 사람들에게 방해가 되지 않도록 발뒤꿈치를 들고 사뿐사뿐 걸어야 한다.", "덩치가 큰 사람보다는 어린아이나 고양이가 가볍게 움직이는 귀여운 의태어로 자주 쓰여요."],
      ["살갑다", "heart", 2, "마음씨나 행동이 겉으로 보기보다 아주 다정하고 부드러워 정이 간다는 뜻이에요.", "평소에는 무뚝뚝해 보이던 짝꿍이 체육 시간에 다친 나에게 살갑게 밴드를 건네주어 감동했다.", "겉모습은 차가워 보여도 속마음은 곰인형처럼 따뜻하고 친절한 사람을 칭찬할 때 써보세요."],
      ["살포시", "action", 2, "어떤 행동이나 물건을 놓을 때 아주 가볍고 부드럽게 조심스럽게 하는 모양이에요.", "교실 창문으로 날아 들어온 작은 나비가 내 책상 위 지우개에 살포시 내려앉았다.", "'사뿐사뿐'이 걷는 모습이라면, '살포시'는 물건을 놓거나 미소를 지을 때 아주 예쁘게 쓰입니다."],
      ["살피다", "action", 1, "무언가를 주의 깊게 두루두루 속속들이 쳐다보거나 상황을 꼼꼼하게 알아보는 행동이에요.", "단원 평가 시험지를 제출하기 전에 혹시나 실수로 틀린 문제가 없는지 처음부터 꼼꼼히 살폈다.", "남의 눈치를 살피다, 주변을 살피다처럼 조심스럽게 관찰하는 6학년의 성숙한 태도를 나타냅니다."],
      ["새기다", "action", 1, "나무나 돌에 글씨나 그림을 파거나, 어떤 가르침을 잊지 않도록 마음에 깊이 간직하는 일이에요.", "오늘 교장 선생님께서 해주신 정직에 대한 훈화 말씀을 내 마음속 깊이 단단하게 새겼다.", "물리적으로 도장을 새기는 것뿐만 아니라, 은혜나 다짐을 마음속에 영원히 저장할 때 멋지게 쓰여요."],
      ["새록새록", "action", 2, "어떤 생각이나 느낌, 기억이 자꾸 새롭게 연달아 생겨나는 감성적인 모양이에요.", "졸업을 앞두고 앨범을 넘겨보니 1학년 때 친구들과 코흘리며 뛰놀던 추억이 새록새록 떠오른다.", "지나간 아름다운 추억이나 잊고 있던 좋은 아이디어가 계속 샘솟듯 떠오를 때 찰떡인 부사입니다."],
      ["새벽", "time", 1, "어두운 밤이 지나고 날이 밝아오기 시작하는 아주 이른 아침의 맑은 시간이에요.", "내일 수학여행을 간다는 설렘 때문에 밤잠을 설치다가 결국 창밖으로 동이 트는 새벽을 맞았다.", "어둠이 끝나고 새로운 하루가 시작되는 희망차고 고요한 시간을 상징하는 멋진 고유어예요."],
      ["새침하다", "heart", 2, "마음속으로는 안 그러면서 일부러 짐짓 딴청을 피우며 조금 차갑고 도도한 태도를 보이는 거예요.", "내가 장난을 치며 사과를 건넸지만 짝꿍은 여전히 단단히 삐친 듯 새침한 표정으로 앞만 보았다.", "진짜로 화가 난 것은 아니지만 살짝 토라져서 얌전을 빼는 친구의 귀여운 표정을 묘사할 때 써요."],
      ["샘", "heart", 2, "남이 나보다 잘되거나 좋은 것을 가진 것을 부러워하며 속상하고 미워하는 질투의 마음이에요.", "미술 대회에서 내 단짝 친구가 대상을 타자 진심으로 축하하면서도 내심 속으로 작은 샘이 났다.", "땅에서 솟아나는 물을 뜻하는 '샘'과 글자는 같지만, 사람의 솔직한 질투 감정을 나타내는 말입니다."],
      ["서늘하다", "nature", 1, "온도가 낮아 살갗에 닿는 기운이 더위를 식혀줄 만큼 약간 차갑고 시원한 느낌이 드는 상태예요.", "가을 운동장에서 달리기를 하고 땀이 났는데 등 뒤로 서늘한 바람이 불어와 기분이 무척 상쾌해졌다.", "공포 영화를 보고 나서 등골이 서늘하다처럼 무섭고 섬뜩한 기분을 비유적으로 표현하기도 해요."],
      ["서럽다", "heart", 1, "억울하거나 슬픈 마음이 가슴속에 가득 차서 눈물이 날 만큼 원통하고 괴로운 감정이에요.", "동생이 내 물건을 망가뜨렸는데 엄마가 나만 형이니까 참으라고 혼내셔서 너무 서럽고 억울했다.", "단순히 슬픈 것을 넘어서 내 마음을 남이 알아주지 않아 억울한 감정이 섞여 있을 때 주로 씁니다."],
      ["서리", "nature", 2, "늦가을이나 겨울에 공기 중의 수증기가 땅이나 풀잎에 얼어붙어 하얗게 덮이는 기상 현상이에요.", "11월의 차가운 아침, 등굣길 화단에 핀 마른 국화꽃잎 위로 하얀 서리가 눈처럼 소복하게 내려앉아 있었다.", "시골에서 남의 과일을 몰래 따 먹는 장난인 '서리'와는 완전히 다른 뜻의 자연 현상 단어랍니다."],
      ["서슴다", "action", 2, "결단을 내리지 못하고 자꾸 머뭇거리거나 주저하는 태도로, 주로 '서슴지 않다'로 쓰여요.", "우리 반 반장은 친구가 곤란한 일에 처했을 때 눈치 보지 않고 서슴지 않고 나서서 도움의 손길을 내민다.", "망설이지 않고 당당하게 행동하는 용기 있는 친구를 칭찬할 때 '서슴없이 행동하다'라고 아주 멋지게 씁니다."],
      ["서투르다", "action", 1, "어떤 일을 많이 해보지 않아서 익숙하지 못하고 일 처리하는 솜씨가 어설프다는 뜻이에요.", "아직 피코더 연주가 서투르지만, 매일 포기하지 않고 30분씩 연습해서 학예회 무대에 꼭 서고 싶다.", "누구나 처음에는 서투를 수밖에 없으니 좌절하지 말고 꾸준히 노력해야 한다는 것을 기억하세요."],
      ["섣부르다", "action", 3, "상황을 깊이 생각하지 않고 가볍고 성급하게 행동하거나, 솜씨가 아주 설고 어설프다는 뜻이에요.", "아직 친구의 진짜 속마음을 듣지도 않고 섣부르게 오해하여 화를 낸 내 행동이 너무 경솔하고 후회되었다.", "실수하기 쉬운 급한 성격이나 성급한 판단을 경계하고 차분함을 강조할 때 콕 집어 쓰는 말입니다."],
      ["선뜻", "action", 1, "마음에 아무런 망설임이나 내키지 않는 어려움 없이 시원스럽고 가볍게 행동하는 모양이에요.", "무거운 과학 상자를 혼자 들고 가는 나를 보고, 지훈이가 선뜻 다가와 한쪽 손잡이를 들어주어 고마웠다.", "조건을 따지지 않고 남을 위해 시원하게 양보하거나 도와줄 때 사람의 멋진 성품을 보여주는 부사예요."],
      ["설레다", "heart", 1, "앞으로 일어날 일에 대한 기대감이나 두려움으로 마음이 가라앉지 않고 두근거리는 상태예요.", "내일모레 드디어 6학년 수학여행을 떠날 생각을 하니 가슴이 설레어서 짐을 싸며 밤잠을 설치고 말았다.", "새 학기 첫날이나 소풍 전날처럼 가장 기분 좋고 행복한 두근거림을 뜻하는 예쁜 고유어랍니다."],
      ["소나기", "nature", 1, "여름철에 갑자기 먹구름이 끼면서 세차게 쏟아지다가 곧 뚝 그치는 아주 시원한 비예요.", "하굣길에 맑았던 하늘에서 갑자기 굵은 소나기가 쏟아져서 가방을 머리에 이고 처마 밑으로 급히 피했다.", "사람의 땀방울을 식혀주는 자연 현상이며, 소설의 제목으로도 아주 유명한 낭만적인 단어입니다."],
      ["소담하다", "nature", 3, "꽃이나 과일의 생김새가 풍성하고 탐스럽거나, 음식이 아주 넉넉하고 먹음직스러운 상태예요.", "가을 운동회 날, 엄마가 정성껏 싸주신 도시락 안에는 소담하게 빚은 주먹밥과 과일이 가득 들어 있었다.", "아주 작고 앙증맞은 것보다는 풍성하고 넉넉해서 보기에 마음이 흐뭇해지는 훌륭한 모습을 칭찬할 때 써요."],
      ["소리", "daily", 1, "물체가 부딪치거나 떨려서 우리 귀를 자극하여 듣게 되는 모든 현상을 가리키는 고유어예요.", "조용한 도서관에서 책장을 넘기는 바스락거리는 소리조차 크게 들려서 조심스럽게 숨을 쉬며 행동했다.", "새소리, 빗소리, 웃음소리처럼 다른 단어 뒤에 붙어서 세상의 모든 청각을 예쁘게 표현해 주는 기본 단어입니다."],
      ["속", "daily", 1, "겉으로 드러나지 않는 사물의 안쪽, 혹은 사람의 보이지 않는 마음 깊은 곳을 가리키는 말이에요.", "겉으로는 화가 난 척 틱틱거렸지만, 사실 내 속마음은 친구와 빨리 화해하고 싶어서 몹시 애가 타고 있었다.", "사람의 진심이나 배려심을 뜻할 때 '속이 참 깊다'라고 표현하며, 아주 짧지만 많은 뜻을 담은 명사예요."],
      ["솜씨", "daily", 1, "손을 놀려 물건을 멋지게 만들거나 어떤 어려운 일을 훌륭하게 처리해 내는 재주와 능력이에요.", "가정 시간에 바느질을 하는데 짝꿍의 꼼꼼한 바느질 솜씨가 마치 예술가처럼 뛰어나서 모두가 감탄했다.", "재능이라는 한자어 대신에 손재주나 일 처리 능력을 칭찬할 때 쓰면 훨씬 더 구체적이고 정겨운 느낌을 줍니다."],
      ["수다", "action", 1, "쓸데없이 말을 많이 하는 짓, 또는 친구들끼리 가벼운 이야기를 아주 즐겁게 오래 나누는 행동이에요.", "쉬는 시간 10분 동안 삼삼오오 모여서 어제 본 드라마 이야기를 하며 신나게 수다를 떨었더니 스트레스가 풀렸다.", "너무 시끄럽게 떠드는 것은 좋지 않지만, 친구들과 우정을 나누는 가벼운 수다는 교실의 활력소랍니다."],
      ["수월하다", "action", 2, "일이 까다롭거나 힘들지 않아 해내기가 아주 십상이고 쉽다는 뜻을 가진 부드러운 형용사예요.", "평소에 매일 조금씩 수학 복습을 해 둔 덕분에 이번 단원 평가 시험은 생각보다 아주 수월하게 풀 수 있었다.", "'쉽다'는 말보다 조금 더 과정이 매끄럽고 편안하게 진행되었다는 느낌을 줄 때 고급스럽게 쓰이는 말입니다."],
      ["수줍다", "heart", 1, "성격이 활발하지 못하고 남들 앞에 서면 부끄러움을 타거나 몹시 쑥스러워하는 마음이에요.", "평소에 몹시 수줍음이 많던 민지가 학예회 무대에서 당당하게 춤을 추는 모습을 보고 모두가 깜짝 놀라 박수를 쳤다.", "나쁜 성격이 아니라 조심스럽고 순수한 성품을 뜻하며, 용기를 내서 무언가를 해냈을 때 칭찬의 포인트가 됩니다."],
      ["숨", "daily", 1, "사람이나 동물이 살기 위해 코와 입으로 공기를 들이마시고 내쉬는 가장 중요한 생명의 기운이에요.", "체육 시간에 50미터 달리기를 전력 질주로 끝내고 나니 심장이 쿵쿵 뛰고 턱 끝까지 가쁜 숨이 헉헉 차올랐다.", "생명을 유지하는 호흡뿐만 아니라 '숨을 돌리다', '숨이 막히다'처럼 긴장감이나 휴식을 비유할 때도 쓰입니다."],
      ["술래", "action", 2, "숨바꼭질이나 술래잡기 놀이에서 몰래 숨은 사람을 찾아내는 중요한 역할을 맡은 사람이에요.", "가위바위보에서 진 내가 술래가 되어 전봇대에서 열을 셀 동안 친구들은 재빠르게 교실 곳곳으로 도망쳐 숨었다.", "우리나라 전통 놀이에서 빠질 수 없는 역할의 이름으로, 옛날 밤에 도둑을 잡던 순찰꾼의 이름에서 유래했어요."],
      ["스스럼", "heart", 2, "상대방을 대할 때 조심스럽거나 부끄러운 마음이 없어 아주 편안하고 스스럼없는 상태예요.", "유치원 때부터 매일 얼굴을 보며 자란 우리는 어떤 비밀을 털어놓아도 스스럼이 없을 정도로 편안한 단짝 친구다.", "어려운 어른을 대할 때가 아니라, 허물없이 아주 가까운 친구나 가족 관계의 편안함을 묘사할 때 쓰는 명사입니다."],
      ["스미다", "action", 2, "물이나 연기 따위가 틈 속으로 배어들거나, 감동적인 마음이나 느낌이 속으로 아주 깊이 번져가는 현상이에요.", "선생님의 따뜻한 위로와 격려의 말씀이 내 꽁꽁 언 마음속 깊이 스며들어 나도 모르게 뜨거운 눈물이 흘러내렸다.", "단순히 들어간다는 뜻보다 눈에 보이지 않게 아주 서서히 번지며 스며드는 문학적이고 부드러운 동사입니다."],
      ["슬기", "heart", 2, "세상의 이치와 사리를 바르게 판단하고 닥친 일을 아주 현명하게 잘 처리해 내는 지혜로운 마음이에요.", "의견 충돌로 모둠이 다툴 뻔했지만, 서로 조금씩 양보하는 슬기를 발휘하여 과제를 무사히 완벽하게 끝마쳤다.", "책에서 배운 지식을 뛰어넘어, 삶에서 일어나는 문제들을 아주 지혜롭게 해결하는 6학년의 성숙한 태도입니다."],
      ["슬프다", "heart", 1, "억울한 일을 당하거나 사랑하는 대상을 잃어 마음이 몹시 아프고 괴로워 눈물이 나는 감정이에요.", "가족처럼 아끼며 10년 동안 키우던 강아지가 무지개다리를 건넜을 때 내 마음은 이루 말할 수 없이 슬프고 허전했다.", "사람이 느끼는 가장 자연스럽고 깊은 감정 중 하나로, 이 감정을 잘 이겨내면 마음이 더욱 단단하게 성장한답니다."],
      ["시나브로", "time", 3, "어떤 변화가 눈에 띄지 않게 모르는 사이에 조금씩 조금씩 아주 천천히 일어나는 모양을 뜻하는 예쁜 부사예요.", "매일 밤 30분씩 꾸준히 읽었더니 그 두껍고 어려웠던 해리포터 책도 어느새 시나브로 마지막 장을 향해 가고 있었다.", "갑작스러운 변화가 아니라 계절이 바뀌듯 아주 자연스럽고 서서히 일어나는 긍정적인 변화를 문학적으로 표현할 때 써요."],
      ["시름", "heart", 3, "마음에 깊이 걸려 있어서 쉽게 풀리지 않는 근심이나 막막한 걱정을 뜻하는 아주 무거운 고유어예요.", "시험 성적이 떨어져서 며칠 동안 시름에 빠져 있었지만, 부모님의 따뜻한 격려 덕분에 다시 훌훌 털고 일어났다.", "'걱정'이라는 말보다 훨씬 마음 깊은 곳에서 오랫동안 떠나지 않는 아련하고 진지한 고민을 표현할 때 씁니다."],
      ["시샘", "heart", 2, "자기가 가질 수 없는 남의 좋은 물건이나 성과를 부러워하면서 얄밉게 여기는 마음이에요.", "수학 경시대회에서 1등을 한 짝꿍이 대단하다고 생각하면서도, 한편으로는 속으로 아주 작은 시샘이 일어나는 건 어쩔 수 없었다.", "이른 봄에 꽃이 피는 것을 질투하는 늦추위를 '꽃샘추위'라고 하듯이, 사람의 귀여운 질투를 뜻하는 파생어랍니다."],
      ["실마리", "daily", 2, "감겨 있는 실의 첫머리라는 뜻으로, 복잡하게 얽힌 일이나 사건을 쉽게 풀어 나갈 수 있는 첫 번째 단서예요.", "도무지 풀리지 않던 어려운 과학 문제였는데 선생님이 주신 작은 힌트 하나가 사건의 실마리가 되어 정답을 찾았다.", "추리 소설에서 탐정이 범인을 찾는 증거를 발견했을 때처럼, 어려운 상황의 엉킨 매듭을 푸는 출발점을 비유합니다."],
      ["심부름", "action", 1, "남이 시키는 일을 도와주기 위해 다른 곳에 대신 다녀오거나 어떤 일을 아주 성실하게 해주는 일이에요.", "저녁을 준비하시는 엄마를 도와드리기 위해 동네 슈퍼에 가서 신선한 두부와 콩나물을 사 오는 심부름을 씩씩하게 다녀왔다.", "귀찮은 일이 아니라 가족을 돕는 기특한 행동이자, 어릴 때 자립심과 심부름하는 책임감을 기르는 아주 좋은 훈련이죠."],
      ["싹싹하다", "heart", 1, "눈치가 아주 빠르고 행동이나 말투가 뻣뻣하지 않으며, 남을 아주 상냥하고 부드럽게 대하는 성격이에요.", "전학 온 첫날부터 처음 보는 반 친구들에게 싹싹하게 먼저 인사를 건네는 지호는 하루 만에 우리 반의 인기스타가 되었다.", "무뚝뚝하거나 퉁명스러운 태도와 반대되는 성품으로, 어른들이 아주 좋아하고 사회성이 뛰어난 태도를 칭찬하는 말입니다."],
      ["쏠쏠하다", "heart", 2, "어떤 일의 품질이나 수준, 혹은 거기서 얻는 재미나 이익이 기대했던 것보다 꽤 괜찮고 훌륭하다는 뜻이에요.", "벼룩시장에서 안 쓰는 헌 장난감과 동화책을 팔았더니 생각보다 번 돈이 쏠쏠해서 평소 갖고 싶었던 학용품을 샀다.", "큰 대박은 아니더라도 작은 일상에서 기대 이상의 큰 기쁨이나 소소한 만족감을 톡톡히 느꼈을 때 아주 찰떡인 부사입니다."],
      ["쑥스럽다", "heart", 1, "하는 짓이나 어떤 모양이 몹시 어색하고 부자연스러워서 얼굴이 붉어질 만큼 남 앞에 나서기 부끄러운 감정이에요.", "미술 시간에 내가 그린 그림을 반 친구들 모두 앞에서 들어 올려 발표하려고 하니 얼굴이 화끈거리고 너무 쑥스러웠다.", "나쁜 짓을 해서 창피한 것이 아니라, 주목을 받아 칭찬을 듣거나 낯선 일을 할 때 느끼는 귀엽고 자연스러운 마음의 상태예요."],
