<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반짝반짝 우리말 고유어 대사전 (초등 6학년)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Noto Sans KR"', 'sans-serif'], fun: ['"Gaegu"', 'cursive'] },
          colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } }
        }
      }
    }
  </script>
  <style>
    .card-hover { transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.2), 0 8px 10px -6px rgba(16, 185, 129, 0.1); }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
    .modal-open { overflow: hidden; }
    .word-highlight { background: linear-gradient(120deg, #dcfce7 0%, #dcfce7 100%); background-repeat: no-repeat; background-size: 100% 40%; background-position: 0 88%; }
  </style>
</head>
<body class="bg-gradient-to-br from-amber-50/60 via-emerald-50/50 to-sky-50/60 text-slate-800 min-h-screen flex flex-col font-sans selection:bg-emerald-200">

  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-emerald-100 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3 cursor-pointer" onclick="resetFilters()">
        <span class="text-3xl p-2 bg-emerald-100 rounded-2xl shadow-inner text-emerald-600">
          <i class="fa-solid fa-book-bookmark"></i>
        </span>
        <div>
          <h1 class="text-xl sm:text-2xl font-fun font-bold text-emerald-800 tracking-wide flex items-center gap-2">
            우리말 고유어 대사전
            <span class="text-xs font-sans font-bold bg-emerald-500 text-white px-2 py-0.5 rounded-full shadow-sm" id="totalWordsBadge">로딩중...</span>
          </h1>
          <p class="text-xs text-slate-500 hidden sm:block">초등학교 6학년 국어 연계 • 아름다운 우리말 탐험</p>
        </div>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0 custom-scroll">
        <button id="bookmarkTabBtn" onclick="toggleBookmarkFilter()" class="whitespace-nowrap px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-amber-300 bg-amber-50 text-amber-800 hover:bg-amber-100 flex items-center gap-1.5 shadow-sm transition active:scale-95">
          <i class="fa-solid fa-star text-amber-500"></i><span>내 단어장</span><span id="bookmarkCount" class="bg-amber-500 text-white rounded-full px-1.5 py-0.2 text-[11px] font-bold">0</span>
        </button>
        <button onclick="openPracticeModal()" class="whitespace-nowrap px-3 py-2 rounded-xl text-xs sm:text-sm font-bold bg-sky-50 text-sky-700 hover:bg-sky-100 border border-sky-200 flex items-center gap-1.5 transition active:scale-95">
          <i class="fa-solid fa-pen-to-square text-sky-500"></i><span>문장 짓기 노트</span>
        </button>
        <button onclick="openQuizModal()" class="whitespace-nowrap px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white shadow-sm flex items-center gap-1.5 transition active:scale-95">
          <i class="fa-solid fa-gamepad"></i><span>낱말 퀴즈</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-5 flex flex-col gap-5">
    <section class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-emerald-100 relative overflow-hidden bg-gradient-to-r from-emerald-50/80 via-white to-sky-50/60">
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div class="space-y-2">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="bg-emerald-600 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-full flex items-center gap-1 shadow-sm">
              <i class="fa-solid fa-sparkles"></i> 오늘의 추천 고유어
            </span>
            <span id="todayWordCategory" class="text-xs text-slate-500 bg-white px-2 py-0.5 rounded-lg border font-medium">자연</span>
            <span id="todayWordLevel" class="text-xs text-emerald-700 bg-emerald-100/70 font-semibold px-2 py-0.5 rounded-lg">1단계 (기초)</span>
          </div>
          <div class="flex items-baseline gap-3 pt-1">
            <h2 id="todayWordTitle" class="text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-tight word-highlight">불러오는 중</h2>
            <button onclick="speakWord(document.getElementById('todayWordTitle').innerText)" class="text-emerald-600 hover:text-emerald-700 text-xl transition-transform hover:scale-110" title="발음 듣기">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </div>
          <p id="todayWordMeaning" class="text-slate-700 text-sm sm:text-base font-medium leading-relaxed"></p>
          <div class="bg-white/60 p-3 rounded-xl border border-white mt-2 inline-block">
            <p id="todayWordExample" class="text-sm text-slate-600 italic"></p>
          </div>
        </div>
        <button onclick="pickRandomTodayWord()" class="px-4 py-2.5 bg-white hover:bg-slate-50 text-slate-700 text-xs font-bold rounded-2xl border border-slate-200 shadow-sm transition active:scale-95 flex items-center gap-2 shrink-0">
          <i class="fa-solid fa-shuffle text-emerald-500"></i> 다른 낱말 보기
        </button>
      </div>
    </section>

    <section class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-5">
      <div class="relative group">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-400 group-focus-within:text-emerald-500 transition-colors">
          <i class="fa-solid fa-magnifying-glass text-lg"></i>
        </span>
        <input type="text" id="searchInput" placeholder="단어, 뜻, 예문을 검색해 보세요." class="w-full pl-12 pr-24 py-3.5 bg-slate-50 hover:bg-slate-100/60 focus:bg-white text-slate-800 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm font-medium transition-all shadow-inner" oninput="handleSearch()" />
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute inset-y-0 right-3 px-3 my-auto h-8 text-xs font-bold text-slate-500 hover:text-slate-800 bg-slate-200/60 hover:bg-slate-300/60 rounded-xl transition-colors">지우기</button>
      </div>
      <div>
        <div class="flex items-center justify-between mb-2.5">
          <label class="text-xs sm:text-sm font-bold text-slate-600 flex items-center gap-1.5">
            <span class="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center"><i class="fa-solid fa-shapes"></i></span>자음으로 찾기
          </label>
          <button onclick="clearConsonantFilter()" class="text-xs text-emerald-600 hover:text-emerald-700 font-bold bg-emerald-50 px-2 py-1 rounded-lg">전체 보기</button>
        </div>
        <div class="grid grid-cols-7 sm:grid-cols-14 gap-1.5 sm:gap-2" id="consonantContainer"></div>
      </div>
      <div class="flex flex-col lg:flex-row gap-4 pt-4 border-t border-slate-100">
        <div class="flex-1">
          <label class="text-xs font-bold text-slate-500 mb-2 block">주제별 테마</label>
          <div class="flex flex-wrap items-center gap-1.5" id="categoryContainer"></div>
        </div>
        <div class="lg:border-l lg:border-slate-100 lg:pl-4">
          <label class="text-xs font-bold text-slate-500 mb-2 block">6학년 맞춤 난이도</label>
          <div class="flex items-center gap-1.5">
            <button onclick="setLevelFilter('all')" id="levelBtn-all" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow-sm transition">전체</button>
            <button onclick="setLevelFilter(1)" id="levelBtn-1" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🌱 1단계(기초)</button>
            <button onclick="setLevelFilter(2)" id="levelBtn-2" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🌿 2단계(실력)</button>
            <button onclick="setLevelFilter(3)" id="levelBtn-3" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🌳 3단계(도전)</button>
          </div>
        </div>
      </div>
    </section>

    <section class="space-y-4 flex-grow">
      <div class="flex flex-wrap items-center justify-between px-1 gap-3">
        <div class="text-sm font-bold text-slate-700 flex items-center gap-2">
          <span>발견한 고유어</span><span id="resultCount" class="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full text-xs font-extrabold shadow-sm">0개</span><span id="pageInfoText" class="text-xs text-slate-400 font-normal hidden sm:inline"></span>
        </div>
        <div class="flex items-center gap-2 text-xs">
          <select id="sortSelect" onchange="applyFiltersAndRender(1)" class="bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-slate-700 font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm cursor-pointer hover:bg-slate-50 transition">
            <option value="nameAsc">가나다순 (ㄱ~ㅎ)</option>
            <option value="nameDesc">역순 (ㅎ~ㄱ)</option>
            <option value="levelAsc">쉬운 순서</option>
            <option value="levelDesc">어려운 순서</option>
          </select>
        </div>
      </div>
      <div id="wordGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div id="paginationContainer" class="flex flex-wrap items-center justify-center gap-2 pt-6 pb-4"></div>
      <div id="emptyState" class="hidden flex-col items-center justify-center p-16 text-center bg-white rounded-3xl border-2 border-dashed border-slate-200">
        <div class="w-16 h-16 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center text-2xl mb-4"><i class="fa-solid fa-face-sad-tear"></i></div>
        <h3 class="text-lg font-bold text-slate-700">앗, 해당하는 고유어를 찾지 못했어요.</h3>
        <button onclick="resetFilters()" class="mt-6 px-5 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-bold rounded-xl shadow-sm transition active:scale-95 flex items-center gap-2"><i class="fa-solid fa-rotate-right"></i> 모든 필터 초기화</button>
      </div>
    </section>
  </main>

  <div id="wordModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4" onclick="handleModalClick(event, 'wordModal')">
    <div class="bg-white rounded-[2rem] max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-100 relative transform transition-all scale-95 opacity-0 duration-200" id="modalCard">
      <button onclick="closeWordModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center transition-colors text-lg"><i class="fa-solid fa-xmark"></i></button>
      <div class="space-y-5">
        <div class="flex items-center gap-2">
          <span id="modalCategoryBadge" class="text-xs font-bold px-3 py-1.2 rounded-xl shadow-sm"></span><span id="modalLevelBadge" class="text-xs font-bold px-3 py-1.2 rounded-xl border"></span>
        </div>
        <div class="flex items-center justify-between border-b border-slate-100 pb-4">
          <div class="flex items-end gap-3">
            <h2 id="modalTitle" class="text-4xl font-extrabold text-slate-800 tracking-tight"></h2>
            <button id="modalAudioBtn" class="text-emerald-500 hover:text-emerald-600 text-2xl p-1 mb-1 transition-transform hover:scale-110" title="발음 듣기"><i class="fa-solid fa-circle-play"></i></button>
          </div>
          <button id="modalBookmarkBtn" class="text-3xl p-2 transition transform hover:scale-110 active:scale-125"><i class="fa-regular fa-star text-slate-300"></i></button>
        </div>
        <div class="space-y-4 pt-2">
          <div><p class="text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">뜻풀이</p><p id="modalMeaning" class="text-slate-800 text-lg font-bold leading-relaxed break-keep"></p></div>
          <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100/50"><p class="text-xs font-bold text-emerald-700 mb-2 flex items-center gap-1.5"><i class="fa-solid fa-pen-fancy"></i> 이렇게 문장으로 써요</p><p id="modalExample" class="text-emerald-900 text-sm font-medium leading-relaxed break-keep"></p></div>
          <div class="bg-amber-50 p-4 rounded-2xl border border-amber-100/50"><p class="text-xs font-bold text-amber-700 mb-2 flex items-center gap-1.5"><i class="fa-regular fa-lightbulb"></i> 6학년 돋보기 팁</p><p id="modalTip" class="text-amber-900 text-sm font-medium leading-relaxed break-keep"></p></div>
        </div>
      </div>
      <div class="mt-8 flex flex-col sm:flex-row justify-between items-center gap-3">
        <button id="modalPracticeShortcutBtn" class="w-full sm:w-auto px-5 py-3 bg-sky-50 hover:bg-sky-100 text-sky-700 text-sm font-bold rounded-xl transition flex items-center justify-center gap-2 border border-sky-200"><i class="fa-solid fa-pen-nib"></i> 이 단어로 문장 짓기</button>
        <button onclick="closeWordModal()" class="w-full sm:w-auto px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-xl transition shadow-md">확인</button>
      </div>
    </div>
  </div>

  <div id="practiceModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4" onclick="handleModalClick(event, 'practiceModal')">
    <div class="bg-white rounded-[2rem] max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-100 relative">
      <button onclick="closePracticeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center transition-colors text-lg"><i class="fa-solid fa-xmark"></i></button>
      <div class="space-y-5">
        <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
          <span class="w-10 h-10 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center text-lg font-bold shadow-inner"><i class="fa-solid fa-book-journal-whills"></i></span>
          <div><h3 class="text-xl font-extrabold text-slate-800">나만의 문장 짓기 노트</h3><p class="text-xs font-medium text-slate-500">배운 고유어를 넣어 멋진 문장을 완성해 보세요!</p></div>
        </div>
        <div class="space-y-4">
          <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
            <label class="block text-xs font-bold text-slate-600 mb-2">1. 사용할 고유어 선택하기</label>
            <div class="flex gap-2">
              <input type="text" id="practiceWordSearch" placeholder="단어 검색..." class="w-1/3 bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-sky-400 outline-none transition" oninput="filterPracticeOptions()" />
              <select id="practiceWordSelect" onchange="updatePracticeWordDetail()" class="w-2/3 bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-400 cursor-pointer shadow-sm"></select>
            </div>
            <div class="mt-3 p-3 bg-white rounded-xl border border-slate-100"><p id="practiceWordMeaningHint" class="text-sm text-slate-700 font-medium"></p></div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-2">2. 나만의 문장 쓰기</label>
            <textarea id="practiceSentenceInput" rows="4" placeholder="선택한 고유어를 포함해서 자연스러운 문장을 지어보세요." class="w-full bg-slate-50 hover:bg-white border-2 border-slate-200 rounded-2xl p-4 text-sm font-medium focus:bg-white focus:outline-none focus:border-sky-400 focus:ring-4 focus:ring-sky-100 transition-all resize-none shadow-inner" oninput="handlePracticeInput()"></textarea>
            <div class="flex justify-between items-center mt-2 px-1 text-xs font-bold text-slate-400">
              <span id="practiceWordCheckMsg" class="flex items-center gap-1"><i class="fa-solid fa-circle-exclamation"></i> 문장에 단어를 넣어주세요.</span><span id="practiceCharCount">0자</span>
            </div>
          </div>
          <div id="practiceSuccessBox" class="hidden p-4 bg-emerald-50 border-2 border-emerald-200 rounded-2xl text-emerald-800 text-sm font-bold flex items-start gap-3 shadow-sm transform transition-all">
            <i class="fa-solid fa-face-smile-wink text-emerald-500 text-2xl mt-0.5"></i>
            <div><p>참 잘했어요! 👏</p><p class="text-xs text-emerald-600 font-medium mt-1">고유어를 아주 자연스럽게 활용한 멋진 문장입니다.</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="quizModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm hidden p-4" onclick="handleModalClick(event, 'quizModal')">
    <div class="bg-white rounded-[2rem] max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-100 relative">
      <button onclick="closeQuizModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 w-10 h-10 rounded-full flex items-center justify-center transition-colors text-lg"><i class="fa-solid fa-xmark"></i></button>
      <div class="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
        <span class="w-10 h-10 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center text-xl shadow-inner"><i class="fa-solid fa-crown"></i></span>
        <div><h3 class="text-xl font-extrabold text-slate-800">우리말 척척박사 퀴즈</h3><p class="text-xs font-medium text-slate-500">설명을 읽고 알맞은 고유어를 맞춰보세요!</p></div>
      </div>
      <div id="quizQuestionBox" class="space-y-5">
        <div class="bg-slate-50 p-5 rounded-2xl border-2 border-slate-100 relative">
          <span class="absolute -top-3 left-4 text-xs font-bold text-white bg-emerald-500 px-3 py-1 rounded-full shadow-sm">문제</span>
          <p id="quizMeaning" class="text-slate-800 font-bold text-base mt-2 min-h-[60px] flex items-center leading-relaxed break-keep"></p>
        </div>
        <div id="quizOptions" class="grid grid-cols-1 gap-2.5"></div>
        <div id="quizFeedback" class="hidden p-4 rounded-xl text-center text-sm font-bold shadow-sm transition-all transform scale-95"></div>
        <div class="flex justify-between items-center pt-4 border-t border-slate-100">
          <div class="flex flex-col"><span class="text-[10px] font-bold text-slate-400 uppercase">내 점수</span><span id="quizScoreText" class="text-lg font-extrabold text-emerald-600">0점</span></div>
          <button id="nextQuizBtn" onclick="generateNewQuiz()" class="hidden px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-xl transition shadow-md flex items-center gap-2">다음 문제 도전 <i class="fa-solid fa-arrow-right"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script>
    //
    const RAW_WORDS = [
      ["가꾸다", "action", 1, "1. 식물을 정성껏 보살펴서 잘 자라게 하는 일이에요.<br>2. 외모나 몸을 보기 좋게 꾸미는 일이에요.", "1. 봄이 되어 교실 창가에 있는 화분 속 꽃을 정성껏 가꾸었다.<br>2. 틈틈이 운동을 하며 몸을 튼튼하게 가꾸었다.", "'꿈을 가꾸다'처럼 자신의 실력이나 목표를 훌륭하게 키워갈 때도 멋지게 쓰는 말이에요."],
      ["가누다", "action", 2, "1. 몸의 자세를 똑바로 잡는 행동이에요.<br>2. 정신이나 기운을 흩어지지 않게 차리는 뜻이에요.", "1. 오래달리기를 하고 나서 숨을 헐떡이며 겨우 몸을 가누었다.<br>2. 너무 슬퍼서 무너지는 마음을 가누기 힘들었다.", "주로 '몸을 가누다', '마음을 가누다'처럼 아프거나 힘들 때 중심을 잡는 의미로 씁니다."],
      ["가득", "daily", 1, "분량이나 수효가 정해진 범위나 그릇 안에 빈틈없이 꽉 차 있는 모양이에요.", "가을 소풍날, 내 가방 안에는 엄마가 싸주신 맛있는 김밥과 과자가 가득 들어 있었다.", "공간이 꽉 찬 것뿐만 아니라 '자신감이 가득하다'처럼 감정이 넘쳐흐를 때도 자주 써요."],
      ["가리키다", "action", 1, "손가락이나 물건을 어떤 방향이나 대상을 향하게 하여 집어내는 행동이에요.", "선생님께서 지휘봉으로 칠판에 적힌 중요한 수학 공식을 가리키며 설명해 주셨다.", "'가르치다(알려주다)'와 발음이 비슷해서 헷갈리기 쉬우니 쓸 때 조심해야 하는 단어예요."],
      ["가르치다", "action", 1, "1. 지식이나 이치 등을 깨닫게 하거나 알려 주는 일이에요.<br>2. 기능이나 기술 등을 익히게 하는 일이에요.<br>3. 나쁜 버릇 따위를 고치어 바로잡는 일이에요.", "1. 수학 문제를 몰라서 헤매는 짝꿍에게 푸는 법을 가르쳐 주었다.<br>2. 동생에게 안전하게 두발자전거를 타는 방법을 가르쳤다.<br>3. 남의 물건을 함부로 만지지 않도록 올바른 예절을 가르쳤다.", "세 가지 뜻 모두 '누군가를 바른길로 이끌고 성장하게 돕는다'는 훌륭한 의미가 담겨 있어요."],
      ["가름", "daily", 2, "1. 사물이나 상황을 쪼개거나 나누는 일이에요.<br>2. 승패나 판결 등을 따로따로 구별되게 하는 판단이에요.", "1. 남은 케이크를 두 가름으로 똑같이 나누어 먹었다.<br>2. 오늘 열린 피구 대회에서 우리 반의 승패 가름은 마지막 1분에 결정되었다.", "새로운 것으로 바꾼다는 뜻의 '갈음'과는 완전히 다른 뜻의 단어이니 맞춤법에 유의하세요."],
      ["가만히", "action", 1, "1. 몸을 움직이지 않고 잠잠하게 있는 모양이에요.<br>2. 아무 말 없이 조용히, 또는 속으로 몰래 하는 모양이에요.<br>3. 마음을 가라앉히고 깊이 생각하는 모양이에요.", "1. 수업 시간에 떠들지 않고 자리에 가만히 앉아 있었다.<br>2. 친구를 깜짝 놀라게 해주려고 가만히 뒤로 다가갔다.<br>3. 내 장래 희망이 무엇인지 눈을 감고 가만히 생각해보았다.", "주변을 방해하지 않고 평화롭게 있는 태도나 조심스러운 움직임을 나타낼 때 주로 씁니다."],
      ["가물거리다", "action", 2, "1. 작은 불빛이 자꾸 어두워졌다 밝아졌다 하는 상태예요.<br>2. 사물이 보일 듯 말 듯 희미하게 흔들리는 상태예요.<br>3. 기억이나 생각이 날 듯 말 듯 흐릿한 상태예요.", "1. 밤바다 멀리 떠 있는 배의 불빛이 가물거린다.<br>2. 짙은 안개 속에서 사람의 그림자가 가물거렸다.<br>3. 어릴 적 재미있게 놀았던 추억인데 시간이 지나 기억이 가물거린다.", "불빛이 흔들리는 물리적인 현상부터 기억이 뚜렷하지 않을 때까지 폭넓게 쓰여요."],
      ["가시", "nature", 1, "1. 식물의 줄기나 동물의 몸에 돋아난 뾰족한 부분이에요.<br>2. 남의 마음을 아프게 찌르는 독한 말이나 태도예요.", "1. 산길을 걷다가 장미 넝쿨의 가시에 찔려 상처가 났다.<br>2. 화가 난다고 친구에게 가시 돋친 말을 하면 안 된다.", "물리적으로 뾰족한 것뿐만 아니라 문학적으로 비유할 때도 널리 쓰이는 명사입니다."],
      ["가엽다", "heart", 2, "다른 사람이나 동물의 처지가 마음이 아플 만큼 안되고 불쌍하다는 따뜻한 마음이에요.", "비 오는 날 길가에서 덜덜 떨고 있는 버려진 강아지가 너무 가여워서 집으로 데려왔다.", "'가엾다'와 똑같은 뜻으로 쓰이는 복수 표준어로, 남을 동정하고 배려하는 착한 마음을 뜻해요."],
      ["가운데", "daily", 1, "1. 여럿이 있는 속이나 안, 또는 공간의 중심이에요.<br>2. 어떤 일이나 시간이 한창 진행되고 있는 도중을 말해요.", "1. 친구들이 둥글게 모여 앉았고 나는 그 가운데 섰다.<br>2. 진지하게 회의를 하는 가운데 갑자기 좋은 아이디어가 떠올랐다.", "물리적인 정중앙을 뜻하는 동시에 시간의 흐름을 나타내는 폭넓은 명사입니다."],
      ["가을", "time", 1, "여름과 겨울 사이의 계절로, 잎이 붉게 물들고 곡식을 거두어들이는 수확의 시기예요.", "가을이 되니 학교 뒤뜰의 은행나무 잎이 노랗게 물들고 시원한 바람이 불어오기 시작했다.", "우리나라의 아름다운 사계절 중 풍성함과 독서를 상징하는 아주 아름다운 고유어 명칭입니다."],
      ["가장", "daily", 1, "여럿 가운데 어느 것보다 정도가 높거나 으뜸이 되게라는 뜻을 가진 훌륭한 부사예요.", "우리 반에서 달리기가 가장 빠른 민수는 이번 체육대회 계주 마지막 주자로 뽑혔다.", "한자어인 '제일(第一)'을 완벽하게 대체할 수 있는 아주 자연스럽고 예쁜 순우리말입니다."],
      ["가지런하다", "daily", 2, "여럿이 줄지어 있는 모양이 들쭉날쭉하지 않고 나란하며 아주 고르게 정돈된 상태예요.", "체육관에 들어가기 전, 입구에 벗어둔 친구들의 실내화가 삐뚤어지지 않고 아주 가지런했다.", "물건이 보기 좋게 정리된 모습뿐만 아니라, 글씨나 마음가짐이 바른 상태를 칭찬할 때 씁니다."],
      ["가탈", "daily", 3, "1. 일이 순조롭게 나아가는 것을 방해하는 뜻밖의 조건이에요.<br>2. 이리저리 트집을 잡아 까다롭게 구는 얄미운 행동이에요.", "1. 갑작스러운 소나기로 운동회 준비에 가탈이 생겼다.<br>2. 모둠 숙제를 하는데 지훈이가 자꾸 사소한 일로 가탈을 부려 힘들었다.", "별일 아닌 것에 괜한 불평을 늘어놓는 피곤한 행동을 아주 정확하게 꼬집어 주는 낱말입니다."],
      ["간지럽다", "heart", 1, "살갗에 무엇이 살짝 닿아 웃음이 날 만큼 찌릿하거나 기분 좋게 근질거리는 느낌이에요.", "친구와 귓속말을 하는데 친구의 숨결이 귀에 닿아 몹시 간지러워서 나도 모르게 웃음이 터졌다.", "쑥스러운 칭찬을 들어서 부끄러울 때 '귀가 간지럽다'라고 마음의 느낌을 표현할 때도 써요."],
      ["갈무리", "action", 2, "1. 물건을 잘 정돈하여 안전하게 보관하는 일이에요.<br>2. 하던 일을 깔끔하게 끝맺어 정리하는 일이에요.", "1. 겨울옷을 깨끗하게 빨아 옷장에 잘 갈무리했다.<br>2. 오늘 배운 중요한 단어들을 내 노트에 예쁜 글씨로 잘 갈무리해 두었다.", "컴퓨터나 스마트폰에서 화면을 캡처해서 저장하는 기능도 요즘은 '갈무리'라고 순화해서 불러요."],
      ["갈피", "daily", 2, "1. 겹쳐진 책이나 물건들의 사이를 뜻해요.<br>2. 얽힌 사물이나 일의 가닥을 뜻해요.<br>3. 마음이나 생각의 방향을 뜻해요.", "1. 예쁜 네잎클로버를 주워 책 갈피에 끼워 두었다.<br>2. 사건이 너무 복잡하게 얽혀서 갈피를 잡을 수 없다.<br>3. 수학 문제가 너무 어려워서 어떻게 풀어야 할지 갈피를 잡지 못했다.", "마음이나 생각의 방향을 정할 때 '갈피를 못 잡다'로 아주 흔하게 쓰이는 유용한 단어입니다."],
      ["감기다", "action", 1, "1. 눈꺼풀이 저절로 내려와 눈이 덮이는 일이에요.<br>2. 실이나 끈 따위가 다른 물체에 빙빙 둘러지는 일이에요.", "1. 늦게까지 책을 읽었더니 수업 시간에 자꾸 눈이 스르르 감겼다.<br>2. 연을 날릴 때 실이 얼레에 팽팽하게 감겨 있었다.", "머리를 씻는 뜻인 '머리가 감기다'와는 다른 뜻으로, 수동적으로 일어나는 현상을 나타냅니다."],
      ["감다", "action", 1, "1. 샴푸나 비누로 머리나 몸을 씻는 일이에요.<br>2. 눈꺼풀을 내리어 눈을 덮는 행동이에요.<br>3. 끈을 다른 물체에 두르는 일이에요.", "1. 아침에 늦잠을 자서 머리를 감지 못하고 등교했다.<br>2. 무서운 영화 장면이 나오자 두 눈을 질끈 감았다.<br>3. 다친 친구의 팔에 붕대를 단단하게 감아 주었다.", "씻다, 덮다, 두르다 등 무려 3가지 이상의 전혀 다른 뜻을 가진 으뜸 다의어입니다."],
      ["갑자기", "time", 1, "미처 대비하거나 생각할 겨를도 없이 아주 급하고 빠르게 일어나는 상황을 뜻해요.", "체육 시간에 맑았던 하늘에서 갑자기 굵은 소나기가 쏟아져서 반 친구들 모두 교실로 뛰어 들어갔다.", "예상치 못한 돌발 상황이 벌어져서 당황스러울 때 문장의 맨 앞에 가장 자주 붙는 고유어 부사예요."],
      ["강아지", "nature", 1, "개가 낳은 새끼를 아주 귀엽고 친근하게 부르는 널리 사랑받는 동물의 이름이에요.", "학교 가는 길에 꼬리를 흔들며 쫄랑쫄랑 따라오는 이웃집 하얀 강아지가 너무 귀여워 쓰다듬어 주었다.", "짐승의 새끼를 뜻하는 '-아지'가 개와 결합하여 파생된 말로, 송아지, 망아지도 같은 원리로 만들어졌어요."],
      ["갖추다", "action", 2, "1. 목적을 위해 꼭 있어야 할 물건이나 조건을 마련하는 일이에요.<br>2. 올바른 예절이나 태도를 차리는 일이에요.", "1. 우리 학교 과학실은 실험에 필요한 도구를 완벽히 갖추고 있다.<br>2. 선생님과 인사할 때는 허리를 굽혀 바른 예의를 갖추어야 한다.", "물건을 준비하는 것뿐만 아니라 사람으로서의 올바른 기본기를 닦는 아주 훌륭한 도덕적 태도랍니다."],
      ["개구쟁이", "action", 1, "행동이 얌전하지 않고 아주 심하게 장난을 치며 노는 아이를 귀엽게 부르는 파생어예요.", "우리 모둠의 최고 개구쟁이 지훈이 덕분에 딱딱했던 조별 활동 시간이 웃음바다가 되었다.", "심한 장난을 치는 단점이 있지만 분위기를 띄우는 귀여운 매력을 가졌을 때 주로 부르는 애칭입니다."],
      ["거드름", "heart", 2, "스스로 잘난 체하며 남들 앞에서 아주 거만하고 우쭐거리며 구는 얄미운 태도예요.", "이번 수학 단원 평가에서 혼자 백 점을 맞았다고 친구들 앞에서 거드름을 피우면 미움을 받을 수 있다.", "거만함보다는 남을 배려하는 겸손한 태도를 갖추는 것이 진정한 실력자이자 멋진 6학년의 모습이라는 걸 잊지 마세요."],
      ["거칠다", "heart", 1, "1. 물체의 표면이 매끄럽지 못하고 까슬까슬한 상태예요.<br>2. 사람의 말이나 행동이 부드럽지 못하고 험한 상태예요.", "1. 찬 바람을 많이 맞으며 뛰어놀았더니 손등이 거칠어졌다.<br>2. 화가 난다고 거친 말을 쓰면 친구에게 큰 상처를 주게 된다.", "물리적인 촉감과 사람의 험한 태도를 동시에 나타낼 수 있는 활용도 높은 형용사입니다."],
      ["걱정", "heart", 1, "안심이 되지 않아 속을 태우며 마음이 불안하고 괴로운 아주 자연스러운 감정 상태예요.", "내가 체육 시간에 다쳐서 양호실에 가자, 단짝 친구가 몹시 걱정스러운 표정으로 달려와 주어 고마웠다.", "우리가 매일 쓰는 순우리말로 누군가를 아끼기 때문에 생겨나는 따뜻한 마음이기도 해요."],
      ["걷다", "action", 1, "1. 두 다리를 번갈아 떼어 옮기며 바닥을 나아가는 동작이에요.<br>2. 늘어지거나 덮인 것을 위로 끌어 올리는 행동이에요.<br>3. 벌여 놓은 것을 거두어 치우는 일이에요.", "1. 시원한 가을바람을 맞으며 공원을 나란히 걸었다.<br>2. 더운 여름날 바닥 청소를 하기 위해 소매를 무릎까지 걷어 올렸다.<br>3. 비가 오려고 해서 마당에 널어둔 빨래를 재빨리 걷었다.", "전혀 다른 3가지 뜻이 있으니 문맥에 따라 헷갈리지 않게 잘 구분해서 써보세요."],
      ["걸싸다", "action", 3, "동작이 답답하지 않게 아주 날래고, 일을 처리하는 솜씨가 빠르고 시원시원하다는 칭찬이에요.", "청소 당번인 민지는 성격이 아주 걸싸서 넓은 복도 청소를 빗자루질 몇 번으로 순식간에 끝내버렸다.", "능력이 뛰어나고 융통성이 있어 굼뜨지 않게 척척 일을 해내는 아주 유능한 친구를 칭찬할 때 써보세요."],
      ["겪다", "action", 1, "1. 어렵고 힘든 일이나 새롭고 중요한 사건을 몸소 부딪쳐 치러내는 행동이에요.<br>2. 사람을 사귀어 지내보는 일이에요.", "1. 체육대회 준비를 하며 친구들과 다투고 화해하는 과정을 겪었다.<br>2. 겉보기엔 무뚝뚝해도 직접 겪어보니 아주 다정한 친구였다.", "자신의 몸과 마음으로 직접 체험하거나 사람을 사귀어 볼 때 쓰는 가치 있는 동사입니다."],
      ["견디다", "heart", 1, "당장 몹시 힘들고 아프지만 포기하지 않고 그 어려움을 꾹 참고 버티어 내는 굳센 힘이에요.", "오래달리기를 할 때 숨이 턱까지 차오르는 고통을 꾹 참고 끝까지 견디어 낸 내 자신이 무척 자랑스러웠다.", "어려움을 극복하고 더 단단하게 성장하는 6학년 아이들의 훌륭한 인내심과 의지를 보여주는 멋진 낱말입니다."],
      ["곁", "daily", 1, "어떤 대상의 아주 가까운 양옆이나 주변 공간을 뜻하는 아주 다정하고 심리적인 거리를 나타내는 말이에요.", "내가 수학 문제를 틀려서 몹시 속상해하고 있을 때, 짝꿍이 곁으로 조용히 다가와 따뜻하게 위로해 주었다.", "단순한 물리적 옆자리를 넘어 마음으로 의지하고 보호해 주는 아주 따뜻한 관계의 자리를 뜻하기도 한답니다."],
      ["고개", "nature", 1, "1. 산이나 언덕을 넘어가도록 비탈지게 나 있는 길이에요.<br>2. 사람이나 동물의 목 윗부분을 뜻해요.<br>3. 일을 처리할 때 겪는 위기나 고비예요.", "1. 숨을 헐떡이며 가파른 고개를 넘어 교실에 도착했다.<br>2. 선생님의 칭찬을 듣고 쑥스러워 고개를 푹 숙였다.<br>3. 이번 시험 준비의 가장 힘든 고개를 무사히 넘겼다.", "자연의 지형과 사람의 신체, 그리고 위기의 순간까지 세 가지 완벽히 다른 뜻을 가졌습니다."],
      ["고르다", "action", 1, "1. 여럿 중에서 마음에 들거나 기준에 알맞은 것을 뽑아내는 행동이에요.<br>2. 울퉁불퉁하지 않고 상태가 고르게 정돈된 상태예요.<br>3. 날씨나 상태가 평소처럼 순조로운 상태예요.", "1. 도서관에 가서 주말에 읽을 재미있는 소설책을 골랐다.<br>2. 운동장의 흙이 파인 곳 없이 아주 고르게 잘 다듬어져 있다.<br>3. 오늘은 바람 한 점 없이 아주 고른 날씨다.", "선택을 뜻하는 동사와 가지런하다는 뜻의 형용사로 쓰이는 필수 단어입니다."],
      ["고스란히", "daily", 2, "누가 함부로 건드리거나 빼내지 않아서 조금도 축나거나 상함 없이 원래 있던 모양 그대로인 완벽한 상태예요.", "학교 운동장에서 주운 5천 원 지폐를 파출소에 가져다주었더니 주인의 품으로 고스란히 돌아갈 수 있었다.", "상태나 물건이 전혀 훼손되지 않고 온전하게 잘 보존되었을 때 문장을 아주 고급스럽게 꾸며주는 예쁜 부사입니다."],
      ["고약하다", "heart", 2, "1. 맛이나 냄새 따위가 코를 찌를 듯이 몹시 나쁜 상태예요.<br>2. 사람의 마음씨가 남을 괴롭힐 정도로 지독하게 심술궂은 상태예요.<br>3. 날씨나 사정이 몹시 나쁘고 험한 상태예요.", "1. 오래된 하수구에서 아주 고약한 냄새가 진동을 했다.<br>2. 놀부처럼 남을 시기하는 고약한 심보를 가지면 친구들이 떠나간다.<br>3. 오늘따라 날씨가 비바람이 몰아치며 아주 고약하다.", "악취를 묘사할 때와 사람의 나쁜 본성을 꼬집을 때 아주 강력하게 씁니다."],
      ["고즈넉하다", "heart", 2, "주변이 시끄럽지 않고 아주 고요하고 평화로우며 아늑한 느낌을 주어 마음이 차분해지는 상태예요.", "방과 후 아무도 남지 않은 도서관의 고즈넉한 분위기 속에서 혼자 조용히 동화책을 읽으니 집중이 정말 잘 되었다.", "시끄러운 소음이 사라진 뒤 찾아오는 마음이 편안해지는 조용한 장소나 시간의 분위기를 묘사하는 아주 멋진 형용사예요."],
      ["고치다", "action", 1, "1. 병이나 아픈 곳을 치료하여 낫게 하는 일이에요.<br>2. 고장 나거나 낡은 것을 손보아 쓰게 하는 일이에요.<br>3. 잘못된 단점이나 나쁜 버릇을 바로잡는 일이에요.", "1. 의사 선생님께서 나의 지독한 감기를 고쳐 주셨다.<br>2. 주말에 아빠와 함께 펑크 난 자전거 바퀴를 고쳤다.<br>3. 자주 지각하는 나의 나쁜 게으름 버릇을 기필코 고치겠다.", "병, 고장 난 물건, 그리고 나의 단점을 모두 낫게 만드는 아주 훌륭하고 긍정적인 행동입니다."],
      ["곧장", "action", 1, "굽은 길로 빙 돌아가거나 딴 데로 한눈팔아 새지 않고 목적지를 향해 똑바로 쭉 나아가는 단호한 모양이에요.", "오늘 학교 수업이 끝나면 피시방이나 놀이터에서 헤매지 말고 집으로 곧장 가야 부모님이 걱정하지 않으신다.", "망설임 없이 빠르고 정확하게 직진하는 행동을 묘사할 때 쓰며, 바르고 곧은 마음가짐을 은유할 때도 유용합니다."],
      ["골짜기", "nature", 1, "크고 높은 산과 산 사이에 길고 깊게 푹 파여 있어서 물이 고여 흐르기 좋은 아주 깊은 지형을 말해요.", "현장체험학습으로 산에 갔을 때 깊은 골짜기 사이로 맑고 시원한 계곡물이 세차게 흘러내리는 경쾌한 소리를 들었다.", "소리를 지르면 메아리가 크게 울려 퍼지는 자연의 웅장한 지형으로, 인생의 아주 힘들고 우울한 시기를 비유하기도 해요."],
      ["곯다", "action", 2, "1. 과일 따위의 속이 물러서 상하는 일이에요.<br>2. 제때 밥을 먹지 못해 속이 비어 배가 고픈 상태예요.<br>3. 억울한 일로 몹시 속상하여 마음이 썩어 들어가는 일이에요.", "1. 사과상자에서 곯은 사과를 골라내어 버렸다.<br>2. 아침밥을 거르고 왔더니 배를 곯아 꼬르륵 소리가 났다.<br>3. 억울한 오해를 받아 속이 곯을 대로 곯았다.", "물리적으로 배가 고프거나 과일이 썩은 것부터, 마음이 병들고 아플 때까지 폭넓게 비유합니다."],
      ["곰곰이", "heart", 1, "한 가지 일에 대해 마음을 가라앉히고 여러모로 차분하게 아주 깊고 진지하게 생각하는 조용한 모양이에요.", "내가 중학교에 가서 진짜로 하고 싶은 꿈이나 장래 희망이 무엇인지 주말 내내 책상에 앉아 곰곰이 생각하며 일기를 썼다.", "글씨를 쓸 때 소리 나는 대로 '곰곰히'로 잘못 쓰는 경우가 아주 많은데, '곰곰이'가 올바른 표준어 맞춤법이라는 점 꼭 기억하세요!"],
      ["곰살갑다", "heart", 2, "말투나 행동이 무뚝뚝하지 않고 성질이 아주 부드럽고 다정하며 싹싹하게 친절하다는 기분 좋은 뜻이에요.", "전학을 와서 교실에서 혼자 쭈뼛거리는 나에게, 먼저 곰살갑게 다가와 상냥한 인사를 건네준 짝꿍이 눈물 나게 고마웠다.", "마치 곰돌이 인형처럼 포근하고 다정한 친구의 성격을 아주 멋지게 칭찬할 때 꼭 어울리는 훌륭한 고유어 형용사입니다."],
      ["곱다", "daily", 1, "1. 모양이나 색깔, 소리나 사람의 마음씨가 예쁘고 아름다운 상태예요.<br>2. 추위 때문에 손가락이 굳어 감각이 없고 뻣뻣해진 상태예요.", "1. 거친 욕설을 빼고 고운 말을 쓰면 학급 분위기가 따뜻해진다.<br>2. 한겨울에 장갑을 안 껴서 추위에 손이 곱아 글씨가 안 써진다.", "아름답다는 뜻의 형용사와 손이 얼었다는 뜻의 형용사가 소리만 같을 뿐 전혀 다른 뜻을 지녔습니다."],
      ["구르다", "action", 1, "1. 둥근 물체가 바닥에 닿아 빙글빙글 돌며 자리를 옮기는 모양이에요.<br>2. 사람이 누운 채로 이리저리 뒹굴거나 도는 모양이에요.<br>3. 발로 바닥을 세게 구르며 치는 행동이에요.", "1. 힘차게 찬 축구공이 모래밭까지 시원하게 굴러갔다.<br>2. 체육 시간에 매트 위에서 앞으로 구르기를 연습했다.<br>3. 몹시 억울하고 화가 나서 방바닥에 발을 구르며 소리쳤다.", "상황이 점점 나빠지거나 커질 때 '눈덩이처럼 구르다'라고 비유로도 쓰이는 생생한 순우리말 동사입니다."],
      ["구름", "nature", 1, "공기 중의 수증기가 엉겨 붙어 무리가 되어 높은 하늘에 신비롭게 떠 있는 아주 친숙하고 예쁜 자연 현상이에요.", "미술 시간에 파란 크레파스로 맑은 가을 하늘을 칠하고 그 위에 하얀 물감으로 솜사탕 같은 뭉게구름을 두둥실 예쁘게 그렸다.", "먹구름, 양떼구름, 쌘구름 등 생김새와 특징에 따라 수십 가지의 재미있는 고유어 이름으로 나뉘는 기상 현상의 대표 단어랍니다."],
      ["구쁘다", "food", 3, "배 속이 허전하여 무언가를 자꾸 먹고 싶다는 뜻을 가진, 식욕이 당길 때 쓰는 아주 재미있고 낯선 옛말이에요.", "점심시간에 밥을 조금 남겼더니 오후 4시쯤 하교 시간이 되자 어김없이 입이 구쁘기 시작하여 떡볶이집으로 향했다.", "출출하고 입이 심심해서 군것질이 당길 때 '나 지금 너무 구쁘다!'라고 친구들에게 멋지게 써먹어 보세요."],
      ["까불다", "action", 1, "1. 곡식을 키에 담아 위아래로 흔들어 먼지를 날려 보내는 농사일이에요.<br>2. 행동이 얌전하지 못하고 함부로 가볍게 장난치는 모습이에요.", "1. 할머니께서 키에 콩을 담아 위아래로 까불며 먼지를 털어내셨다.<br>2. 수업 시간에 까불다가 선생님께 지적을 받고 부끄러웠다.", "곡식을 터는 조상들의 지혜로운 행동이, 아이들의 점잖지 못한 장난을 뜻하는 말로 넓게 쓰이게 되었습니다."],
      ["까칠하다", "heart", 1, "1. 야위거나 메말라 피부 표면이 몹시 거친 상태예요.<br>2. 사람의 성질이 부드럽지 못하고 신경질적이라 원만하지 않은 상태예요.", "1. 겨울철에 로션을 바르지 않았더니 볼이 까칠하게 텄다.<br>2. 요즘 작은 농담에도 예민하게 반응하고 까칠하게 대답하게 된다.", "피부의 메마름과 예민하고 짜증이 많은 성격을 묘사할 때 모두 찰떡같이 쓰이는 단어입니다."],
      ["깜깜하다", "nature", 1, "1. 빛이 전혀 없어서 앞이 보이지 않을 정도로 어두운 상태예요.<br>2. 희망이나 대책이 없어 어떻게 해야 할지 막막한 심정이에요.<br>3. 어떤 사실에 대한 기억이나 소식이 전혀 없는 상태예요.", "1. 밤에 불을 끄고 누우니 방 안이 너무 깜깜해서 무서웠다.<br>2. 시험지를 받았는데 배운 내용이 하나도 기억나지 않아 눈앞이 깜깜했다.<br>3. 어릴 때 친구의 얼굴이 지금은 깜깜하게 기억나지 않는다.", "물리적인 어둠뿐만 아니라 사람의 앞날이 안 보이고 당황스러운 감정을 기가 막히게 표현해 줍니다."],
      ["깜냥", "heart", 2, "스스로 어떠한 일을 해낼 수 있는 본인의 능력이나 수준, 혹은 한계를 뜻하는 아주 줏대 있는 고유어예요.", "남들이 뭐라 하든 신경 쓰지 않고 나는 내 깜냥껏 내가 할 수 있는 최선의 노력을 다해 숙제를 마쳤다.", "자신의 능력 안에서 남에게 의지하지 않고 묵묵히 노력할 때 쓰기 좋은 다부지고 단단한 느낌의 칭찬입니다."],
      ["깜빡", "action", 1, "1. 불빛 따위가 잠깐 밝았다가 사라지는 눈부신 모양이에요.<br>2. 순간적으로 기억이나 의식을 잃어버리는 일상적인 실수 모양이에요.", "1. 밤하늘에 반딧불이 불빛이 깜빡 빛났다가 사라졌다.<br>2. 허둥지둥 등교하느라 수학 노트를 가방에 넣는 것을 깜빡했다.", "기억력이 흐려져서 무언가를 잊어버렸을 때 가장 많이 변명으로 등장하는 친숙한 귀여운 부사입니다."],
      ["깜찍하다", "daily", 1, "생김새가 아주 작고 귀여우며, 하는 행동이 눈치가 빠르고 영리해서 사랑스럽다는 뜻의 칭찬이에요.", "지민이가 새로 사 온 필통에 달린 아주 깜찍한 고양이 열쇠고리가 우리 반 여학생들 사이에서 엄청난 인기를 끌었다.", "단순히 귀여운 것을 넘어서 체구는 작지만 행동이 아주 야무지고 센스가 넘칠 때 콕 집어 칭찬하는 말이에요."],
      ["꼬집다", "action", 1, "1. 손가락으로 살을 단단히 잡아 비트는 물리적인 행동이에요.<br>2. 남의 아픈 약점이나 잘못을 아주 매섭게 지적하여 아프게 하는 일이에요.<br>3. 어떤 사실을 콕 집어내어 지적하는 행동이에요.", "1. 동생이 장난을 치며 내 팔을 세게 꼬집어서 따끔했다.<br>2. 친구가 짝꿍의 콤플렉스를 꼬집어 말하는 바람에 큰 싸움이 났다.<br>3. 선생님은 우리 반의 문제점을 정확히 꼬집어 말씀하셨다.", "물리적인 통증보다, 친구의 기분을 나쁘게 하거나 핵심을 찌를 때의 예리함을 비유합니다."],
      ["꼼수", "action", 1, "정정당당한 방법이 아니라 쩨쩨하고 얕은 수단이나 꾀를 부려 상황을 유리하게 넘어가려는 얄미운 방법이에요.", "청소 시간에 쓰레기 당번을 피하려고 몰래 꼼수를 부리다가 결국 반장에게 들켜서 화장실 청소까지 하게 되었다.", "게임을 할 때 규칙을 어기고 편법을 쓰는 얄미운 반칙을 뜻하는 말로 아이들 사이에서 아주 자주 쓰이는 현실적인 단어입니다."],
      ["꼼꼼하다", "heart", 1, "빈틈이 없이 아주 차분하고 조심스럽게 일을 끝까지 완벽하게 처리하는 훌륭하고 훌륭한 성격이에요.", "중요한 단원 평가 수학 시험을 다 풀고 나서 시간이 남았길래, 계산 실수한 곳이 없는지 꼼꼼하게 처음부터 다시 검토를 했다.", "덜렁대지 않고 실수를 줄여주기 때문에 중학교에 진학하기 전 6학년 학생들에게 꼭 필요한 가장 좋은 습관 중 하나랍니다."],
      ["꾀", "heart", 1, "어려운 일이나 복잡한 상황을 잘 뚫고 나오기 위해 머리를 써서 생각해 낸 묘하고 영리한 지혜나 수단이에요.", "토끼와 거북이 이야기에서 토끼는 빠른 발만 믿었지만, 거북이는 꾀를 내어 포기하지 않고 끈기 있게 결승선을 통과했다.", "지혜와 비슷하지만 약간 잔머리를 굴린다는 느낌이 있어 '잔꾀를 부리다'처럼 얌체 같은 행동을 혼낼 때도 사용됩니다."],
      ["꾸벅꾸벅", "action", 1, "1. 졸음이 와서 머리가 무거워 자꾸 앞으로 수그러지는 모양이에요.<br>2. 남에게 인사를 여러 번 연속해서 깊숙이 하는 공손한 모양이에요.", "1. 늦게까지 게임을 했더니 수업 내내 꾸벅꾸벅 졸고 말았다.<br>2. 교장 선생님을 뵙고 반갑게 꾸벅꾸벅 인사를 드렸다.", "밀려오는 수마(잠)를 이기지 못하는 일상과, 예의 바르게 인사하는 두 가지 모습을 모두 생생하게 그려내는 소리말입니다."],
      ["꿀꺽", "action", 1, "1. 입안에 고인 침이나 물을 단숨에 삼키는 소리예요.<br>2. 남의 물건을 몰래 가로채어 제 것으로 만드는 얄미운 모양이에요.<br>3. 참았던 말이나 울음을 속으로 억지로 참아 넘기는 모양이에요.", "1. 체육을 마치고 시원한 얼음물을 꿀꺽 단숨에 들이마셨다.<br>2. 주운 돈을 경찰서에 주지 않고 몰래 꿀꺽 삼키면 안 된다.<br>3. 화가 났지만 싸우지 않기 위해 할 말을 꿀꺽 삼켰다.", "식욕을 돋우는 물 마시는 소리부터 욕심과 인내심까지 뜻이 기가 막히게 확장되는 유쾌한 의성어입니다."],
      ["꿈", "heart", 1, "1. 잠을 잘 때 깨어 있을 때처럼 여러 가지 현상을 보는 일이에요.<br>2. 실현시키고 싶은 미래의 희망이나 목표예요.<br>3. 실현될 가능성이 아주 없는 헛된 기대나 생각이에요.", "1. 어젯밤에 구름 위를 훨훨 날아다니는 신비한 꿈을 꾸었다.<br>2. 나는 커서 훌륭한 로봇 공학자가 되겠다는 꿈을 품었다.<br>3. 공부는 안 하고 백 점을 맞길 바라다니 헛된 꿈을 버려라.", "인간의 무한한 상상력과 장래 희망을 뜻하는, 두 글자 한자어 '희망'을 완벽하게 압도하는 가장 아름다운 고유어입니다."],
      ["나비잠", "daily", 1, "갓난아이가 두 팔을 머리 위로 벌리고 편안하고 달콤하게 자는 잠이에요.", "어린 동생이 포근한 이불 속에서 나비잠을 자는 모습이 천사 같았다.", "팔을 벌린 모습이 나비 날개 같다고 해서 붙여진 귀여운 이름입니다."],
      ["나루터", "nature", 2, "강이나 좁은 바다에서 배가 건너다니는 일정한 곳이에요.", "시골 마을 나루터에는 사람들을 태워줄 작은 나룻배 한 척이 매여 있었다.", "옛날 사람들에게는 지금의 버스 정류장이나 기차역 같은 곳이었어요."],
      ["남실바람", "nature", 1, "얼굴에 부드럽게 스치며 나뭇잎이 살랑살랑 흔들리게 부는 기분 좋은 바람입니다.", "따스한 봄날 들판에 남실바람이 불어 청보리밭이 일렁였다.", "초등 과학 교과서 '바람의 세기'에서도 배우는 공식적인 우리말 바람 이름이에요."],
      ["내리사랑", "heart", 1, "부모님이 자식을 아끼듯, 윗사람이 아랫사람을 조건 없이 베푸는 깊은 사랑입니다.", "손주를 향한 할머니의 다정한 내리사랑은 끝이 없다.", "반대로 자식이 부모를 향하는 사랑은 '치사랑'이라고 해요."],
      ["너나들이", "heart", 2, "서로 '너', '나' 하고 편하게 부르며 허물없이 아주 가깝게 지내는 사이를 말해요.", "유치원 때부터 짝꿍이었던 진우와 나는 정말 친한 너나들이 친구다.", "친구 사이의 끈끈하고 편안한 우정을 나타낼 때 쓰면 좋습니다."],
      ["너울가지", "heart", 2, "남과 잘 사귀는 솜씨나, 성품이 싹싹하고 원만한 태도를 말합니다.", "전학 온 첫날부터 친구들과 다정하게 어울리는 지호는 너울가지가 좋다.", "친화력과 사교성이 뛰어난 친구를 칭찬할 때 써보세요."],
      ["눈꽃", "nature", 1, "1. 쏟아져 내리는 하얀 눈송이를 예쁜 꽃에 비유한 말이에요.<br>2. 겨울철 나뭇가지 위에 눈이 하얗게 엉겨 붙어 꽃처럼 핀 풍경이에요.", "1. 하늘에서 눈꽃이 펑펑 쏟아지며 겨울이 왔음을 알렸다.<br>2. 설악산 나뭇가지마다 새하얀 눈꽃이 활짝 피어 장관을 이루었다.", "추운 겨울 산행에서 볼 수 있는 가장 아름다운 자연의 신비입니다."],
      ["눈썰미", "heart", 1, "어떤 것을 한두 번 보고도 그 방법이나 특징을 금방 알아채는 재능입니다.", "지수는 눈썰미가 뛰어나서 복잡한 종이접기도 한 번만 보고 척척 따라 한다.", "관찰력이 좋고 손재주가 뛰어난 사람을 칭찬하는 긍정적인 말이에요."],
      ["는개", "nature", 2, "안개비보다는 조금 굵고 이슬비보다는 가늘게 내리는 비예요.", "산길을 걷는데 는개가 촉촉하게 내려 머리카락에 이슬이 맺혔다.", "비의 굵기에 따라 안개비 < 는개 < 이슬비 < 가랑비 순서로 굵어져요."],
      ["늦둥이", "daily", 1, "1. 부모님이 나이가 많이 들어서 늦게 낳은 소중한 자식이에요.<br>2. 제철보다 늦게 열리거나 태어난 동식물을 귀엽게 부르는 말이에요.", "1. 우리 집 귀여운 늦둥이 동생의 재롱 덕분에 매일 웃는다.<br>2. 가을 끝자락에 피어난 늦둥이 코스모스가 몹시 아름답다.", "가족의 사랑을 듬뿍 차지하는 귀여운 막내를 부를 때 많이 씁니다."],
      ["나들목", "daily", 2, "1. 사람들이나 차가 나가고 들어오는 길목이에요.<br>2. 고속도로나 자동차 전용 도로의 인터체인지를 우리말로 순화한 말이에요.", "1. 동네 나들목에서 친구를 만나 함께 씩씩하게 등교했다.<br>2. 차가 막혀서 고속도로 나들목을 빠져나오는 데 한참이 걸렸다.", "외래어(인터체인지)를 아주 자연스럽고 예쁜 우리말로 바꾼 대표적인 단어예요."],
      ["나래", "nature", 2, "1. '날개'를 아주 아름답고 서정적으로 이르는 문학적 표현이에요.<br>2. 흙을 밀어 내어 논밭을 고르게 평평하게 다듬는 농기구예요.", "1. 상상력의 나래를 마음껏 펼쳐서 너만의 멋진 이야기를 써 보렴.<br>2. 농부가 나래를 소에 매달아 거친 밭을 판판하게 골랐다.", "시나 소설에서 무한한 가능성을 비유할 때 '나래를 펴다'라고 씁니다."],
      ["낟알", "food", 2, "껍질을 아직 벗기지 않은 벼나 보리 같은 곡식의 알맹이입니다.", "참새들이 추수가 끝난 들판에서 떨어진 낟알을 주워 먹고 있다.", "농부의 땀방울이 맺힌 아주 작지만 소중한 식량을 뜻해요."],
      ["노을", "nature", 1, "해가 뜨거나 질 무렵 하늘이 아름답게 붉은빛으로 물드는 현상이에요.", "저녁이 되자 하늘 전체가 불타는 듯한 붉은 노을로 덮였다.", "아침에 해가 뜰 때 붉게 물드는 현상은 '아침노을'이라고 부른답니다."],
      ["눈바래기", "action", 3, "멀리 배웅을 가지 않고 선 자리에서 눈으로만 멀리까지 배웅하는 모습이에요.", "할머니께서는 내가 탄 버스가 안 보일 때까지 눈바래기로 지켜보셨다.", "헤어짐의 아쉬움이 듬뿍 묻어나는 정다운 우리말입니다."],
      ["뉘엿뉘엿", "time", 1, "해나 달이 서서히 산이나 지평선 너머로 넘어가려고 하는 모양이에요.", "서산 너머로 해가 뉘엿뉘엿 지기 시작하자 주변이 어둑어둑해졌다.", "시간이 천천히 흘러가며 저무는 평화로운 저녁 풍경에 어울려요."],
      ["너울", "nature", 2, "1. 바다에서 일어나는 아주 크고 세차게 넘실거리는 거대한 물결이에요.<br>2. 옛날 여성들이 외출할 때 얼굴을 가리기 위해 쓰던 얇은 천이에요.", "1. 태풍이 다가오자 바다에는 커다란 너울이 일어 방파제를 때렸다.<br>2. 사극 드라마에서 양반집 규수가 너울을 쓰고 말을 타는 모습을 보았다.", "일반적인 파도보다 훨씬 스케일이 크고 무서운 물결을 뜻할 때 씁니다."],
      ["나긋나긋하다", "heart", 2, "1. 물건이 만지기에 꽤 부드럽고 연한 상태예요.<br>2. 사람의 태도나 성질이 뻣뻣하지 않고 아주 다정하고 친절한 모습이에요.", "1. 갓 구워낸 빵이 아주 나긋나긋하고 촉촉해서 맛있다.<br>2. 항상 미소를 지으며 나긋나긋하게 말씀하시는 선생님의 수업은 참 편안하다.", "딱딱하고 무서운 태도와 반대되는 아주 다정하고 부드러운 성격의 칭찬입니다."],
      ["나부끼다", "action", 1, "1. 깃발이나 얇은 천, 나뭇잎 따위가 바람에 가볍게 흔들리는 모습이에요.<br>2. 냄새나 연기 따위가 바람에 실려 널리 퍼지는 현상이에요.<br>3. 사람의 마음이 외부의 유혹이나 감정에 흔들리는 상태예요.", "1. 학교 운동장 국기 게양대 위로 태극기가 힘차게 나부끼고 있다.<br>2. 저녁 무렵 굴뚝에서 피어오른 밥 짓는 연기가 동네에 나부꼈다.<br>3. 화려한 장난감 광고를 보니 사고 싶은 마음에 결심이 나부꼈다.", "가볍고 경쾌하게 바람에 날리는 긍정적이고 활기찬 느낌을 줍니다."],
      ["남우세", "heart", 3, "남에게 비웃음이나 조롱을 받을 만한 부끄러운 일이나 태도를 말해요.", "큰소리를 치고서 정작 대회에서 꼴찌를 하니 남우세를 사게 되었다.", "부끄러운 일을 당하지 않도록 스스로 행동을 조심하자는 뜻이 담겨 있어요."],
      ["넌출", "nature", 3, "길게 뻗어 나가 이리저리 엉클어지고 처진 식물의 긴 줄기를 말해요.", "시골집 돌담 위로 호박 넌출이 탐스럽게 뻗어 나가 꽃을 피웠다.", "덩굴 식물이 생명력 넘치게 뻗어 나가는 야생의 모습을 묘사합니다."],
      ["넌지시", "action", 2, "자신의 마음이나 뜻을 대놓고 드러내지 않고 가만히 전하는 모양이에요.", "생일 선물이 무엇인지 궁금해서 엄마에게 넌지시 물어보았다.", "상대방이 눈치채지 못하게 살짝 떠보거나 부드럽게 말할 때 씁니다."],
      ["노둣돌", "daily", 3, "옛날에 말을 타고 내릴 때 발돋움하기 위해 바닥에 놓아둔 큰 돌입니다.", "장군이 커다란 노둣돌을 밟고 단숨에 용맹한 말 위로 올라탔다.", "지금은 '어떤 일을 시작하기 위한 발판'이라는 비유적인 뜻으로 쓰여요."],
      ["눈도장", "action", 2, "1. 마음에 잊지 않기 위해 눈으로 꾹 찍어두듯 똑똑히 기억해 두는 행동이에요.<br>2. 윗사람이나 중요한 사람에게 눈에 띄게 인사를 하여 자신을 알리는 일이에요.", "1. 마트에서 갖고 싶은 장난감의 위치에 눈도장을 꾹 찍어 두었다.<br>2. 전학 온 첫날 담임 선생님께 바르게 인사하며 눈도장을 단단히 찍었다.", "기억에 남기려는 의지를 눈빛과 도장에 비유한 재미있는 단어입니다."],
      ["눈초리", "daily", 1, "1. 귀 쪽으로 가늘게 이어지는 눈의 가장자리를 가리키는 부위예요.<br>2. 감정이 겉으로 드러나는 눈빛이나 남을 바라보는 날카로운 시선이에요.", "1. 친구가 환하게 웃을 때 눈초리가 살짝 휘어지는 모습이 예쁘다.<br>2. 거짓말을 한 것을 들킬까 봐 선생님의 매서운 눈초리를 슬쩍 피했다.", "매섭거나 따뜻한 감정이 가장 잘 드러나는 얼굴 부위입니다."],
      ["눈치", "heart", 1, "1. 남의 마음이나 주변 상황을 재빨리 알아채는 직감적인 힘이나 센스예요.<br>2. 속으로 생각하는 불만이나 감정이 겉으로 드러나는 태도예요.", "1. 지혜는 눈치가 빨라서 친구가 우울해할 때 먼저 다가가 위로를 건넨다.<br>2. 청소하기 싫은 눈치를 자꾸 보이면 모둠 친구들의 기분이 상한다.", "긍정적으로 쓰이면 상황을 현명하게 대처하는 센스(Sense)가 됩니다."],
      ["나직하다", "action", 1, "1. 물건의 위치가 꽤 낮아 보기에 편안하고 안정감 있는 모양이에요.<br>2. 목소리나 소리가 꽤 낮고 부드러워서 차분하게 들리는 모양이에요.", "1. 산기슭에 나직하게 엎드려 있는 시골집이 무척 정겨워 보였다.<br>2. 엄마께서 나직한 목소리로 옛날이야기를 들려주시자 스르르 잠이 왔다.", "크고 뾰족한 것이 아니라 마음을 편안하게 해주는 안정된 느낌이에요."],
      ["낮잠", "time", 1, "낮에 피곤을 풀기 위해 잠깐 짧게 자는 꿀 같은 잠입니다.", "여름방학에 마루에 누워 시원한 바람을 맞으며 달콤한 낮잠을 잤다.", "너무 길게 자면 오히려 밤에 잠이 안 오니 주의해야 해요!"],
      ["낯가림", "heart", 1, "어린아이가 낯선 사람을 보고 부끄러워하거나 무서워서 피하는 행동이에요.", "우리 동생은 낯가림이 심해서 처음 보는 친척 어른들 뒤로 쏙 숨어버린다.", "새로운 사람이나 환경에 적응하는 데 시간이 필요한 자연스러운 모습입니다."],
      ["낯설다", "heart", 1, "전에 본 적이 없거나 겪어보지 않아서 익숙하지 않고 어색하다는 뜻이에요.", "전학 온 첫날, 모든 것이 낯설고 어색해서 교실에 들어가기 망설여졌다.", "처음 해보는 일은 누구나 낯설지만, 시간이 지나면 익숙해진답니다."],
      ["내음", "daily", 1, "코로 맡을 수 있는 '냄새'를 아주 부드럽고 서정적으로 기분 좋게 표현하는 말입니다.", "비가 내린 뒤 숲속을 걸으니 향긋한 흙내음이 코끝을 맴돌았다.", "향기롭고 좋은 냄새를 문학적으로 표현할 때 아주 잘 어울려요."],
      ["널뛰기", "action", 1, "1. 긴 널빤지 한가운데를 받치고 양 끝에 사람이 서서 번갈아 뛰어오르는 놀이예요.<br>2. 물가나 감정 따위가 위아래로 아주 크게 오르내리는 현상을 비유해요.", "1. 명절날 한복을 입은 소녀들이 마당에서 하늘 높이 널뛰기를 즐겼다.<br>2. 요즘 채소 가격이 널뛰기를 하는 바람에 장보기가 겁난다고 하셨다.", "체육 시간에 배우는 지레의 원리가 쏙쏙 담긴 조상들의 지혜로운 놀이입니다."],
      ["널찍하다", "daily", 1, "보기에 꽤 넓고 시원하여 공간이 넉넉하고 편안하다는 뜻이에요.", "짐을 다 치우고 나니 거실이 아주 널찍해져서 누워서 뒹굴기 좋았다.", "답답함 없이 공간이나 마음이 탁 트이고 여유로운 상태를 묘사합니다."],
      ["눈망울", "daily", 1, "눈알의 앞부분으로, 맑고 반짝이며 감정을 가득 담고 있는 눈을 뜻합니다.", "강아지가 간식을 달라고 초롱초롱한 눈망울로 나를 올려다보았다.", "순수하고 깨끗한 사람이나 동물의 눈을 표현할 때 가장 좋은 말이에요."],
      ["느루", "time", 3, "어떤 일을 한꺼번에 몰아치지 않고 시간을 길게 잡아 여유롭게 처리하는 모양이에요.", "벼락치기를 하지 말고 시험공부는 평소에 느루 해 두는 것이 현명하다.", "조급해하지 않고 꾸준하고 여유 있게 일을 해나가는 지혜로운 태도입니다."],
      ["나룻", "daily", 3, "턱이나 뺨에 나는 어른들의 수염을 옛스럽게 부르는 고유어입니다.", "옛날 장군들의 초상화를 보면 하나같이 덥수룩하고 멋진 나룻을 기르고 있다.", "우리가 아는 '구레나룻'이라는 단어도 바로 이 말에서 나온 것이랍니다."],
      ["나막신", "daily", 2, "비가 오거나 땅이 질 때 진흙에 발이 빠지지 않도록 통나무를 파서 굽을 높게 만든 옛날 신발이에요.", "장마철이 되자 옛 선비들은 굽이 높은 나막신을 신고 외출을 하셨다.", "장화가 없던 시절 우리 조상들이 젖지 않게 신었던 훌륭한 발명품입니다."],
      ["나발", "daily", 2, "1. 옛날 군대에서 신호를 보낼 때 불던 관악기예요.<br>2. 함부로 쑥덕거리는 입을 비유적으로 속되게 이르는 말이에요.<br>3. 컵을 쓰지 않고 병째로 입에 대고 마시는 얄미운 행동이에요.", "1. 장군의 명령이 떨어지자 병사들이 뿔로 만든 나발을 길게 불었다.<br>2. 헛소문을 동네방네 나발 불고 다니면 사람들의 미움을 받는다.<br>3. 체육이 끝나고 냉장고의 물을 병째로 나발 불다 엄마에게 혼났다.", "'입'을 낮잡아 부르거나, 소문을 함부로 퍼뜨리는 행동을 꼬집을 때 써요."],
      ["나비", "nature", 1, "봄이나 여름에 아름다운 색깔의 날개를 팔랑거리며 꽃 사이를 나는 예쁜 곤충입니다.", "노란 호랑나비 한 마리가 향기로운 튤립 꽃송이 위에 살포시 내려앉았다.", "자연의 아름다움과 봄의 생명력을 가장 잘 보여주는 곤충의 순우리말이에요."],
      ["나이", "time", 1, "사람이나 동물이 태어나서부터 지금까지 살아온 햇수를 세는 말입니다.", "어느덧 나이를 한 살 더 먹고 6학년의 최고 형님이 되었으니 의젓하게 행동해야지.", "나무의 나이를 뜻하는 '나이테'도 이 단어에서 유래한 정겨운 표현입니다."],
      ["나중", "time", 1, "1. 어떤 차례나 순서의 가장 끝을 가리키는 말이에요.<br>2. 지금 당장이 아니라 시간이 조금 더 흐른 뒤의 미래를 뜻해요.", "1. 줄을 늦게 서는 바람에 밥을 나중 차례로 먹게 되었다.<br>2. 어려운 수학 문제를 풀다 막히면 잠시 넘어가고 나중에 다시 푸는 것이 좋다.", "현재가 아닌 미래의 순서나 시간을 약속할 때 흔히 쓰는 아주 유용한 고유어입니다."],
      ["낚시", "action", 1, "1. 미끼를 달아 물고기를 낚아 올리는 도구나 활동이에요.<br>2. 물고기를 잡기 위해 줄 끝에 매다는 굽은 바늘이에요.<br>3. 교묘한 속임수로 남을 유혹하여 속이는 나쁜 행동을 비유해요.", "1. 주말에 아빠와 함께 저수지로 낚시를 가서 손바닥만 한 물고기를 잡았다.<br>2. 물고기가 미끼만 먹고 도망가서 빈 낚시만 물 밖으로 올라왔다.<br>3. 인터넷에서 자극적인 제목으로 클릭을 유도하는 낚시성 기사에 속았다.", "무언가를 잡는 행동 외에도 속임수로 남을 유혹할 때 비유적으로 쓰기도 합니다."],
      ["날개", "nature", 1, "1. 새나 곤충, 비행기가 하늘을 날기 위해 펄럭이는 양쪽 부분이에요.<br>2. 좌우로 날개처럼 길게 뻗어 나온 공간이나 건물을 뜻해요.<br>3. 구속에서 벗어나 자유롭게 꿈과 희망을 펼치는 능력을 비유해요.", "1. 독수리가 거대한 날개를 활짝 펴고 먹이를 향해 빠른 속도로 날아갔다.<br>2. 우리 학교 본관 건물 양쪽 날개에는 새롭게 꾸민 과학실과 음악실이 있다.<br>3. 6학년이 된 우리 반 친구들은 상상력의 날개를 활짝 펴고 나아간다.", "꿈과 희망을 상징하며 '상상력의 날개를 달다'처럼 비유적으로 아주 많이 쓰여요."],
      ["날씨", "nature", 1, "그날그날의 기온, 비, 구름, 바람 등 자연이 만들어내는 대기의 상태를 말합니다.", "소풍 가는 날 아침, 다행히 날씨가 맑고 따뜻해서 기분 좋게 김밥을 챙겨 나섰다.", "'날(day)'과 '씨(상태)'가 합쳐져 만들어진 매일매일 우리의 삶에 중요한 단어입니다."],
      ["낯", "daily", 1, "1. 사람의 이목구비가 있는 얼굴을 가리키는 짧은 단어예요.<br>2. 남을 당당하게 대할 만한 체면이나 자존심을 뜻해요.", "1. 오랜만에 만난 친척 동생이 몰라보게 자라서 순간 낯을 알아보기 힘들었다.<br>2. 거짓말을 한 사실이 들통나서 부끄러워 낯을 들고 다닐 수가 없었다.", "'낯이 익다(익숙하다)', '낯이 두껍다(뻔뻔하다)'처럼 관용구로 굉장히 많이 활용돼요."],
      ["너비", "daily", 1, "물건이나 장소의 가로로 벌어진 폭을 말하며, 길이나 높이와 함께 쓰이는 크기 단위예요.", "책상에 들어갈 수납장을 사기 위해 줄자로 빈 공간의 너비를 꼼꼼하게 재었다.", "수학이나 실과 시간에 넓이와 폭을 계산할 때 꼭 알아야 하는 기본 고유어입니다."],
      ["노래", "action", 1, "1. 아름다운 가락에 맞추어 목소리로 사람의 감정을 표현하는 예술이에요.<br>2. 특정한 대상의 훌륭함을 높이 기리고 칭찬하는 글이나 말이에요.<br>3. 상대방이 같은 말을 귀찮을 정도로 계속 반복해서 불평할 때 비유해요.", "1. 음악 시간에 친구들과 둥글게 모여 앉아 즐겁고 신나는 동요 노래를 합창했다.<br>2. 위인전에는 우리나라를 지킨 이순신 장군의 용맹함을 부르는 노래가 담겨 있다.<br>3. 동생은 스마트폰을 사달라고 며칠째 똑같은 노래를 부르며 떼를 쓴다.", "우리의 감정을 가장 잘 표현해 주고 사람들의 마음을 하나로 묶어주는 마법 같은 말이에요."],
      ["노루", "nature", 1, "뿔이 없고 엉덩이 부분에 흰 반점이 있으며, 숲속에 사는 겁이 많은 사슴을 닮은 동물이에요.", "산길을 걷다가 바스락 소리에 놀라 도망치는 귀여운 노루의 뒷모습을 보았다.", "순하고 착한 눈망울을 가진 우리나라 야생 동물을 대표하는 친숙한 이름입니다."],
      ["누리", "nature", 2, "1. '세상'이나 '우주'를 뜻하는 아주 스케일이 크고 웅장한 느낌을 주는 대명사예요.<br>2. 소나기와 함께 하늘에서 떨어지는 얼음덩어리인 '우박'을 뜻하는 고유어예요.", "1. 우리 반 친구들이 자라서 이 넓은 누리를 이끌어가는 훌륭한 일꾼이 되기를 바란다.<br>2. 농부 아저씨들은 애써 가꾼 농작물이 누리를 맞아 상할까 봐 몹시 걱정하셨다.", "'온누리', '가온누리'처럼 더 넓고 희망찬 세상을 노래할 때 주로 붙여서 사용합니다."],
      ["눈물", "heart", 1, "1. 슬프거나 기쁘거나 아플 때 눈에서 뺨으로 흘러내리는 맑은 액체예요.<br>2. 몹시 힘들고 고통스럽거나 안타까운 감정과 슬픔을 비유적으로 이르는 말이에요.", "1. 운동회 계주에서 아쉽게 역전당해 져버리자 속상한 마음에 나도 모르게 눈물이 났다.<br>2. 독립운동가들은 피와 눈물로 이 나라를 지켜내신 위대한 분들이다.", "사람의 가장 진실한 감정을 표현하는 투명한 보석 같은 순우리말 단어입니다."],
      ["다독이다", "action", 1, "1. 흩어진 것을 가볍게 두드려 평평하게 하거나 가라앉히는 일이에요.<br>2. 남의 아프거나 슬픈 마음을 따뜻하게 위로하여 가라앉히는 다정한 행동이에요.", "1. 봄에 씨앗을 뿌린 뒤 흙을 손으로 가볍게 다독여 주었다.<br>2. 수학 시험을 망친 짝꿍의 등을 다독이며 따뜻하게 위로했다.", "아기를 재울 때 가볍게 두드리는 스킨십처럼 아주 다정한 격려의 표현입니다."],
      ["다붓하다", "heart", 3, "1. 여럿이 아주 가깝게 붙어 있는 상태예요.<br>2. 조용하고 오붓하여 아주 아늑한 느낌을 주는 상태예요.", "1. 추운 겨울, 강아지 세 마리가 서로 다붓하게 모여 잠을 잔다.<br>2. 오랜만에 친한 친구와 다붓하게 마주 앉아 고민을 나누었다.", "조용하고 오붓한 시간을 보내며 마음을 나눌 때 쓰기 좋은 서정적인 순우리말입니다."],
      ["다사롭다", "heart", 2, "햇살이나 성격이 아주 따뜻하고 부드럽다는 뜻을 가진 기분 좋은 형용사예요.", "봄날의 다사로운 햇살을 맞으며 운동장 벤치에서 친구와 정겹게 책을 읽었다.", "따사롭다와 비슷하지만 조금 더 여리하고 부드러워 마음에 스며드는 느낌을 줍니다."],
      ["다스리다", "action", 2, "1. 국가나 사회, 단체를 보살피고 통제하여 올바르게 관리하는 일이에요.<br>2. 끓어오르는 자신의 화나 감정을 꾹 누르고 진정시키는 일이에요.<br>3. 병이나 아픈 곳을 약으로 고쳐 낫게 하는 일이에요.", "1. 세종대왕은 백성들을 몹시 아끼고 사랑하는 마음으로 나라를 다스리셨다.<br>2. 순간 화가 났지만 심호흡을 하며 마음을 차분히 다스렸다.<br>3. 할머니께서는 감기에 걸렸을 때 따뜻한 생강차로 기침을 다스리신다.", "나쁜 감정에 휩쓸리지 않고 스스로를 통제하는 아주 지혜롭고 어른스러운 행동이죠."],
      ["다잡다", "action", 2, "1. 늦추어졌던 끈이나 물건을 바짝 당겨 단단히 묶거나 잡는 행동이에요.<br>2. 흐트러진 마음이나 태도를 다시 단단히 굳게 먹고 바로잡는 굳센 행동이에요.", "1. 바람에 날아가지 않도록 텐트의 줄을 팽팽하게 다잡아 매었다.<br>2. 여름방학이 끝나고 2학기에는 더 열심히 공부하겠다고 마음을 다잡았다.", "게을러지거나 포기하고 싶을 때 스스로를 응원하고 결심을 굳힐 때 쓰는 말입니다."],
      ["다짜고짜", "action", 1, "상황이나 앞뒤 사정을 알아보지도 않고 무턱대고 급하게 행동하는 모양이에요.", "친구가 교실에 들어오자마자 인사도 없이 다짜고짜 나에게 따져 물어 황당했다.", "이유도 묻지 않고 막무가내로 급하게 행동하여 당황스러울 때 주로 쓰이는 부사입니다."],
      ["단골", "daily", 1, "1. 늘 정해 놓고 자주 가는 친숙한 가게나 장소예요.<br>2. 자주 오는 손님이나 아주 친밀하게 자주 만나는 사람을 말해요.", "1. 학교 앞 맛있는 분식집은 우리 모둠 친구들의 단골 가게다.<br>2. 서점 사장님께서 나를 알아보시고 단골이 왔다며 반갑게 인사를 건네셨다.", "한자어 같지만 사실 우리 조상 대대로 쓰여온 아주 친숙하고 정겨운 순우리말이랍니다."],
      ["달구지", "daily", 2, "소나 말이 끄는 짐수레를 뜻하는 전통 농경 사회의 아주 요긴한 시골 교통수단이에요.", "민속촌 현장체험학습을 가서 소가 느릿느릿 끄는 낡은 나무 달구지를 직접 타 보았다.", "요즘 시대의 트럭이나 택배차 역할을 묵묵히 담당하던 조상들의 소중한 도구랍니다."],
      ["달큼하다", "food", 2, "맛이나 냄새가 혀끝에 닿았을 때 기분 좋을 정도로 알맞게 단 느낌을 주는 말이에요.", "할머니께서 가을에 정성껏 끓여주신 노란 단호박죽이 참 달큼하고 목 넘김이 좋다.", "설탕처럼 너무 강한 단맛이 아니라 자연스럽고 은은해서 기분 좋은 맛의 표준어예요."],
      ["달포", "time", 3, "한 달이 조금 넘는 기간을 뜻하는, 옛 선비들이 쓰던 멋진 시간 표현이에요.", "여름방학을 한 지 벌써 달포가 지났는데도 계획한 책을 다 읽지 못해 아쉬움이 남는다.", "한 달 남짓한 시간을 한 달이라는 말 대신 조금 어른스럽고 멋스럽게 표현하는 단어입니다."],
      ["더기", "nature", 3, "산이나 들에 있는 고원처럼 아주 높고 넓으며 평평한 땅을 뜻하는 자연 낱말이에요.", "힘들게 산 정상에 올랐더니 탁 트인 푸른 더기가 펼쳐져 있어서 시원한 바람을 맞았다.", "우리가 평소에 잘 모르는 지형 이름이지만, 아주 웅장하고 너른 땅을 묘사할 때 쓰입니다."],
      ["더듬거리다", "action", 1, "1. 말을 유창하게 못 하고 자꾸 막히거나 끊어지게 말하는 모습이에요.<br>2. 앞이 보이지 않아 손이나 감각으로 이리저리 만지며 길이나 물건을 찾는 모양이에요.", "1. 수업 시간에 발표를 하게 되자 긴장해서 얼굴이 빨개지고 말을 자꾸 더듬거렸다.<br>2. 갑자기 정전이 되어 캄캄한 방 안에서 손으로 벽을 더듬거리며 문을 찾았다.", "말이 막히는 언어적 행동과 어두운 곳에서 손을 쓰는 물리적인 행동으로 두루 쓰입니다."],
      ["더위잡다", "action", 3, "1. 높은 곳에 오르려고 무엇을 꽉 끌어당겨 잡는 행동이에요.<br>2. 어떠한 사실이나 일의 가장 중요하고 핵심적인 단서를 꽉 붙잡는 일이에요.", "1. 클라이밍 체험장에서 위쪽의 돌을 굳세게 더위잡고 기어올라 정상에 섰다.<br>2. 경찰 아저씨가 범인이 남긴 결정적인 증거를 더위잡아 사건을 해결했다.", "어려움을 이겨내고 한 단계 더 위로 꿋꿋하게 올라가려는 훌륭한 노력을 뜻하기도 합니다."],
      ["덜렁이", "heart", 1, "차분하지 못하고 행동이나 성격이 몹시 가벼워 실수를 자주 하는 사람을 귀엽게 부르는 말이에요.", "우리 반 최고의 덜렁이인 나는 오늘도 꼼꼼히 챙기지 못하고 실내화 주머니를 집에 두고 왔다.", "귀여운 실수를 하는 친구의 별명으로 많이 쓰이지만, 고학년이 되면 꼼꼼해지려 노력해야 해요."],
      ["덤", "daily", 1, "1. 물건을 살 때 주인이 정해진 양보다 고마운 마음으로 조금 더 얹어 주는 여분의 물건이에요.<br>2. 어떤 일의 결과로 뜻하지 않게 추가로 얻게 되는 좋은 일이나 이익이에요.", "1. 문방구 아주머니께서 지우개를 사자 인사성이 바르다며 덤으로 사탕을 주셨다.<br>2. 봉사 활동을 하며 남을 도왔을 뿐인데, 덤으로 내 마음까지 무척 행복해졌다.", "계산적인 세상을 따뜻하게 만드는 우리나라 특유의 넉넉한 인심과 정을 느낄 수 있는 낱말입니다."],
      ["덧없다", "heart", 2, "1. 시간이 너무 빨리 지나가서 허무하거나, 삶이 알맹이가 없어 보잘것없다는 아쉬운 뜻이에요.<br>2. 어떤 일에 대해 마음을 둘 곳이 없이 몹시 허전하고 쓸쓸한 기분이에요.", "1. 6학년 1학기가 눈 깜짝할 사이에 덧없이 훌쩍 지나가 버려 아쉬움이 남는다.<br>2. 아끼던 강아지를 잃어버리고 나니 모든 일이 덧없게 느껴져 며칠을 우울했다.", "시간의 쏜살같은 빠름이나 인생의 허무함을 시나 문학 작품처럼 감성적으로 표현할 때 씁니다."],
      ["도담도담", "action", 1, "어린아이나 새싹이 탈 없이 튼튼하고 탐스럽게 쑥쑥 잘 자라는 긍정적인 모양을 뜻해요.", "교실 뒤편 화분에 심어둔 강낭콩이 도담도담 잎을 내며 하루가 다르게 무럭무럭 잘 자라고 있다.", "귀중한 생명이 건강하게 성장하기를 간절히 바라고 축복할 때 쓰는 아주 예쁜 순우리말 부사예요."],
      ["도란도란", "action", 1, "여럿이 모여 나지막한 목소리로 정답고 다정하게 웃음꽃을 피우며 이야기를 나누는 모습입니다.", "현장체험학습 버스 안에서 짝꿍과 도란도란 수다를 떠느라 목적지까지 가는 시간 가는 줄을 몰랐다.", "가족이나 친구들과의 오붓하고 따뜻한 대화 시간을 묘사할 때 가장 잘 어울리고 많이 쓰입니다."],
      ["도랑", "nature", 2, "시골 마을이나 들판에 물이 졸졸 흐르도록 좁고 길게 파놓은 아주 작은 물길이나 냇물이에요.", "여름방학 때 시골 외갓집 앞 도랑에서 송사리와 올챙이를 잡으며 바지 가랑이가 젖도록 놀았다.", "도랑 치고 가재 잡는다는 속담은 도랑 청소도 하고 가재도 얻듯 한 일로 두 이익을 얻는다는 뜻이에요."],
      ["도르리", "action", 3, "여러 사람이 음식을 똑같이 나누어 먹거나, 물건을 살 비용을 공평하게 나누어 내는 훌륭한 일이에요.", "모둠 과제가 끝나고 분식집에서 떡볶이를 맛있게 먹은 뒤 우리는 각자 용돈으로 공평하게 도르리를 했다.", "오늘날의 더치페이나 뿜빠이 같은 외국어를 완벽하게 대체할 수 있는 우리 조상들의 지혜로운 단어예요."],
      ["돋우다", "action", 2, "1. 화나 용기, 입맛 같은 감정이나 기운이 높아지게 부추기는 행동이에요.<br>2. 밑을 괴어서 위로 도톰하게 쑥 높아지게 만드는 물리적인 행동이에요.", "1. 체육대회 때 응원 단장이 큰 목소리로 화이팅을 외치며 선수들의 사기를 한껏 돋우었다.<br>2. 화단에 꽃씨를 심기 위해 호미로 흙을 파서 둑을 도톰하게 돋우었다.", "화를 돋우다처럼 부정적인 감정을 부추길 때도 쓰지만 입맛을 돋우다처럼 긍정적으로도 쓰입니다."],
      ["동무", "heart", 1, "늘 친하게 어울려 노는 친구나 단짝 짝꿍을 정겹고 따뜻하게 부르는 아주 훌륭한 옛말이에요.", "유치원 때부터 매일 등교를 같이하며 내 고민을 잘 들어주는 지훈이는 나의 가장 소중한 친한 동무다.", "어깨동무, 길동무처럼 어딘가를 사이좋게 함께하는 관계를 나타낼 때 뒤에 붙어서 예쁜 말을 만듭니다."],
      ["동아리", "daily", 1, "같은 뜻이나 같은 취미를 가진 사람들이 자발적으로 모여서 만든 즐겁고 유익한 학교 모임이나 단체예요.", "나는 평소에 컴퓨터 코딩을 아주 좋아해서 이번 학기에 과학 발명 동아리에 기쁘게 가입했다.", "학교생활에서 친구들과 공통의 관심사를 즐겁게 나누고 실력을 키울 수 있는 아주 좋은 교내 모임이죠."],
      ["동트다", "time", 1, "캄캄한 새벽에 동쪽에서 해가 떠오르며 온 세상이 서서히 희미하게 밝아지기 시작하는 희망찬 시간이에요.", "수련회 마지막 날 일출을 보려고 새벽 일찍 산에 올랐더니 저 멀리 바다에서 하늘이 동트는 모습이 장관이었다.", "길고 긴 어둠이 마침내 끝나고 새로운 희망의 시작이 열리는 아주 긍정적이고 벅찬 순간을 의미하는 말이에요."],
      ["두남받다", "heart", 3, "남에게 남다른 도움이나 특별한 돌봄과 사랑을 아주 듬뿍 받아 몸과 마음이 편안해지다는 따뜻한 뜻이에요.", "부모님의 조건 없는 따뜻한 사랑으로 두남받으며 자라난 나는 매사에 구김살 없이 늘 긍정적이고 밝게 컸다.", "누군가의 각별한 애정과 보살핌을 당연하게 여기지 않고 진심으로 감사하게 여길 때 쓰는 훌륭한 단어입니다."],
      ["두루뭉술하다", "heart", 2, "말이나 행동이 모나거나 정확하지 않고, 대충 둥글고 원만하게 스리슬쩍 넘어가는 어설픈 모습이에요.", "모둠 토의 시간에 구체적인 의견을 묻자, 준비를 안 한 지호가 대충 두루뭉술하게 변명하듯 얼버무렸다.", "좋게 포장하면 성격이 둥글둥글하고 원만한 것이지만, 나쁘게 말하면 일 처리가 정확하거나 꼼꼼하지 않은 거예요."],
      ["두레", "daily", 2, "옛날 농촌에서 힘든 농사일을 서로 돕기 위해 마을 사람들이 자발적으로 뭉쳐서 만든 전통 협동 단체예요.", "우리 조상들은 모내기 철이 오면 다 같이 두레를 만들어 네 논 내 논 가리지 않고 서로 땀 흘려 도와주셨다.", "도덕이나 사회 시간에 배우는 우리 민족 고유의 아름다운 상부상조와 협동 정신을 가장 잘 보여주는 역사적인 단어입니다."],
      ["둔덕", "nature", 2, "가운데가 밥그릇을 엎어놓은 것처럼 볼록하게 둥글게 솟아오른 작은 언덕이나 흙더미를 정겹게 부르는 말이에요.", "점심을 먹고 학교 뒤뜰의 푸른 둔덕에 빙 둘러앉아 상쾌한 바람을 쐬며 저녁 메뉴에 대해 수다를 떨었다.", "가파르고 험한 산비탈보다는 높이가 낮고 둥글둥글해서 아이들이 굴러놀기 좋은 동네 뒷산이나 공원 같은 느낌을 줍니다."],
      ["둘레", "daily", 1, "1. 어떤 사물이나 장소의 겉을 한 바퀴 빙 돌아가는 가장자리 선이나 그 테두리예요.<br>2. 그 선을 따라 잰 길이의 단위를 뜻해요.", "1. 학교 정문 화단의 동그란 둘레를 따라 예쁜 튤립이 심어져 있다.<br>2. 거대한 운동장 둘레를 세 바퀴나 전력 질주해 돌았더니 숨이 턱 끝까지 찼다.", "수학 시간에 다각형과 원의 성질을 배울 때 넓이와 함께 반드시 공식을 외우게 되는 아주 중요한 개념입니다."],
      ["둥지", "nature", 1, "1. 새나 짐승이 알을 낳고 새끼를 기르기 위해 나뭇가지나 풀로 엮어서 튼튼하게 만든 집이에요.<br>2. 가족들이 오순도순 모여 사는 편안하고 아늑한 집이나 보금자리를 문학적으로 비유하는 말이에요.", "1. 은행나무 위에 까치 한 쌍이 부지런히 굵은 나뭇가지를 물어다 둥지를 틀었다.<br>2. 힘든 하루를 마치고 따뜻한 둥지 같은 우리 집으로 돌아오니 마음이 몹시 편안했다.", "동물들의 집뿐만 아니라 우리가 사랑하는 가족들의 보금자리를 비유할 때도 쓰이는 따뜻한 명사입니다."],
      ["뒤뚱거리다", "action", 1, "무거운 몸이나 엉덩이를 좌우로 어설프게 크게 흔들며 중심을 잡지 못하고 불안하게 걷는 귀여운 모습이에요.", "동물원 눈밭에서 통통한 펭귄 무리가 짧은 다리로 뒤뚱거리며 물가로 걷는 모습이 우스꽝스럽고 귀여웠다.", "아기들이 막 걸음마를 배울 때나 통통한 동물들이 무겁게 흔들리며 걷는 모습을 아주 생생하게 나타냅니다."],
      ["뒤웅박", "daily", 3, "둥근 박을 쪼개지 않고 꼭지 부분만 구멍을 뚫어 속을 파내고 끈을 달아 만든 전통 바가지예요.", "가을에 조롱박으로 단단한 뒤웅박을 만들어 귀한 씨앗을 안전하게 보관하던 조상들의 알뜰한 지혜가 엿보인다.", "여자의 운명은 뒤웅박 팔자라는 속담은 한 번 그 안에 갇히거나 매이면 빠져나오기 힘들다는 비유적인 뜻이에요."],
      ["들러리", "action", 2, "1. 어떤 행사의 주인공 곁에 서서 주인공을 돋보이게 장식하는 사람이에요.<br>2. 주도권이 없이 남의 일을 거들거나 곁눈질만 하는 억울한 역할을 뜻해요.", "1. 연극 무대에서 나는 대사가 많은 주인공은 아니지만 돕는 들러리 역할을 톡톡히 해냈다.<br>2. 이번 회의에서 나는 아무런 의견도 내지 못하고 그저 들러리만 서다 온 기분이라 몹시 섭섭했다.", "주인공을 돕는 역할을 뜻하지만, 때로는 헛고생을 했을 때 섭섭함을 표현하는 단어로 쓰입니다."],
      ["들마", "time", 3, "시장 거리의 상점들이 영업을 마치고 문을 닫기 위해 물건을 정리할 무렵의 조용한 저녁 시간이에요.", "늦게 시장에 갔더니 이미 들마 시간이 다 되어서 상인 아주머니들이 남은 물건을 싸게 떨이로 팔고 계셨다.", "치열하게 물건을 팔던 하루의 수고를 마감하고 집으로 돌아갈 준비를 하는 상인들의 조금은 쓸쓸한 시간입니다."],
      ["들썩이다", "action", 1, "1. 무겁거나 고정된 물건이 위로 들렸다 내렸다 하며 자꾸 움직이는 모양이에요.<br>2. 흥분을 가라앉히지 못하고 마음이나 몸뚱이가 자꾸 우쭐거리며 신나게 움직이는 모양이에요.", "1. 끓는 물의 거센 김 때문에 냄비 뚜껑이 덜그럭덜그럭 들썩였다.<br>2. 체육대회 전날 밤, 반 친구들 모두가 1등을 하겠다는 기대감에 엉덩이가 들썩여서 잠을 설쳤다.", "물리적인 움직임뿐만 아니라 너무 신나거나 흥분해서 엉덩이나 어깨를 가만히 두지 못할 때 자주 쓰는 표현이에요."],
      ["듬직하다", "heart", 1, "사람의 체격이 크거나 성격이 가볍지 않고 묵직해서, 다른 사람이 곁에 두기에 몹시 믿음직하고 의지가 되는 느낌이에요.", "항상 솔선수범해서 궂은일을 불평 없이 도맡아 하는 우리 반 부회장은 선생님이 보시기에도 정말 듬직하다.", "외모에 대한 가벼운 칭찬보다 인성이나 책임감이 묵직하여 남에게 깊은 신뢰를 주는 아주 훌륭한 칭찬이랍니다."],
      ["뜻", "heart", 1, "1. 사람이 마음속에 굳게 품고 있는 생각이나 달성하려는 목표예요.<br>2. 낱말이나 문장이 가지고 있는 정확한 의미나 내용을 가리켜요.", "1. 나는 커서 세상을 돕는 훌륭한 사람이 되겠다는 뜻을 마음속 깊이 품었다.<br>2. 순우리말 사전의 어려운 단어 뜻을 하나하나 꼼꼼히 열심히 외웠다.", "마음먹은 바를 이루겠다는 멋진 표현으로도 많이 쓰이며 언어 학습의 가장 기본이 되는 중요한 뼈대 단어입니다."],
      ["뚱딴지", "daily", 1, "1. 뿌리가 울퉁불퉁한 돼지감자를 일컫는 옛말 이름이에요.<br>2. 상황에 전혀 맞지 않게 엉뚱한 행동이나 어리석은 말을 불쑥 꺼내는 사람을 비유해요.", "1. 할머니 댁 텃밭 구석에는 노란 꽃이 피는 뚱딴지(돼지감자)가 무성하게 자라 있었다.<br>2. 다들 토의를 하는데 지훈이가 뚱딴지같이 저녁 메뉴 이야기를 꺼내서 흐름이 탁 끊겼다.", "진지한 분위기에 어울리지 않게 엉뚱한 소리를 하거나 맥락 없는 돌발 행동을 가볍게 꼬집는 핀잔의 말이랍니다."],
      ["다듬다", "action", 1, "1. 불필요한 부분을 잘라내어 겉모양을 가지런하고 예쁘게 정리하는 물리적인 행동이에요.<br>2. 글이나 말을 매끄럽게 고치거나 실력을 갈고닦는 훌륭한 행동이에요.", "1. 엄마께서 저녁 찌개에 넣을 파와 마늘을 도마 위에서 깔끔하게 다듬으셨다.<br>2. 일기의 삐뚤어진 글씨와 어색한 문장을 예쁘게 다듬었고, 수학 실력도 다듬어 나갔다.", "외모나 식재료를 단정하게 꾸미는 것뿐만 아니라 자신의 생각과 실력을 발전시키는 성장을 비유할 때도 쓰여요."],
      ["다락", "daily", 2, "방의 천장과 지붕 사이의 빈 공간에 물건을 넣어두기 위해 널빤지를 막아 만든, 비밀스럽고 비좁은 수납공간이에요.", "할아버지 댁 안방 문 위 다락에는 할아버지가 아끼시는 오래된 골동품들이 먼지를 쓰고 가득 쌓여 있다.", "요즘 아파트에서는 보기 힘들지만 숨바꼭질하기에 딱 좋은 비밀 아지트처럼 동화책에 자주 등장하는 신비로운 장소랍니다."],
      ["다름없다", "heart", 1, "두 가지 사물이나 사람의 모습, 상황이 서로 똑같아서 견주어 보았을 때 차이점이 조금도 없다는 확실한 뜻이에요.", "매일 나를 챙겨주는 짝꿍 지민이는 나에게 있어 친동생이나 다름없는 가장 소중하고 고마운 단짝 친구다.", "비유를 할 때 아주 강력한 확신을 주는 단어로, 진짜 그것과 똑같다는 점을 강조할 때 한자어보다 피부에 와닿게 쓰여요."],
      ["단출하다", "daily", 2, "1. 식구나 가족의 수가 적어서 살림살이가 몹시 간편한 상태예요.<br>2. 여행 짐이나 옷차림이 복잡하지 않고 아주 가볍고 홀가분한 뜻이에요.", "1. 우리 가족은 할머니 한 분과 나, 이렇게 둘뿐이라 식구가 아주 단출하다.<br>2. 텐트 없이 돗자리와 김밥만 싸서 아주 단출한 차림으로 소풍을 다녀왔다.", "욕심부려 바리바리 싸 들고 가는 것보다 꼭 필요한 것만 챙기는 깔끔하고 지혜로운 생활 태도를 칭찬할 때 씁니다."],
      ["닫집", "daily", 3, "옛날 궁궐이나 절에 가면 왕이 앉는 자리나 부처님 동상 바로 위 천장에 화려하게 나무를 조각해 매달아 놓은 장식이에요.", "경복궁 근정전에서 임금님이 앉으시던 어좌 위를 올려다보니 정교한 용이 새겨진 화려한 닫집이 감싸고 있었다.", "왕의 권위나 부처님의 신성함을 높여주기 위한 우리 전통 건축의 아름다운 예술품으로 역사 시간에 알아두면 좋습니다."],
      ["달래다", "action", 1, "1. 우는 아이의 기분을 맞춰 주어 울음을 그치게 하거나, 슬픈 마음을 부드러운 말로 어루만져 진정시키는 행동이에요.<br>2. 육체적인 배고픔, 목마름이나 통증을 잠시 가라앉게 하는 행동이에요.", "1. 바통을 놓쳐서 엉엉 우는 지훈이에게 다가가 1등보다 안 다친 게 다행이라며 다정하게 달랬다.<br>2. 한여름에 시원한 아이스크림을 먹으며 푹푹 찌는 무더위를 간신히 달랬다.", "육체적인 고통을 잠시 참게 만들 때도 쓰이지만, 가장 많이 쓰일 때는 상처받은 마음을 사랑으로 치유해 줄 때입니다."],
      ["덧붙이다", "action", 1, "이미 해 놓은 말이나 만들어 놓은 물건에다 자기의 생각이나 다른 물건을 추가로 조금 더 보태어 붙이는 행동이에요.", "회장인 민수가 발표한 재활용 아이디어에, 내가 종이팩을 따로 모으자는 구체적인 실천 방법을 한마디 더 덧붙였다.", "단순히 더한다는 뜻의 한자어 '추가(追加)하다'보다 훨씬 우리말의 맛을 살려주며 대화의 뼈대에 살을 쏙쏙 붙일 때 씁니다."],
      ["도리어", "action", 2, "상황이 기대했거나 예상했던 것과는 전혀 반대로, 오히려 앞뒤가 엉뚱하게 뒤바뀌어 버린 어이없는 상황을 나타내는 말이에요.", "숙제 노트를 찢은 동생이 미안해하기는커녕 도리어 자기가 놀라 울음을 터뜨리며 엄마에게 이르러 황당했다.", "적반하장처럼 잘못한 사람이 큰소리를 칠 때나, 좋은 의도의 일이 반대의 나쁜 결과를 가져왔을 때 억울함을 호소하기 좋은 부사입니다."],
      ["동그라미", "daily", 1, "1. 컴퍼스를 빙 돌려 그은 선처럼 모난 곳이 없이 동그랗게 꽉 찬 기호나 모양이에요.<br>2. 성격이나 행동이 아주 원만하고 친구들과 모남 없이 잘 지내는 좋은 성품을 비유하는 말이에요.", "1. 수학 시험지를 채점할 때 선생님이 쳐주시는 빨간 동그라미는 나를 기분 좋게 만든다.<br>2. 화를 내는 법이 없는 우리 반 반장의 성격은 그야말로 동글동글한 동그라미 같다.", "세모나 네모처럼 각진 곳이 없기 때문에 긍정적이고 포용력 있는 훌륭한 성격을 칭찬할 때 멋지게 비유합니다."],
      ["두드러지다", "action", 1, "1. 평평한 곳에서 어떤 부분이 툭 튀어나와서 눈에 확 띄는 물리적인 모양이에요.<br>2. 여럿 속에서 어떤 사람의 성적이나 재능이 특별히 뛰어나게 돋보이는 모습이에요.", "1. 사춘기가 되니 코끝에 붉은 여드름이 두드러지게 솟아나 신경이 쓰인다.<br>2. 우리 반 아이들 중에서도 미술 대회만 나가면 대상을 타는 지민이의 예술적 재능이 가장 두드러진다.", "신체적인 특징을 나타낼 때도 쓰지만, 남들보다 훌륭한 학생들의 실력이나 인성을 칭찬할 때 더욱 값지게 쓰입니다."],
      ["드물다", "daily", 1, "어떤 일이나 물건이 흔하게 있지 않고 발생 횟수가 아주 적어 쉽게 찾아볼 수 없거나 몹시 귀하다는 상태를 뜻해요.", "쉬는 시간마다 도서관에 틀어박혀 백과사전만 읽는 민수 같은 학생은 전교에서도 찾아보기 힘들 정도로 드문 경우다.", "흔하지 않다는 의미를 넘어 남들이 갖지 못한 희소성을 가져 가치가 높다는 뜻이니, '드문 인재'라는 칭찬은 아주 특별한 의미입니다."],
      ["띠", "daily", 1, "1. 옷이 벗겨지지 않도록 허리에 단단히 두르는 끈이나 헝겊이에요.<br>2. 색깔이나 빛이 길고 선명하게 펼쳐진 뭉친 무리를 묘사하는 말이에요.<br>3. 사람이 태어난 해를 동물의 이름으로 나타내는 12지신(쥐띠, 소띠 등)을 뜻해요.", "1. 태권도 학원에서 승급 심사를 통과하고 드디어 자랑스러운 검은 띠를 매었다.<br>2. 새하얀 도화지 가운데에 일곱 빛깔의 아름다운 무지개색 띠를 길고 굵게 그려 넣었다.<br>3. 새해가 되면 우리 가족은 재미로 각자의 띠에 맞는 운세를 읽어보곤 한다.", "허리끈부터 무지개, 그리고 태어난 해의 동물 이름까지 일상에서 정말 여러 가지로 유용하게 쓰이는 기본 명사입니다."],
      ["마루", "daily", 1, "1. 한옥에서 방과 방 사이나 방 앞에 널빤지를 깔아 만든 바닥이에요.<br>2. 산이나 지붕, 파도 따위의 가장 높은 꼭대기를 뜻해요.<br>3. 일이 진행되는 과정에서 가장 중요한 고비나 절정을 비유해요.", "1. 여름방학에 할머니 댁 마루에 누워 수박을 먹으니 무척 시원했다.<br>2. 험한 산을 한참 오르니 마침내 산마루에 도착해 시원한 바람을 맞았다.<br>3. 이번 시험 준비의 가장 큰 마루를 무사히 넘기고 나니 몹시 홀가분하다.", "바닥을 뜻할 뿐만 아니라 가장 높은 곳이나 위기를 상징하는 아주 유용한 다의어입니다."],
      ["마중", "action", 1, "역이나 터미널 등에 나가서 오는 사람을 반갑게 맞이하는 일이에요.", "비가 쏟아지자 우산을 들고 정문 앞까지 동생을 마중 나갔다.", "반대로 떠나는 사람을 밖으로 나가서 보내는 일은 '배웅'이라고 해요."],
      ["마파람", "nature", 2, "뱃사람들이 남쪽에서 불어오는 바람을 부르는 고유어예요.", "따뜻한 마파람이 불어오자 교실 창가의 커튼이 살랑살랑 흔들렸다.", "'마파람에 게 눈 감추듯'은 음식을 아주 빨리 먹어 치운다는 속담이에요."],
      ["마냥", "action", 2, "1. 부족함이 없이 실컷이라는 뜻이에요.<br>2. 언제까지나 줄곧 계속되는 모양이에요.", "1. 오랜만에 만난 친구와 마냥 웃고 떠들며 즐거운 시간을 보냈다.<br>2. 방학이 마냥 계속될 것만 같았는데 어느새 개학 날이 다가왔다.", "어떤 상태나 행동이 끝없이 계속될 때 문장을 예쁘게 꾸며주는 부사입니다."],
      ["마뜩하다", "heart", 3, "제법 마음에 들 만큼 아주 만족스럽다는 뜻을 가진 형용사예요.", "친구의 제안이 마뜩하지 않았지만 모둠을 위해 일단 따르기로 했다.", "보통 '마뜩하지 않다'나 '마뜩잖다'처럼 부정하는 형태와 짝을 이뤄 씁니다."],
      ["마당", "daily", 1, "1. 집의 앞이나 뒤에 평평하게 닦아 놓은 흙이나 시멘트 땅이에요.<br>2. 어떤 일이 이루어지고 있는 곳이나 판을 뜻해요.<br>3. 판소리나 탈춤 등에서 하나의 짧은 이야기가 끝나는 단락을 세는 단위예요.", "1. 명절에 온 가족이 둥근 달이 뜬 마당에 모여 윷놀이를 하며 놀았다.<br>2. 전교생이 모인 배움의 마당에서 우리 반이 멋진 합창을 선보였다.<br>3. 옛날 사람들은 장터에서 탈춤 한 마당을 구경하며 피로를 풀었다.", "단순한 공간을 넘어 어떠한 일이 활발하게 벌어지는 장(場)을 의미합니다."],
      ["마무리", "action", 1, "어떤 일의 끝을 맺는 일, 또는 그 일의 가장 마지막 부분이에요.", "모둠 발표를 잘 마무리하기 위해 우리가 알게 된 점을 한 문장으로 요약했다.", "시작만큼 끝맺음도 중요하다는 뜻으로 '마무리가 중요하다'고 말하죠."],
      ["마디", "daily", 1, "1. 대나무나 뼈처럼 길게 이어진 것의 불룩하게 도드라진 부분이에요.<br>2. 말이나 글, 노래 따위의 한 도막을 세는 단위예요.", "1. 대나무는 마디마다 힘을 모아 꺾이지 않고 하늘을 향해 곧게 자란다.<br>2. 선생님께서 나에게 용기를 주는 따뜻한 말 한마디를 건네주셨다.", "식물의 구조를 뜻하기도 하고 대화의 단위를 셀 때도 자주 쓰는 명사입니다."],
      ["마실", "daily", 2, "동네 이웃집에 가볍게 놀러 가는 일을 정겹게 부르는 고유어예요.", "저녁을 드시고 난 할머니께서는 옆집으로 마실을 다녀오시겠다고 하셨다.", "사투리 같지만 국립국어원에 당당히 등재된 표준어랍니다."],
      ["마침내", "time", 1, "오랜 시간이나 힘든 과정을 지나 가장 끝에 이르러서를 뜻해요.", "몇 주 동안 땀 흘려 연습한 끝에 마침내 줄넘기 이단 뛰기를 성공했다.", "'드디어'나 '결국'과 비슷하지만 긴 노력 끝에 이루어졌을 때 잘 어울려요."],
      ["막내", "daily", 1, "1. 여러 형제자매 가운데 맨 나중에 태어난 가장 어린 사람이에요.<br>2. 어떤 무리나 조직에서 가장 나이가 어린 사람을 귀엽게 부르는 말이에요.", "1. 우리 집 막내인 나는 중학생 언니와 오빠에게 매일 사랑을 듬뿍 받는다.<br>2. 우리 동아리에 새로 들어온 막내 후배들을 위해 환영회를 열었다.", "'막둥이'도 같은 뜻을 가진 귀엽고 정겨운 우리말이랍니다."],
      ["맏이", "daily", 1, "여러 형제자매 가운데 가장 먼저 태어난 맏아들이나 맏딸이에요.", "동생들을 돌보는 맏이로서 책임감을 가지고 항상 모범을 보이려 노력한다.", "장남이나 장녀라는 한자어를 대신해서 쓸 수 있는 아주 좋은 단어예요."],
      ["말갛다", "nature", 2, "1. 티끌 하나 없이 맑고 깨끗하다는 뜻을 가진 부드러운 단어예요.<br>2. 국 같은 것이 건더기가 적고 진하지 않아 묽은 상태예요.", "1. 세수를 하고 나온 동생의 얼굴이 솜털이 보일 정도로 말갛게 빛났다.<br>2. 오늘 아침에는 속이 편안해지도록 고춧가루 없이 말갛게 끓인 뭇국을 먹었다.", "맑고 순수한 표정이나 묽은 음식을 표현할 때 아주 부드럽게 쓰여요."],
      ["맑다", "nature", 1, "1. 잡스럽고 탁한 것이 전혀 섞이지 않고 아주 깨끗하다는 뜻이에요.<br>2. 소리나 목소리가 찌그러짐 없이 아주 또렷하고 고운 상태예요.<br>3. 생각이나 정신이 흐리지 않고 또렷하며 잡념이 없는 상태예요.", "1. 비가 갠 뒤 맑은 하늘에 일곱 빛깔 무지개가 선명하게 떠올랐다.<br>2. 합창단에서 노래하는 지민이의 맑은 목소리가 강당에 울려 퍼졌다.<br>3. 잠을 푹 자고 일어났더니 머리가 맑아져서 수학 문제가 척척 풀렸다.", "자연물뿐만 아니라 눈에 보이지 않는 소리나 정신 상태를 칭찬할 때도 으뜸입니다."],
      ["매무새", "daily", 3, "옷을 다 입고 났을 때의 맵시나 깔끔한 모양새를 뜻해요.", "강당에서 발표를 하기 전에 거울을 보며 옷매무새를 단정하게 가다듬었다.", "주로 '매무새를 고치다', '매무새를 다듬다'라는 표현으로 함께 씁니다."],
      ["매듭", "daily", 1, "1. 끈이나 실 따위를 엮어 단단히 묶어서 맺은 부분이에요.<br>2. 사람 사이의 얽히고설킨 껄끄러운 감정이나 관계를 비유해요.<br>3. 어떤 일의 순서나 끝맺음을 뜻하는 말이에요.", "1. 넘어지지 않도록 운동화 끈을 튼튼하게 매듭지어 묶고 달렸다.<br>2. 오해가 쌓여 생긴 친구와의 갈등 매듭을 진솔한 대화로 풀었다.<br>3. 6학년 1학기를 훌륭하게 매듭짓고 즐거운 여름방학을 맞이했다.", "물리적인 매듭부터 일의 마무리까지 아주 폭넓게 비유적으로 쓰이는 단어입니다."],
      ["맵시", "daily", 2, "옷을 입거나 몸가짐을 했을 때 보기 좋게 어울리는 아름다운 모양이에요.", "한복을 곱게 차려입은 친구의 맵시가 평소보다 훨씬 단정하고 아름다웠다.", "'맵시 있다', '맵시를 부리다'처럼 단정하고 멋진 자태를 칭찬할 때 써요."],
      ["머금다", "action", 2, "1. 물이나 음식물 따위를 입안에 넣고 삼키거나 뱉지 않는 행동이에요.<br>2. 눈물이나 웃음 같은 감정을 얼굴에 지니고 겉으로 띠는 모습이에요.<br>3. 어떤 물체가 물기나 향기 따위를 품고 있는 상태예요.", "1. 양치질을 할 때 물을 입안에 가득 머금고 오물오물 헹구어 냈다.<br>2. 전학을 가는 친구가 눈물을 글썽이며 슬픈 미소를 머금고 인사를 건넸다.<br>3. 아침 일찍 산책을 하니 이슬을 머금은 풀잎들이 싱그럽게 빛나고 있었다.", "입안에 무언가를 품는 행동이 감정이나 수분을 머금는 것으로 예쁘게 넓혀진 말입니다."],
      ["머뭇거리다", "action", 1, "어떤 말이나 행동을 선뜻 하지 못하고 자꾸 망설이며 주저하는 모습이에요.", "정답을 알고 있었지만 혹시 틀릴까 봐 쑥스러워서 손을 들지 못하고 머뭇거렸다.", "자신감이 부족해서 행동을 미루는 모습으로, 용기를 내라는 격려가 필요해요."],
      ["메아리", "nature", 1, "1. 산이나 골짜기에서 소리를 지르면 부딪혀서 되돌아 들리는 소리예요.<br>2. 어떤 사건이나 느낌이 다른 사람의 마음에 큰 호응과 감동을 일으키는 현상을 비유해요.", "1. 산꼭대기에서 두 손을 모으고 외치자 메아리가 길게 울려 퍼졌다.<br>2. 선생님의 따뜻한 가르침이 우리들의 마음에 감동의 메아리로 영원히 남았다.", "소리의 반사 현상에서 유래하여 누군가의 마음에 감동을 울리는 뜻으로도 씁니다."],
      ["모둠", "daily", 1, "수업이나 어떤 활동을 함께하기 위해 몇 사람씩 묶은 작은 무리예요.", "우리 모둠은 역할을 공평하게 나누어 협동한 덕분에 과제를 가장 먼저 마쳤다.", "교실에서 흔히 쓰는 한자어 '조(組)'를 아름다운 우리말로 순화한 단어랍니다."],
      ["모락모락", "action", 1, "1. 연기나 냄새 따위가 계속 가볍고 동그랗게 피어오르는 모양이에요.<br>2. 긍정적인 생각이나 감정이 마음속에서 자꾸자꾸 일어나는 모양이에요.<br>3. 어린아이나 동식물이 병 없이 쑥쑥 아주 잘 자라는 모양이에요.", "1. 추운 겨울날 급식실에 들어서자 따끈한 국에서 김이 모락모락 피어올랐다.<br>2. 아름다운 풍경을 보니 잊고 있던 즐거운 옛 추억이 머릿속에 모락모락 피어났다.<br>3. 우리 집 강아지는 매일 사료를 잘 먹더니 하루가 다르게 모락모락 큰다.", "김이 나는 모습, 생각이 피어나는 모습, 아이가 자라는 모습을 모두 표현하는 예쁜 의태어예요."],
      ["모래", "nature", 1, "바위나 돌이 아주 잘게 부서져서 이루어진 작고 고운 알갱이예요.", "여름휴가 때 바닷가 부드러운 모래 위에 친구와 함께 커다란 성을 쌓았다.", "자갈보다 작고 흙보다 큰 알갱이로, 바위의 풍화 작용을 보여주는 자연물입니다."],
      ["모시다", "action", 1, "1. 웃어른이나 존경하는 사람을 가까이에서 받들거나 정성껏 대접하는 일이에요.<br>2. 웃어른을 모시고 어떤 곳으로 함께 가거나 데리고 오는 행동이에요.", "1. 명절을 맞아 할아버지와 할머니를 안방에 편안하게 모시고 어깨를 주물러 드렸다.<br>2. 주말에 부모님을 모시고 단풍이 예쁜 산으로 가족 나들이를 다녀왔다.", "'데리다'의 높임말로, 어른을 대하는 예의 바른 태도를 나타내는 고유어입니다."],
      ["몽글몽글", "nature", 2, "어떤 덩어리가 아주 연하고 매끄럽게 둥글게 뭉쳐 있는 부드러운 모양이에요.", "점심 급식으로 나온 순두부찌개의 몽글몽글한 두부가 아주 고소하고 맛있었다.", "하늘에 둥글게 뭉쳐 떠오르는 귀여운 뭉게구름을 묘사할 때도 잘 어울려요."],
      ["무지개", "nature", 1, "비가 갠 뒤 대기 중의 수방울에 햇빛이 굴절되어 나타나는 일곱 빛깔의 반원이에요.", "여름날 시원하게 소나기가 그치자 하늘에 선명하고 거대한 무지개가 떠올랐다.", "과학 시간에 배우는 빛의 굴절 현상으로, 희망과 아름다움을 상징합니다."],
      ["미쁘다", "heart", 3, "사람이나 행동이 듬직하여 아주 믿음성이 있다는 뜻을 가진 고유어예요.", "약속한 것은 무조건 꼭 지키는 우리 반 부회장은 정말 미쁜 친구다.", "'믿음직하다'와 같은 뜻을 가졌으면서도 훨씬 예스럽고 문학적인 느낌을 줍니다."],
      ["무릅쓰다", "heart", 2, "힘들고 피하고 싶은 어려움이나 위험을 꾹 참고 견디며 행동하는 굳은 태도예요.", "소방관 아저씨들은 목숨을 잃을 위험을 무릅쓰고 불길 속으로 뛰어들어 생명을 구하셨다.", "'무릎쓰다'라고 잘못 쓰기 쉬운데, 인내심을 나타내는 '무릅쓰다'가 맞습니다."],
      ["문득", "action", 1, "1. 어떤 생각이나 느낌이 예고 없이 아주 갑자기 머릿속에 떠오르는 모양이에요.<br>2. 어떤 행동이나 현상이 갑자기 불쑥 일어나는 모양이에요.", "1. 하교하는 길에 문득 어제 읽은 동화책의 마지막 감동적인 장면이 떠올랐다.<br>2. 길을 걷다가 문득 뒤를 돌아보니 아름다운 저녁 노을이 지고 있었다.", "'갑자기'라는 말보다 조용히 스치듯 감성적으로 일어나는 느낌이 들어 글쓰기에 아주 좋아요."],
      ["물꼬", "daily", 2, "1. 논에 물이 알맞게 넘나들도록 한쪽을 틔워 만들어 놓은 좁은 통로예요.<br>2. 어떤 일의 시작을 비유적으로 이르는 말이에요.", "1. 농부 아저씨께서는 비가 오자 논에 가서 물꼬를 트고 물이 잘 흐르도록 하셨다.<br>2. 처음엔 어색했지만 내가 먼저 인사를 건네며 친구와 대화의 물꼬를 텄다.", "농사일에서 유래하여 굳게 닫혔던 상황이 열리고 시작될 때 아주 훌륭하게 비유합니다."],
      ["미투리", "daily", 3, "삼이나 튼튼한 노끈 따위로 짚신처럼 정교하게 엮어 만든 옛날 신발이에요.", "현장체험학습으로 방문한 민속촌에서 조상들이 신던 삼 미투리를 직접 신어 보았다.", "일반 짚신보다 훨씬 질기고 튼튼해서 먼 길을 갈 때 유용하게 쓰던 신발입니다."],
      ["모꼬지", "action", 3, "놀이나 잔치 또는 특별한 목적을 가지고 여러 사람이 한곳에 모이는 일이에요.", "방학을 맞이하여 동네 친구들과 함께 놀이터에 모여 즐거운 모꼬지를 열었다.", "대학생들의 '엠티(MT)'나 모임을 대체할 수 있는 아주 정겹고 예쁜 고유어랍니다."],
      ["무녀리", "daily", 3, "1. 짐승이 한 번에 낳은 여러 마리의 새끼 가운데 가장 먼저 나온 새끼를 말해요.<br>2. 말이나 행동이 정상적인 사람보다 조금 모자란 사람을 비유적으로 이르는 말이에요.", "1. 우리 집 강아지가 낳은 여섯 마리 중 무녀리는 몸집이 작지만 아주 활발하다.<br>2. 친구를 무녀리라고 놀리며 따돌리는 행동은 절대 해서는 안 될 나쁜 일이다.", "가장 먼저 태어나서 약하다는 뜻으로, 행동이 모자란 사람을 낮잡아 부를 때도 씁니다."],
      ["말미", "time", 3, "일정한 직업이나 바쁜 일에서 잠시 벗어나 쉴 수 있는 자유로운 시간이에요.", "아버지께서는 회사에서 며칠간의 말미를 얻어 가족과 함께 가을 여행을 떠나셨다.", "끝부분을 뜻하는 한자어 '말미(末尾)'와 소리는 같지만 완전 다른 뜻의 순우리말입니다."],
      ["먹먹하다", "heart", 2, "1. 귀가 막힌 듯 소리가 잘 안 들리는 물리적인 상태예요.<br>2. 큰 슬픔이나 벅찬 감동으로 가슴이 꽉 막힌 듯한 심리적인 느낌이에요.", "1. 터널을 지날 때나 높은 산에 올라가면 갑자기 귀가 먹먹해지기도 한다.<br>2. 친구들이 만들어준 롤링페이퍼를 읽으며 감동으로 가슴이 먹먹해져 눈물이 났다.", "귀가 멍해지는 물리적인 현상과 가슴 벅찬 감동을 동시에 훌륭하게 표현하는 형용사입니다."],
      ["멀미", "daily", 1, "1. 차나 배, 비행기를 탔을 때 그 흔들림 때문에 속이 울렁거리는 증세예요.<br>2. 어떤 것에 진저리가 날 정도로 몹시 싫어지거나 거부감이 드는 상태를 비유해요.", "1. 수학여행 때 버스를 너무 오래 탔더니 멀미가 나서 창문을 열고 바람을 쐬었다.<br>2. 매일 똑같은 잔소리를 들으니 이제는 그 말만 들어도 멀미가 날 지경이다.", "자연스러운 생리 현상이지만, 보기 싫은 상황을 과장해서 거부할 때도 쓴답니다."],
      ["몽땅", "action", 1, "어떤 물건이나 양을 하나도 남김없이 모두 다 거두어들인 모양을 뜻해요.", "맛있는 과자를 나 혼자 몽땅 먹어 치우기 전에 친구들과 공평하게 나누어 먹었다.", "'모두', '전부'라는 말과 뜻이 같지만 훨씬 발음이 가볍고 입에 잘 붙는 느낌이에요."],
      ["마음", "heart", 1, "1. 사람이 사물을 느끼고 생각하는 감정이나 기억이 깃들이는 곳이에요.<br>2. 사람에 대한 사랑이나 남을 배려하는 따뜻한 태도예요.<br>3. 어떤 일을 하려는 굳은 결심이나 의지를 말해요.", "1. 전학 와서 외로워 보이는 친구의 닫힌 마음을 열기 위해 먼저 다가갔다.<br>2. 우리 할머니는 이웃을 돕는 넉넉하고 따뜻한 마음을 지니신 분이다.<br>3. 이번 2학기에는 매일 일기를 쓰기로 굳게 마음을 먹었다.", "한자어 심(心)에 해당하는 가장 아름답고 근본적인 순우리말로 수많은 감정 표현에 쓰여요."],
      ["무던하다", "heart", 2, "1. 사람의 성격이나 태도가 까다롭지 않고 둥글둥글하며 너그럽다는 뜻이에요.<br>2. 어떤 사물의 정도나 크기가 그런대로 꽤 어지간하다는 뜻이에요.", "1. 내 짝꿍은 누가 장난을 쳐도 화내지 않고 웃어넘길 정도로 성격이 참 무던하다.<br>2. 날씨가 무던히도 더웠던 올여름은 유난히 시원한 아이스크림을 많이 먹었다.", "예민하지 않고 주변 사람들을 편안하게 해주는 아주 좋은 성품을 칭찬하는 말이에요."],
      ["무렵", "time", 1, "어떤 일이나 현상이 일어나는 시기와 대략 일치하는 즈음이나 때를 뜻해요.", "학교 수업이 모두 끝나고 노을이 지기 시작할 무렵, 우리는 운동장에서 축구를 했다.", "정확한 시간은 아니지만 대략적인 시간의 흐름을 나타낼 때 쓰는 아주 편리한 말입니다."],
      ["뭉클하다", "heart", 1, "1. 덩어리 따위가 닿았을 때 쑥 들어갈 정도로 아주 부드러운 느낌이에요.<br>2. 어떤 감동적인 일 때문에 슬픔이나 기쁨이 가슴에 꽉 차오르는 느낌이에요.", "1. 잘 익은 찐 고구마를 한 입 베어 물자 뭉클하고 달콤한 속살이 씹혔다.<br>2. 올림픽에서 우리나라 선수가 금메달을 따고 눈물을 흘릴 때 내 가슴도 뭉클했다.", "머리로 이해하는 것이 아니라 마음 깊은 곳에서 진한 감동이나 슬픔을 벅차게 느낄 때 씁니다."],
      ["마침", "time", 1, "어떤 기회나 때, 혹은 조건에 아주 딱 알맞게 우연히 들어맞는 상황을 뜻해요.", "비가 와서 우산을 안 가져가 걱정했는데, 마침 하굣길에 엄마가 데리러 오셨다.", "운이 좋거나 타이밍이 기가 막히게 잘 맞았을 때 감탄사처럼 쓰는 긍정적인 부사예요."],
      ["망설이다", "action", 1, "이리저리 생각만 하고 마음을 확실하게 정하지 못한 채 결정을 주저하는 모습이에요.", "짜장면을 먹을지 짬뽕을 먹을지 한참을 망설이다가 결국 볶음밥을 주문했다.", "어떤 선택을 앞두고 고민하는 자연스러운 모습이지만 때로는 과감한 결단이 필요해요."],
      ["매만지다", "action", 2, "1. 옷이나 머리 모양을 아주 단정하고 보기 좋게 손으로 잘 만져 다듬는 행동이에요.<br>2. 애정을 담아 부드럽게 어루만지는 다정한 행동이에요.<br>3. 어떤 사태나 문제를 수습하여 잘 정리하는 일이에요.", "1. 무대에 오르기 직전, 거울 앞에서 떨리는 손으로 옷깃을 가지런히 매만졌다.<br>2. 엄마는 내가 잠들 때까지 내 이마와 머리카락을 다정하게 매만져 주셨다.<br>3. 모둠의 갈등을 지혜롭게 매만지고 훌륭한 결과물을 완성해 낸 반장이 자랑스럽다.", "단정하게 다듬는 물리적 행동과 갈등을 어루만져 수습하는 마음 씀씀이를 모두 뜻합니다."],
      ["무치다", "food", 1, "나물이나 채소에 소금, 간장, 참기름 같은 양념을 넣고 골고루 섞어 반찬을 만드는 일이에요.", "실과 시간에 배운 대로 시금치를 살짝 데친 후 참기름과 소금을 넣고 조물조물 무쳤다.", "불에 익히지 않고 신선한 재료에 맛을 더하는 우리나라 고유의 맛있는 조리법이에요."],
      ["미끄럽다", "nature", 1, "1. 물건의 표면이 거칠지 않고 반질반질하여 물체가 쑥 미끄러지기 쉬운 상태예요.<br>2. 말이나 글이 막힘없이 아주 자연스럽고 유창하게 흘러가는 상태예요.<br>3. 사람의 성품이나 행동이 진실하지 못하고 뺀질거리는 모양이에요.", "1. 겨울에 눈이 내린 뒤 바닥이 얼어 몹시 미끄러우니 주머니에서 손을 빼고 걸어야 한다.<br>2. 발표회에서 지훈이의 미끄럽고 유창한 진행 솜씨에 모두가 칭찬의 박수를 보냈다.<br>3. 약속을 어기고 미끄럽게 핑계만 늘어놓는 행동은 친구들의 믿음을 떨어뜨린다.", "미끄러운 빙판길뿐만 아니라 말이 막힘없는 것, 약삭빠른 성격을 비유할 때도 씁니다."],
      ["미루다", "action", 1, "1. 원래 정해진 시간이나 날짜에 하지 않고 그 일을 나중으로 넘기는 행동이에요.<br>2. 자기의 책임이나 잘못을 남의 탓으로 돌려 떠넘기는 행동이에요.<br>3. 이미 알고 있는 사실을 바탕으로 다른 일의 결과를 짐작하는 일이에요.", "1. 오늘 해야 할 숙제를 내일로 미루고 놀다가 결국 밤늦게까지 고생하며 숙제를 마쳤다.<br>2. 유리가 깨진 것을 서로 상대방의 잘못으로 미루며 다투는 것은 몹시 비겁한 행동이다.<br>3. 바닥이 흠뻑 젖은 것으로 미루어 보아 아까 소나기가 거세게 내렸음을 알 수 있었다.", "시간, 책임, 짐작 등 전혀 다른 세 가지 중요한 뜻으로 널리 쓰이는 훌륭한 다의어입니다."],
      ["미끼", "daily", 1, "1. 낚시를 할 때 물고기를 꾀어 잡으려고 낚싯바늘에 꿰는 지렁이나 떡밥이에요.<br>2. 사람을 속여서 끌어들이기 위해 교묘하게 던지는 거짓 정보나 유혹이에요.", "1. 아빠와 낚시를 가서 바늘에 튼실한 지렁이 미끼를 끼워 던지자 큰 물고기가 물었다.<br>2. 인터넷에서 자극적인 제목으로 클릭을 유도하는 미끼성 기사에 속지 말아야 한다.", "동물을 낚는 물리적 도구와 사람의 마음을 속이는 함정을 동시에 기가 막히게 비유해요."],
      ["밉다", "heart", 1, "1. 어떤 사람의 말이나 행동이 눈에 거슬리고 마음에 들지 않아 싫은 감정이 드는 상태예요.<br>2. 생김새나 모양이 보기에 아름답지 못하고 볼품없는 상태예요.", "1. 친구와 심하게 다투고 난 뒤에는 그 친구의 얼굴조차 밉게 보여서 한동안 말을 안 했다.<br>2. 글씨를 너무 서둘러 썼더니 공책에 적힌 글씨가 삐뚤빼뚤하고 밉게 써져서 속상했다.", "사람의 자연스러운 부정적 감정이지만, 이 감정을 잘 풀고 용서하는 것이 6학년의 성숙함이에요."],
      ["묶다", "action", 1, "1. 흩어지기 쉬운 끈이나 줄 따위를 얽어매어 단단하게 매듭을 짓는 행동이에요.<br>2. 사람의 행동이나 자유를 어떤 규칙이나 약속으로 얽어매어 제한하는 일이에요.<br>3. 두 가지 이상의 낱낱의 사물이나 사람을 하나로 합치는 일이에요.", "1. 재활용품들이 바람에 날아가지 않도록 노끈으로 십자 모양을 내어 튼튼하게 묶었다.<br>2. 시험공부라는 핑계로 하루 종일 책상에 나를 묶어 두었더니 몸이 몹시 찌뿌둥하다.<br>3. 발표 수업을 위해 선생님께서 우리 반 아이들을 다섯 명씩 훌륭한 모둠으로 묶어 주셨다.", "끈을 묶는 물리적인 행동부터 집단을 하나로 단합시키는 비유까지 폭넓게 활용됩니다."],
      ["바가지", "daily", 1, "1. 박을 반으로 쪼개어 속을 파내고 만든 둥근 그릇이에요.<br>2. 맹랑하게 속여서 물건값을 제값보다 훨씬 비싸게 부르는 얄미운 짓을 비유해요.", "1. 시골 할머니 댁 우물가에서 바가지로 시원한 물을 떠 마셨다.<br>2. 관광지에서 밥을 먹었는데 바가지를 써서 기분이 몹시 상했다.", "요즘은 플라스틱 그릇도 바가지라 부르며, 비싸게 속아 살 때 '바가지를 쓰다'라고도 씁니다."],
      ["바구니", "daily", 1, "대나무나 싸리 따위를 엮어서 물건을 담을 수 있게 만든 그릇이에요.", "가을 소풍을 갈 때 맛있는 샌드위치를 예쁜 바구니에 차곡차곡 담아 갔다.", "물건을 담아 나르는 데 아주 유용한 전통 생활 도구랍니다."],
      ["바다", "nature", 1, "지구 위에서 육지를 둘러싸고 있는 넓고 깊은 짠물이에요.", "여름 방학에 가족과 함께 푸른 바다로 여행을 떠나 시원하게 수영했다.", "우리에게 가장 친숙하지만 아주 오래전부터 쓰여 온 순우리말이에요."],
      ["바르다", "heart", 1, "1. 겉으로 보기에 삐뚤어지거나 굽지 않고 똑바로 곧게 나 있는 상태예요.<br>2. 사람의 마음이나 행동이 어긋남이 없이 도리에 맞고 정당하다는 뜻이에요.", "1. 수업 시간에는 허리를 바르게 펴고 의자에 똑바로 앉아야 한다.<br>2. 거짓말을 하지 않고 항상 바르게 행동하는 것이 6학년의 멋진 모습이다.", "자세가 굽지 않은 물리적인 상태와 마음이 정직한 도덕적인 상태를 모두 훌륭하게 뜻합니다."],
      ["바쁘다", "action", 1, "1. 해야 할 일이 너무 많아서 몹시 서두르며 틈이 없는 쫓기는 상태예요.<br>2. 어떤 일을 하느라 다른 것에 신경을 쓸 겨를이나 여유가 전혀 없다는 뜻이에요.", "1. 아침에 늦잠을 자는 바람에 학교에 지각하지 않으려고 바쁘게 뛰어갔다.<br>2. 시험공부를 하느라 너무 바빠서 친구들과 놀이터에 나갈 시간이 없다.", "시간이 부족할 만큼 급하게 행동하거나 여유가 없을 때 주로 쓰는 친숙한 단어입니다."],
      ["바위", "nature", 1, "1. 부피가 아주 크고 무거우며 단단하게 뭉쳐진 거대한 돌덩어리를 뜻해요.<br>2. 어떤 시련에도 흔들림 없이 굳세고 묵직하여 변하지 않는 굳은 의지를 비유해요.", "1. 산 정상에 있는 커다란 바위에 올라앉아 우리 동네를 내려다보았다.<br>2. 아무리 힘든 일이 닥쳐도 나의 굳은 결심은 바위처럼 흔들리지 않을 것이다.", "커다란 돌덩이뿐만 아니라 굳세고 듬직한 사람의 믿음직한 성격을 비유할 때 아주 좋습니다."],
      ["바투", "daily", 3, "1. 두 물체 사이나 시간의 간격이 아주 짧고 가깝게 바짝 붙은 모양이에요.<br>2. 어떤 일이나 상황에 주의를 아주 바짝 기울여 정신을 차리는 모양이에요.", "1. 칠판 글씨가 잘 보이지 않아서 의자를 책상 쪽으로 바투 당겨 앉았다.<br>2. 중요한 시험을 앞두고 긴장감을 바투 다잡으며 공부에 집중했다.", "'가까이'라는 말보다 훨씬 바짝 다가선 긴장감과 밀착된 느낌을 주는 순우리말 부사예요."],
      ["바탕", "daily", 1, "1. 사물이나 현상을 이루는 가장 기본이 되는 뿌리나 밑바닥이에요.<br>2. 사람이 태어날 때부터 가지고 있는 기본적인 성격이나 훌륭한 자질의 근본이에요.", "1. 수학은 덧셈과 뺄셈 같은 기초 바탕이 튼튼해야 어려운 문제도 척척 풀 수 있다.<br>2. 우리 반 반장은 남을 배려하는 착한 마음씨가 바탕에 깔려 있는 훌륭한 학생이다.", "기초나 근본을 뜻하는 아주 중요한 단어로 뼈대가 되는 중심을 강조할 때 씁니다."],
      ["바람", "nature", 1, "1. 기압의 차이 때문에 공기가 한곳에서 다른 곳으로 움직이는 자연 현상이에요.<br>2. 사람들 사이에 어떤 유행이나 사상 따위가 일시적으로 널리 퍼지는 현상을 비유해요.", "1. 가을이 되니 시원한 바람이 불어와 나뭇잎이 살랑살랑 기분 좋게 흔들린다.<br>2. 최근 우리 학교 학생들 사이에서 환경 보호 바람이 불어 분리수거를 아주 잘한다.", "눈에 보이지 않지만 우리가 느끼는 자연의 움직임과 시대의 유행을 모두 아우르는 명사입니다."],
      ["반갑다", "heart", 1, "1. 보고 싶던 사람을 만나거나 반가운 소식을 들어서 마음이 몹시 기쁘다는 뜻이에요.<br>2. 바랐던 일이나 필요한 사물이 뜻대로 나타나서 마음이 아주 만족스럽고 흡족해요.", "1. 전학 갔던 친구가 오랜만에 학교에 놀러 와서 너무 반가워 덥석 안아주었다.<br>2. 덥고 목이 마를 때 엄마께서 주신 시원한 수박 한 조각이 몹시 반가웠다.", "사람을 만났을 때 마음의 문을 활짝 열어주는 가장 따뜻하고 긍정적인 좋은 인사말이에요."],
      ["밝다", "nature", 1, "1. 빛이 있어 환하거나, 어두운 밤이 지나고 환한 아침이 시작된다는 뜻이에요.<br>2. 사람의 마음이나 표정이 구김살 없이 맑고 명랑하여 환하다는 뜻이에요.<br>3. 사리에 눈이 밝아 사정이나 앞길을 아주 정확하게 잘 꿰뚫어 안다는 뜻이에요.", "1. 어두운 밤이 지나고 아침이 되자 온 세상이 아침 햇살을 받아 밝게 빛났다.<br>2. 우리 짝꿍은 항상 얼굴에 구김살 하나 없이 맑고 밝은 표정으로 웃는다.<br>3. 컴퓨터에 아주 밝은 지훈이는 코딩 과제를 우리 반에서 제일 잘 해낸다.", "빛의 환함뿐만 아니라 긍정적인 성격과 지식의 뛰어남까지 두루 칭찬할 때 으뜸입니다."],
      ["밤", "time", 1, "해가 져서 어두워진 때부터 다음 날 해가 뜨기 전까지의 고요한 시간이에요.", "어젯밤에는 밤하늘에 반짝이는 수많은 별들을 보며 속으로 소원을 빌었다.", "먹는 열매인 '밤'과 글자는 같지만 뜻이 다른 동음이의어 말이에요."],
      ["방긋", "action", 1, "입을 조금 벌리며 소리 없이 가볍고 예쁘게 웃는 모양이에요.", "동생이 나를 보며 방긋 웃어 주니 학교에서 쌓인 피로가 다 날아가는 것 같았다.", "'방긋방긋'처럼 두 번 겹쳐 쓰면 더 귀엽고 연속적인 느낌이 듭니다."],
      ["방울", "daily", 1, "1. 물이 떨어지거나 맺힐 때 생기는 아주 작고 둥근 액체 덩어리예요.<br>2. 흔들면 딸랑딸랑 맑은 소리가 나는 둥근 쇠공 모양의 작은 물건이에요.", "1. 풀잎에 맺힌 맑은 이슬방울이 아침 햇살을 받아 보석처럼 반짝였다.<br>2. 동생이 아끼는 자전거 핸들에는 귀여운 소리가 나는 예쁜 방울이 달려 있다.", "물방울과 쇠방울 모두 '둥글다'는 공통적인 모양의 특징을 가지고 있는 동음이의어입니다."],
      ["버겁다", "heart", 2, "어떤 일을 하거나 감당하기에 내 능력이나 힘에 몹시 벅차다는 뜻이에요.", "모둠 과제를 혼자서 다 끝내기에는 조금 버겁게 느껴져서 친구들에게 도움을 청했다.", "'힘들다'보다 나에게 주어진 짐이나 책임이 무겁다는 느낌을 잘 표현해 줍니다."],
      ["버금", "daily", 3, "으뜸(첫째)의 바로 다음, 즉 두 번째 자리를 뜻하는 멋진 고유어예요.", "우리 반 달리기 선수는 전교 1등에 버금가는 아주 빠르고 훌륭한 실력을 갖췄다.", "'버금가다'라는 표현으로 쓰여서 첫째만큼이나 훌륭하다는 칭찬이 됩니다."],
      ["버릇", "daily", 1, "1. 오랫동안 자꾸 반복해서 몸에 아주 굳어져 버린 행동이나 습관이에요.<br>2. 어른이나 남을 대할 때 예의를 지키지 않는 나쁜 버르장머리를 꾸짖는 말이에요.", "1. 긴장할 때마다 손톱을 깨무는 나쁜 버릇을 고치기 위해 의식적으로 노력하고 있다.<br>2. 어른에게 함부로 말대꾸하는 것은 버릇없는 행동이므로 반드시 고쳐야 한다.", "좋은 행동에는 '습관'을, 고쳐야 할 행동이나 예의 없는 태도에는 '버릇'을 자주 씁니다."],
      ["버무리다", "food", 2, "여러 가지 재료나 양념을 한데 쏟아 넣고 골고루 뒤섞어 비비는 행동이에요.", "할머니와 함께 배추에 빨간 양념을 골고루 버무리며 겨울 김장을 도왔다.", "무언가를 골고루 섞어 맛을 낼 때 쓰는 아주 맛깔스러운 전통 요리 용어입니다."],
      ["벗", "daily", 1, "마음이 아주 잘 맞고 친하게 어울리는 친구를 예스럽게 부르는 말이에요.", "너는 내가 기쁠 때나 슬플 때나 항상 내 곁을 지켜주는 진정한 나의 벗이다.", "'친구(親舊)'라는 한자어를 완벽하게 대신할 수 있는 가장 아름다운 고유어예요."],
      ["베풀다", "action", 1, "자신의 것을 아끼지 않고 남에게 신세나 좋은 혜택을 나누어 주는 행동이에요.", "어려운 이웃에게 따뜻한 사랑을 베푸는 연탄 배달 봉사 활동에 참여해 뿌듯했다.", "나눔과 배려를 실천할 때 어울리는 아주 너그럽고 멋진 도덕적인 동사입니다."],
      ["번개", "nature", 1, "1. 비가 오는 날 구름과 구름 사이에서 전기가 부딪쳐 번쩍하고 빛나는 현상이에요.<br>2. 움직임이나 행동이 미처 생각할 틈도 없이 아주 빠르고 날쌘 것을 비유해요.", "1. 갑자기 하늘에서 번쩍하고 번개가 치더니 우르릉 쾅쾅 천둥소리가 이어졌다.<br>2. 숙제를 깜빡했는데 선생님이 오시기 전에 번개처럼 빠른 속도로 다 끝마쳤다.", "행동이 몹시 빠를 때 '번개처럼 빠르다'라고 아주 날쌔게 비유할 때도 훌륭합니다."],
      ["번지다", "action", 1, "1. 물이나 색깔이 묻어서 주위로 점점 넓게 퍼져 나가는 모양이에요.<br>2. 병이나 불길, 소문 따위가 이웃이나 주위로 겉잡을 수 없이 퍼지는 현상이에요.<br>3. 기분 좋은 미소나 감정이 얼굴 전체에 넓게 퍼져 나타나는 예쁜 모습이에요.", "1. 도화지에 칠한 물감 위에 물을 한 방울 떨어뜨리니 색이 예쁘게 번져 나갔다.<br>2. 작은 장난으로 시작된 다툼이 결국 반 전체의 큰 싸움으로 번져 선생님께 혼났다.<br>3. 칭찬을 듣자마자 나도 모르게 입가에 기분 좋은 웃음이 활짝 번졌다.", "물감이 퍼지는 물리적인 현상부터 소문이나 웃음이 퍼지는 문학적 비유까지 널리 씁니다."],
      ["벼락", "nature", 1, "1. 구름과 땅 사이에서 전기가 떨어지며 번쩍이는 빛과 큰 소리를 내는 현상이에요.<br>2. 갑자기 들이닥친 큰 불행이나 아주 매섭고 무서운 꾸지람을 비유하는 말이에요.<br>3. 아주 짧은 시간 안에 당장 급하게 서둘러서 일을 해치우는 모양을 속되게 일컬어요.", "1. 어젯밤 숲속의 커다란 소나무가 벼락을 맞아 새까맣게 타버렸다고 뉴스에 나왔다.<br>2. 창문을 깨뜨리는 바람에 아버지께 불호령 같은 벼락이 떨어져서 몹시 혼이 났다.<br>3. 평소에 안 하던 시험공부를 전날 밤에 벼락치기로 하느라 코피가 날 뻔했다.", "무서운 자연 현상뿐만 아니라 호통을 치거나 급하게 서두르는 모습을 묘사할 때도 탁월합니다."],
      ["벼리다", "action", 3, "1. 무뎌진 연장을 불에 달구어 두드려서 아주 날카롭게 날을 세우는 일이에요.<br>2. 마음을 단단히 먹고 각오를 다지며 굳센 의지를 가다듬는 훌륭한 행동이에요.", "1. 대장장이 아저씨가 무딘 칼을 붉은 불에 달구어 날카롭게 벼리고 계신다.<br>2. 이번 가을 체육대회에서는 꼭 종합 우승을 하겠다고 마음속으로 굳게 다짐을 벼렸다.", "칼을 날카롭게 갈듯이 자신의 결심을 아주 굳세게 다질 때 쓰는 비유적인 표현입니다."],
      ["별", "nature", 1, "1. 밤하늘에 빛을 내며 반짝이는 수많은 천체들을 아름답게 부르는 말이에요.<br>2. 어떤 분야에서 장차 가장 뛰어나게 두각을 나타낼 훌륭한 인물을 비유해요.", "1. 시골 밤하늘을 올려다보니 셀 수 없이 많은 별이 쏟아질 듯 맑게 반짝였다.<br>2. 우리 반 지민이는 미술 대회마다 상을 휩쓰는 우리 학교의 떠오르는 별이다.", "태양처럼 스스로 빛을 내는 천체이자, 미래를 빛낼 유망주를 칭찬하는 가장 낭만적인 고유어예요."],
      ["보듬다", "action", 2, "1. 사람이나 동물을 가슴에 바짝 붙여 껴안아 따뜻하게 안아 주는 다정한 행동이에요.<br>2. 남의 잘못이나 약점까지 너그럽게 덮어주고 사랑으로 감싸 안는 훌륭한 태도예요.", "1. 천둥소리에 놀라 덜덜 떠는 강아지를 내 품에 꼭 보듬어 주며 안심시켰다.<br>2. 우리 선생님은 말썽을 피우는 아이들까지도 탓하지 않고 따뜻하게 보듬어 주신다.", "단순히 안는 것을 넘어 마음과 약점까지 너그럽게 감싸준다는 의미가 가득 담겨 있어요."],
      ["보람", "heart", 1, "1. 어떤 일을 힘들게 해낸 뒤에 얻어지는 좋은 결과나 아주 뿌듯하고 자랑스러운 마음이에요.<br>2. 잊지 않기 위해 눈에 띄게 남겨 둔 표적이나 징표를 뜻하는 옛스러운 말이에요.", "1. 맹연습한 연극 무대를 성공적으로 마치고 친구들의 박수를 받으니 가슴 벅찬 보람을 느꼈다.<br>2. 책을 읽다가 중간에 멈출 때, 나중에 찾기 쉽도록 책갈피로 예쁘게 보람을 해 두었다.", "고된 노력 끝에 얻는 달콤한 감정이자, 책갈피 같은 표적을 뜻하기도 하는 멋진 고유어입니다."],
      ["보살피다", "action", 1, "1. 약한 사람이나 동물을 정성을 기울여 곁에서 보호하며 돕고 돌보아 주는 다정한 일이에요.<br>2. 어떤 일이 잘 진행되는지 여러모로 꼼꼼히 살피고 주의를 기울여 점검하는 일이에요.", "1. 방학 동안 부모님을 도와서 어린 동생을 밥도 챙겨주며 다정하게 보살피고 놀아주었다.<br>2. 반장으로서 모둠 과제가 차질 없이 잘 진행되고 있는지 꼼꼼하게 보살피고 점검했다.", "사랑과 관심을 듬뿍 담아 누군가를 지켜주고 일을 꼼꼼히 챙긴다는 훌륭하고 도덕적인 뜻이에요."],
      ["보슬보슬", "nature", 1, "눈이나 비가 바람 없이 아주 조용하고 가늘게 계속해서 얌전하게 내리는 예쁜 모양이에요.", "이른 아침 창밖을 보니 보슬보슬 봄비가 내려 마당의 잔디가 촉촉하게 젖어 있었다.", "굵은 비가 아니라 부드럽고 얌전하게 내리는 비를 묘사할 때 소리 내어 읽기 참 예뻐요."],
      ["보태다", "action", 2, "1. 모자라는 것이나 부족한 부분을 더하여 채우거나 분량을 더 많아지게 하는 행동이에요.<br>2. 남의 일에 힘이나 마음, 의견 등을 더하여 일이 잘되도록 적극적으로 돕는 일이에요.", "1. 저금통을 깼더니 만 원이 나와서 내 용돈을 더 보태어 부모님께 드릴 선물을 샀다.<br>2. 모둠 토론 시간에 내 의견을 한마디 더 보태어 훌륭한 발표 자료를 완성하는 데 기여했다.", "서로의 힘과 마음을 합쳐서 더 크게 만들고 부족함을 채울 때 쓰는 아주 긍정적인 말입니다."],
      ["봄", "time", 1, "겨울이 지나고 날씨가 따뜻해져 얼었던 땅이 녹고 새싹이 돋아나는 아름다운 계절이에요.", "봄이 오니 언 땅이 녹고 학교 화단에 노란 개나리가 눈부시게 활짝 피기 시작했다.", "만물이 새로 피어나고 희망찬 한 해가 시작되는 시기를 뜻하는 가장 포근한 이름이죠."],
      ["볼", "daily", 1, "사람의 얼굴에서 코와 귀 사이에 있는 양쪽의 둥글고 넓적한 부분이에요.", "추운 겨울바람을 오래 맞고 서 있었더니 양쪽 볼이 빨갛게 사과처럼 얼어버렸다.", "'뺨'과 거의 같은 뜻이지만, 통통하고 귀여운 느낌을 줄 때 주로 '볼'이라고 씁니다."],
      ["부끄럽다", "heart", 1, "1. 자신의 잘못이나 약점 때문에 남을 대하기가 떳떳하지 못하여 쥐구멍에 숨고 싶은 감정이에요.<br>2. 낯선 사람 앞에서나 많은 사람 앞에서 수줍고 쑥스러워 얼굴이 붉어지는 감정이에요.", "1. 시험을 못 본 것을 부모님께 속이고 거짓말을 한 내 자신이 몹시 부끄러워 반성했다.<br>2. 선생님께서 반 친구들 앞에서 나를 크게 칭찬하시자 너무 쑥스럽고 부끄러워 고개를 숙였다.", "잘못을 뉘우칠 줄 아는 훌륭한 양심이자 귀여운 수줍음을 동시에 나타내는 필수 단어입니다."],
      ["부드럽다", "heart", 1, "1. 만졌을 때 뻣뻣하지 않고 질감이 아주 연하고 촉감이 포근한 긍정적인 상태예요.<br>2. 사람의 성격과 태도, 또는 목소리가 아주 상냥하고 까다롭지 않아 편안하다는 뜻이에요.", "1. 엄마가 새로 사 주신 겨울 털목도리는 촉감이 구름처럼 아주 부드러워서 기분이 좋다.<br>2. 항상 다정하고 부드러운 목소리로 먼저 인사해 주는 짝꿍 덕분에 내 마음도 따뜻해진다.", "물건의 촉감뿐만 아니라 사람의 마음씨와 목소리가 따뜻할 때도 널리 칭찬으로 쓰입니다."],
      ["부랴부랴", "action", 2, "어떤 일이 생겨서 아주 급하게 허둥지둥 서두르는 모양을 뜻하는 재미있는 말이에요.", "늦잠을 자는 바람에 아침밥도 못 먹고 부랴부랴 가방을 메고 학교로 뛰어갔다.", "'불이야 불이야'에서 온 말로, 불이 났을 때처럼 몹시 다급한 상황을 실감 나게 나타내요."],
      ["부시다", "nature", 1, "1. 빛이 너무 강해서 눈을 마주 뜨고 바라보기 어려울 정도로 아주 환한 상태예요.<br>2. 그릇 따위를 깨끗하게 씻어 헹구거나 얼룩을 없애는 일상적인 살림 행동이에요.", "1. 아침에 창문을 쫙 여니 찬란하고 눈이 부신 햇살이 방 안으로 가득 쏟아져 들어왔다.<br>2. 저녁을 맛있게 먹고 나서 설거지를 하며 밥그릇을 맑은 물에 뽀득뽀득 부시어 엎어 두었다.", "눈부신 빛을 표현할 때 쓰는 형용사와 그릇을 씻는다는 뜻의 동사가 섞인 동음이의어입니다."],
      ["부지런하다", "heart", 1, "게으름을 피우지 않고 자기가 맡은 일을 꾸준하고 성실히 해내는 훌륭한 성격이에요.", "비가 오나 눈이 오나 매일 아침 일찍 일어나 규칙적으로 운동을 하시는 아빠는 참 부지런하시다.", "6학년 학생들이 꼭 가져야 할 가장 모범적이고 칭찬받아 마땅한 태도입니다."],
      ["부추기다", "action", 2, "남의 마음을 이리저리 꾀어서 어떤 일을 하도록 슬쩍 밀어 올리거나 꼬드기는 일이에요.", "친구들이 옆에서 할 수 있다고 자꾸 부추기는 바람에 용기를 내어 장기 자랑 무대에 올라갔다.", "주로 안 좋은 일에 꼬일 때 많이 쓰지만, 용기를 내도록 옆에서 격려할 때도 쓸 수 있어요."],
      ["부풀다", "action", 1, "1. 종이나 빵, 풍선 따위의 부피가 원래보다 둥글게 커지거나 늘어나는 물리적인 상태예요.<br>2. 앞으로 일어날 좋은 일에 대한 간절한 기대감으로 마음이 한껏 설레고 벅차오르는 상태예요.", "1. 오븐에 넣은 빵 반죽이 열을 받아 먹음직스럽게 동그랗게 부풀어 오르기 시작했다.<br>2. 내일 친구들과 떠나는 즐거운 수학여행 생각에 잔뜩 부푼 마음을 안고 신나게 가방을 챙겼다.", "풍선에 바람이 들어가 커지는 것처럼 내 마음속의 기쁨과 희망이 가득 차오를 때 씁니다."],
