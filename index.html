<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등학교 고유어 사전 & 퀴즈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #f0fdf4; } /* 연한 녹색 배경 */
    .word-btn { transition: all 0.2s ease-in-out; }
    .word-btn:hover { transform: scale(1.05); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .tab-active { border-bottom: 4px solid #3b82f6; color: #1d4ed8; font-weight: bold; }
    .tab-inactive { color: #6b7280; }
  </style>
</head>
<body class="text-gray-800 pb-20">

  <div class="max-w-5xl mx-auto p-5">
    <header class="text-center py-8">
      <h1 class="text-4xl font-bold text-green-600 mb-2">🌿 우리말 고유어 대사전</h1>
      <p class="text-gray-500">초등학교 6학년을 위한 순우리말 탐험</p>
    </header>

    <!-- 네비게이션 탭 -->
    <div class="flex justify-center border-b mb-8">
      <button id="tab-dict" class="px-8 py-3 text-lg tab-active" onclick="switchTab('dict')">📖 사전 모드</button>
      <button id="tab-quiz" class="px-8 py-3 text-lg tab-inactive hover:text-blue-500" onclick="switchTab('quiz')">🎮 낱말 퀴즈</button>
    </div>

    <!-- ==================== [1] 사전 모드 영역 ==================== -->
    <div id="section-dict" class="block">
      <!-- 자음 버튼 -->
      <div id="consonant-buttons" class="flex flex-wrap gap-2 justify-center mb-8"></div>
      
      <!-- 안내 메시지 -->
      <div class="text-center mb-6">
        <p class="text-gray-600 font-bold bg-white inline-block px-4 py-2 rounded-full shadow-sm" id="result-info">단어를 불러오는 중입니다...</p>
        <p class="text-sm text-green-600 mt-2">💡 궁금한 단어를 클릭해서 뜻과 예문을 확인해 보세요!</p>
      </div>

      <!-- 단어 목록 (단어만 보임) -->
      <div id="word-grid" class="flex flex-wrap gap-4 justify-center mb-10"></div>
    </div>

    <!-- ==================== [2] 퀴즈 모드 영역 ==================== -->
    <div id="section-quiz" class="hidden max-w-2xl mx-auto bg-white p-8 rounded-3xl shadow-lg text-center">
      <h2 class="text-2xl font-bold text-blue-600 mb-2">도전! 고유어 퀴즈</h2>
      <p class="text-gray-500 mb-6">다음 뜻풀이를 읽고, 알맞은 단어를 골라보세요.</p>
      
      <div class="bg-blue-50 p-6 rounded-xl mb-8 min-h-[120px] flex items-center justify-center border-2 border-blue-100">
        <p id="quiz-question" class="text-xl font-bold text-gray-800 break-keep">문제가 여기에 표시됩니다.</p>
      </div>

      <div id="quiz-options" class="grid grid-cols-2 gap-4">
        <!-- 보기 버튼들이 여기에 생성됩니다 -->
      </div>
      
      <div class="mt-6 flex justify-between items-center">
        <p id="quiz-score" class="font-bold text-green-600">맞힌 문제: 0</p>
        <button onclick="generateQuiz()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-bold text-gray-700 transition">다음 문제 건너뛰기 ➔</button>
      </div>
    </div>

  </div>

  <!-- ==================== [3] 단어 뜻풀이 모달(팝업창) ==================== -->
  <div id="word-modal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center p-4 z-50 transition-opacity">
    <div class="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl transform scale-100 transition-transform">
      <!-- 모달 헤더 -->
      <div class="bg-green-50 px-6 py-4 flex justify-between items-center border-b border-green-100">
        <div class="flex gap-2">
          <span id="modal-category" class="text-xs font-bold text-green-700 bg-green-200 px-2 py-1 rounded">카테고리</span>
          <span id="modal-level" class="text-xs font-bold text-yellow-600 bg-yellow-100 px-2 py-1 rounded">난이도</span>
        </div>
        <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 font-bold text-xl">&times;</button>
      </div>
      <!-- 모달 본문 -->
      <div class="p-6">
        <h2 id="modal-word" class="text-4xl font-bold text-gray-800 mb-4 text-center">단어</h2>
        <p id="modal-meaning" class="text-lg text-gray-700 font-medium mb-6 text-center leading-relaxed">"뜻풀이"</p>
        
        <div class="bg-gray-50 p-4 rounded-xl mb-4 border-l-4 border-blue-400">
          <p class="text-xs text-blue-500 font-bold mb-1">📖 활용 예문</p>
          <p id="modal-example" class="text-sm text-gray-700">예문이 들어갑니다.</p>
        </div>
        
        <div class="bg-yellow-50 p-3 rounded-xl border border-yellow-200">
          <p id="modal-tip" class="text-xs text-yellow-800 font-bold">💡 팁: 팁 내용이 들어갑니다.</p>
        </div>
      </div>
    </div>
  </div>

  <script>

      ["가시버시", "사람·관계", 3, "아내와 남편을 묶어서 부르는 옛말이에요.", "두 사람은 잉꼬같은 가시버시입니다.", "결혼한 부부를 귀엽게 부르는 말이에요."],

      ["가을거짓", "시간·계절", 2, "가을에 다 자란 곡식을 거두어들이는 일이에요. (추수)", "농부 아저씨들이 가을거짓으로 바쁘십니다.", "가을과 '거두
