      ["너나들이", "heart", 2, "서로 '너', '나' 하고 편하게 부르며 허물없이 아주 가깝게 지내는 사이를 말해요.", "유치원 때부터 짝꿍이었던 진우와 나는 정말 친한 너나들이 친구다.", "친구 사이의 끈끈하고 편안한 우정을 나타낼 때 쓰면 좋습니다."],

      ["눈꽃", "nature", 1, "겨울철 나뭇가지 위에 눈이 하얗게 엉겨 붙어 마치 꽃처럼 핀 풍경이에요.", "설악산 나뭇가지마다 새하얀 눈꽃이 활짝 피어 장관을 이루었다.", "추운 겨울 산행에서 볼 수 있는 가장 아름다운 자연의 신비입니다."],

      ["늦둥이", "daily", 1, "부모님이 나이가 꽤 들어서 늦게 낳은 아주 귀엽고 소중한 자식이에요.", "우리 집 귀여운 늦둥이 동생의 재롱 덕분에 온 가족이 매일 활짝 웃는다.", "가족의 사랑을 듬뿍 차지하는 귀여운 막내를 부를 때 많이 씁니다."],
      
    // 🟢 2. 핵심 동작 코드 (건드리지 않으셔도 됩니다!)
    const CHO_SUNG = ["ㄱ", "ㄲ", "ㄴ", "ㄷ", "ㄸ", "ㄹ", "ㅁ", "ㅂ", "ㅃ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅉ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
    
    // 단어의 첫 글자에서 초성을 추출하는 함수
    function getChosung(word) {
      const charCode = word.charCodeAt(0) - 44032;
      if (charCode < 0 || charCode > 11171) return word.charAt(0);
      return CHO_SUNG[Math.floor(charCode / 588)];
    }

    // 데이터를 사용하기 좋게 변환하고 초성별로 개수 세기
    let wordData = [];
    let chosungCount = {};

    CHO_SUNG.forEach(c => chosungCount[c] = 0); // 초기화

    RAW_WORDS.forEach(item => {
      const word = item[0];
      const chosung = getChosung(word);
      
      wordData.push({
        word: item[0],
        category: item[1],
        level: item[2],
        meaning: item[3],
        example: item[4],
        tip: item[5],
        chosung: chosung
      });

      if(chosungCount[chosung] !== undefined) {
        chosungCount[chosung]++;
      }
    });

    // 화면 렌더링 함수
    const btnContainer = document.getElementById('consonant-buttons');
    const gridContainer = document.getElementById('word-grid');
    const resultInfo = document.getElementById('result-info');

    // 자음 버튼 생성
    const mainChosungs = ["ㄱ", "ㄴ", "ㄷ", "ㄹ", "ㅁ", "ㅂ", "ㅅ", "ㅇ", "ㅈ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
    
    mainChosungs.forEach(c => {
      const btn = document.createElement('button');
      const count = chosungCount[c] || 0;
      btn.className = `px-4 py-2 rounded-full font-bold text-sm border-2 ${count > 0 ? 'border-blue-500 text-blue-600 hover:bg-blue-50' : 'border-gray-200 text-gray-400 cursor-not-allowed'}`;
      btn.innerText = `${c} (${count})`;
      
      if (count > 0) {
        btn.onclick = () => renderWords(c);
      }
      btnContainer.appendChild(btn);
    });

    // 단어 카드 그리기
    function renderWords(targetChosung) {
      gridContainer.innerHTML = ''; // 초기화
      const filtered = wordData.filter(w => w.chosung === targetChosung);
      
      resultInfo.innerText = `'${targetChosung}'(으)로 시작하는 단어 ${filtered.length}개`;

      filtered.forEach(w => {
        const card = document.createElement('div');
        card.className = 'word-card bg-white p-6 rounded-2xl border border-gray-100 relative';
        
        let levelStars = w.level === 1 ? '⭐ 기초' : w.level === 2 ? '⭐⭐ 실력' : '⭐⭐⭐ 탐구';

        card.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <span class="text-xs font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded">${w.category}</span>
            <span class="text-xs font-bold text-yellow-500 bg-yellow-50 px-2 py-1 rounded">${levelStars}</span>
          </div>
          <h2 class="text-2xl font-bold mb-2">${w.word}</h2>
          <p class="text-gray-700 font-medium mb-3">"${w.meaning}"</p>
          <div class="bg-gray-50 p-3 rounded-lg text-sm text-gray-600 mb-3 border-l-2 border-blue-400">
            예문: ${w.example}
          </div>
          <p class="text-xs text-green-600 font-bold">💡 팁: ${w.tip}</p>
        `;
        gridContainer.appendChild(card);
      });
    }

    // 처음 로딩 시 'ㄱ' 단어 보여주기 (데이터가 있으면)
    if(chosungCount["ㄱ"] > 0) {
      renderWords("ㄱ");
    } else {
      resultInfo.innerText = "단어 데이터를 추가해 주세요!";
    }
  </script>
